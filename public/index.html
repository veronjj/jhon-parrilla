      leer. Reutiliza this.totals(c), el mismo cálculo que ya usan los
      KPIs y el cierre de caja, así que nunca puede quedar descuadrado
      frente a lo que la app muestra en pantalla. */
  resumenTurno(){
    const c = DB.openCash(); if (!c) return;
    this._mostrarResumen(c, this.totals(c), 'RESUMEN DE TURNO');
  },
  /** INTERVENCIÓN: mismo resumen corporativo de 80&nbsp;mm, pero para un
      cierre de caja YA CERRADO (histórico), buscado por fecha/empleado
      en "Cierres anteriores". Reutiliza exactamente el mismo cálculo
      (this.totals) y el mismo formato de impresión que "Resumen de
      Turno", así ambos documentos siempre coinciden en su lógica. */
  resumenCierre(cierreId){
    const c = (DB.d.cash||[]).find(x => x.id === cierreId);
    if (!c) return UI.toast('No se encontró ese cierre de caja.','warn');
    this._mostrarResumen(c, this.totals(c), 'RESUMEN DE CIERRE');
  },
  /** Construye e imprime el ticket de resumen (compartido por
      resumenTurno y resumenCierre) a partir de una caja (abierta o ya
      cerrada) y sus totales ya calculados. */
  _mostrarResumen(c, t, titulo){
    const cfg = DB.d.config;
    /* INTERVENCIÓN (corrección de raíz): usar el total real de gastos
       del turno (t.gastosTotal, tomado de DB.d.gastos — efectivo +
       transferencia), no solo los egresos en efectivo de c.movs. */
    const egresos = t.gastosTotal || 0;
    /* El cierre de la cajera no es contable, es de caja: de todo lo vendido
       en el turno solo entrega en la mano el efectivo. Lo cobrado por
       transferencia (Nequi, Daviplata, transferencia) entró al banco, y lo
       cobrado por datáfono ni siquiera pasó por el cajón, así que ninguno
       de los dos se liquida en efectivo. Se descuentan, igual que los
       gastos, para llegar a la cifra que de verdad tiene que entregar.
       Aritméticamente equivale a (efectivo de ventas − gastos), pero se
       imprime paso a paso para que la cajera pueda seguir la cuenta. */
    const otrosMedios = Math.max(0, Number(t.otrosMedios)||0);
    const transferencias = Number(t.transferencias)||0;
    const efectivoLiquidar = t.total - egresos - transferencias - otrosMedios;

    const linea = (label, valor, opts) => {
      opts = opts || {};
      return '<div style="display:flex;justify-content:space-between;gap:10px;margin:' + (opts.mt||'3px') + ' 0;' +
        (opts.grande ? 'font-size:14px;font-weight:800' : 'font-size:12px') +
        (opts.indent ? ';padding-left:12px;color:#333' : '') + '">' +
        '<span>' + label + '</span>' +
        '<b style="font-family:var(--mono);white-space:nowrap">' + Util.money(valor) + '</b></div>';
    };

    const cuerpo =
      '<div class="ticket">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() + '" style="max-width:55%;height:auto;margin-bottom:4px"></div>' : '') +
      '<div class="c b lg">' + Util.esc((cfg.empresa||'').toUpperCase()) + '</div>' +
      '<div class="c" style="font-size:10px">' + Util.esc(cfg.dir||'') + ' · Tel: ' + Util.esc(cfg.tel||'') + '</div>' +
      '<hr>' +
      '<div class="c b" style="font-size:14px;letter-spacing:.08em">' + Util.esc(titulo) + '</div>' +
      '<div class="c tk-sub">' + Util.esc((DB.user(c.userId)||{}).nombre||'—') + '</div>' +
      '<hr>' +
      '<div>Apertura: ' + Util.dt(c.apertura) + '</div>' +
      (c.cierre ? '<div>Cierre: ' + Util.dt(c.cierre) + '</div>' : '') +
      '<div>Impreso: ' + Util.dt(Util.now()) + '</div>' +
      '<div>Facturas del turno: ' + t.ventas.length + '</div>' +
      '<hr>' +
      /* INTERVENCIÓN: la Base inicial queda solo como referencia arriba
         (no se suma en el totalizado de abajo). */
      linea('Base inicial', c.base, {grande:false}) +
      '<hr>' +
      /* Cinco renglones, sin desgloses anidados ni valores repetidos: la
         cajera lee de arriba abajo cuánto se vendió, cómo entró la plata,
         cuánto salió en gastos y cuánto entrega en efectivo. */
      linea('Total de ventas', t.total) +
      linea('Efectivo', t.efectivoVentas) +
      linea('Transferencias', transferencias) +
      /* Solo aparece si el turno tuvo cobros por datáfono; si no, no estorba.
         Sin este renglón los números impresos no cuadrarían entre sí. */
      (otrosMedios ? linea('Otros medios', otrosMedios) : '') +
      linea('Gastos', egresos) +
      '<hr>' +
      linea('TOTAL EFECTIVO A LIQUIDAR', efectivoLiquidar, {grande:true, mt:'6px'}) +
      '</div>';

    UI.modal({
      title: titulo === 'RESUMEN DE CIERRE' ? 'Resumen de cierre' : 'Resumen de turno', size:'sm',
      body:'<div class="ticket-frame">' + cuerpo + '</div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
        '<button class="btn gold" id="crt-print">' + Util.ico('print') + ' Imprimir resumen</button>',
      onMount(ov){
        ov.querySelector('#crt-print').onclick = () => {
          DB.log('caja:resumen', titulo + ' · Efectivo a liquidar ' + Util.money(efectivoLiquidar) +
            ' · Transferencias ' + Util.money(transferencias) + ' · Gastos ' + Util.money(egresos) +
            ' · Esperado con base ' + Util.money(t.esperado), c.id);
          const anchoOriginal = cfg.ticket;
          cfg.ticket = '80';
          UI.imprimir(ov);
          cfg.ticket = anchoOriginal;
        };
      }
    });
  },
  /** Elimina un ingreso o egreso manual. Las líneas de venta no se tocan aquí:
      para revertir una venta se anula la factura, que devuelve inventario y dinero. */
  async delMov(movId){
    const c = DB.openCash(); if (!c) return;
    const mv = c.movs.find(x => x.id === movId); if (!mv) return;
    if (mv.tipo === 'venta') return UI.toast('Ese movimiento viene de una venta. Anula la factura si necesitas revertirlo.','warn', 4600);
    const autorizo = await Auth.autorizar('Eliminar un movimiento de caja',
      mv.concepto + ' · ' + Util.money(mv.monto));
    if (!autorizo) return;
    if (!(await UI.confirm('Se elimina el movimiento "' + mv.concepto + '" por ' + Util.money(mv.monto) +
      '. El efectivo esperado del turno se recalcula.', {ok:'Eliminar movimiento', danger:true}))) return;
    c.movs = c.movs.filter(x => x.id !== movId);
    c.act = Util.now();
    DB.touch('cash');
    DB.log('caja:eliminar-movimiento', mv.tipo + ' · ' + Util.money(mv.monto) + ' · ' + mv.concepto +
      ' · autorizó ' + autorizo.nombre, c.id);
    Sync.enqueue('cash','update', c);
    UI.toast('Movimiento eliminado.','ok');
    Router.render();
  },
  open(){
    if (DB.openCash()) return UI.toast('Ya hay una caja abierta.','warn');
    UI.formModal({title:'Abrir caja', size:'sm', ok:'Abrir turno',
      fields:[{k:'base', label:'Base en efectivo', type:'number', val:200000, min:0, req:true, full:true},
              {k:'nota', label:'Observación', val:'', full:true}],
      onSave(d, close){
        const c = {id:Util.uid('cx'), apertura:Util.now(), cierre:null, base:d.base, nota:d.nota,
          userId:(Auth.user||{}).id, sede:DB.d.config.sedeId, movs:[], estado:'abierta', act:Util.now()};
        DB.d.cash.push(c); DB.touch('cash');
        DB.log('caja:abrir','Base ' + Util.money(d.base), c.id);
        Sync.enqueue('cash','open', c);
        close(); UI.toast('Caja abierta con ' + Util.money(d.base) + '.','ok'); Router.render();
      }});
  },
  mov(){
    const c = DB.openCash(); if(!c) return;
    UI.formModal({title:'Movimiento de caja', size:'sm', ok:'Registrar',
      fields:[
        {k:'tipo', label:'Tipo', type:'select', val:'egreso', opts:[{v:'ingreso',t:'Ingreso'},{v:'egreso',t:'Egreso o gasto'}]},
        {k:'monto', label:'Monto', type:'number', val:0, min:0, req:true},
        {k:'concepto', label:'Concepto', val:'', req:true, full:true, ph:'Ej: compra de hielo, pago de domicilio'}
      ],
      onSave(d, close){
        if (!d.monto) return 'Indica un monto mayor a cero.';
        const monto = d.tipo === 'egreso' ? -Math.abs(d.monto) : Math.abs(d.monto);
        c.movs.push({id:Util.uid('mv'), tipo:d.tipo, fecha:Util.now(), concepto:d.concepto, monto, metodo:'Efectivo', userId:(Auth.user||{}).id});
        c.act = Util.now(); DB.touch('cash');
        DB.log('caja:movimiento', d.tipo + ' · ' + Util.money(monto) + ' · ' + d.concepto, c.id);
        Sync.enqueue('cash','mov', c);
        close(); UI.toast('Movimiento registrado.','ok'); Router.render();
      }});
  },
  async close(){
    const c = DB.openCash(); if(!c) return;
    if (!Auth.can('cerrarcaja')) return UI.toast('Tu rol no puede cerrar la caja.','warn');
    /* INTERVENCIÓN: antes de abrir el arqueo, se confirma que ya se
       imprimió el Resumen del Turno, para que no se cierre la caja sin
       dejar ese respaldo impreso. */
    if (!(await UI.confirm('Usted cerrará la Caja, ¿realizó la impresión del Resumen del Turno?',
      {ok:'Sí, continuar con el cierre'}))) return;
    const t = this.totals(c);
    UI.formModal({title:'Arqueo y cierre de caja', ok:'Cerrar turno',
      extra:'<div class="card" style="margin-top:12px">' +
        '<div class="eyebrow" style="margin-bottom:8px">Resumen de ventas del turno</div>' +
        '<div class="tot-row"><span>Total facturado (' + t.ventas.length + ' facturas)</span><b>' + Util.money(t.total) + '</b></div>' +
        '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Efectivo</span><b>' + Util.money(t.efectivoVentas) + '</b></div>' +
        '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Transferencias (Nequi, Daviplata)</span><b>' + Util.money(t.transferencias) + '</b></div>' +
        (t.otrosMedios ? '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Otros medios</span><b>' + Util.money(t.otrosMedios) + '</b></div>' : '') +
        '<hr style="border-color:var(--line);margin:10px 0">' +
        '<div class="eyebrow" style="margin-bottom:8px">Consolidado de caja</div>' +
        '<div class="tot-row"><span>Base inicial</span><b>' + Util.money(c.base) + '</b></div>' +
        '<div class="tot-row"><span>Ventas del turno</span><b>' + Util.money(t.total) + '</b></div>' +
        '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Efectivo</span><b>' + Util.money(t.efectivoVentas) + '</b></div>' +
        '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Transferencias</span><b>' + Util.money(t.transferencias) + '</b></div>' +
        (t.otrosMedios ? '<div class="tot-row" style="padding-left:14px;font-size:13px;color:var(--ash)"><span>· Otros medios</span><b>' + Util.money(t.otrosMedios) + '</b></div>' : '') +
        (t.ingresos ? '<div class="tot-row"><span>Otros ingresos</span><b>' + Util.money(t.ingresos) + '</b></div>' : '') +
        '<div class="tot-row"><span>Egresos en efectivo (afectan el cajón)</span><b>' + Util.money(t.egresos) + '</b></div>' +
        /* INTERVENCIÓN: se muestra aparte el total REAL de gastos del
           turno (efectivo + transferencia, tomado de DB.d.gastos), para
           que quede visible aunque no todos afecten el efectivo físico
           del cajón — sin alterar el cálculo de "Total esperado". */
        '<div class="tot-row"><span>Gastos totales del turno (todo medio de pago)</span><b>' + Util.money(t.gastosTotal) + '</b></div>' +
        '<div class="tot-grand"><span>Total esperado</span><b>' + Util.money(t.esperado) + '</b></div></div>',
      fields:[{k:'contado', label:'Total contado (efectivo + transferencias)', type:'number', val:t.esperado, min:0, req:true, full:true},
              {k:'nota', label:'Observación del cierre', type:'textarea', val:'', full:true}],
      onSave(d, close){
        c.estado = 'cerrada'; c.cierre = Util.now(); c.esperado = t.esperado; c.contado = d.contado;
        c.diferencia = d.contado - t.esperado; c.notaCierre = d.nota; c.act = Util.now();
        DB.touch('cash');
        DB.log('caja:cerrar','Esperado ' + Util.money(t.esperado) + ' · contado ' + Util.money(d.contado) +
          ' · diferencia ' + Util.money(c.diferencia), c.id);
        Sync.enqueue('cash','close', c);
        close();
        UI.toast(c.diferencia === 0 ? 'Caja cuadrada. Turno cerrado.' :
          'Turno cerrado con diferencia de ' + Util.money(c.diferencia) + '.', c.diferencia===0?'ok':'warn', 4200);
        Router.render();
      }});
  }
};

/* --- Reportes -------------------------------------------------------- */
const Reports = {
  defs:{
    ventas:{t:'Ventas', cols:[
      {k:'numero',t:'Factura'},{k:'fecha',t:'Fecha',f:'dt'},{k:'usuario',t:'Atendió'},{k:'cliente',t:'Cliente'},
      {k:'items',t:'Ítems',n:1},{k:'subtotal',t:'Subtotal',n:1,f:'$'},{k:'descuento',t:'Descuento',n:1,f:'$'},
      {k:'impuesto',t:'Impuesto',n:1,f:'$'},{k:'propina',t:'Propina',n:1,f:'$'},
      {k:'domicilio',t:'Domicilio',n:1,f:'$'},{k:'entrega',t:'Entrega'},{k:'total',t:'Total',n:1,f:'$'},
      {k:'metodos',t:'Pago'},{k:'estado',t:'Estado'}],
      build(v){ return v.map(s=>({id:s.id, numero:s.numero, fecha:s.fecha, usuario:(DB.user(s.userId)||{}).nombre||'—',
        cliente:(DB.client(s.clienteId)||{}).nombre||'—', items:s.items.reduce((a,i)=>a+i.qty,0),
        subtotal:s.subtotal, descuento:s.descuento, impuesto:s.impuesto, propina:s.propina,
        domicilio:s.domicilio||0, entrega:(POS.TIPOS[s.tipo||'mesa']||{}).corto||'Mesa', total:s.total,
        metodos:(s.pagos||[]).map(p=>p.metodo).join(', '), estado:s.estado})); }},
    productos:{t:'Productos', cols:[
      {k:'nombre',t:'Plato'},{k:'categoria',t:'Categoría'},{k:'qty',t:'Porciones',n:1},
      {k:'gramos',t:'Consumo',n:1},{k:'total',t:'Venta',n:1,f:'$'},{k:'costo',t:'Costo',n:1,f:'$'},
      {k:'utilidad',t:'Utilidad',n:1,f:'$'},{k:'margen',t:'Margen',n:1,f:'%'}],
      build(v){
        const m = {};
        v.forEach(s=>s.items.forEach(i=>{
          const p = DB.product(i.pid) || {};
          m[i.pid] = m[i.pid] || {nombre:i.nombre, categoria:(DB.cat(p.cat)||{}).nombre||'—', qty:0, gramos:0, total:0, costo:0};
          m[i.pid].qty += i.qty; m[i.pid].gramos += (i.gramos||0)*i.qty;
          m[i.pid].total += i.total; m[i.pid].costo += (p.costo||0)*i.qty;
        }));
        return Object.values(m).map(r=>Object.assign(r,{utilidad:r.total-r.costo,
          margen:r.total?Math.round(((r.total-r.costo)/r.total)*100):0})).sort((a,b)=>b.total-a.total); }},
    clientes:{t:'Clientes', cols:[
      {k:'nombre',t:'Cliente'},{k:'doc',t:'Documento'},{k:'tel',t:'Teléfono'},{k:'visitas',t:'Visitas',n:1},
      {k:'gastado',t:'Total gastado',n:1,f:'$'},{k:'ticket',t:'Ticket medio',n:1,f:'$'},{k:'puntos',t:'Puntos',n:1},
      {k:'ultima',t:'Última visita',f:'d'}],
      build(){ return DB.clients().filter(c=>!c.sistema).map(c=>({nombre:c.nombre, doc:c.doc, tel:c.tel,
        visitas:c.visitas, gastado:c.gastado, ticket:c.visitas?Math.round(c.gastado/c.visitas):0,
        puntos:c.puntos, ultima:c.ultima})).sort((a,b)=>b.gastado-a.gastado); }},
    inventario:{t:'Inventario', cols:[
      {k:'nombre',t:'Insumo'},{k:'unidad',t:'Unidad'},{k:'gramos',t:'Existencia',n:1},{k:'minimo',t:'Mínimo',n:1},
      {k:'estado',t:'Estado'},{k:'costoGramo',t:'Costo unitario',n:1,f:'$'},{k:'valor',t:'Valor',n:1,f:'$'},
      {k:'consumo',t:'Consumo periodo',n:1}],
      build(v){ return DB.meats().map(m=>({nombre:m.nombre,
        unidad:{g:'gramos', ml:'mililitros', und:'unidades'}[m.unidad||'g'],
        gramos:m.gramos, minimo:m.minimo,
        estado:{ok:'Disponible',warn:'Crítico',bad:'Agotado'}[DB.stockState(m)], costoGramo:m.costoGramo,
        valor:Math.round(m.gramos*(m.costoGramo||0)),
        consumo:v.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.carne===m.id?i.gramos*i.qty:0),0),0)})); }},
    utilidad:{t:'Utilidad', cols:[
      {k:'fecha',t:'Fecha',f:'d'},{k:'tickets',t:'Tickets',n:1},{k:'bruto',t:'Venta bruta',n:1,f:'$'},
      {k:'descuento',t:'Descuentos',n:1,f:'$'},{k:'impuesto',t:'Impuesto',n:1,f:'$'},{k:'propina',t:'Propina',n:1,f:'$'},
      {k:'domicilio',t:'Domicilios',n:1,f:'$'},
      {k:'costo',t:'Costo',n:1,f:'$'},{k:'utilidad',t:'Utilidad',n:1,f:'$'},{k:'margen',t:'Margen',n:1,f:'%'}],
      build(v){
        const m = {};
        v.forEach(s=>{ const k = s.fecha.slice(0,10);
          m[k] = m[k] || {fecha:k, tickets:0, bruto:0, descuento:0, impuesto:0, propina:0, domicilio:0, costo:0};
          m[k].tickets++; m[k].bruto += s.subtotal; m[k].descuento += s.descuento;
          m[k].impuesto += s.impuesto; m[k].propina += s.propina;
          m[k].domicilio += s.domicilio||0; m[k].costo += s.costo||0; });
        return Object.values(m).map(r=>{ const neto = r.bruto - r.descuento;
          return Object.assign(r,{utilidad:neto-r.costo, margen:neto?Math.round(((neto-r.costo)/neto)*100):0}); })
          .sort((a,b)=>a.fecha<b.fecha?1:-1); }},
    compras:{t:'Compras', cols:[
      {k:'fecha',t:'Fecha',f:'d'},{k:'factura',t:'Factura'},{k:'proveedor',t:'Proveedor'},{k:'corte',t:'Insumo'},
      {k:'gramos',t:'Cantidad',n:1},{k:'costoGramo',t:'Costo unitario',n:1,f:'$'},{k:'total',t:'Total',n:1,f:'$'}],
      build(v, from, to){ return DB.purchases().filter(p=>p.fecha>=from && p.fecha<=to)
        .map(p=>({fecha:p.fecha, factura:p.factura, proveedor:p.proveedor, corte:(DB.meat(p.meatId)||{}).nombre||'—',
          gramos:p.gramos, costoGramo:p.costoGramo, total:p.total})).sort((a,b)=>a.fecha<b.fecha?1:-1); }},
    empleados:{t:'Empleados', cols:[
      {k:'nombre',t:'Persona'},{k:'rol',t:'Rol'},{k:'tickets',t:'Tickets',n:1},{k:'total',t:'Facturado',n:1,f:'$'},
      {k:'ticket',t:'Ticket medio',n:1,f:'$'},{k:'descuentos',t:'Descuentos dados',n:1,f:'$'},{k:'anuladas',t:'Anuladas',n:1}],
      build(v){ return DB.users().map(u=>{
        const mine = v.filter(s=>s.userId===u.id);
        const t = Metrics.totals(mine);
        return {nombre:u.nombre, rol:ROL_LABEL[u.rol], tickets:t.n, total:t.total,
          ticket:t.n?Math.round(t.total/t.n):0, descuentos:t.desc,
          anuladas:DB.d.sales.filter(s=>s.estado==='anulada'&&s.userId===u.id).length}; })
        .sort((a,b)=>b.total-a.total); }},
    domiciliarios:{t:'Domiciliarios', cols:[
      {k:'nombre',t:'Domiciliario'},{k:'telefono',t:'Teléfono'},{k:'pedidos',t:'Pedidos',n:1},
      {k:'facturado',t:'Facturado',n:1,f:'$'},{k:'domicilios',t:'Domicilios cobrados',n:1,f:'$'},
      {k:'ticket',t:'Ticket medio',n:1,f:'$'},{k:'estado',t:'Estado'}],
      /* Se agrupan las ventas a domicilio por quien las llevó. Las que salieron
         sin domiciliario asignado se muestran aparte para no perderlas de vista. */
      build(v){
        const doms = (DB.d.domiciliarios||[]).filter(d => !d.borrado);
        const aDomicilio = v.filter(s => s.tipo === 'domicilio');
        const fila = (id, nombre, telefono, estado) => {
          const mias = aDomicilio.filter(s => ((s.entrega||{}).domiciliarioId||'') === id);
          const facturado = mias.reduce((a,s) => a + (s.total||0), 0);
          return {nombre, telefono:telefono||'—', pedidos:mias.length, facturado,
            domicilios:mias.reduce((a,s) => a + (s.domicilio||0), 0),
            ticket: mias.length ? Math.round(facturado/mias.length) : 0, estado};
        };
        const filas = doms.map(d => fila(d.id, d.nombre, d.telefono,
          d.activo ? (d.enTurno ? 'En turno' : 'Activo') : 'Inactivo'));
        const sinAsignar = fila('', 'Sin domiciliario asignado', '', '—');
        if (sinAsignar.pedidos) filas.push(sinAsignar);
        return filas.filter(f => f.pedidos || f.estado === 'En turno')
          .sort((a,b) => b.facturado - a.facturado);
      }},
    gastos:{t:'Gastos', cols:[
      {k:'fecha',t:'Fecha',f:'dt'},{k:'concepto',t:'Concepto'},{k:'metodo',t:'Forma de pago'},
      {k:'responsable',t:'Responsable'},{k:'valor',t:'Valor',n:1,f:'$'}],
      build(v, from, to){ return (DB.d.gastos||[])
        .filter(g => !g.borrado && g.fecha.slice(0,10) >= from && g.fecha.slice(0,10) <= to)
        .map(g => ({fecha:g.fecha, concepto:g.concepto, metodo:g.metodo||'Efectivo',
          responsable:(DB.user(g.userId)||{}).nombre || '—', valor:g.valor||0}))
        .sort((a,b) => a.fecha < b.fecha ? 1 : -1); }},
    caja:{t:'Caja', cols:[
      {k:'apertura',t:'Apertura',f:'dt'},{k:'cierre',t:'Cierre',f:'dt'},{k:'responsable',t:'Responsable'},
      {k:'base',t:'Base',n:1,f:'$'},{k:'totalVentas',t:'Total ventas',n:1,f:'$'},
      {k:'efectivo',t:'Efectivo',n:1,f:'$'},{k:'transferencia',t:'Transferencia',n:1,f:'$'},
      {k:'otrosMedios',t:'Otros medios',n:1,f:'$'},
      {k:'ingresos',t:'Ingresos',n:1,f:'$'},{k:'egresos',t:'Egresos',n:1,f:'$'},
      {k:'esperado',t:'Esperado',n:1,f:'$'},{k:'contado',t:'Contado',n:1,f:'$'},
      {k:'diferencia',t:'Diferencia',n:1,f:'$'}],
      build(v, from, to){ return DB.d.cash.filter(c=>c.apertura.slice(0,10)>=from && c.apertura.slice(0,10)<=to)
        .map(c=>{
          const ventas = DB.paid().filter(s => s.fecha >= c.apertura && (!c.cierre || s.fecha <= c.cierre));
          const porMetodo = {};
          ventas.forEach(s => (s.pagos||[]).forEach(p => { porMetodo[p.metodo] = (porMetodo[p.metodo]||0) + p.monto; }));
          const totalVentas = ventas.reduce((a,s)=>a+s.total,0);
          const efVentas = porMetodo['Efectivo']||0;
          const transf = (porMetodo['Transferencia']||0) + (porMetodo['Nequi']||0) + (porMetodo['Daviplata']||0);
          const otrosMedios = totalVentas - efVentas - transf;
          const ingresos = c.movs.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
          const egresos = c.movs.filter(m=>m.tipo==='egreso').reduce((a,m)=>a+m.monto,0);
          const esperadoCalc = c.estado==='cerrada' ? (c.esperado||0) : (c.base + totalVentas + ingresos + egresos);
          return {apertura:c.apertura, cierre:c.cierre, responsable:(DB.user(c.userId)||{}).nombre||'—',
            base:c.base, totalVentas, efectivo:efVentas, transferencia:transf, otrosMedios:Math.max(0,otrosMedios),
            ingresos, egresos, esperado:esperadoCalc, contado:c.contado||0,
            diferencia:(c.contado||0)-(esperadoCalc)};
        }).sort((a,b)=>a.apertura<b.apertura?1:-1); }},
    alimentacion:{t:'Alimentación', cols:[
      {k:'fecha',t:'Fecha',f:'dt'},{k:'persona',t:'Persona'},{k:'rol',t:'Rol'},
      {k:'carne',t:'Carne'},{k:'nota',t:'Observación'},{k:'registro',t:'Registró'},
      {k:'costo',t:'Costo',n:1,f:'$'}],
      build(v, from, to){ return DB.meals()
        .filter(m => m.fecha.slice(0,10) >= from && m.fecha.slice(0,10) <= to)
        .map(m => ({fecha:m.fecha, persona:(DB.user(m.userId)||{}).nombre || m.userNombre || '—',
          rol:ROL_LABEL[m.rol] || m.rol || '—', carne:m.carneNombre, nota:m.nota||'',
          registro:m.registroNombre||'', costo:m.costo||0}))
        .sort((a,b) => a.fecha < b.fecha ? 1 : -1); }},
    movimientos:{t:'Movimientos', cols:[
      {k:'fecha',t:'Fecha',f:'dt'},{k:'tipo',t:'Tipo'},{k:'concepto',t:'Concepto'},{k:'usuario',t:'Registró'},{k:'monto',t:'Monto',n:1,f:'$'}],
      build(v, from, to){ const out = [];
        DB.d.cash.forEach(c=>c.movs.forEach(m=>{ const d = m.fecha.slice(0,10);
          if (d>=from && d<=to) out.push({fecha:m.fecha, tipo:m.tipo, concepto:m.concepto,
            usuario:(DB.user(m.userId)||{}).nombre||'—', monto:m.monto}); }));
        return out.sort((a,b)=>a.fecha<b.fecha?1:-1); }}
  },
  fmt(v, f){
    if (v == null || v === '') return '—';
    if (f === '$') return Util.money(v);
    if (f === 'g') return Util.g(v);
    if (f === '%') return v + '%';
    if (f === 'dt') return Util.dt(v);
    if (f === 'd') return Util.date(v);
    return String(v);
  },
  current(){
    const f = State.filters.rep || (State.filters.rep = {tipo:'ventas', from:Util.daysAgo(6).toISOString().slice(0,10), to:Util.today()});
    const def = this.defs[f.tipo];
    const ventas = Metrics.between(f.from, f.to);
    return {f, def, data:def.build(ventas, f.from, f.to), ventas};
  },
  csv(nombre, data, cols){
    if (!data.length) return UI.toast('No hay datos para exportar en este periodo.','warn');
    const keys = cols ? cols.map(c=>c.k) : Object.keys(data[0]);
    const head = cols ? cols.map(c=>c.t) : keys;
    const esc = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
    const csv = [head.map(esc).join(';')].concat(data.map(r=>keys.map(k=>esc(r[k])).join(';'))).join('\r\n');
    Util.download('jhon-parrilla-' + nombre + '-' + Util.today() + '.csv', csv, 'text/csv;charset=utf-8');
    DB.log('reporte:exportar', nombre + ' · CSV · ' + data.length + ' filas');
  },
  xls(nombre, data, cols){
    if (!data.length) return UI.toast('No hay datos para exportar en este periodo.','warn');
    const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>' +
      '<table border="1"><thead><tr>' + cols.map(c=>'<th>' + Util.esc(c.t) + '</th>').join('') + '</tr></thead><tbody>' +
      data.map(r=>'<tr>' + cols.map(c=>'<td>' + Util.esc(r[c.k]==null?'':r[c.k]) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></body></html>';
    Util.download('jhon-parrilla-' + nombre + '-' + Util.today() + '.xls', html, 'application/vnd.ms-excel');
    DB.log('reporte:exportar', nombre + ' · Excel · ' + data.length + ' filas');
  },
  /** Suma las columnas de dinero y de conteo de cualquier reporte.
      Devuelve un objeto por clave de columna, o null si no hay nada que sumar. */
  totales(def, data){
    if (!data.length) return null;
    const sumables = def.cols.filter(c => c.n && c.k !== 'ticket' && c.k !== 'costoGramo' &&
      c.k !== 'margen' && c.f !== '%');
    if (!sumables.length) return null;
    const out = {};
    sumables.forEach(c => { out[c.k] = data.reduce((a,r) => a + (Number(r[c.k])||0), 0); });
    return out;
  },

  /** Genera ticket térmico para reportes — optimizado para impresora térmica 58/80 mm.
      Espacio compacto, totales destacados al final de cada sección. */
  ticketTermico(){
    const {f, def, data} = this.current();
    const c = DB.d.config;
    const w58 = c.ticket === '58';
    /* Separador compacto: línea punteada sin márgenes exagerados */
    const line = '<hr style="margin:2px 0">';
    const sep  = '<tr><td colspan="2" style="border-bottom:1px dotted #aaa;padding:1px 0"></td></tr>';
    const tipo = f.tipo;
    let filas = '';
    /* Acumuladores para totales por sección */
    let totalPrincipal = 0;
    let totalSecundario = 0;
    let labelSecundario = '';

    if (tipo === 'gastos'){
      filas = data.map(g => {
        totalPrincipal += (g.valor||0);
        return '<tr><td style="font-size:9px;line-height:1.1">' + Util.dt(g.fecha) +
          (g.responsable ? ' · ' + Util.esc(g.responsable) : '') +
          (g.metodo && g.metodo !== 'Efectivo' ? ' · ' + Util.esc(g.metodo) : '') + '</td>' +
          '<td class="r b" style="white-space:nowrap">' + Util.money(g.valor||0,false) + '</td></tr>' +
          '<tr><td colspan="2" style="font-size:10px;padding-bottom:2px">' + Util.esc(g.concepto) + '</td></tr>';
      }).join(sep);
    } else if (tipo === 'domiciliarios'){
      labelSecundario = 'Domicilios';
      filas = data.map(d => {
        totalPrincipal  += (d.facturado||0);
        totalSecundario += (d.domicilios||0);
        return '<tr><td class="b" style="padding-top:2px">' + Util.esc(d.nombre) + '</td>' +
          '<td class="r b" style="white-space:nowrap">' + Util.money(d.facturado||0,false) + '</td></tr>' +
          '<tr><td style="font-size:9px">Pedidos: ' + (d.pedidos||0) +
            (d.telefono && d.telefono!=='—' ? ' · ' + Util.esc(d.telefono) : '') + '</td>' +
          '<td class="r" style="font-size:9px">Dom: ' + Util.money(d.domicilios||0,false) + '</td></tr>';
      }).join(sep);
    } else {
      /* INTERVENCIÓN: en reportes con muchas columnas (ventas, caja, utilidad,
         productos, etc.) mostrarlas todas en una sola fila angosta de 80mm
         las comprimía hasta cortarlas — la impresión quedaba incompleta.
         Ahora cada registro se imprime en formato tarjeta: una línea con la
         descripción principal + el valor total del registro (destacados y
         sin truncar), y debajo el resto de columnas en texto que se ajusta
         (wrap) a lo ancho del papel en vez de recortarse. */
      const tt = Reports.totales(def, data);
      const colDesc = def.cols.find(col => !col.n) || def.cols[0];
      /* Prioridad de nombres típicos de "total" por registro, para que el
         valor destacado sea siempre el más representativo del reporte
         (ej.: en Caja resalta el total de ventas, no la diferencia;
         en Clientes resalta el total gastado, no el ticket medio). Si
         ninguno de estos nombres existe, se usa la última columna en
         dinero como respaldo. */
      const PRIORIDAD_TOTAL = ['total','totalVentas','facturado','gastado','monto','utilidad','costo','valor'];
      let colTotal = null;
      for (const key of PRIORIDAD_TOTAL){
        const found = def.cols.find(col => col.k === key);
        if (found){ colTotal = found; break; }
      }
      if (!colTotal) colTotal = def.cols.slice().reverse().find(col => col.f === '$') || null;
      const colsResto = def.cols.filter(col => col !== colDesc && col !== colTotal);
      filas = data.map(r => {
        const detalle = colsResto
          .map(col => Util.esc(col.t) + ': ' + Util.esc(Reports.fmt(r[col.k], col.f)))
          .join(' · ');
        return '<tr><td colspan="2">' +
          '<div style="display:table;width:100%">' +
            '<span style="display:table-cell;font-weight:700;font-size:10.5px">' +
              Util.esc(Reports.fmt(r[colDesc.k], colDesc.f)) + '</span>' +
            (colTotal ? '<span style="display:table-cell;text-align:right;font-weight:700;' +
              'font-size:11px;white-space:nowrap;padding-left:6px">' +
              Util.esc(Reports.fmt(r[colTotal.k], colTotal.f)) + '</span>' : '') +
          '</div>' +
          (detalle ? '<div style="font-size:9px;line-height:1.35;color:#333;margin-top:1px">' +
            detalle + '</div>' : '') +
        '</td></tr>';
      }).join(sep);
      /* Construir bloque de totales genérico: uno por cada columna sumable,
         con el total principal (colTotal) destacado más grande. */
      if (tt){
        const filaTotal = Object.keys(tt).map(k => {
          const col = def.cols.find(cc => cc.k === k);
          const esPrincipal = col && col === colTotal;
          return '<tr' + (esPrincipal ? ' style="border-top:1px solid #000"' : '') + '>' +
            '<td style="' + (esPrincipal ? 'font-weight:700;font-size:11px' : 'font-size:9.5px') +
              ';padding:' + (esPrincipal?'2px 0':'1px 0') + '">' +
              (esPrincipal ? 'TOTAL — ' : '') + Util.esc(col ? col.t : k) + '</td>' +
            '<td class="r" style="' + (esPrincipal ? 'font-weight:700;font-size:13px' : 'font-weight:700;font-size:9.5px') +
              ';white-space:nowrap">' + Util.esc(Reports.fmt(tt[k], col ? col.f : '$')) + '</td></tr>';
        }).join('');
        const cuerpoGen = '<div class="ticket ' + (w58?'w58':'') + '">' +
          (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() +
            '" style="max-width:50%;height:auto;margin-bottom:3px;background:#fff"></div>' : '') +
          '<div class="c b" style="font-size:12px;letter-spacing:.06em">' + Util.esc(c.empresa.toUpperCase()) + '</div>' +
          '<div class="c" style="font-size:9px">NIT ' + Util.esc(c.nit) + ' · ' + Util.esc(c.tel) + '</div>' + line +
          '<div class="c b" style="font-size:11px;letter-spacing:.06em">REPORTE DE ' + def.t.toUpperCase() + '</div>' +
          '<div class="c" style="font-size:9px">' + Util.date(f.from) + ' — ' + Util.date(f.to) + '</div>' +
          '<div class="c" style="font-size:8px">' + Util.dt(Util.now()) + ' · ' + Util.esc((Auth.user||{}).nombre||'') + '</div>' + line +
          '<table style="width:100%">' + filas + '</table>' + line +
          '<table style="width:100%">' + filaTotal + '</table>' + line +
          '<div class="c" style="font-size:8px">' + data.length + ' registros · ' + Util.esc(c.sede) + '</div></div>';
        return UI.modal({title:'Ticket · ' + def.t, size:'sm',
          body:'<div class="ticket-frame">' + cuerpoGen + '</div>',
          footer:'<button class="btn" data-close>Cerrar</button><button class="btn gold" id="rpTk">' + Util.ico('print') + ' Imprimir</button>',
          onMount(ov){ ov.querySelector('#rpTk').onclick = () => { DB.log('reporte:ticket', def.t); UI.imprimir(ov); }; }});
      }
    }

    /* Pie de totales: siempre al final, tipografía destacada */
    const pieTotales =
      '<table style="width:100%">' +
        (totalSecundario > 0
          ? '<tr><td>' + Util.esc(labelSecundario||'Subtotal') + '</td>' +
              '<td class="r b" style="white-space:nowrap">' + Util.money(totalSecundario,false) + '</td></tr>'
          : '') +
        '<tr><td class="b" style="font-size:12px;letter-spacing:.04em">TOTAL</td>' +
          '<td class="r b" style="font-size:14px;white-space:nowrap">' + Util.money(totalPrincipal,false) + '</td></tr>' +
        '<tr><td colspan="2" style="font-size:9px">' + data.length + ' registros</td></tr>' +
      '</table>';

    const cuerpo = '<div class="ticket ' + (w58?'w58':'') + '">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() +
        '" style="max-width:50%;height:auto;margin-bottom:3px;background:#fff"></div>' : '') +
      '<div class="c b" style="font-size:12px;letter-spacing:.06em">' + Util.esc(c.empresa.toUpperCase()) + '</div>' +
      '<div class="c" style="font-size:9px">NIT ' + Util.esc(c.nit) + ' · ' + Util.esc(c.tel) + '</div>' + line +
      '<div class="c b" style="font-size:11px;letter-spacing:.06em">REPORTE DE ' + def.t.toUpperCase() + '</div>' +
      '<div class="c" style="font-size:9px">' + Util.date(f.from) + ' — ' + Util.date(f.to) + '</div>' +
      '<div class="c" style="font-size:8px">' + Util.dt(Util.now()) + ' · ' + Util.esc((Auth.user||{}).nombre||'') + '</div>' + line +
      '<table style="width:100%">' + filas + '</table>' + line +
      pieTotales + line +
      '<div class="c" style="font-size:8px">' + Util.esc(c.sede) + '</div>' +
    '</div>';
    UI.modal({title:'Ticket · ' + def.t, size:'sm',
      body:'<div class="ticket-frame">' + cuerpo + '</div>',
      footer:'<button class="btn" data-close>Cerrar</button><button class="btn gold" id="rpTk">' + Util.ico('print') + ' Imprimir</button>',
      onMount(ov){ ov.querySelector('#rpTk').onclick = () => { DB.log('reporte:ticket', def.t); UI.imprimir(ov); }; }});
  },

  pdf(){
    const {f, def, data} = this.current();
    /* INTERVENCIÓN: todas las secciones del Módulo Reportes imprimen ahora en
       formato térmico ajustado a 80mm (o 58mm según configuración), con los
       totales respectivos de cada selección — igual que gastos/domiciliarios.
       El bloque "hoja" (A4/carta) queda debajo sin usarse, sin eliminarlo,
       por si se necesita restaurar el modo hoja en el futuro. */
    return this.ticketTermico();
    // eslint-disable-next-line no-unreachable

    UI.modal({title:'Vista previa · ' + def.t, size:'lg',
      body:'<div style="background:#fff;color:#111;padding:22px;border-radius:8px" id="pdfdoc">' +
        '<h2 style="font-family:Georgia,serif;margin-bottom:2px">' + Util.esc(c.empresa) + '</h2>' +
        '<div style="font-size:11px;color:#555">NIT ' + Util.esc(c.nit) + ' · ' + Util.esc(c.dir) + '</div>' +
        '<h3 style="margin-top:14px;font-size:14px">Reporte de ' + def.t.toLowerCase() + '</h3>' +
        '<div style="font-size:11px;color:#555;margin-bottom:10px">Periodo ' + Util.date(f.from) + ' a ' + Util.date(f.to) +
          ' · generado ' + Util.dt(Util.now()) + ' por ' + Util.esc((Auth.user||{}).nombre||'') + '</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:11px">' +
        '<thead><tr>' + def.cols.map(col=>'<th style="border-bottom:1.5px solid #111;text-align:' + (col.n?'right':'left') +
          ';padding:5px">' + Util.esc(col.t) + '</th>').join('') + '</tr></thead><tbody>' +

          (col.n?'right':'left') + '">' + Util.esc(Reports.fmt(r[col.k], col.f)) + '</td>').join('') + '</tr>').join('') +
        '</tbody>' +

          if (!tt) return '';
          return '<tfoot><tr>' + def.cols.map((col,i) =>

            (col.n?'right':'left') + '">' + (i===0 ? 'TOTAL'
              : (tt[col.k] !== undefined ? Util.esc(Reports.fmt(tt[col.k], col.f)) : '')) + '</td>').join('') +
          '</tr></tfoot>';
        })() +
        '</table><div style="font-size:10px;color:#777;margin-top:12px">' + data.length + ' registros · ' + Util.esc(c.sede) + '</div></div>',
      footer:'<button class="btn" data-close>Cerrar</button><button class="btn gold" id="pp">' + Util.ico('print') + ' Imprimir o guardar PDF</button>',
      onMount(ov){ ov.querySelector('#pp').onclick = () => { DB.log('reporte:pdf', def.t); UI.imprimir(ov); }; }});
  },

  /** INTERVENCIÓN: seleccionar una factura del reporte de Ventas para
      editarla, eliminarla o reimprimirla — protegido con la clave de
      un administrador, tal como pide la lógica de autorizaciones que ya
      usa el resto de la aplicación (Auth.autorizar). */
  async editarVenta(ventaId){
    const s = (DB.d.sales||[]).find(x => x.id === ventaId);
    if (!s) return UI.toast('No se encontró esa factura.','warn');
    const autorizo = await Auth.autorizar('Editar o eliminar la factura ' + s.numero,
      (DB.client(s.clienteId)||{}).nombre + ' · ' + Util.money(s.total));
    if (!autorizo) return;

    const recalcular = (box) => {
      const num = id => Number(box.querySelector('#' + id).value) || 0;
      const total = num('rvSub') - num('rvDesc') + num('rvImp') + num('rvProp') + num('rvDom');
      box.querySelector('#rvTotal').textContent = Util.money(Math.max(0, total));
    };

    const close = UI.modal({
      title:'Factura ' + s.numero, size:'sm',
      body:'<div id="rvBox">' +
        '<div class="dim" style="font-size:12px;margin-bottom:10px">' + Util.dt(s.fecha) + ' · ' +
          Util.esc((DB.client(s.clienteId)||{}).nombre||'—') + ' · atendió ' + Util.esc((DB.user(s.userId)||{}).nombre||'—') +
        '</div>' +
        '<div class="grid g-form">' +
          '<label class="f">Subtotal<input class="inp num" type="number" id="rvSub" value="' + (s.subtotal||0) + '"></label>' +
          '<label class="f">Descuento<input class="inp num" type="number" id="rvDesc" value="' + (s.descuento||0) + '"></label>' +
          '<label class="f">Impuesto<input class="inp num" type="number" id="rvImp" value="' + (s.impuesto||0) + '"></label>' +
          '<label class="f">Propina<input class="inp num" type="number" id="rvProp" value="' + (s.propina||0) + '"></label>' +
          '<label class="f">Domicilio<input class="inp num" type="number" id="rvDom" value="' + (s.domicilio||0) + '"></label>' +
          '<label class="f">Estado<select class="inp" id="rvEstado">' +
            ['pagada','pendiente','anulada'].map(e=>'<option value="'+e+'"'+(s.estado===e?' selected':'')+'>'+e+'</option>').join('') +
          '</select></label>' +
        '</div>' +
        '<label class="f" style="margin-top:10px">Nota<input class="inp" id="rvNota" value="' + Util.esc(s.nota||'') + '"></label>' +
        '<div class="tot-grand" style="margin-top:12px"><span>Nuevo total</span><b id="rvTotal">' + Util.money(s.total) + '</b></div>' +
        '<div class="dim" style="font-size:11px;margin-top:8px">Corrige aquí valores o la comanda en caso de un error de digitación. ' +
        'Los ítems del pedido se muestran en la comanda impresa; para cambiarlos, anula esta factura y registra el pedido de nuevo.</div>' +
      '</div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
        '<button class="btn" id="rvImprimir">' + Util.ico('print') + ' Imprimir</button>' +
        '<button class="btn" id="rvEliminar" style="color:var(--ember-hi)">' + Util.ico('trash') + ' Eliminar factura</button>' +
        '<button class="btn pri" id="rvGuardar">' + Util.ico('chk') + ' Guardar cambios</button>',
      onMount(ov){
        const box = ov.querySelector('#rvBox');
        box.querySelectorAll('input[type="number"]').forEach(inp => inp.oninput = () => recalcular(box));
        ov.querySelector('#rvImprimir').onclick = () => { DB.log('reporte:venta-imprimir', s.numero, s.id); Ticket.open(s.id); };
        ov.querySelector('#rvGuardar').onclick = () => {
          const num = id => Number(box.querySelector('#' + id).value) || 0;
          s.subtotal = num('rvSub'); s.descuento = num('rvDesc'); s.impuesto = num('rvImp');
          s.propina = num('rvProp'); s.domicilio = num('rvDom');
          s.total = Math.max(0, s.subtotal - s.descuento + s.impuesto + s.propina + s.domicilio);
          s.estado = box.querySelector('#rvEstado').value;
          s.nota = box.querySelector('#rvNota').value || '';
          s.act = Util.now();
          DB.touch('sales');
          DB.log('reporte:venta-editar', s.numero + ' · nuevo total ' + Util.money(s.total) + ' · autorizó ' + autorizo.nombre, s.id);
          Sync.enqueue('sales','update', s);
          UI.toast('Factura ' + s.numero + ' actualizada.','ok');
          close();
          Router.render();
        };
        ov.querySelector('#rvEliminar').onclick = async () => {
          if (!(await UI.confirm('Se eliminará por completo la factura ' + s.numero + ' del sistema. ' +
            'Esta acción no revierte automáticamente el inventario ni los movimientos de caja ya generados por ella.',
            {ok:'Eliminar factura', danger:true}))) return;
          DB.d.sales = DB.d.sales.filter(x => x.id !== s.id);
          DB.touch('sales');
          DB.log('reporte:venta-eliminar', s.numero + ' · ' + Util.money(s.total) + ' · autorizó ' + autorizo.nombre, s.id);
          Sync.enqueue('sales','delete', {id:s.id});
          UI.toast('Factura ' + s.numero + ' eliminada del sistema.','ok');
          close();
          Router.render();
        };
      }
    });
  }
};
Views.reports = {
  actions(){
    return '<button class="btn" data-x="csv">CSV</button><button class="btn" data-x="xls">Excel</button>' +
           '<button class="btn gold" data-x="pdf">PDF</button>';
  },
  html(){
    const {f, def, data, ventas} = Reports.current();
    const t = Metrics.totals(ventas);
    const util = t.total - t.imp - t.prop - t.dom - t.costo;
    const TOPE = 300;
    /* INTERVENCIÓN: en la sección Ventas, el orden pasa a mostrar primero
       el registro más reciente y va desplazándose hacia atrás (de más
       reciente a menos reciente); así, al recortar a las primeras 300
       filas para la pantalla, son siempre las más recientes las que se
       ven, no las más viejas. Los demás reportes (agregados por
       producto/cliente/etc.) no se tocan. */
    const dataOrdenada = f.tipo === 'ventas' ? data.slice().reverse() : data;
    const esVentas = f.tipo === 'ventas';
    const rows = dataOrdenada.slice(0, TOPE).map(r => '<tr' +
      (esVentas ? ' style="cursor:pointer" data-venta-id="' + r.id + '" title="Seleccionar para editar o eliminar (requiere clave de administrador)"' : '') +
      '>' + def.cols.map(c =>
      '<td class="' + (c.n?'n':'') + '">' + Util.esc(Reports.fmt(r[c.k], c.f)) + '</td>').join('') + '</tr>');
    // El pie suma siempre el periodo completo, aunque en pantalla se corten filas
    const tot = Reports.totales(def, data);
    if (tot) rows.push('<tr class="fila-total">' + def.cols.map((c,i) =>
      '<td class="' + (c.n?'n':'') + '">' + (i===0 ? 'TOTAL · ' + data.length + ' registros'
        : (tot[c.k] !== undefined ? Util.esc(Reports.fmt(tot[c.k], c.f)) : '')) + '</td>').join('') + '</tr>');
    return '<div class="view-head"><div><div class="eyebrow">Periodo ' + Util.date(f.from) + ' — ' + Util.date(f.to) + '</div>' +
      '<h2>Reportes</h2></div></div>' +
      '<div class="card" style="margin-bottom:14px"><div class="row wrap">' +
        '<label class="f">Desde<input class="inp" type="date" id="rf" value="' + f.from + '"></label>' +
        '<label class="f">Hasta<input class="inp" type="date" id="rt" value="' + f.to + '"></label>' +
        '<div class="chips wrap grow">' + Object.entries(Reports.defs).map(([k,d]) =>
          '<button class="chip ' + (f.tipo===k?'on':'') + '" data-r="' + k + '">' + d.t + '</button>').join('') + '</div>' +
      '</div>' +
      '<div class="row wrap" style="margin-top:10px;gap:8px">' +
        ['hoy','7','30','mes'].map(p=>'<button class="btn sm" data-q="' + p + '">' +
          ({hoy:'Hoy','7':'7 días','30':'30 días',mes:'Mes actual'})[p] + '</button>').join('') + '</div></div>' +
      '<div class="grid g-kpi" style="margin-bottom:14px">' +
        UI.kpi('Facturado', Util.money(t.total), t.n + ' tickets del periodo') +
        UI.kpi('Descuentos', Util.money(t.desc), 'Aplicados sobre ' + Util.money(t.bruto)) +
        UI.kpi('Utilidad estimada', Util.money(util), 'Después de costo, impuesto y propina') +
        UI.kpi('Ticket promedio', Util.money(t.n ? t.total/t.n : 0), 'Propinas: ' + Util.money(t.prop)) +
      '</div>' +
      '<div class="card pad0"><div class="card-h"><h3>' + def.t + '</h3>' +
        '<span class="dim right" style="font-size:11px">' +
          (data.length > TOPE ? 'mostrando ' + TOPE + ' de ' + data.length : data.length + ' registros') +
          (esVentas ? ' · toca una factura para editarla' : '') + '</span></div>' +
        UI.table(def.cols, rows, {emptyTitle:'Sin datos en el periodo', emptyMsg:'Amplía el rango de fechas o cambia de reporte.'}) +
        (data.length > TOPE ? '<div style="padding:11px 14px;border-top:1px solid var(--line-soft)" class="dim">' +
          'Se muestran las ' + TOPE + ' filas más recientes para que la pantalla siga siendo ágil. ' +
          'Al exportar salen las ' + data.length + '.</div>' : '') + '</div>';
  },
  mount(){
    const f = State.filters.rep;
    document.getElementById('rf').onchange = e => { f.from = e.target.value; Router.render(); };
    document.getElementById('rt').onchange = e => { f.to = e.target.value; Router.render(); };
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { f.tipo = b.dataset.r; Router.render(); });
    document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
      const p = b.dataset.q;
      if (p === 'hoy'){ f.from = f.to = Util.today(); }
      else if (p === 'mes'){ f.from = Util.today().slice(0,8) + '01'; f.to = Util.today(); }
      else { f.from = Util.daysAgo(Number(p)-1).toISOString().slice(0,10); f.to = Util.today(); }
      Router.render();
    });
    document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      const {def, data} = Reports.current();
      const raw = data.map(r => { const o = {}; def.cols.forEach(c => o[c.k] = r[c.k]); return o; });
      if (b.dataset.x === 'csv') Reports.csv(State.filters.rep.tipo, raw, def.cols);
      if (b.dataset.x === 'xls') Reports.xls(State.filters.rep.tipo, raw, def.cols);
      if (b.dataset.x === 'pdf') Reports.pdf();
    });
    /* INTERVENCIÓN: seleccionar una factura del reporte de Ventas para
       editarla o eliminarla, protegido con clave de administrador. */
    document.querySelectorAll('[data-venta-id]').forEach(tr =>
      tr.onclick = () => Reports.editarVenta(tr.dataset.ventaId));
  }
};

    bind('sAhora', () => Sync.run());
    bind('sAvz', () => { State.filters.syncAvz = !State.filters.syncAvz; Router.render(); });

    /* Repite a mano la misma revisión que corre sola al abrir: fusiona lo del
       servidor con lo de aquí y encola lo que allá falte. No borra nada. */
    bind('sRec', async () => {
      UI.toast('Revisando contra el servidor…','info');
      const r = await Sync.hidratar({});
      if (!r) return;
      await Sync.run(true);
      UI.toast(r.modo === 'siembra' ? 'El servidor estaba vacío: se publicó la base de este equipo.'
        : (r.recibidos || r.enviados)
          ? 'Al día: ' + r.recibidos + ' registros recibidos y ' + r.enviados + ' enviados.'
          : 'Ya estaba todo al día.','ok', 5000);
      Router.render();
    });

    bind('sPub', async () => {
      if (!(await UI.confirm('El servidor tomará la carta, el inventario, los usuarios y el histórico de este equipo ' +
        'como punto de partida. Hazlo una sola vez, desde el equipo de la caja.', {ok:'Publicar'}))) return;
      try{
        await Sync.publish();
        UI.toast('Datos publicados. Ya puedes agregar las tablets.','ok'); Router.render();
      }catch(e){
        if (e.yaTieneDatos){
          const ok = await UI.confirm('El servidor ya tiene ' + e.registros + ' registros del restaurante. ' +

            'Si lo que quieres es traer los datos del servidor a este aparato, cancela y usa "Traer los datos".',
            {ok:'Reemplazar de todos modos', danger:true, title:'El servidor ya tiene datos'});
          if (!ok) return;
          try{ await Sync.publish(true); UI.toast('Datos reemplazados en el servidor.','ok'); Router.render(); }
          catch(e2){ UI.toast('No se pudo publicar: ' + e2.message,'bad', 5000); }
          return;
        }
        UI.toast('No se pudo publicar: ' + e.message,'bad', 5000);
      }
    });
    bind('sJoin', async () => {
      if (!(await UI.confirm('Este equipo borrará sus datos y tomará los del servidor. ' +
        'Úsalo al configurar una tablet nueva, no en la caja.', {ok:'Traer datos', danger:true}))) return;
      try{ await Sync.join(); UI.toast('Datos actualizados desde el servidor.','ok'); Router.go('dash'); }
      catch(e){ UI.toast('No se pudo: ' + e.message,'bad', 5000); }
    });
    bind('qclear', async () => {
      if (!(await UI.confirm('Se descartarán ' + DB.d.queue.length + ' operaciones pendientes. ' +
        'Los datos locales no se pierden, pero no se enviarán al servidor.', {ok:'Descartar', danger:true}))) return;
      DB.log('sync:descartar', DB.d.queue.length + ' operaciones');
      DB.d.queue = []; DB.touch('queue'); Router.render();
    });
  },

  /** Pantalla grande para que otro aparato escanee sin acercarse mucho. */
  agregar(){
    const dir = this.direccion();
    if (!dir) return UI.toast('Este equipo no tiene servidor configurado todavía.','warn');
    UI.modal({

        '<div class="qr-url" style="margin-top:14px">' + Util.esc(dir.replace(/^https?:\/\//,'')) + '</div></div>' +
        '<ol class="pasos-n" style="margin-top:18px">' +
          '<li>Abre la <b>cámara</b> del aparato y apúntala al código. Toca el aviso que sale en pantalla.</li>' +
          '<li>Entra con el <b>PIN</b> del mesero. Queda conectado al instante: no hay nada que configurar.</li>' +
          '<li>Para dejarlo como aplicación: menú del navegador → <b>Añadir a pantalla de inicio</b>.</li>' +
          '<li>Sirve por WiFi o por datos móviles. No hace falta que esté en la red del local.</li>' +
        '</ol>' +
        '<p class="dim" style="font-size:11.5px">Si la cámara no lee códigos, escribe la dirección de arriba en el navegador.</p>' +
        '</div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
             '<button class="btn gold" id="qrPrint">' + Util.ico('print') + ' Imprimir el código</button>',
      onMount(ov){
        ov.querySelector('#qrPrint').onclick = () => {
          DB.log('equipo:codigo-impreso', dir);
          UI.imprimir(ov);      // solo el código, no la pantalla que hay detrás
        };
      }
    });
  }
};

      const autorizo = await Auth.autorizar('Borrar datos de ventas y movimientos',

        DB.d.cash.length + ' turnos de caja · ' + DB.d.purchases.length + ' compras');

      if (!(await UI.confirm(

        'Se conservan: carta (productos y categorías), inventario, clientes, equipo, alimentación de empleados y toda la configuración. ' +
        'Antes se genera un respaldo automático que podrás restaurar desde "Recuperar datos".',
        {ok:'Borrar ventas y movimientos', danger:true, title:'Reiniciar ventas y movimientos'}))) return;

      /* Generar respaldo completo descargable antes de borrar */
      const dumpBackup = {version:1, generado:Util.now(), datos:JSON.parse(JSON.stringify(DB.d))};
      Util.download('respaldo-antes-borrar-' + Util.today() + '.json', JSON.stringify(dumpBackup), 'application/json');

      const punto = await Respaldo.antesDe('antes de borrar ventas y movimientos');

      /* Reiniciar solo las colecciones de ventas y movimientos financieros.
         Se conservan: config, users, categories, products, meats, clients, staff, meals */
      DB.d.sales = [];
      DB.d.orders = [];
      DB.d.purchases = [];
      DB.d.cash = [];
      DB.d.gastos = [];
      DB.d.domiciliarios = DB.d.domiciliarios || [];
      // Conservar domiciliarios pero reiniciar su estado de turno
      DB.d.domiciliarios.forEach(d => { d.enTurno = false; });
      DB.d.audit = [];
      DB.d.queue = [];
      // Reiniciar consecutivo de facturación
      DB.d.config.consecutivo = 1;
      DB.d.config.comandaSeq = 0;

      await DB.saveAll();
      Sync.startPolling(); Respaldo.iniciar();
      DB.log('datos:borrar', 'Borrado de ventas y movimientos · autorizó ' + autorizo.nombre +
        (punto ? ' · punto de recuperación guardado' : ' · SIN punto de recuperación') +
        ' · respaldo descargado');

/* --- Datos de demostración ------------------------------------------- */
const Demo = {
  /** Carga una carta y unos cortes de muestra para poder probar el sistema. */
  async catalogo(){
    if (DB.prods().length || DB.meats().length){
      if (!(await UI.confirm('Ya tienes datos cargados. El catálogo de ejemplo se sumará a lo que existe. ' +
        '¿Continuar?', {ok:'Cargar ejemplo'}))) return;
    } else if (!(await UI.confirm('Se cargarán 6 cortes y 23 platos de muestra para que puedas probar el sistema. ' +
      'Puedes borrarlos o reemplazarlos cuando cargues los tuyos.', {ok:'Cargar ejemplo'}))) return;
    const ej = DB.ejemplo();
    ej.meats.forEach(m => { DB.d.meats.push(m); Sync.enqueue('meats','create', m); });
    ej.products.forEach(p => { DB.d.products.push(p); Sync.enqueue('products','create', p); });
    DB.touch('meats','products');
    DB.log('demo:catalogo', ej.meats.length + ' cortes y ' + ej.products.length + ' platos de ejemplo');
    UI.toast('Catálogo de ejemplo cargado.','ok');
    Router.go('menu');
  },
  async seed(){
    if (!DB.prods().length) return UI.toast('Primero carga tu carta: sin platos no se pueden generar ventas.','warn', 4600);
    if (!(await UI.confirm('Se generarán unas 120 ventas de los últimos 14 días para ver reportes y gráficos con datos. Puedes borrarlas después desde Configuración.',
      {ok:'Generar demo'}))) return;
    const nombres = ['Camila Restrepo','Julián Ospina','Marcela Vélez','Sebastián Arango','Paula Cardona','Daniel Zapata'];
    nombres.forEach(n => { if (!DB.clients().some(c=>c.nombre===n))
      DB.d.clients.push({id:Util.uid('cl'), nombre:n, doc:String(10000000+Math.floor(Math.random()*8e7)),
        tel:'30'+Math.floor(10000000+Math.random()*8e7), email:'', notas:'', puntos:0, gastado:0, visitas:0, ultima:null, act:Util.now()}); });
    const c = DB.d.config, prods = DB.prods().filter(p=>p.activo), users = DB.users().filter(u=>u.rol!=='cocina');
    let n = 0;
    for (let d = 13; d >= 0; d--){
      const dia = Util.daysAgo(d);
      const cuantas = 5 + Math.floor(Math.random()*8);
      for (let i = 0; i < cuantas; i++){
        const fecha = new Date(dia); fecha.setHours(11 + Math.floor(Math.random()*11), Math.floor(Math.random()*60));
        const items = [];
        const cuantos = 1 + Math.floor(Math.random()*4);
        for (let k = 0; k < cuantos; k++){
          const p = prods[Math.floor(Math.random()*prods.length)];
          const qty = 1 + Math.floor(Math.random()*2);
          items.push({pid:p.id, nombre:p.nombre, precio:p.precio, qty, gramos:p.gramos, nota:'', total:p.precio*qty, carne:p.carne});
        }
        const subtotal = items.reduce((a,x)=>a+x.total,0);
        const impuesto = Math.round(subtotal*(c.impuesto/100));
        const propina = Math.random() > .6 ? Math.round(subtotal*.1) : 0;
        const costo = items.reduce((a,x)=>a+((DB.product(x.pid)||{}).costo||0)*x.qty,0);
        const total = subtotal + impuesto + propina;
        const metodo = ['Efectivo','Tarjeta débito','Transferencia','Nequi'][Math.floor(Math.random()*4)];
        const cli = DB.clients()[Math.floor(Math.random()*DB.clients().length)];
        const u = users[Math.floor(Math.random()*users.length)];
        DB.d.sales.push({id:Util.uid('v'), numero:c.prefijo + String(c.consecutivo++).padStart(5,'0'),
          fecha:fecha.toISOString(), sede:c.sedeId, userId:u.id, clienteId:cli.id, mesa:String(1+Math.floor(Math.random()*15)),
          items, subtotal, descuento:0, impuesto, propina, costo, total,
          pagos:[{metodo, monto:total}], cambio:0, estado:'pagada', sync:true, act:fecha.toISOString()});
        if (!cli.sistema){ cli.visitas++; cli.gastado += total; cli.ultima = fecha.toISOString(); cli.puntos += Math.floor(total/10000); }
        n++;
      }
    }
    DB.touch('sales','clients','config');
    DB.log('demo:generar', n + ' ventas de demostración');
    UI.toast(n + ' ventas de demostración generadas.','ok');
    Router.go('dash');
  }
};

/* --- 10. Arranque ---------------------------------------------------- */
const Boot = {
  installPrompt:null, _veloSeguro:null,

  async start(){
    await Persist.init();
    const virgen = await DB.load();
    Ticket.prepararLogo();          // deja el logotipo listo para papel
    this.pwa();
    this.net();
    this.keys();
    const reacomodar = Util.debounce(()=>{ if (Auth.user) Router.chrome(); }, 180);
    window.addEventListener('resize', reacomodar);
    window.addEventListener('orientationchange', () => setTimeout(reacomodar, 260));
    /* Si la aplicación se abrió desde el servidor, la conexión se configura
       sola Y el equipo se pone al día antes de pedir el PIN: quien entra por
       la dirección del restaurante ya ve la carta, el inventario y las
       comandas de hoy sin tocar ningún botón. */
    this.velo(true);
    let puesto = null;
    try{ puesto = await Sync.arranque(virgen); }catch(e){ /* nunca traba el arranque */ }
    this.velo(false);
    const conServidor = Sync.activo() && !!puesto && puesto.conectado !== false;

    // Recargar la página no debe costar el trabajo hecho: se reanuda la sesión
    // anterior con su módulo y su pedido. Si caducó, se pide el PIN como siempre.
    const reanudada = await Sesion.restaurar();
    if (!reanudada) Gate.show();
    else if (POS.cart.length)
      UI.toast('Seguimos donde ibas: ' + POS.cart.reduce((a,i)=>a+i.qty,0) +
        ' ítems en el pedido' + (POS.mesa ? ' de la mesa ' + POS.mesa : '') + '.','info', 4600);

    if (virgen && !conServidor)
      setTimeout(()=>UI.toast('Sistema listo. Ingresa con cualquier perfil usando el PIN 1234.','info', 6000), 700);
    else if (virgen && conServidor)
      setTimeout(()=>UI.toast('Equipo conectado al restaurante. Entra con tu PIN de siempre.','ok', 6000), 700);
    if (conServidor && puesto && !puesto.aTiempo)
      UI.toast('El servidor está despertando. Puedes entrar: la información termina de llegar sola.','info', 6000);
  },

  /** Velo de arranque. Se ve mientras el equipo se pone al día y desaparece
      solo; si algo falla, el `finally` de start lo quita igual. Es texto
      plano sobre el fondo de la aplicación: no depende de ninguna hoja de
      estilos ni de que el resto de la interfaz ya esté dibujada. */
  velo(mostrar){
    if (!mostrar){
      clearTimeout(this._veloSeguro);
      /* Se quitan todos: si por cualquier camino quedara más de uno, ninguno
         puede quedarse tapando la pantalla.

         El orden importa. Primero se vuelve intocable (`pointer-events:none`)
         y solo después se desvanece y se retira. Un velo a opacidad cero
         sigue siendo una lámina encima de toda la pantalla: si el navegador
         retrasa el temporizador de retirada —pasa en segundo plano, o con el
         aparato ahogado— la aplicación se ve perfecta pero no responde a
         ningún toque. Quitarle primero la captura del toque hace que ese
         retraso no tenga consecuencias, y la retirada se intenta por tres
         caminos para que no dependa de uno solo. */
      document.querySelectorAll('#bootVelo').forEach(v => {
        v.style.pointerEvents = 'none';
        v.style.opacity = '0';
        const quitar = () => { if (v.parentNode) v.parentNode.removeChild(v); };
        try{ v.addEventListener('transitionend', quitar, {once:true}); }catch(e){}
        setTimeout(quitar, 300);
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(()=>setTimeout(quitar, 0));
      });
      return;
    }
    let el = document.getElementById('bootVelo');
    if (el) return;
    /* Seguro de vida: pase lo que pase más arriba, el velo se va solo.
       Nunca puede dejar el equipo mirando una pantalla negra. */
    clearTimeout(this._veloSeguro);
    this._veloSeguro = setTimeout(()=>Boot.velo(false), 20000);
    el = document.createElement('div');
    el.id = 'bootVelo';
    el.setAttribute('style',
      'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;' +
      'flex-direction:column;gap:14px;background:#0C0B0A;color:#EFE7DA;' +
      'font-family:inherit;transition:opacity .25s ease');
    el.innerHTML =
      '<div style="width:34px;height:34px;border:3px solid rgba(239,231,218,.18);' +
        'border-top-color:#C8A24A;border-radius:50%;animation:bvGira .9s linear infinite"></div>' +
      '<div style="font-size:14px;letter-spacing:.02em">Poniendo el equipo al día…</div>' +
      '<div style="font-size:11.5px;opacity:.55">Trayendo la carta, el inventario y las comandas</div>' +
      '<style>@keyframes bvGira{to{transform:rotate(360deg)}}</style>';
    document.body.appendChild(el);
  },

  net(){
    const upd = (online) => {
      UI.refreshStatus();
      if (online){
        UI.toast('Conexión recuperada. Poniendo el equipo al día.','ok');
        if (DB.d.config.autoSync) Sync.puestaAlDia();
      } else {
        UI.toast('Sin conexión. Puedes seguir vendiendo: todo queda guardado en el equipo.','warn', 4600);
      }
    };
    window.addEventListener('online', ()=>{ upd(true); Sync.escuchar(); });
    window.addEventListener('offline', ()=>upd(false));
    document.addEventListener('visibilitychange', ()=>{
      // Irse a segundo plano es el momento más probable de que el navegador
      // descarte la página: se escribe a disco antes de nada.
      if (document.hidden){ DB._flushYa(); return Sesion.guardarYa(); }
      if (!Auth.user) return;
      // Al volver de segundo plano el canal suele venir muerto: se rehace y,
      // además, se comprueba que no se haya perdido nada mientras tanto.
      if (!Sync.enVivo) Sync.escuchar();
      Sync.puestaAlDia();
    });
    // En móviles la página se descarta sin avisar: se guarda antes de perderla
    window.addEventListener('pagehide', ()=>{ DB._flushYa(); Sesion.guardarYa(); });
    window.addEventListener('pageshow', e => {
      if (!Auth.user) return;
      // e.persisted = la página vuelve congelada de la caché del navegador.
      if (e.persisted || !Sync.enVivo) Sync.escuchar();
      Sync.puestaAlDia();
    });
    window.addEventListener('beforeunload', ()=>{ DB._flushYa(); Sesion.guardarYa(); });
    setInterval(()=>{ if (navigator.onLine && DB.d.config.autoSync && Sync.pending()) Sync.run(true); }, 60000);
  },

  keys(){
    document.addEventListener('keydown', e => {
      if (!Auth.user) return;
      const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
      if (e.key === 'Escape'){
        if (UI._stack.length) return UI.closeAll();
        if (Router.abierto()) return Router.drawer(false);
        if (State.view === 'pos' && POS.q){ POS.q = ''; Router.render(); }
        return;
      }
      if (e.key === 'F1'){ e.preventDefault(); return POS.help(); }
      if (e.key === 'F2'){ e.preventDefault(); if (State.view !== 'pos') Router.go('pos'); else POS.pay(); return; }
      if (e.key === 'F3'){ e.preventDefault(); if (State.view !== 'pos') Router.go('pos');
        setTimeout(()=>{ const q = document.getElementById('pq'); if(q) q.focus(); }, 60); return; }
      if (e.key === 'F4'){ e.preventDefault(); if (State.view === 'pos') POS.clear(true); return; }
      if (e.key === 'F5' && State.view === 'pos' && POS.cart.length){ e.preventDefault(); return POS.sendKitchen(); }
      if (enCampo) return;
      if (e.key === '/'){ e.preventDefault(); const q = document.getElementById('pq'); if(q) q.focus(); }
      if (State.view === 'pos' && POS.cart.length){
        const last = POS.cart[POS.cart.length-1];
        if (e.key === '+') POS.inc(last.lid, 1);
        if (e.key === '-') POS.inc(last.lid, -1);
      }
    });
  },

  /* PWA: manifiesto en memoria + service worker si el origen lo permite. */
  pwa(){
    const icon = (size) => {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
        '<rect width="512" height="512" rx="112" fill="#0C0B0A"/>' +
        '<path d="M120 330h272M120 386h272" stroke="#A3231C" stroke-width="34" stroke-linecap="round"/>' +
        '<path d="M186 140c0 46-46 46-46 100h232c0-54-46-54-46-100" stroke="#C8A24A" stroke-width="30" fill="none" stroke-linecap="round"/>' +
        '</svg>';
      return {src:'data:image/svg+xml,' + encodeURIComponent(svg), sizes:size, type:'image/svg+xml', purpose:'any maskable'};
    };
    const manifest = {
      name:'Jhon Parrilla · POS', short_name:'Jhon Parrilla',
      description:'Punto de venta para restaurante con operación offline.',
      start_url:'.', scope:'.', display:'standalone', orientation:'any',
      background_color:'#0C0B0A', theme_color:'#0C0B0A', lang:'es-CO',
      icons:[icon('192x192'), icon('512x512')]
    };
    try{
      const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
      const link = document.createElement('link'); link.rel = 'manifest'; link.href = url;
      document.head.appendChild(link);
    }catch(e){}

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); Boot.installPrompt = e;
      const b = document.getElementById('btnInstall'); if (b) b.style.display = 'inline-flex';
    });

    // El service worker requiere un archivo propio en el mismo origen (sw.js).
    // Si existe, se registra; si no, la app sigue funcionando desde caché del navegador.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  },
  /** Descarta la copia guardada del navegador y recarga con la versión del servidor.
      La sesión y el pedido en curso quedan guardados antes de irse. */
  async actualizar(){
    await Sesion.guardarYa();
    UI.toast('Buscando la versión más reciente…','info');
    try{
      if (typeof caches !== 'undefined' && caches.keys){
        const llaves = await caches.keys();
        await Promise.all(llaves.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.update().catch(()=>r.unregister())));
      }
    }catch(e){ /* si el navegador no lo permite, la recarga normal basta */ }
    // El parámetro obliga a pedir el archivo de nuevo en vez de servir el guardado
    const url = location.pathname + '?v=' + Date.now() + location.hash;
    setTimeout(()=>location.replace(url), 400);
  },
  async install(){
    if (!this.installPrompt) return UI.toast('Usa el menú del navegador para instalar la aplicación.','info');
    this.installPrompt.prompt();
    await this.installPrompt.userChoice;
    this.installPrompt = null;
  }
};

/* Superficie de depuración: permite inspeccionar y automatizar desde la consola,
   por ejemplo JP.DB.d.meats o JP.Reports.current(). */
window.JP = {Util, QR, Glifo, Persist, DB, Sync, Auth, PERMS, UI, Gate, Sesion, Respaldo, Equipo, Router, State,
  POS, Orders, Ticket, Sales, Importar, Views, Metrics, Chart, Reports, Clients, Demo, Boot};

document.addEventListener('DOMContentLoaded', () => Boot.start());
</script>
