  /** Tras cambiar el carrito solo cambian los contadores y lo que quedó agotado.
      Repintar las tarjetas enteras costaba más que la propia venta. */
  refrescarTarjetas(){
    const grid = document.getElementById('pgrid');
    if (!grid) return;
    grid.querySelectorAll('[data-p]').forEach(card => {
      const p = DB.product(card.dataset.p);
      if (!p) return;
      const n = this.cart.reduce((a,i) => a + (i.pid===p.id ? i.qty : 0), 0);
      let badge = card.querySelector('.qbadge');
      if (n && !badge){
        badge = document.createElement('span');
        badge.className = 'qbadge';
        card.insertBefore(badge, card.firstChild);
      }
      if (badge){ if (n) badge.textContent = n; else badge.remove(); }
      if (p.carne){
        const sin = DB.available(p.carne) < p.gramos;
        card.classList.toggle('stockless', sin);
      }
    });
  },
  paintGrid(){
    const grid = document.getElementById('pgrid'); if(!grid) return;
    const list = this.products();
    if (!list.length){
      const vacio = !DB.prods().length;
      grid.innerHTML = '<div style="grid-column:1/-1">' + (vacio
        ? UI.empty('Todavía no hay platos en la carta',
            Auth.can('menu') ? 'Créalos en Carta o cárgalos de una vez desde un archivo.'
                             : 'Pide a un administrador que cargue la carta.',
            Auth.can('menu') ? '<button class="btn gold" id="posIrCarta">Ir a la carta</button>' : '')
        : UI.empty('Ningún plato coincide','Prueba con otro término o cambia de categoría.')) + '</div>';
      const ir = document.getElementById('posIrCarta');
      if (ir) ir.onclick = () => Router.go('menu');
      return;
    }
    grid.innerHTML = list.map(p => {
      const enCarro = this.cart.filter(i=>i.pid===p.id).reduce((a,i)=>a+i.qty,0);
      const m = p.carne ? DB.meat(p.carne) : null;
      // Una bandeja se agota solo si ninguna de sus carnes alcanza
      const sinStock = p.bandeja
        ? !POS.carnesDe(p).some(x => DB.available(x.m.id) >= (p.gramos||1))
        : (m && DB.available(p.carne) < p.gramos);
      const disp = m ? DB.available(p.carne) : Infinity;
      const k = Glifo.para(p);
      return '<button class="pcard ' + Glifo.tono(k) + ' ' + (sinStock?'stockless':'') +
        (p.bandeja?' bandeja':'') + '" data-p="' + p.id + '">' +
        (enCarro ? '<span class="qbadge">' + enCarro + '</span>' : '') +
        '<span class="ico">' + Glifo.svg(k, 38) + '</span>' +
        '<span class="nm">' + Util.esc(p.nombre) + '</span>' +
        (m ? '<span class="gr">' + Util.cantIns(p.gramos, m) + (sinStock ? ' · agotado' : '') + '</span>'
           : '<span class="gr dim">' + Util.esc((DB.cat(p.cat)||{}).nombre||'') + '</span>') +
        '<span class="pr">' + (p.bandeja
          ? '<small style="font-size:10px;color:var(--ash-dim);font-weight:500">desde </small>' +
            Util.money(DB.desdeBandeja(p))
          : Util.money(p.precio)) + '</span></button>';
    }).join('');
    grid.querySelectorAll('[data-p]').forEach(b => b.onclick = () => POS.add(b.dataset.p));
  },

          : '') +
        '<div class="row" style="gap:6px;margin-top:6px">' +
          ((DB.product(i.pid)||{}).bandeja

            : '<button class="btn sm ghost ci-btn" data-note="' + i.lid + '">' + Util.ico('edit') +

          '<button class="btn sm ghost ci-btn" data-del="' + i.lid + '" style="color:var(--ash-dim)">Quitar</button>' +
        '</div>' +
      '</div>' +
      '<div class="ci-side"><div class="ci-pr">' + Util.money((i.precio + (i.adiciones||[]).reduce((s,x)=>s+x.precio,0))*i.qty) + '</div>' +
        '<div class="qty"><button data-m="' + i.lid + '">−</button><span>' + i.qty + '</span><button data-p2="' + i.lid + '">+</button></div>' +

    foot.innerHTML =
      (pendSub ? '<div class="tot-row" style="color:var(--brass-hi)"><span>Ya en cocina (rondas anteriores)</span>' +
        '<b>' + Util.money(pendSub) + '</b></div>' : '') +
      '<div class="tot-row"><span>Subtotal' + (pendSub ? ' de la mesa' : '') + '</span><b>' + Util.money(t.subtotal) + '</b></div>' +
      (t.descuento ? '<div class="tot-row"><span>Descuento</span><b style="color:var(--ember-hi)">−' + Util.money(t.descuento) + '</b></div>' : '') +
      (t.impuesto ? '<div class="tot-row"><span>' + Util.esc(c.impuestoNombre) + ' ' + c.impuesto + '%</span><b>' + Util.money(t.impuesto) + '</b></div>' : '') +
      (t.propina ? '<div class="tot-row"><span>Propina ' + this.propinaPct + '%</span><b>' + Util.money(t.propina) + '</b></div>' : '') +

      (Auth.can('cobrar') ? '<div class="row" style="gap:8px;margin-bottom:9px">' +

      /* INTERVENCIÓN: botón "Nuevo Pedido" — naranja, en alto relieve.

        'title="Ver todos los platos para seguir agregando">' +
        Util.ico('plus') + ' Nuevo Pedido</button>' +
      '<button class="btn ' + (Auth.can('cobrar')?'gold':'pri') + ' wide" id="btnKitchen" ' + (this.cart.length?'':'disabled') +

      (Auth.can('cobrar') ?
        '<button class="btn pri wide" id="btnPay" ' + (this.cart.length?'':'disabled') + ' style="padding:13px">' +
        'Cobrar ' + Util.money(t.total) + ' <span class="kbd" style="background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.15)">F2</span></button>'
        : '<p class="dim center" style="font-size:11px;margin-top:2px">La cuenta la cierra la caja.</p>');

    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => POS.inc(b.dataset.m, -1));
    box.querySelectorAll('[data-p2]').forEach(b => b.onclick = () => POS.inc(b.dataset.p2, 1));
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => POS.remove(b.dataset.del));
    box.querySelectorAll('[data-note]').forEach(b => b.onclick = () => POS.note(b.dataset.note));
    box.querySelectorAll('[data-band]').forEach(b => b.onclick = () => {
      const it = POS.cart.find(x => x.lid === b.dataset.band);
      if (it) POS.pedirBandeja(DB.product(it.pid), it.lid);
    });
    // Tocar el nombre del plato hace lo mismo que su botón principal
    box.querySelectorAll('[data-linea]').forEach(el => el.onclick = () => {
      const it = POS.cart.find(x => x.lid === el.dataset.linea);
      if (!it) return;
      const p = DB.product(it.pid);
      if (p && p.bandeja) POS.pedirBandeja(p, it.lid); else POS.note(it.lid);
    });
    const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    bind('btnPay', () => POS.pay());
    bind('btnKitchen', () => POS.sendKitchen());
    bind('btnNuevoPedido', () => POS.nuevoPedido());
    bind('btnDesc', () => POS.discount());
    bind('btnProp', () => POS.tip());
    bind('btnSplit', () => POS.split());
    bind('btnDom', () => POS.pedirTipo());

    const fab = document.getElementById('cartfab');
    if (fab) fab.innerHTML = '<span>' + this.cart.reduce((a,i)=>a+i.qty,0) + ' ítems</span><b class="num">' + Util.money(t.total) + '</b>';
    this.refrescarTarjetas();

  discount(){
    if (!Auth.can('descuento')) return UI.toast('Tu rol no puede aplicar descuentos. Pide autorización a un supervisor.','warn');
    UI.formModal({title:'Descuento', size:'sm',
      fields:[
        {k:'pct', label:'Porcentaje (%)', type:'number', val:this.descPct, min:0, max:100},
        {k:'val', label:'Valor fijo', type:'number', val:this.descVal, min:0}
      ],
      onSave(d, close){
        POS.descPct = Math.min(100, Math.max(0, d.pct||0));

        if (POS.descPct || POS.descVal) DB.log('venta:descuento', POS.descPct + '% + ' + Util.money(POS.descVal));

      }});

  pedirTipo(despues){

                opciones.map(v => '<button class="chip" data-v="' + v + '">' + Util.money(v) + '</button>').join('') +

              '<label class="f" style="margin-top:10px">Otro valor' +

            (llevaMensajero ? (()=>{

              return '<div class="grid g-form" style="margin-top:12px">' +
                '<label class="f">Domiciliario' +
                  '<select class="inp" id="tDomiciliario">' +
                    '<option value="">— Seleccionar —</option>' +
                    doms.map(d => '<option value="' + d.id + '"' +

                      '>' + Util.esc(d.nombre) + '</option>').join('') +
                  '</select></label>' +
                '<label class="f">Dirección<input class="inp" id="tDir" value="' + Util.esc(POS.entrega.direccion) +
                  '" placeholder="Cra 43A # 18-25, apto 302"></label>' +
                '<label class="f">Teléfono<input class="inp" id="tTel" value="' + Util.esc(POS.entrega.telefono) +
                  '" placeholder="300 000 0000"></label>' +
              '</div>';
            })() : '') +
            '<p class="dim" style="font-size:11.5px;margin-top:10px">Cocina lo verá marcado como <b>' +
              POS.TIPOS[tipo].corto.toUpperCase() + '</b> y lo pondrá de primero.</p>';

          const marca = () => det.querySelectorAll('[data-v]').forEach(b =>
            b.classList.toggle('on', Number(b.dataset.v) === Number(valor)));
          det.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
            valor = Number(b.dataset.v);
            const inp = det.querySelector('#tValor'); if (inp) inp.value = valor;
            marca();

  /** Manda lo que hay en el carrito a la pantalla de cocina. No cobra ni descuenta inventario. */
  sendKitchen(){
    if (!this.cart.length) return;
    if (!this.mesa) return this.askMesa(()=>POS.sendKitchen());
    const c = DB.d.config;
    let o = this.orderId ? DB.order(this.orderId) : null;
    /* CORRECCIÓN DE RAÍZ (comanda y valor duplicados "en el sistema"):
       esta pantalla no exige reabrir la mesa desde "Comandas" para
       agregarle otra ronda — basta con escribir el mismo número de mesa
       en "¿Para qué mesa?" y enviar a cocina. Si quien atiende hace eso
       en vez de usar "Agregar" sobre la comanda ya abierta (o si otra
       tablet acaba de crearla y a esta todavía no le llegó por la
       sincronización), this.orderId queda vacío y el código de abajo no
       tenía forma de saber que la mesa YA tenía una comanda abierta: creaba
       una segunda, con su propio id. Cada comanda, vista o impresa por
       separado, muestra su propio valor correcto — por eso el tiquete
       siempre "sale bien" — pero la mesa queda con dos pedidos abiertos en
       vez de uno, así que las listas, el KDS y el total de la mesa suman
       ambos y todo se ve duplicado. Antes de crear una comanda nueva para
       una mesa, se busca si ya hay una abierta para ese mismo número y, si
       la hay, se usa esa (se le agrega la ronda) en vez de duplicarla —
       igual que ya se hace aquí mismo cuando sí se conoce el id. */
    if (!o && this.tipo === 'mesa' && this.mesa){
      o = DB.ordersOf(this.mesa)[0] || null;
      if (o) this.orderId = o.id;
    }
    const ronda = o ? (Math.max(0, ...o.items.map(i=>i.ronda||1)) + 1) : 1;
    /* Una línea que YA está en la comanda no se vuelve a enviar. Pasa, por
       ejemplo, si se abrió el cobro (que trae al carrito toda la mesa), se
       pulsó "Volver" y después "Agregar a la comanda": sin este filtro la
       mesa quedaría con los platos duplicados y cobrando de más. */
    const yaEnComanda = o ? new Set((o.items||[]).map(i=>i.lid).filter(Boolean)) : new Set();
    const porEnviar = this.cart.filter(i => !i.lid || !yaEnComanda.has(i.lid));
    if (o && !porEnviar.length){
      UI.toast('Esos platos ya están en la comanda ' + o.numero + '. No se envió nada repetido.','info', 4600);
      return;
    }
    const nuevos = porEnviar.map(i => ({
      lid:i.lid, pid:i.pid, nombre:i.nombre, precio:i.precio, qty:i.qty, gramos:i.gramos,
      nota:i.nota, adiciones:i.adiciones||[], total:(i.precio + (i.adiciones||[]).reduce((s,x)=>s+x.precio,0))*i.qty,
      carne: i.carne !== undefined ? i.carne : ((DB.product(i.pid)||{}).carne||null),
      carneNombre: i.carneNombre || '',
      ronda, st:'pendiente'
    }));
    if (o){
      o.items = o.items.concat(nuevos);
      if (o.estado === 'listo' || o.estado === 'entregado') o.estado = 'pendiente';
      // Si se marcó para llevar después de abrir la mesa, la comanda se actualiza
      if (this.esLlevar()){
        o.tipo = this.tipo;
        o.domicilio = Number(this.domicilio)||0;
        o.entrega = Object.assign({}, this.entrega);
      }
      o.act = Util.now();
    } else {
      c.comandaSeq = (c.comandaSeq||0) + 1;
      o = {
        id:Util.uid('o'), numero:'C' + String(c.comandaSeq).padStart(4,'0'),
        mesa:this.mesa, meseroId:(Auth.user||{}).id, clienteId:this.clienteId,
        fecha:Util.now(), items:nuevos, estado:'pendiente', nota:this.nota,
        tipo:this.tipo, domicilio:this.esLlevar() ? (Number(this.domicilio)||0) : 0,
        entrega:this.esLlevar() ? Object.assign({}, this.entrega) : null,
        sede:c.sedeId, tiempos:{enviado:Util.now()}, act:Util.now()
      };
      DB.orders().push(o);
    }
    DB.touch('orders','config');
    DB.log('comanda:enviar', o.numero + ' · ' + (o.tipo && o.tipo !== 'mesa'
        ? POS.TIPOS[o.tipo].corto + (o.domicilio ? ' · domicilio ' + Util.money(o.domicilio) : '')
        : 'mesa ' + o.mesa) +
      ' · ronda ' + ronda + ' · ' + nuevos.reduce((a,i)=>a+i.qty,0) + ' ítems', o.id);
    Sync.enqueue('orders','update', o);
    const mesa = o.mesa, id = o.id;
    this.reset();
    Router.render();
    /* Toast especial: centrado en la parte superior, grande y destacado */
    (()=>{
      const box = document.getElementById('toasts');
      const el = document.createElement('div');
      const txt = '✓ Comanda ' + o.numero + ' enviada a cocina · ' +
        (o.tipo && o.tipo !== 'mesa' ? POS.TIPOS[o.tipo].corto.toUpperCase() : 'Mesa ' + mesa);
      el.className = 'toast comanda-ok';
      el.textContent = txt;
      box.appendChild(el);
      const dur = 3800;
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; }, dur-250);
      setTimeout(()=> el.remove(), dur);
    })();
    if (Sync.activo() && !navigator.onLine)
      UI.toast('Sin red: la cocina la verá en cuanto vuelva la conexión.','warn', 4600);
    setTimeout(()=>Ticket.comanda(id, ronda), 350);
  },
  /** INTERVENCIÓN (corrección): "Nuevo Pedido" — botón naranja de la
      sección Pedido / Nota. Se redirige su función: en vez de enviar a

  /** Carga una comanda abierta en el carrito, para agregarle platos o para cobrarla. */
  loadOrder(id, paraCobrar){

  /* --- cobro --- */
  pay(personas){
    if (!this.cart.length && !this.pendientesComanda().length) return;
    if (!Auth.can('cobrar')) return UI.toast('La cuenta la cierra la caja. Envía el pedido a cocina y avisa en caja.','warn', 4200);
    if (!DB.openCash()) return UI.toast('Abre la caja antes de cobrar.','warn');
    /* Cobrar una comanda abierta es cobrarla completa: se suman primero los
       platos de las rondas anteriores que no estuvieran en el carrito. */
    const sumados = this.completarCuenta();
    if (sumados){
      this.paint();
      const oc = DB.order(this.orderId) || {};
      UI.toast('Se sumaron ' + sumados + ' plato(s) de rondas anteriores de la comanda ' +
        (oc.numero || '') + '. La cuenta se cobra completa.','info', 6000);
    }
    const t = this.calc();
    const METODOS = ['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','Nequi','Daviplata','Otro'];
    let pagos = personas
      ? Array.from({length:personas}, (_,i) => ({metodo:'Efectivo', monto: i === personas-1 ? t.total - Math.floor(t.total/personas)*(personas-1) : Math.floor(t.total/personas)}))
      : [{metodo:'Efectivo', monto:t.total}];
    let recibeCliente = 0;

    const close = UI.modal({
      title:'Cobrar ' + Util.money(t.total), size:'',
      body:'<div id="payBox"></div>',
      footer:'<button class="btn" data-close>Volver</button>' +
             '<button class="btn pri" id="doPay">Confirmar cobro y facturar</button>',
      onMount(ov, cls){
        const box = ov.querySelector('#payBox');
        /* CORRECCIÓN DE RAÍZ (no se puede digitar de corrido en "monto" ni en
           "el cliente paga con"): la versión anterior reconstruía TODO
           box.innerHTML en cada tecla y luego intentaba devolver el foco al
           input recién creado. Eso funciona en un mouse/teclado de escritorio,
           pero en una tablet/POS táctil, destruir el <input> activo cierra el
           teclado en pantalla aunque el foco de DOM se restaure a tiempo — el
           navegador no vuelve a abrirlo solo, así que cada carácter exige un
           toque nuevo para reabrir el teclado. La causa raíz real es volver a
           crear el <input> en cada tecla; la solución de raíz es dejar de
           hacerlo: los campos de "monto" y de "el cliente paga con" ahora se
           crean UNA sola vez (en render(), cuando cambian filas/método) y
           jamás se destruyen mientras se está escribiendo en ellos. Lo único
           que se recalcula tecla a tecla — el cuadro de "falta/excedente" y
           el resultado de la calculadora de cambio — vive en contenedores
           aparte que no contienen ningún <input>, así que reconstruirlos no
           le quita el foco a nada. */
          const faltaHTML = () => {
            const cubierto = pagos.reduce((a,p)=>a+(Number(p.monto)||0),0);
            const falta = t.total - cubierto;
            return '<div class="card" style="margin-top:12px;border-color:' + (Math.abs(falta)<1?'var(--line-soft)':'var(--ember-dim)') + '">' +
              '<div class="row"><span class="mut" style="font-size:12.5px">' + (falta > 0 ? 'Falta por cubrir' : (falta < 0 ? 'Excedente registrado' : 'Cuenta cuadrada')) + '</span>' +
              '<b class="num right" style="font-size:18px;color:' + (falta>0?'var(--ember-hi)':(falta<0?'var(--brass-hi)':'var(--ok)')) + '">' +
              Util.money(Math.abs(falta)) + '</b></div></div>';
          };
          const cambioHTML = () => {
            if (!(recibeCliente > 0)) return '';
            const cambioRecibe = recibeCliente - t.total;
            return '<div style="margin-top:10px;padding:10px 14px;border-radius:8px;background:' +
                (cambioRecibe >= 0 ? 'rgba(62,155,98,.1)' : 'rgba(220,80,60,.08)') +
                ';text-align:center">' +
                '<div style="font-size:11px;color:var(--ash-dim)">' + (cambioRecibe >= 0 ? 'Devuelta al cliente' : 'Falta') + '</div>' +
                '<div style="font-size:28px;font-weight:800;letter-spacing:-.02em;color:' +
                  (cambioRecibe >= 0 ? 'var(--ok)' : 'var(--ember-hi)') + '">' +
                  (cambioRecibe >= 0 ? Util.money(cambioRecibe) : '−' + Util.money(Math.abs(cambioRecibe))) +
                '</div></div>';
          };
          /* Recalcula solo los cuadros derivados (falta/excedente y cambio),
             sin tocar los <input> de monto ni el de "paga con". Se llama en
             cada tecla. */
          const actualizarTotales = () => {
            const fc = box.querySelector('#payFaltaCard');
            if (fc) fc.outerHTML = faltaHTML();
            const cc = box.querySelector('#cambioResultado');
            if (cc) cc.innerHTML = cambioHTML();
          };
          /* Reconstruye la estructura completa (filas de pago, método,
             botones): solo se llama cuando cambia el NÚMERO de filas o el
             método de pago — nunca por escribir un monto — así que perder el
             foco aquí no afecta la escritura fluida. */
        const paint = () => {
          const tieneEfectivo = pagos.some(p => p.metodo === 'Efectivo');
          box.innerHTML =
            '<div class="card" style="margin-bottom:12px"><div class="tot-row"><span>Subtotal</span><b>' + Util.money(t.subtotal) + '</b></div>' +
            (t.descuento?'<div class="tot-row"><span>Descuento</span><b>−' + Util.money(t.descuento) + '</b></div>':'') +
            (t.impuesto?'<div class="tot-row"><span>' + Util.esc(DB.d.config.impuestoNombre) + '</span><b>' + Util.money(t.impuesto) + '</b></div>':'') +
            (t.propina?'<div class="tot-row"><span>Propina</span><b>' + Util.money(t.propina) + '</b></div>':'') +
            '<div class="tot-grand"><span>Total</span><b>' + Util.money(t.total) + '</b></div></div>' +
            '<div class="eyebrow">Formas de pago</div>' +
            pagos.map((p,i) =>
              '<div class="row" style="margin-top:8px">' +
                '<select class="inp" data-met="' + i + '" style="flex:1.3">' + METODOS.map(m=>'<option' + (m===p.metodo?' selected':'') + '>' + m + '</option>').join('') + '</select>' +
                '<input class="inp num" type="number" data-mon="' + i + '" value="' + p.monto + '" style="flex:1;text-align:right">' +
                (pagos.length>1 ? '<button class="btn icon ghost" data-rm="' + i + '">' + Util.ico('x') + '</button>' : '') +
              '</div>').join('') +
            '<button class="btn sm ghost" id="addPay" style="margin-top:9px">' + Util.ico('plus') + ' Agregar forma de pago</button>' +
            /* MEJORA: pago mixto (Comandas) — atajo que arma en un clic las
               dos filas Efectivo + Transferencia, dejando que la cajera
               digite manualmente cuánto corresponde a cada una. No crea
               infraestructura nueva: reutiliza el mismo arreglo "pagos"
               (varias filas metodo/monto) que ya alimenta correctamente el
               cierre de caja y los reportes por forma de pago (ver
               DB.ventasPorMetodo/porMetodo más abajo en el archivo), así
               que el desglose queda interconectado sin tocar esa lógica. */
            '<button class="btn sm ghost" id="mixPay" style="margin-top:9px;margin-left:8px">' + Util.ico('plus') + ' Pago mixto (efectivo + transferencia)</button>' +

            /* Calculadora de cambio: se muestra cuando hay pago en efectivo.
               El resultado va en su propio contenedor (#cambioResultado) para
               poder actualizarlo tecla a tecla sin reconstruir el <input>. */
            (tieneEfectivo
              ? '<div class="card" style="margin-top:12px;border-color:var(--brass)">' +
                  '<div class="eyebrow" style="margin-bottom:8px">Calculadora de cambio</div>' +
                  '<label class="f" style="margin-bottom:0"><span style="font-size:12px">El cliente paga con:</span>' +
                    '<input class="inp num" type="number" id="recibeBillete" value="' + (recibeCliente||'') +
                    '" placeholder="Ej: 100000" min="0" style="text-align:right;font-size:18px;font-weight:700"></label>' +
                  '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">' +
                    [10000,20000,50000,100000].map(v =>
                      '<button class="btn' + (recibeCliente===v?' gold':'') + '" data-bill="' + v + '" ' +
                        'style="flex:1;min-width:80px;font-size:16px;font-weight:700;padding:12px 8px">' + Util.money(v,false) + '</button>'
                    ).join('') +
                  '</div>' +
                  '<div id="cambioResultado">' + cambioHTML() + '</div>' +
                '</div>'
              : '') +

            faltaHTML().replace('class="card"', 'class="card" id="payFaltaCard"');
          box.querySelectorAll('[data-met]').forEach(s => s.onchange = e => { pagos[+s.dataset.met].metodo = e.target.value; paint(); });
          box.querySelectorAll('[data-mon]').forEach(inp => inp.oninput = () => { pagos[+inp.dataset.mon].monto = Number(inp.value)||0; actualizarTotales(); });
          box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { pagos.splice(+b.dataset.rm,1); paint(); });
          box.querySelector('#addPay').onclick = () => {
            const falta2 = t.total - pagos.reduce((a,p)=>a+(Number(p.monto)||0),0);
            pagos.push({metodo:'Tarjeta débito', monto: Math.max(0, falta2)}); paint();
          };
          /* MEJORA: pago mixto — reemplaza las filas actuales por exactamente
             dos: Efectivo y Transferencia, con el total dividido a la mitad
             como punto de partida (redondeado a la unidad); la cajera edita
             ambos montos con los mismos inputs numéricos de siempre y la
             validación de "falta/excedente" ya existente (misma tolerancia
             de $0.5 usada en #doPay) impide confirmar si la suma no cuadra. */
          const btnMix = box.querySelector('#mixPay');
          if (btnMix) btnMix.onclick = () => {
            const mitad = Math.round(t.total/2);
            pagos = [{metodo:'Efectivo', monto:mitad}, {metodo:'Transferencia', monto:t.total-mitad}];
            paint();
          };
          /* Handlers de la calculadora de cambio: escribir aquí solo
             actualiza el resultado (#cambioResultado), nunca reconstruye
             este mismo <input>. */
          const inpRecibe = box.querySelector('#recibeBillete');
          if (inpRecibe) inpRecibe.oninput = () => { recibeCliente = Number(inpRecibe.value)||0; actualizarTotales(); };
          box.querySelectorAll('[data-bill]').forEach(b => b.onclick = () => {
            recibeCliente = parseInt(b.dataset.bill, 10);
            paint();
          });
        };
        paint();
        ov.querySelector('#doPay').onclick = () => {
          const cubierto = pagos.reduce((a,p)=>a+(Number(p.monto)||0),0);
          if (cubierto < t.total - 0.5) return UI.toast('El pago no cubre el total. Faltan ' + Util.money(t.total-cubierto) + '.','bad');
          cls();
          POS.commit(pagos, t);
        };
      }
    });
  },
  commit(pagos, t){
    const c = DB.d.config;
    const numero = c.prefijo + String(c.consecutivo).padStart(5,'0');
    const efectivo = pagos.filter(p=>p.metodo==='Efectivo').reduce((a,p)=>a+p.monto,0);
    const cambio = Math.max(0, pagos.reduce((a,p)=>a+p.monto,0) - t.total);

    const venta = {
      id:Util.uid('v'), opId:Util.uid('op'), numero, fecha:Util.now(), sede:c.sedeId,
      userId:(Auth.user||{}).id, clienteId:this.clienteId, mesa:this.mesa, nota:this.nota,
      items:this.cart.map(i => ({pid:i.pid, nombre:i.nombre, precio:i.precio, qty:i.qty, gramos:i.gramos,
        nota:i.nota, adiciones:i.adiciones||[], total:(i.precio + (i.adiciones||[]).reduce((s,x)=>s+x.precio,0))*i.qty,
        carne: i.carne !== undefined ? i.carne : ((DB.product(i.pid)||{}).carne||null),
        carneNombre: i.carneNombre || ''})),
      tipo:this.tipo, domicilio:t.domicilio,
      entrega:this.esLlevar() ? Object.assign({}, this.entrega) : null,
      subtotal:t.subtotal, descuento:t.descuento, impuesto:t.impuesto, propina:t.propina,
      costo:t.costo, total:t.total, pagos:pagos.map(p=>({metodo:p.metodo, monto:Number(p.monto)||0})),
      cambio, estado:'pagada', sync:false, act:Util.now()
    };
    /* CORRECCIÓN DE RAÍZ (cierre de Domicilios en $0): cuando un pedido tipo
       'domicilio' se cobra desde la pantalla general de Vender (no desde el
       formulario propio de Domicilios), la venta nunca quedaba marcada con
       el turno de domicilios activo (domTurnoId). Domicilios.turnoTotals()
       solo la contaba si el userId y la fecha caían justo en la ventana del
       turno; si otra persona cobraba, o el turno se abría/cerraba en medio,
       la venta se perdía y el resumen de cierre salía en $0. Se sella aquí
       el mismo turno que usa el "Cobrar" del módulo Domicilios. */
    if (venta.tipo === 'domicilio'){
      const turnoDom = Domicilios.turnoDeCobro(venta);
      if (turnoDom) venta.domTurnoId = turnoDom.id;
    }

    // 1. Descuento de inventario en gramos, por corte
    const consumo = {};
    venta.items.forEach(i => { if (i.carne) consumo[i.carne] = (consumo[i.carne]||0) + i.gramos*i.qty; });
    // 1b. Descuento de insumos adicionales (insumosExtra) por producto
    venta.items.forEach(i => {
      const prod = DB.product(i.pid);
      if (prod && Array.isArray(prod.insumosExtra)){
        prod.insumosExtra.forEach(ie => {
          if (ie.id) consumo[ie.id] = (consumo[ie.id]||0) + (ie.qty||1)*i.qty;
        });
      }
    });
    Object.entries(consumo).forEach(([mid, g]) => {
      const m = DB.meat(mid); if(!m) return;
      m.gramos = Math.max(0, m.gramos - g); m.act = Util.now();
    });
    // 2. Cliente
    const cli = DB.client(this.clienteId);
    if (cli && !cli.sistema){
      cli.visitas++; cli.gastado += t.total; cli.ultima = venta.fecha;
      cli.puntos += Math.floor(t.total/10000); cli.act = Util.now();
    }
    // 3. Caja
    const caja = DB.openCash();
    if (caja){
      caja.movs.push({id:Util.uid('mv'), tipo:'venta', fecha:venta.fecha, concepto:'Venta ' + numero,
        monto:efectivo, metodo:'Efectivo', ventaId:venta.id, userId:venta.userId});
      caja.act = Util.now();
    }
    // 4. Persistir + auditar + encolar
    DB.d.sales.push(venta);
    c.consecutivo++;
    const orden = this.orderId ? DB.order(this.orderId) : null;
    if (orden){
      /* Si se cobró algo que nunca se envió a cocina, queda anotado en la
         comanda: así lo facturado y la comanda dicen lo mismo. */
      const yaEn = new Set((orden.items||[]).map(i=>i.lid).filter(Boolean));
      const rondaFin = Math.max(0, ...(orden.items||[]).map(i=>i.ronda||1)) + 1;
      (this.cart||[]).forEach(i => {
        if (i.lid && yaEn.has(i.lid)) return;
        orden.items.push({lid:i.lid || Util.uid('l'), pid:i.pid, nombre:i.nombre, precio:i.precio,
          qty:i.qty, gramos:i.gramos, nota:i.nota||'', adiciones:i.adiciones||[],
          total:(i.precio + (i.adiciones||[]).reduce((s,x)=>s+(x.precio||0),0))*i.qty,
          carne: i.carne !== undefined ? i.carne : null, carneNombre:i.carneNombre||'',
          ronda:rondaFin, st:'cobrado'});
      });
      orden.estado = 'cobrada'; orden.ventaId = venta.id; orden.numeroVenta = numero;
      orden.tiempos = Object.assign({}, orden.tiempos, {cobrado:venta.fecha});
      orden.act = Util.now();
      venta.orderId = orden.id;
      Sync.enqueue('orders','update', orden);
    }
    DB.touch('sales','orders','meats','clients','cash','config');
    DB.log('venta:pagada', numero + ' · ' + Util.money(t.total) + ' · ' + pagos.map(p=>p.metodo).join(', '), venta.id);
    Sync.enqueue('sales','create', venta);
    Object.keys(consumo).forEach(mid => { const m = DB.meat(mid); if (m) Sync.enqueue('meats','update', m); });
    if (cli && !cli.sistema) Sync.enqueue('clients','update', cli);
    if (caja) Sync.enqueue('cash','update', caja);
    Sync.enqueue('config','update', Object.assign({id:'config', act:Util.now()}, c));

    this.reset();
    const bajos = DB.lowStock();
    UI.toast('Venta ' + numero + ' registrada por ' + Util.money(t.total) + '.','ok');
    if (bajos.length) UI.toast('Revisa inventario: ' + bajos.map(m=>m.nombre).join(', ') + ' bajo el mínimo.','warn', 5000);
    Router.render();
    Ticket.open(venta.id, true);
  }
};

/* ==========================================================================
   MÓDULO DOMICILIOS — Gestión completa de pedidos a domicilio
   Flujo: Nuevo → Datos cliente → Selección platos → Enviar cocina → Cobrar
   ========================================================================== */
const Domicilios = {
  /* Estado del formulario activo en memoria */
  _borrador: null,

  _nuevoBorrador(){
    return { nombre:'', contacto:'', direccion:'', telefono:'', items:[], nota:'', _id:null, domicilioValor:null };
  },

  borrador(){ return this._borrador || (this._borrador = this._nuevoBorrador()); },

  /* CORRECCIÓN DE RAÍZ — facturas/pedidos duplicados y valores que
     "cambian solos": _borrador es UN SOLO objeto en memoria compartido
     por todo el módulo. Antes solo se limpiaba si el operario pulsaba
     "Imprimir" o "Nuevo pedido" en el tiquete final; si cerraba esa
     ventana de cualquier otra forma (la "X", clic afuera, o si volvía a
     pulsar "Nuevo domicilio" sin pasar por ahí), el formulario reabría
     ESE MISMO borrador —con el id, cliente y platos del pedido recién
     guardado— y al guardar de nuevo se sobrescribía esa factura con
     datos de otro cliente, o quedaban platos de un pedido anterior
     sumados al nuevo. Ahora resetBorrador() se dispara automáticamente:
     1) apenas se guarda con éxito (ver "Enviar a Cocina"/"Cobrar"),
     2) al cerrar el formulario sin guardar (Cancelar, "X" o clic afuera).
     Así el próximo pedido siempre arranca limpio. */
  resetBorrador(){ this._borrador = null; },

  /* Calcula totales del borrador actual */
  calcBorrador(items, domicilioOverride){
    const c = DB.d.config;
    const subtotal = items.reduce((a,i)=>{
      const adP = (i.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
      return a + (Number(i.precio||0) + adP) * (Number(i.qty)||1);
    }, 0);
    const impuesto = c.impuestoIncluido ? 0 : Math.round(subtotal*(Number(c.impuesto)||0)/100);
    /* INTERVENCIÓN: si el pedido tiene un valor de domicilio elegido con
       los botones rápidos ($1.000 a $10.000), ese valor manda sobre la
       tarifa general configurada, y se suma igual en el resumen, la
       comanda y la factura (todos parten de este mismo cálculo). */
    const domVal = (domicilioOverride!=null && domicilioOverride!=='')
      ? Number(domicilioOverride)||0
      : Number(c.domicilioValor)||0;
    return { subtotal, impuesto, domicilio: domVal, total: subtotal + impuesto + domVal };
  },

  /* Lista de domicilios del día (ventas tipo domicilio) */
  listaHoy(){
    const hoy = Util.today();
    return (DB.d.sales||[]).filter(s => s.tipo === 'domicilio' && (s.fecha||'').slice(0,10) === hoy)
      .slice().reverse();
  },

  /* INTERVENCIÓN: turnos de las encargadas de Domicilios (apertura y
     cierre), con la misma lógica de cálculo que usa el módulo Caja
     (Metrics.byPayment sobre las ventas del rango). Se agregan
     "ingresos" (lo facturado) y "egresos" (gastos reales registrados
     por esa encargada durante el turno, tomados de DB.d.gastos — la
     misma fuente ya corregida que usa Caja), para que el resumen de un
     cierre de Domicilios tenga la misma estructura que el de Caja:
     facturas, efectivo, transferencia, ingresos y egresos. */
  /** El turno de domicilios al que pertenece un cobro.

      Se marca en la venta al cobrarla, y esa marca es la que manda después.
      Deducirlo por "quién es el dueño de la venta" no funciona en un
      restaurante real: una encargada toma el pedido y otra lo cobra, o lo
      cobra la caja. Atar la venta a un `userId` obliga a elegir a cuál de las
      dos pertenece, y la otra ve su resumen en ceros. El cobro, en cambio,
      ocurre una sola vez y en un turno concreto. */
  turnoDeCobro(venta){
    const propio = DB.openDomTurno((Auth.user||{}).id);
    if (propio) return propio;
    // Si quien cobra no lleva turno (la caja, por ejemplo), se imputa al turno
    // abierto de quien tomó el pedido, que es quien responde por ese dinero.
    const deQuienTomo = venta && venta.userId ? DB.openDomTurno(venta.userId) : null;
    return deQuienTomo || null;
  },

  turnoTotals(t){
    const ventas = DB.paid().filter(s => {
      if (s.tipo !== 'domicilio') return false;
      // Marcada al cobrar: no hay nada que deducir.
      if (s.domTurnoId) return s.domTurnoId === t.id;
      /* Ventas anteriores a que existiera la marca. Se resuelven como antes,
         por encargada y ventana, para que el historial siga cuadrando. */
      return s.userId === t.userId && s.fecha >= t.apertura && (!t.cierre || s.fecha <= t.cierre);
    });
    const porMetodo = Metrics.byPayment(ventas);
    const efectivo = porMetodo['Efectivo'] || 0;
    const transferencia = (porMetodo['Transferencia']||0) + (porMetodo['Nequi']||0) + (porMetodo['Daviplata']||0);
    const total = ventas.reduce((a,s)=>a+(s.total||0), 0);
    const otros = Math.max(0, total - efectivo - transferencia);
    const egresos = (DB.d.gastos||[]).filter(g => !g.borrado && g.userId === t.userId &&
      g.fecha >= t.apertura && (!t.cierre || g.fecha <= t.cierre)).reduce((a,g)=>a+(Number(g.valor)||0), 0);
    return { ventas, cantidad: ventas.length, efectivo, transferencia, otros, total, ingresos: total, egresos };
  },

  /** Contexto del día de un turno, para explicar un resumen en ceros: cuánto
      duró y qué se cobró ese día fuera de su ventana. */
  contextoDia(t){
    const dia = (t.apertura||'').slice(0,10);
    const delDia = DB.paid().filter(s => s.tipo === 'domicilio' && (s.fecha||'').slice(0,10) === dia);
    const ms = new Date(t.cierre || Util.now()) - new Date(t.apertura);
    const min = Math.max(0, Math.round(ms/60000));
    const duracion = min < 60 ? (min + ' minuto' + (min===1?'':'s'))
      : (Math.floor(min/60) + ' h ' + String(min%60).padStart(2,'0') + ' min');
    return { duracion, delDia: delDia.length,
             totalDia: delDia.reduce((a,s)=>a+(s.total||0), 0) };
  },

  /** Domicilios cobrados dentro de la ventana del turno que NO están contando.
      Sirve para que un resumen en ceros nunca sea mudo: si hay dinero del día
      que se quedó fuera, la pantalla lo dice y explica por qué. */
  sueltosDelTurno(t){
    const dentro = new Set(this.turnoTotals(t).ventas.map(s => s.id));
    return DB.paid().filter(s => s.tipo === 'domicilio' && !dentro.has(s.id) &&
      s.fecha >= t.apertura && (!t.cierre || s.fecha <= t.cierre));
  }
};

                {t:'Ingresos',n:1},{t:'Egresos',n:1},{t:'Total',n:1},{t:'',n:1}],

          const tt = Domicilios.turnoTotals(x);
          return '<tr><td>' + Util.esc((DB.user(x.userId)||{}).nombre||'—') + '</td>' +

            '<td class="n"><button class="btn sm ghost" data-turno-resumen="' + x.id + '" title="Imprimir resumen de este turno (solo administración)">' + Util.ico('print') + '</button></td></tr>';
        }), {emptyTitle: filtroTActivo ? 'Sin turnos para ese filtro' : 'Sin cierres de turno registrados',
             emptyMsg: filtroTActivo ? 'Prueba con otra fecha o encargada.' : 'El historial de turnos de domicilios aparecerá aquí.'}) +
    '</div>';

    /* Quién está en turno, a la vista y editable desde aquí: es lo que
       decide qué domiciliarios se pueden asignar al despachar. */
    const domsAct = (DB.d.domiciliarios||[]).filter(d=>!d.borrado && d.activo);
    const domsHTML = '<div class="card pad0" style="margin-bottom:14px">' +

        '<h3>Domiciliarios en turno <span class="dim" style="font-weight:400;font-size:12px">· ' +
          domsAct.filter(d=>d.enTurno).length + ' de ' + domsAct.length + ' disponibles</span></h3>' +
        '<button class="btn sm" data-act="gestion-doms2">Gestionar domiciliarios</button>' +
      '</div>' +
      (domsAct.length ?
        '<div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th>' +
        '<th>Inicio turno</th><th>Fin turno</th><th></th></tr></thead><tbody>' +
        domsAct.map(d =>
          '<tr><td><b>' + Util.esc(d.nombre) + '</b></td>' +
          '<td class="num">' + Util.esc(d.telefono||'—') + '</td>' +
          '<td><span class="badge ' + (d.enTurno?'ok':'mut') + '">' + (d.enTurno?'En turno':'Fuera') + '</span></td>' +
          '<td>' + (d.inicioTurno ? Util.dt(d.inicioTurno) : '—') + '</td>' +
          '<td>' + (d.finTurno ? Util.dt(d.finTurno) : '—') + '</td>' +
          '<td class="n"><button class="btn sm ' + (d.enTurno?'ghost':'gold') + '" data-domturno="' + d.id + '">' +
            (d.enTurno ? 'Finalizar' : 'Iniciar turno') + '</button></td></tr>').join('') +
        '</tbody></table></div>'
        : UI.empty('No hay domiciliarios','Pulsa "Gestionar domiciliarios" para crear el primero.')) +
    '</div>';

    return '<div class="view-head"><div>' +
        '<div class="eyebrow">Pedidos a domicilio de hoy · ' + Util.today() + '</div>' +
        '<h2>Domicilios</h2></div></div>' +
      turnoHTML +
      domsHTML +
      '<div class="grid g-kpi" style="margin-bottom:14px">' +
        UI.kpi('Pedidos hoy', String(lista.length), 'domicilios registrados') +
        UI.kpi('Cobrado hoy', Util.money(totalDia), lista.filter(s=>s.estado==='pagada').length + ' cobrados') +
        UI.kpi('En despacho', String(enDespacho), 'pendientes de cobro o entrega') +
      '</div>' +
      '<div class="card pad0" style="margin-bottom:14px">' +
        UI.table(
          [{t:'#'},{t:'Cliente'},{t:'Dirección'},{t:'Teléfono'},{t:'Platos',n:1},{t:'Total',n:1},{t:'Estado'}],
          lista.length ? lista.map(s =>
            '<tr style="cursor:pointer" data-domver="' + s.id + '" title="' +
            ((s.estado==='pagada'||s.anulada) ? 'Ver / reimprimir' : 'Toca para editar este pedido') + '">' +
            '<td class="num">' + Util.esc(s.numero||'—') + '</td>' +
            '<td style="font-weight:600">' + Util.esc((s.entrega&&s.entrega.nombre)||'—') + '</td>' +
            '<td class="dim" style="font-size:12px">' + Util.esc((s.entrega&&s.entrega.direccion)||'—') + '</td>' +
            '<td class="num">' + Util.esc((s.entrega&&s.entrega.telefono)||'—') + '</td>' +
            '<td class="n">' + (s.items||[]).reduce((a,i)=>a+(i.qty||1),0) + '</td>' +
            '<td class="n">' + Util.money(s.total||0) + '</td>' +
            '<td>' + estadoBadge(s) + '</td></tr>') : [],
          {emptyTitle:'Sin domicilios hoy', emptyMsg:'Pulsa "Nuevo domicilio" para registrar el primero.'}) +
      '</div>' +
      cierresHTML;
  },

  mount(){
    const b = document.querySelector('[data-act=nuevo]');
    if (b) b.onclick = () => Views.domicilios.abrirFormulario();
    document.querySelectorAll('[data-act="gestion-doms"],[data-act="gestion-doms2"]')
      .forEach(b => b.onclick = () => Views.domicilios.gestionDomiciliarios());
    /* Iniciar / finalizar turno desde la propia tabla del módulo. */
    document.querySelectorAll('[data-domturno]').forEach(b => b.onclick = () => {
      const d = (DB.d.domiciliarios||[]).find(x=>x.id===b.dataset.domturno);
      if (!d) return;
      if (d.enTurno){
        d.enTurno = false; d.finTurno = Util.now(); d.act = Util.now();
        DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
        DB.log('domiciliario:fin-turno', d.nombre);
        UI.toast(d.nombre + ' finalizó turno.','ok');
      } else {
        d.enTurno = true; d.inicioTurno = Util.now(); d.finTurno = null; d.act = Util.now();
        DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
        DB.log('domiciliario:inicio-turno', d.nombre);
        UI.toast(d.nombre + ' inició turno.','ok');
      }
      Router.render();
    });
    document.querySelectorAll('[data-domver]').forEach(tr => {
      tr.onclick = () => {
        const s = (DB.d.sales||[]).find(x=>x.id===tr.dataset.domver);
        if (!s) return;
        /* INTERVENCIÓN: un pedido ya cobrado o anulado es una factura
           cerrada — solo se puede ver/reimprimir, para no alterar cifras
           que ya se contabilizaron. Un pedido pendiente sí se puede abrir
           para editar (Nota, Quitar, agregar platos, Enviar a Cocina o
           Cobrar), por si la mesera o la cajera se equivocaron. */
        if (s.estado==='pagada' || s.anulada) Views.domicilios.verTicket(s);
        else Views.domicilios.abrirFormulario(s.id);
      };
    });
    /* INTERVENCIÓN: Turno de Domicilios — apertura/cierre por encargada */
    const btnAbrirT = document.getElementById('dt-abrir');
    if (btnAbrirT) btnAbrirT.onclick = () => this.abrirTurno();
    const btnCerrarT = document.getElementById('dt-cerrar');
    if (btnCerrarT) btnCerrarT.onclick = () => this.cerrarTurno();
    const btnResumenT = document.getElementById('dt-resumen');
    if (btnResumenT) btnResumenT.onclick = () => this.resumenMiTurno();
    const fFecha = document.getElementById('dtf-fecha');
    if (fFecha) fFecha.onchange = () => { this._filtroTurnos.fecha = fFecha.value||''; Router.render(); };
    const fUser = document.getElementById('dtf-user');
    if (fUser) fUser.onchange = () => { this._filtroTurnos.userId = fUser.value||''; Router.render(); };
    const fLimpiar = document.getElementById('dtf-limpiar');
    if (fLimpiar) fLimpiar.onclick = () => { this._filtroTurnos = {fecha:'', userId:''}; Router.render(); };
    document.querySelectorAll('[data-turno-resumen]').forEach(btn =>
      btn.onclick = () => this.resumenCierreTurno(btn.dataset.turnoResumen));
  },

  /** INTERVENCIÓN: abre el turno de domicilios para la encargada
      actualmente autenticada (el nombre se toma directo de sus
      credenciales de inicio de sesión, igual que hace Caja con
      Auth.user). Cada encargada puede tener su propio turno abierto al
      mismo tiempo que otras — a diferencia de la caja, que es única. */
  abrirTurno(){
    const uid = (Auth.user||{}).id;
    if (!uid) return UI.toast('Debes iniciar sesión para abrir un turno.','warn');
    if (DB.openDomTurno(uid)) return UI.toast('Ya tienes un turno de domicilios abierto.','warn');
    const t = { id:Util.uid('dt'), userId:uid, apertura:Util.now(), cierre:null, estado:'abierta', act:Util.now() };
    DB.d.domTurnos.push(t);
    DB.touch('domTurnos');
    Sync.enqueue('domTurnos','create', t);
    DB.log('domturno:abrir', (DB.user(uid)||{}).nombre||'—', t.id);
    UI.toast('Turno de domicilios abierto.','ok');
    Router.render();
  },

  /** Cierra el turno de la encargada actual, con la misma confirmación
      de seguridad que usa Caja antes de cerrar. */
  async cerrarTurno(){
    const uid = (Auth.user||{}).id;
    const t = uid ? DB.openDomTurno(uid) : null;
    if (!t) return UI.toast('No tienes un turno de domicilios abierto.','warn');
    /* Cerrar un turno sin domicilios casi nunca es lo que se quiere: significa
       que se abrió cuando la jornada ya iba corrida, y el resumen va a salir
       en ceros. Se avisa antes de cerrarlo, que es cuando todavía tiene
       arreglo, y no después al imprimir. */
    const tt = Domicilios.turnoTotals(t);
    if (!tt.cantidad){
      const ctx = Domicilios.contextoDia(t);
      const ok = await UI.confirm(
        'Este turno no registra ningún domicilio y lleva abierto ' + ctx.duracion + '. ' +
        'El resumen va a salir en ceros.' +
        (ctx.delDia ? ' Hoy se cobraron ' + ctx.delDia + ' domicilio' + (ctx.delDia>1?'s':'') +
          ' por ' + Util.money(ctx.totalDia) + ', pero antes de que abrieras este turno: ' +
          'los domicilios se cuentan desde la apertura, no hacia atrás.' : '') +
        ' ¿Cerrarlo de todas formas?', {ok:'Cerrar igualmente'});
      if (!ok) return;
    } else if (!(await UI.confirm('Usted cerrará su turno de domicilios, ¿realizó la impresión del Resumen del Turno?',
      {ok:'Sí, continuar con el cierre'}))) return;
    t.estado = 'cerrada';
    t.cierre = Util.now();
    t.act = Util.now();
    DB.touch('domTurnos');
    Sync.enqueue('domTurnos','update', t);
    DB.log('domturno:cerrar', (DB.user(uid)||{}).nombre||'—', t.id);
    UI.toast('Turno de domicilios cerrado.','ok');
    Router.render();
  },

  /** Resumen imprimible (80 mm) del turno abierto de la encargada actual. */
  resumenMiTurno(){
    const uid = (Auth.user||{}).id;
    const t = uid ? DB.openDomTurno(uid) : null;
    if (!t) return UI.toast('No tienes un turno de domicilios abierto.','warn');
    this._mostrarResumenTurno(t, Domicilios.turnoTotals(t), 'RESUMEN DE TURNO — DOMICILIOS');
  },

  /** Resumen imprimible de un turno de domicilios YA CERRADO, encontrado
      en el historial filtrable por fecha/encargada. INTERVENCIÓN: esta
      consulta queda reservada solo para administración. */
  resumenCierreTurno(turnoId){
    if (!Auth.can('admin')) return UI.toast('Solo un administrador puede imprimir el resumen de un cierre de turno.','warn');
    const t = (DB.d.domTurnos||[]).find(x => x.id === turnoId);
    if (!t) return UI.toast('No se encontró ese turno.','warn');
    this._mostrarResumenTurno(t, Domicilios.turnoTotals(t), 'RESUMEN DE CIERRE — DOMICILIOS');
  },

  /** Ticket corporativo de 80 mm, mismo mecanismo de impresión que usa
      toda la aplicación (fuerza 80 mm sin tocar la configuración
      general). INTERVENCIÓN: misma estructura que el resumen de cierre
      de Caja — facturas, efectivo, transferencia, ingresos y egresos. */
  _mostrarResumenTurno(t, tt, titulo){
    const cfg = DB.d.config;
    const linea = (label, valor, opts) => {
      opts = opts || {};
      // `crudo` imprime el valor tal cual. Sin esto, el número de facturas
      // salía formateado como dinero: "$ 3" en vez de "3".
      const txt = opts.crudo ? String(valor) : Util.money(valor);
      return '<div style="display:flex;justify-content:space-between;gap:10px;margin:' + (opts.mt||'3px') + ' 0;' +
        (opts.grande ? 'font-size:14px;font-weight:800' : 'font-size:12px') + '">' +
        '<span>' + label + '</span><b style="font-family:var(--mono)">' + txt + '</b></div>';
    };
    const cuerpo =
      '<div class="ticket">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() + '" style="max-width:55%;height:auto;margin-bottom:4px"></div>' : '') +
      '<div class="c b lg">' + Util.esc((cfg.empresa||'').toUpperCase()) + '</div>' +
      '<div class="c" style="font-size:10px">' + Util.esc(cfg.dir||'') + ' · Tel: ' + Util.esc(cfg.tel||'') + '</div>' +
      '<hr>' +
      '<div class="c b" style="font-size:13px;letter-spacing:.06em">' + Util.esc(titulo) + '</div>' +
      '<div class="c tk-sub">' + Util.esc((DB.user(t.userId)||{}).nombre||'—') + '</div>' +
      '<hr>' +
      '<div>Apertura: ' + Util.dt(t.apertura) + '</div>' +
      (t.cierre ? '<div>Cierre: ' + Util.dt(t.cierre) + '</div>' : '') +
      '<div>Impreso: ' + Util.dt(Util.now()) + '</div>' +
      '<hr>' +
      linea('Facturas del turno', tt.cantidad, {crudo:true}) +
      '<hr>' +
      linea('Efectivo', tt.efectivo) +
      linea('Transferencias', tt.transferencia) +
      (tt.otros ? linea('Otros medios', tt.otros) : '') +
      '<hr>' +
      linea('Ingresos (facturado)', tt.ingresos) +
      linea('Egresos (gastos de la encargada)', -tt.egresos) +
      '<hr>' +
      linea('TOTAL DEL TURNO', tt.total, {grande:true, mt:'6px'}) +
      '<hr>' +
      /* Un tiquete lleno de ceros no puede salir sin decir por qué. Casi
         siempre es que el turno se abrió cuando la jornada ya iba corrida: los
         domicilios se cuentan desde la apertura, no hacia atrás. */
      (tt.cantidad ? '' : (function(){
        const ctx = Domicilios.contextoDia(t);
        return '<div style="font-size:10.5px;line-height:1.5;border:1px dashed #000;padding:5px 6px;margin:4px 0">' +
          '<b>Este turno no registra domicilios.</b><br>' +
          'Duró ' + ctx.duracion + '. Los domicilios se cuentan desde que se abre el turno, ' +
          'no hacia atrás.' +
          (ctx.delDia ? '<br>Ese día se cobraron ' + ctx.delDia + ' domicilio' + (ctx.delDia>1?'s':'') +
            ' por ' + Util.money(ctx.totalDia) + ', fuera de esta ventana.' : '') +
        '</div>';
      })()) +
      '<div class="c" style="font-size:10px;margin-top:4px">Resumen totalizado del turno de domicilios</div>' +
      '</div>';

    UI.modal({
      title: titulo.indexOf('CIERRE')>=0 ? 'Resumen de cierre' : 'Resumen de turno', size:'sm',
      body:'<div class="ticket-frame">' + cuerpo + '</div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
        '<button class="btn gold" id="dtr-print">' + Util.ico('print') + ' Imprimir resumen</button>',
      onMount(ov){
        ov.querySelector('#dtr-print').onclick = () => {
          DB.log('domturno:resumen', titulo + ' · Total ' + Util.money(tt.total), t.id);
          const anchoOriginal = cfg.ticket;
          cfg.ticket = '80';
          UI.imprimir(ov);
          cfg.ticket = anchoOriginal;
        };
      }
    });
  },

  /* ── Formulario principal de nuevo domicilio / edición de uno existente ── */
  abrirFormulario(saleId){
    const bor = Domicilios.borrador();
    /* Si se pasa un saleId, cargar ese pedido en el borrador */
    if (saleId && !bor._id){
      const s = (DB.d.sales||[]).find(x=>x.id===saleId);
      if (s){
        if (s.estado==='pagada' || s.anulada){
          UI.toast('Este pedido ya está cerrado; solo puede reimprimirse.','warn');
          return Views.domicilios.verTicket(s);
        }
        Object.assign(bor, {
          nombre:(s.entrega&&s.entrega.nombre)||'',
          contacto:(s.entrega&&s.entrega.contacto)||'',
          direccion:(s.entrega&&s.entrega.direccion)||'',
          telefono:(s.entrega&&s.entrega.telefono)||'',
          items:(s.items||[]).map(i=>Object.assign({}, i, {adiciones:Array.isArray(i.adiciones)?i.adiciones.map(a=>Object.assign({},a)):[]})),
          nota:s.nota||'', _id:s.id, domicilioValor:(s.domicilio!=null ? s.domicilio : null)
        });
      }
    }

    const prods = DB.prods().filter(p=>p.activo);
    const cats  = DB.cats().sort((a,b)=>a.orden-b.orden);

    /* Agrupa productos por categoría */
    const grupos = cats.map(c=>({cat:c, prods:prods.filter(p=>p.cat===c.id)})).filter(g=>g.prods.length);

    /* ── Renders internos ── */
    const calcT = () => Domicilios.calcBorrador(bor.items, bor.domicilioValor);

    const renderResumen = () => {
      const t = calcT();
      if (!bor.items.length)
        return '<div class="dim" style="text-align:center;padding:16px;font-size:13px">Agrega platos del menú de abajo</div>';
      return bor.items.map((it, idx) => {
        const adP = (it.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
        const lineaTotal = (Number(it.precio||0)+adP)*(Number(it.qty)||1);
        /* INTERVENCIÓN: misma estructura e igual rotulado que usa el
           módulo Vender en su carrito — botones de texto "Nota"/"Editar
           nota" y "Quitar" (antes solo iconos, sin nombre). */
        return '<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)">' +
          '<div class="row" style="gap:8px">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:600;font-size:13px">' + Util.esc(it.nombre) + '</div>' +
              '<div class="dim" style="font-size:11px">' + Util.money(it.precio) + '/u' + (adP>0?' · adiciones +'+Util.money(adP):'') + '</div>' +
            '</div>' +
            '<span class="num" style="min-width:80px;text-align:right;font-weight:700;color:var(--brass-hi)">' + Util.money(lineaTotal) + '</span>' +
          '</div>' +
          ((it.adiciones&&it.adiciones.length) ?
            '<div style="margin-top:3px">' +
              it.adiciones.map(a =>
                '<div style="font-size:11px;color:var(--ember-hi);display:flex;justify-content:space-between;gap:4px">' +
                  '<span>⊕ ' + Util.esc(a.nombre) + '</span>' +
                  (a.precio>0 ? '<span style="font-family:var(--mono)">+' + Util.money(a.precio) + '</span>' : '<span style="color:var(--ash-dim)">sin cargo</span>') +
                '</div>'
              ).join('') +
            '</div>' : '') +
          (it.nota ? '<div style="font-size:11px;color:var(--brass-hi);margin-top:2px">✎ ' + Util.esc(it.nota) + '</div>' : '') +
          '<div class="row" style="gap:6px;margin-top:6px">' +
            '<button class="btn sm ghost ci-btn" data-dom-nota="' + idx + '">' + Util.ico('edit') + (it.nota ? ' Editar nota' : ' Nota') + '</button>' +
            '<button class="btn sm ghost ci-btn" data-dom-rm="' + idx + '" style="color:var(--ash-dim)">Quitar</button>' +
            '<div class="row" style="gap:5px;flex:none;margin-left:auto">' +
              '<button class="btn sm icon ghost" data-dom-dec="' + idx + '">−</button>' +
              '<span class="num" style="min-width:22px;text-align:center;font-weight:700">' + it.qty + '</span>' +
              '<button class="btn sm icon ghost" data-dom-inc="' + idx + '">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
      '<div style="display:flex;flex-direction:column;gap:4px;margin-top:10px;padding:10px;background:var(--char-850);border-radius:var(--r);border:1px solid var(--line)">' +
        '<div class="row" style="font-size:12.5px"><span class="mut">Subtotal</span><b class="num right">' + Util.money(t.subtotal) + '</b></div>' +
        (t.impuesto ? '<div class="row" style="font-size:12.5px"><span class="mut">Impuesto</span><b class="num right">' + Util.money(t.impuesto) + '</b></div>' : '') +
        (t.domicilio ? '<div class="row" style="font-size:12.5px"><span class="mut">Envío</span><b class="num right" style="color:var(--brass-hi)">' + Util.money(t.domicilio) + '</b></div>' : '') +
        '<div class="row" style="font-size:15px;font-weight:800;border-top:1px solid var(--line);padding-top:7px;margin-top:3px">' +
          '<span>Total</span><b class="num right" style="color:var(--bone)">' + Util.money(t.total) + '</b>' +

          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px">' +
          g.prods.map(p => {
            const en = bor.items.filter(i=>i.pid===p.id).reduce((a,i)=>a+(i.qty||1),0);
            return '<button class="btn ' + (en?'gold':'ghost') + '" data-dom-add="' + p.id + '" ' +
              'style="justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;' +
              'padding:9px 11px;height:auto;min-height:56px;border-radius:var(--r)">' +
              '<span style="font-size:12.5px;font-weight:600;line-height:1.25">' + Util.esc(p.nombre) + '</span>' +
              '<span class="num" style="font-size:11.5px;color:var(--brass-hi);margin-top:3px">' + Util.money(p.precio) + '</span>' +
              (en ? '<span style="font-size:10px;color:var(--ok);margin-top:2px">× ' + en + ' en pedido</span>' : '') +
            '</button>';
          }).join('') + '</div></div>'

    const close = UI.modal({
      title:false, size:'lg',
      body:
        /* ── Cabecera propia ── */

          'background:var(--char-850);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:10">' +
          '<span style="color:var(--brass);display:flex">' + Util.ico('moto') + '</span>' +
