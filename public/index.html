    const lista = (p && p.carnesBandeja) || [];
    if (!Array.isArray(lista)) return [];
    return lista.map(x => typeof x === 'string'
      ? {id:x, precio:Number(p.precio)||0}
      : {id:x.id, precio:Number(x.precio)||Number(p.precio)||0})
      .filter(x => x.id);
  },
  /** Desde cuánto sale una bandeja. */
  desdeBandeja(p){
    const precios = this.opcionesBandeja(p).map(x => x.precio).filter(v => v > 0);
    return precios.length ? Math.min.apply(null, precios) : (Number(p.precio)||0);
  },
  unidadDe(insumoId){ const m = this.meat(insumoId); return this.unidadTipo(m && m.tipo); },
  unidadTipo(tipo){ return (this.TIPOS[tipo] || this.TIPOS.carne).unidad; },
  /** Nombre completo de una bebida, con su presentación. */
  rotulo(m){
    if (!m) return '';
    return m.nombre + (m.tipo === 'bebida' && m.presentacion ? ' · ' + m.presentacion : '');
  },
  log(accion, detalle, ref){
    this.d.audit.unshift({
      id:Util.uid('a'), fecha:Util.now(), userId:(Auth.user||{}).id||null,
      usuario:(Auth.user||{}).nombre||'sistema', rol:(Auth.user||{}).rol||'—',
      accion, detalle:detalle||'', ref:ref||null
    });
    if (this.d.audit.length > 1200) this.d.audit.length = 1200;
    this.touch('audit');
  }
};
/* ── Guardado en disco: espera corta, pero con tope ────────────────────
   Antes esto era un temporizador que se reiniciaba con CADA escritura. La
   idea era no escribir cien veces seguidas, y está bien; el problema es que
   mientras los cambios no paren, el momento de escribir no llega nunca. Y en
   pleno servicio no paran: cada plato que entra a una comanda, cada página de
   cambios que baja del servidor —que trae hasta quinientos registros, uno
   detrás de otro— vuelve a empujar el plazo hacia adelante. Si en ese rato la
   tablet se recarga o se queda sin batería, todo lo que no se alcanzó a
   escribir se pierde.

   Ahora sigue esperando lo mismo cuando hay calma, pero con un tope: pase lo
   que pase, nunca se está más de TOPE_MS sin escribir a disco.
   ------------------------------------------------------------------- */
DB._espera = 350;
DB.TOPE_MS = 1500;
DB._flushT = null; DB._flushDesde = 0; DB._flushando = false; DB._otraVez = false;

DB._flush = function(){
  const ahora = Date.now();
  if (!DB._flushDesde) DB._flushDesde = ahora;
  clearTimeout(DB._flushT);
  const restante = DB._flushDesde + DB.TOPE_MS - ahora;
  DB._flushT = setTimeout(DB._flushYa, Math.max(0, Math.min(DB._espera, restante)));
};

/** Escribe ya lo que esté pendiente. Se puede llamar a mano cuando la página
    se va a segundo plano o se cierra, que es cuando más importa. */
DB._flushYa = async function(){
  clearTimeout(DB._flushT); DB._flushT = null; DB._flushDesde = 0;
  // Si ya hay una escritura en curso, se anota para repetir al terminar en vez
  // de solaparse: dos `saveBucket` a la vez sobre la misma clave se pisan.
  if (DB._flushando){ DB._otraVez = true; return; }
  DB._flushando = true;
  try{
    do{
      DB._otraVez = false;
      const list = Array.from(DB._dirty); DB._dirty.clear();
      for (const b of list) await DB.saveBucket(b);
    } while (DB._otraVez);
  } finally { DB._flushando = false; }
};

/* ── 4. Sync ───────────────────────────────────────────────────────────
   Sincronización bidireccional contra el servidor del local.
     · subir  → cada escritura encola una operación con `opId` único
     · bajar  → un cursor incremental trae lo que hicieron las otras tablets
   Toda operación es un upsert idempotente: reenviarla no duplica nada.
   Conflictos: gana la escritura con `act` más reciente.
   ------------------------------------------------------------------- */
const APP_VERSION = '2026.09.20.2';

const Sync = {
  running:false, lastAt:null, lastError:null, cursor:null, _poll:null, _fallos:0,
  enVivo:false, _es:null, _visto:0, _ojo:null, _reint:null,

  /* ── Estado de la puesta al día automática ──────────────────────────
     `faltan`     el servidor todavía tiene cambios más allá de esta página
     `alDia`      este equipo ya alcanzó la cabeza del servidor
     `baseAt`     última reconciliación completa contra /estado
     `hidratando` hay una reconciliación en curso (no lanzar otra encima)  */
  faltan:false, alDia:false, baseAt:null, hidratando:false, _huella:null, _cursorCargado:false,

  /* Candado de arranque. Mientras está puesto, ningún disparador suelto
     —el canal en vivo al abrirse, el sondeo, una operación encolada— puede
     adelantarse a la primera puesta al día. Sin esto, el canal abría y
     lanzaba un `run()` que llenaba la base ANTES de que la hidratación
     decidiera qué clase de equipo era este; un aparato recién instalado
     terminaba tomando el camino de "equipo con datos" y empujaba al
     servidor sus usuarios y categorías de fábrica, pisando los buenos. */
  bloqueado:false,

  /* Tamaño del lote de envío. Baja solo cuando el servidor devuelve error,
     para aislar a la operación que no le gusta, y vuelve a lo normal en
     cuanto responde bien. `rechazadas` guarda las que hubo que apartar,
     para poder mirarlas desde la pantalla de Sincronización. */
  LOTE_MAX:200, _tam:200, rechazadas:[], _pedido:false,

  /* Colecciones que viajan al servidor. Es exactamente el juego que el
     backend ya acepta hoy: no se agregan entidades nuevas sin confirmar que
     el servidor las reconoce, para no arriesgar que rechace un lote entero
     y la cola quede represada para todos los equipos.
     `config` se recibe pero nunca se empuja sola: el consecutivo y el nombre
     del equipo son de cada aparato y no deben pisarse entre tablets.
     CORRECCIÓN DE RAÍZ (auditoría: no se registran los movimientos de todos
     los empleados): 'audit' faltaba en esta lista, así que el registro de
     cada tablet se quedaba SOLO en esa tablet — nunca viajaba al servidor
     ni a los demás equipos. Quien revisara Auditoría desde un único equipo
     (p. ej. la caja) nunca veía lo que el personal hacía en las otras
     tablets, aunque DB.log() sí se llamara correctamente en cada acción.
     Se agrega 'audit' ahora que se confirmó que el servidor la acepta. */
  COLECCIONES:['users','categories','products','meats','staff','clients','sales','orders','purchases','cash','meals','gastos','domiciliarios','domTurnos','audit'],
  TOPE_EMPUJE:800,

  /* El servidor confirma toda operación que le llega, incluso de entidades
     que no sabe guardar: responde "aceptada" y la descarta sin dejar rastro
     (se comprobó contra el servidor del restaurante con `domTurnos`). Como
     no hay forma de preguntárselo, se averigua por la práctica: si en una
     reconciliación se le enviaron registros de una colección y en la
     siguiente ninguno está allá, es que no la guarda, y se deja de
     insistir. Se olvida al recargar, así que el día que el servidor aprenda
     a guardarlas, vuelven a viajar solas. */
  noGuarda:{}, _empujado:{},

  activo(){ return !!(DB.d.config.endpoint||'').trim(); },

  /* ── Cursor persistente ───────────────────────────────────────────────
     El cursor marca hasta dónde leyó este equipo el diario de cambios del
     servidor. Antes vivía solo en memoria: al recargar la página volvía a
     cero y el aparato releía siempre el mismo tramo inicial sin alcanzar
     nunca lo de hoy. Ahora se guarda junto al servidor al que pertenece,
     de modo que cambiar de servidor lo descarta en vez de arrastrarlo. */
  _clave(){ return 'jp_sync_cursor'; },
  async cargarCursor(){
    this._cursorCargado = true;
    try{
      const g = await Persist.get(this._clave());
      if (g && g.ep === (DB.d.config.endpoint||'').trim()){
        this.cursor = g.cursor != null ? g.cursor : null;
        this.baseAt = g.baseAt || null;
        return this.cursor;
      }
    }catch(e){}
    this.cursor = null; this.baseAt = null;
    return null;
  },
  async guardarCursor(){
    try{
      await Persist.set(this._clave(), {
        ep:(DB.d.config.endpoint||'').trim(), cursor:this.cursor, baseAt:this.baseAt
      });
    }catch(e){ /* si el disco falla, la sesión sigue: se recupera al reconciliar */ }
  },

  /** Dirección desde la que se abrió la aplicación. Si el archivo lo sirve el
      servidor del local, esa misma dirección ES el servidor: no hay que teclear nada. */
  origen(){
    if (typeof location === 'undefined' || !/^https?:$/.test(location.protocol)) return '';
    return location.origin;
  },
  /** Pregunta a una dirección si allí hay un servidor del sistema. */
  async probar(url, ms){
    const base = String(url||'').trim().replace(/\/$/,'');
    if (!base) return null;
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const corte = setTimeout(()=>{ if (ctrl) ctrl.abort(); }, ms || 4000);
    try{
      const r = await fetch(base + '/salud', ctrl ? {signal:ctrl.signal} : {});
      clearTimeout(corte);
      if (!r.ok) return null;
      const d = await r.json();
      return d && d.ok ? Object.assign({url:base}, d) : null;
    }catch(e){ clearTimeout(corte); return null; }
  },
  /** Si la página vino de un servidor válido, se configura sola. */
  async autoconfigurar(){
    const o = this.origen();
    if (!o) return null;
    /* Espera más larga que antes: el servidor de Render se duerme cuando no
       hay nadie vendiendo y el primer arranque del día tarda en contestar.
       Con 3,5 segundos, una tablet nueva se rendía y quedaba de equipo
       independiente para siempre, aunque el servidor despertara un segundo
       después. */
    const info = await this.probar(o, 9000);
    if (!info) return null;
    // Se reescribe siempre: un aparato que venía apuntando a una IP del local
    // se endereza solo con abrir la dirección nueva.
    if (DB.d.config.endpoint !== o){ DB.d.config.endpoint = o; DB.touch('config'); }
    this.escuchar();
    this.startPolling();
    return info;
  },
  url(path){ return (DB.d.config.endpoint||'').trim().replace(/\/$/,'') + path; },

  enqueue(entidad, op, record){
    DB.d.queue.push({
      opId:Util.uid('op'), entidad, op, payload:record, ts:Util.now(),
      sede:DB.d.config.sedeId, user:(Auth.user||{}).id||null, intentos:0, error:null
    });
    DB.touch('queue');
    UI.refreshStatus();
    if (navigator.onLine && DB.d.config.autoSync) this.run(true);
  },
  pending(){ return DB.d.queue.length; },

  async run(silent){
    /* ── Ningún aviso se puede perder ──────────────────────────────────
       El servidor avisa en cuanto alguien escribe. Si ese aviso llega
       mientras esta tablet está a mitad de una sincronización, antes se
       descartaba sin más: quedaba pendiente lo que acababa de pasar y el
       sondeo de respaldo tampoco lo recogía, porque acababa de sincronizar
       y se creía al día. Resultado: hasta un minuto de retraso para una
       comanda que en cocina se espera al instante. Ahora el aviso se
       apunta y se atiende en cuanto termina lo que estaba haciendo. */
    if (this.running){ this._pedido = true; return; }
    if (this.bloqueado){
      this._pedido = true;
      if(!silent) UI.toast('El equipo se está poniendo al día. Un momento.','info');
      return;
    }
    const q = DB.d.queue;

    if (!this.activo()){
      // Equipo único: no hay con quién conciliar, este archivo es la fuente de verdad.
      if (!q.length){ if(!silent) UI.toast('No hay operaciones pendientes.','info'); return; }
      this.running = true; UI.refreshStatus();
      await new Promise(r=>setTimeout(r, 300));
      const n = q.length;
      DB.d.queue = []; DB.d.sales.forEach(x=>{ x.sync = true; });
      DB.touch('queue','sales');
      this.lastAt = Util.now(); this.lastError = null; this.running = false; UI.refreshStatus();
      if(!silent) UI.toast(n + ' operaciones conciliadas en el equipo. Configura el servidor para trabajar con varias tablets.','ok');
      return;
    }
    if (!navigator.onLine){
      if(!silent) UI.toast('Sin conexión con la red del local. La cola se enviará al reconectar.','warn');
      return;
    }

    this.running = true; UI.refreshStatus();
    if (!this._cursorCargado) await this.cargarCursor();
    let lote = [];
    try{
      /* ── INTERVENCIÓN (corrección de raíz) ─────────────────────────────
         El servidor entrega el diario de cambios PAGINADO: como mucho 500
         por respuesta, y avisa con `faltan:true` que todavía queda atrás.
         Antes se pedía una sola página por ronda y el sondeo posterior se
         saltaba las siguientes al creer que ya estaba al día, así que un
         equipo con retraso se quedaba clavado en las primeras 500 y había
         que traer la base a mano. Ahora se vacía la cola y se drena el
         diario hasta el final en la misma corrida. Medido contra el
         servidor real: 14.443 cambios desde cero = 7 páginas en ~3 s. */
      let enviadas = 0, recibidas = 0, vueltas = 0;
      const TOPE = 60;                       // freno duro: nunca un bucle infinito
      while (vueltas < TOPE){
        vueltas++;
        lote = DB.d.queue.slice(0, this._tam || this.LOTE_MAX);
        const previo = this.cursor;
        const res = await fetch(this.url('/sync'), {
          method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + (Auth.token||'')},
          body: JSON.stringify({sede:DB.d.config.sedeId, cursor:this.cursor, ops:lote})
        });
        if (!res.ok){ const e = new Error('HTTP ' + res.status); e.delServidor = true; throw e; }
        const data = await res.json();
        this._tam = this.LOTE_MAX;           // el servidor responde bien: lote normal
        /* El servidor dice cuáles confirmó pero no sabe guardar. Con eso, lo
           que antes tardaba dos reconciliaciones en descubrirse se sabe al
           instante. Si el servidor es de una versión anterior no manda este
           dato y se sigue averiguando por la vía lenta. */
        (data.ignoradas || []).forEach(x => {
          const ent = x && (x.entidad || x);
          if (ent && !this.noGuarda[ent]){
            this.noGuarda[ent] = true;
            DB.log('sync:no-guarda', 'El servidor no guarda "' + ent + '": deja de enviarse hasta que lo soporte.');
          }
        });
        const ok = new Set(data.aceptadas || lote.map(o=>o.opId));
        DB.d.queue = DB.d.queue.filter(o => !ok.has(o.opId));
        DB.d.sales.forEach(x=>{ if (!x.sync && ok.has(x.opId)) x.sync = true; });
        this.cursor = data.cursor != null ? data.cursor : this.cursor;
        enviadas += ok.size;
        recibidas += this.applyBatch(data.cambios || []);
        DB.touch('queue','sales');
        this.lastAt = Util.now(); this.lastError = null; this._fallos = 0;

        this.faltan = !!data.faltan;
        const avanzo = this.cursor !== previo;
        const quedaCola = DB.d.queue.length > 0 && ok.size > 0;
        // Se sigue mientras el servidor diga que falta (y el cursor avance,
        // para no repetir la misma página si el backend dejara de moverlo)
        // o mientras queden operaciones nuestras por entregar.
        if ((this.faltan && avanzo) || quedaCola) continue;
        break;
      }
      this.alDia = !this.faltan && !DB.d.queue.length;
      await this.guardarCursor();
      if(!silent) UI.toast('Sincronizado: ' + enviadas + ' enviadas, ' + recibidas + ' recibidas.','ok');
      // Si mientras se enviaba entraron más operaciones, se despachan enseguida.
      if (DB.d.queue.length) setTimeout(()=>this.run(true), 250);
    }catch(err){
      this.lastError = err.message; this._fallos++; this.alDia = false;
      DB.d.queue.forEach(o => { o.intentos++; o.error = err.message; });

      /* ── Una operación envenenada no puede parar el restaurante ────────
         Si el servidor devuelve error por UNA operación concreta —un campo
         que no le gusta, una entidad que no conoce— el lote entero falla y
         se reintenta igual para siempre: las ventas del día se quedarían
         detrás de ella sin llegar nunca. Así que ante un error del servidor
         (no ante una caída de red, que es cosa distinta) el lote se va
         partiendo hasta aislar a la culpable, y cuando una sola operación
         falla tres veces ella sola, se aparta y la cola sigue corriendo.
         Nada se pierde: el registro sigue en este equipo y queda anotado en
         la auditoría para poder revisarlo. */
      if (err.delServidor){
        lote.forEach(o => { o.fallosServidor = (o.fallosServidor||0) + 1; });
        if (lote.length === 1 && (lote[0].fallosServidor||0) >= 3){
          const mala = lote[0];
          DB.d.queue = DB.d.queue.filter(o => o.opId !== mala.opId);
          this.rechazadas.unshift({
            entidad:mala.entidad, op:mala.op,
            ref:(mala.payload && (mala.payload.numero || mala.payload.nombre || mala.payload.id)) || '—',
            error:err.message, ts:Util.now()
          });
          if (this.rechazadas.length > 50) this.rechazadas.length = 50;
          DB.log('sync:apartada', 'El servidor rechazó ' + mala.entidad + '/' + mala.op +
            ' (' + err.message + '). Se apartó para que el resto siguiera enviándose.');
          UI.toast('Una operación de ' + mala.entidad + ' no la acepta el servidor. Se apartó; el resto sigue sincronizando.','warn', 6000);
          this._tam = this.LOTE_MAX;
        } else {
          this._tam = Math.max(1, Math.floor((this._tam || this.LOTE_MAX) / 4));
        }
      }
      DB.touch('queue');
      // Solo se avisa una vez por caída, para no tapar la pantalla en pleno servicio.
      if (this._fallos === 3) UI.toast('El servidor del local no responde. Sigue vendiendo: todo queda en cola.','warn', 5000);
      if(!silent) UI.toast('Falló la sincronización: ' + err.message + '. La cola se conserva.','bad');
    }finally{
      this.running = false; UI.refreshStatus();
      if (State.view === 'sync') Router.render();
      // Avisos que llegaron mientras tanto: se atienden ya.
      if (this._pedido){ this._pedido = false; setTimeout(()=>this.run(true), 60); }
    }
  },

  /** Aplica los cambios que llegaron del servidor y repinta si es seguro hacerlo. */
  applyBatch(cambios){
    if (!cambios.length) return 0;
    cambios.forEach(c => this.merge(c));
    const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
    if (!UI._stack.length && !escribiendo && Auth.user) Router.render();
    return cambios.length;
  },

  /** Último-en-escribir-gana por `act`, con el id como clave estable. */
  merge(cambio){
    const {entidad, data} = cambio;
    if (!data || !entidad) return;
    if (entidad === 'config'){
      if (!DB.d.config.act || (data.act||'') > DB.d.config.act){
        const local = {endpoint:DB.d.config.endpoint};   // el endpoint es propio de cada tablet
        DB.d.config = Object.assign({}, DB.d.config, data, local);
        DB.touch('config');
      }
      return;
    }
    const col = DB.d[entidad];
    if (!Array.isArray(col)) return;
    const i = col.findIndex(x => x.id === data.id);
    if (i < 0) col.push(data);
    else if (!col[i].act || (data.act||'') > col[i].act) col[i] = Object.assign({}, col[i], data);
    DB.touch(entidad);
  },

  /** Trae del servidor toda la base y reemplaza la de este equipo. */
  async join(){
    if (!this.activo()) return UI.toast('Primero escribe la dirección del servidor.','warn');
    const res = await fetch(this.url('/estado'));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.estado || !data.estado.config)
      throw new Error('el servidor todavía no tiene datos publicados');
    // Nunca se reemplaza la base local por una sin usuarios: dejaría este equipo
    // sin poder iniciar sesión, que es justo lo que hay que evitar.
    if (!Array.isArray(data.estado.users) || !data.estado.users.filter(u => u && u.activo && !u.borrado).length)
      throw new Error('el servidor no tiene usuarios publicados. Publica la base desde el equipo de la caja antes de unir este.');
    const endpoint = DB.d.config.endpoint;
    Object.keys(data.estado).forEach(k => { DB.d[k] = data.estado[k]; });
    DB.d.config.endpoint = endpoint;
    DB.d.queue = [];
    this.cursor = data.cursor;
    this.baseAt = Util.now();
    await DB.saveAll();
    await this.guardarCursor();   // así el próximo arranque no repite la descarga
    DB.log('sync:unir','Este equipo tomó la base del servidor ' + endpoint);
  },

  /** Publica la base de este equipo como estado inicial del servidor. */
  async publish(forzar){
    if (!this.activo()) return UI.toast('Primero escribe la dirección del servidor.','warn');
    const estado = {};
    /* CORRECCIÓN DE RAÍZ (auditoría: no se registran los movimientos de
       todos los empleados) — ver el mismo comentario junto a COLECCIONES:
       'audit' se agrega aquí también para que un equipo nuevo que se une al
       servidor reciba el historial existente, y para que al publicar la
       base desde este equipo el servidor también reciba su auditoría. */
    ['config','users','categories','products','meats','staff','clients','sales','orders','purchases','cash','meals',
     'gastos','domiciliarios','domTurnos','audit']
      .forEach(k => estado[k] = DB.d[k] || []);
    const res = await fetch(this.url('/sembrar'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sede:DB.d.config.sedeId, estado, forzar: !!forzar})
    });
    if (res.status === 409){
      const d = await res.json();
      const e = new Error('El servidor ya tiene ' + (d.registros||0) + ' registros guardados.');
      e.yaTieneDatos = true; e.registros = d.registros;
      throw e;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    this.cursor = data.cursor;
    this.baseAt = Util.now();
    DB.d.queue = []; DB.touch('queue');
    await this.guardarCursor();
    DB.log('sync:publicar','Base publicada al servidor');
  },

  /* ══ Puesta al día automática ═══════════════════════════════════════
     Todo lo que sigue existe para que nadie tenga que tocar "Publicar" ni
     "Traer los datos". Abrir la dirección del restaurante basta.
     Los botones manuales siguen ahí y siguen haciendo lo mismo: esto es
     un camino nuevo encima, no un reemplazo.
     ------------------------------------------------------------------ */

  /** Fusión de una colección completa, por id y último-en-escribir-gana.
      Se hace con un índice en vez de buscar registro por registro: con 1.400
      ventas la búsqueda lineal recorría dos millones de posiciones. */
  mergeColeccion(entidad, lista){
    if (!Array.isArray(lista) || !lista.length) return 0;
    const col = DB.d[entidad];
    if (!Array.isArray(col)) return 0;
    const idx = new Map();
    col.forEach((r, i) => { if (r && r.id != null) idx.set(r.id, i); });
    let n = 0;
    lista.forEach(r => {
      if (!r || r.id == null) return;
      const i = idx.get(r.id);
      if (i === undefined){ idx.set(r.id, col.length); col.push(r); n++; return; }
      /* Lo de fábrica sin tocar cede siempre. Su fecha se sella al abrir la
         aplicación, así que ganaría el último-en-escribir-gana y dejaría a la
         tablet mostrando los perfiles de la plantilla en vez de los del
         restaurante. */
      if (this.deFabrica(entidad, col[i])){ col[i] = r; n++; return; }
      // Fuera de ese caso, solo pisa lo local si lo del servidor es más reciente.
      if (!col[i].act || (r.act||'') > col[i].act){ col[i] = Object.assign({}, col[i], r); n++; }
    });
    if (n) DB.touch(entidad);
    return n;
  },

  /** Cuántos registros sincronizables tiene este equipo. Sirve de huella
      barata contra el `registros` que informa /salud. */
  contarLocal(){
    /* El "+1" es la configuración. El servidor guarda cada registro como una
       fila de una sola tabla, y la configuración ocupa una fila más; /salud
       informa el total de filas. Sin contarla aquí, la comparación daba un
       registro de diferencia SIEMPRE, incluso con todo al día, y eso disparaba
       una descarga completa de la base cada pocos minutos sin necesidad. */
    return this.COLECCIONES.reduce((a, k) => a + ((DB.d[k]||[]).length), 0) + 1;
  },

  /** ¿Vale la pena conservar lo que hay en este equipo? Un aparato recién
      instalado trae solo los perfiles de fábrica y la carta vacía. */
  tieneDatosPropios(){
    return (DB.d.products||[]).length > 0 || (DB.d.sales||[]).length > 0 ||
           (DB.d.orders||[]).length > 0 || (DB.d.meats||[]).length > 0 ||
           (DB.d.staff||[]).length > 0 || (DB.d.queue||[]).length > 0;
  },

  /** ¿Este registro es sencillamente uno de los de fábrica, sin tocar?

      Importa mucho al conectar un equipo que venía trabajando solo. Los
      perfiles, las categorías y el cliente genérico que trae la aplicación
      recién instalada llevan los MISMOS identificadores en todas partes
      (u_adm, c_ban, cl_1…) y su fecha se sella al abrir el archivo, así que
      siempre parecen "lo más reciente". Si se dejaran subir, el último-en-
      escribir-gana los daría por buenos y el administrador del restaurante
      volvería a llamarse como el de la plantilla en todas las tablets.
      Solo se comparan los campos con significado: la fecha y la clave no
      cuentan, porque son justo lo que cambia sin que nadie edite nada. */
  _fabrica:null,
  deFabrica(entidad, r){
    if (!this._fabrica){
      const d = DB.defaults();
      this._fabrica = {};
      ['users','categories','clients'].forEach(k => {
        const m = new Map();
        (d[k]||[]).forEach(x => m.set(x.id, x));
        this._fabrica[k] = m;
      });
    }
    const m = this._fabrica[entidad];
    if (!m) return false;
    const def = m.get(r.id);
    if (!def) return false;
    const limpia = o => {
      const c = Object.assign({}, o);
      delete c.act; delete c.pin; delete c.sync; delete c.opId;
      return JSON.stringify(c);
    };
    return limpia(def) === limpia(r);
  },

  /** Encola varias operaciones de una vez sin disparar un envío por cada una. */
  encolarLote(items){
    if (!items.length) return 0;
    items.forEach(it => DB.d.queue.push({
      opId:Util.uid('op'), entidad:it.entidad, op:it.op, payload:it.payload, ts:Util.now(),
      sede:DB.d.config.sedeId, user:(Auth.user||{}).id||null, intentos:0, error:null
    }));
    DB.touch('queue');
    return items.length;
  },

  /** Reconciliación completa contra /estado.

      Es la red de seguridad que reemplaza los dos botones manuales:
        · Equipo nuevo  → toma la base del servidor tal cual (como "Traer").
        · Equipo con datos → fusiona sin borrar nada y sube lo que el
          servidor no tenga o tenga más viejo (como "Publicar", pero sin
          arrasar con lo ajeno).
        · Servidor vacío → este equipo siembra la base (como "Publicar").
      Devuelve un resumen para poder contarlo en pantalla. */
  async hidratar(opts){
    const o = opts || {};
    if (!this.activo()) return null;
    if (this.hidratando) return null;
    this.hidratando = true;
    UI.refreshStatus();
    const resumen = {recibidos:0, enviados:0, modo:'fusion'};
    try{
      // Con corte de espera: si el servidor se queda colgado, se suelta el
      // candado de arranque en vez de dejar la sincronización muerta.
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const corte = setTimeout(()=>{ if (ctrl) ctrl.abort(); }, 45000);
      let res;
      try{ res = await fetch(this.url('/estado'), ctrl ? {signal:ctrl.signal} : {}); }
      finally{ clearTimeout(corte); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const est = data.estado || {};
      const hayUsuarios = Array.isArray(est.users) && est.users.filter(u => u && u.activo && !u.borrado).length > 0;

      /* Qué clase de equipo es este se decide con lo que había ANTES de
         tocar la red. Si se recalculara ahora, cualquier dato que hubiera
         entrado mientras se pedía /estado cambiaría la respuesta. */
      const propios = (o.propios !== undefined) ? !!o.propios : this.tieneDatosPropios();
      const copiar  = (o.copiar  !== undefined) ? !!o.copiar  : (!!o.virgen && !propios);

      /* ── Servidor todavía sin base ── */
      if (!est.config || !hayUsuarios){
        if (propios){
          // Sembrar sin `forzar`: si el servidor ya tuviera algo devuelve 409
          // y no se toca nada. Solo llena un servidor realmente vacío.
          try{
            await this.publish(false);
            resumen.modo = 'siembra';
            DB.log('sync:auto-sembrar','El servidor estaba vacío: este equipo publicó la base');
          }catch(e){ if (!e.yaTieneDatos) throw e; }
        }
        this.baseAt = Util.now();
        await this.guardarCursor();
        return resumen;
      }

      /* ── Equipo nuevo: la base del servidor entra tal cual ── */
      if (copiar){
        const endpoint = DB.d.config.endpoint;
        Object.keys(est).forEach(k => {
          if (k === 'config') return;
          if (Array.isArray(DB.d[k]) || DB.d[k] === undefined) DB.d[k] = est[k];
        });
        // La configuración se mezcla, no se sustituye: así no se pierden las
        // migraciones ya aplicadas en este aparato ni su dirección.
        DB.d.config = Object.assign({}, DB.d.config, est.config, {endpoint});
        DB.d.queue = [];
        this.cursor = data.cursor != null ? data.cursor : this.cursor;
        this.baseAt = Util.now();
        resumen.modo = 'copia';
        resumen.recibidos = this.COLECCIONES.reduce((a,k)=>a+((est[k]||[]).length),0);
        DB.touch.apply(DB, Object.keys(est));
        await DB.saveAll();
        // Los PINs del servidor pasan a ser el respaldo de este equipo.
        try{ await Persist.set('jp_bk_pins', DB.d.users.map(u => ({id:u.id, usuario:u.usuario, pin:u.pin}))); }catch(e){}
        await this.guardarCursor();
        DB.log('sync:auto-traer','Equipo nuevo: tomó la base del servidor ' + endpoint);
        return resumen;
      }

      /* ── Equipo con datos: fusión en los dos sentidos ── */
      Object.keys(est).forEach(k => {
        if (k === 'config') return;
        resumen.recibidos += this.mergeColeccion(k, est[k]);
      });
      // Misma regla que ya usaba merge() para la configuración que llega por
      // el diario: gana la más reciente y el endpoint es propio de cada tablet.
      if (est.config) this.merge({entidad:'config', data:est.config});

      /* Lo que el servidor no tiene, o tiene más viejo, sube solo.

         Un equipo que nunca ha trabajado no sube NADA: lo único que tendría
         para ofrecer son los perfiles y las categorías de fábrica, y como
         comparten identificador con los buenos (u_adm, cl_1…) y llevan una
         fecha recién puesta, ganarían el último-en-escribir-gana y
         reemplazarían los del restaurante en todas las tablets. */
      const subir = [];
      // Lo que ya está esperando en la cola no se vuelve a encolar.
      const enCola = new Set();
      (DB.d.queue||[]).forEach(op => { if (op && op.payload && op.payload.id != null) enCola.add(op.entidad + '\u0000' + op.payload.id); });

      /* Veredicto sobre lo enviado en la reconciliación anterior: si de una
         colección no llegó ni un registro, el servidor no la guarda. Solo se
         juzga lo que ya salió de la cola; lo que sigue esperando no prueba
         nada. */
      Object.keys(this._empujado).forEach(k => {
        const ids = (this._empujado[k]||[]).filter(id => !enCola.has(k + '\u0000' + id));
        if (!ids.length) return;
        const alla = new Set((est[k]||[]).map(r => r && r.id));
        if (!ids.some(id => alla.has(id))){
          this.noGuarda[k] = true;
          DB.log('sync:no-guarda', 'El servidor no conserva "' + k + '": se deja de enviar hasta que el servidor lo soporte.');
        }
      });
      this._empujado = {};

      if (propios) this.COLECCIONES.forEach(k => {
        if (this.noGuarda[k]) return;
        const remoto = new Map();
        (est[k]||[]).forEach(r => { if (r && r.id != null) remoto.set(r.id, r); });
        (DB.d[k]||[]).forEach(r => {
          if (!r || r.id == null || subir.length >= this.TOPE_EMPUJE) return;
          if (enCola.has(k + '\u0000' + r.id)) return;
          if (this.deFabrica(k, r)) return;
          const s = remoto.get(r.id);
          if (!s) subir.push({entidad:k, op:'create', payload:r});
          else if ((r.act||'') > (s.act||'')) subir.push({entidad:k, op:'update', payload:r});
          else return;
          (this._empujado[k] = this._empujado[k] || []).push(r.id);
        });
      });
      resumen.enviados = this.encolarLote(subir);

      this.cursor = data.cursor != null ? data.cursor : this.cursor;
      this.baseAt = Util.now();
      await this.guardarCursor();
      if (resumen.recibidos || resumen.enviados)
        DB.log('sync:reconciliar', resumen.recibidos + ' registros recibidos, ' + resumen.enviados + ' puestos en cola');
      return resumen;
    }catch(err){
      this.lastError = err.message;
      if (!o.silencioso) UI.toast('No se pudo poner al día con el servidor: ' + err.message,'bad', 5000);
      return null;
    }finally{
      this.hidratando = false;
      UI.refreshStatus();
      if (State.view === 'sync') Router.render();
    }
  },

  /** Arranque: lo único que hace falta es abrir la dirección.
      Devuelve cuando el equipo ya está al día, o cuando se agota la espera
      razonable — en ese caso la puesta al día sigue sola por detrás y la
      aplicación abre igual, nunca se queda trabada esperando al servidor. */
  async arranque(virgen){
    /* La foto de cómo llegó este equipo se toma ANTES de abrir el canal en
       vivo y antes de pedir nada: es lo que decide si toma la base del
       servidor o la fusiona con la suya. */
    const propios = this.tieneDatosPropios();
    let conectado = false;
    const trabajo = (async () => {
      this.bloqueado = true;
      try{
        const info = await this.autoconfigurar();
        if (!info || !this.activo()){
          // No contestó: se sigue tocando la puerta por detrás sin estorbar.
          this.bloqueado = false;
          this.insistirConexion();
          return;
        }
        conectado = true;
        await this.cargarCursor();
        // Hace falta la base completa si este equipo nunca la tomó de este
        // servidor, si llega en blanco, o si perdió el cursor.
        const primeraVez = this.cursor == null || !this.baseAt || (virgen && !propios);
        if (primeraVez)
          await this.hidratar({copiar:(!!virgen && !propios), propios, silencioso:true});
      }catch(e){ /* el arranque nunca se cae por culpa del servidor */ }
      finally{ this.bloqueado = false; }
      /* Solo se concilia si de verdad hay servidor. Sin él, `run` toma el
         camino de "equipo único" y da la cola por conciliada: en el arranque
         eso borraría operaciones que todavía no ha visto nadie. */
      if (!this.activo()) return;
      await this.run(true);
      this.vigilar();
    })();

    // Tope de espera: si el servidor de Render viene despertando, la pantalla
    // de acceso sale igual y la sincronización termina por detrás.
    let aTiempo = true;
    await Promise.race([trabajo, new Promise(r => setTimeout(()=>{ aTiempo = false; r(); }, 12000))]);
    return {aTiempo, conectado};
  },

  /** El servidor dormido no puede costar el día de trabajo.

      Si la página vino de una dirección web pero el servidor no contestó a
      tiempo —Render tarda en despertar—, este equipo NO se resigna a quedar
      independiente: sigue tocando la puerta por detrás, con esperas cada vez
      más largas, mientras la aplicación funciona con normalidad. En cuanto
      contesta, se configura, se pone al día y avisa. */
  _reconexion:null,
  ESPERAS:[3000, 5000, 8000, 12000, 20000, 30000, 30000, 30000, 30000, 30000],
  insistirConexion(){
    clearTimeout(this._reconexion);
    if (this.activo() || !this.origen()) return;
    let i = 0;
    const intento = async () => {
      if (this.activo()) return;
      const o = this.origen();
      const info = await this.probar(o, 12000);
      if (!info){
        if (i < this.ESPERAS.length) this._reconexion = setTimeout(intento, this.ESPERAS[i++]);
        return;
      }
      const propios = this.tieneDatosPropios();
      DB.d.config.endpoint = o; DB.touch('config');
      this.bloqueado = true;
      try{
        this.escuchar(); this.startPolling();
        await this.cargarCursor();
        await this.hidratar({copiar:!propios, propios, silencioso:true});
      }catch(e){ /* si falla, el sondeo normal sigue intentando */ }
      finally{ this.bloqueado = false; }
      await this.run(true);
      this.vigilar();
      UI.toast('Conectado con el servidor del restaurante. El equipo ya está al día.','ok', 5000);
      if (State.view === 'sync') Router.render();
    };
    this._reconexion = setTimeout(intento, this.ESPERAS[i++]);
  },

  /** Puesta al día de ocasión: al volver de segundo plano, al reconectar o
      al entrar a una pantalla que depende de datos frescos. */
  async puestaAlDia(){
    if (!this.activo() || !navigator.onLine || !DB.d.config.autoSync) return;
    if (!this.enVivo) this.escuchar();
    await this.run(true);
    await this.comprobarHuella();
  },

  /** Huella barata: /salud dice cuántos registros tiene el servidor. Si nos
      lleva ventaja, algo se perdió por el camino (diario recortado, cursor
      dañado, base restaurada) y se reconcilia con /estado. Es lo que
      garantiza que el equipo converja aunque el diario falle. */
  MARGEN_HUELLA: 0,          // solo cuenta que el servidor nos lleve ventaja
  ESPERA_HUELLA: 600000,     // no se reconcilia por huella más de una vez cada 10 min
  _ultimaHuella:0, _enVano:0,
  async comprobarHuella(forzar){
    if (!this.activo() || !navigator.onLine || this.hidratando || this.running) return false;
    const info = await this.probar(DB.d.config.endpoint, 6000);
    if (!info || typeof info.registros !== 'number') return false;
    // Solo interesa el caso "al servidor le sobran registros que aquí no están".
    // Si este equipo tiene de más, es trabajo propio sin enviar: eso lo resuelve
    // la cola, no una descarga completa.
    if (info.registros - this.contarLocal() <= this.MARGEN_HUELLA) return false;
    /* Freno por si la cuenta del servidor y la de aquí no cuadran nunca del
       todo (por ejemplo si allá se guardan cosas que aquí no viajan): tras
       varias reconciliaciones que no traen nada, se va espaciando en vez de
       bajar la base entera cada diez minutos para nada. */
    const espera = this.ESPERA_HUELLA * (1 + this._enVano * 5);
    if (!forzar && Date.now() - this._ultimaHuella < espera) return false;
    this._ultimaHuella = Date.now();
    const r = await this.hidratar({silencioso:true});
    if (r && !r.recibidos && !r.enviados) this._enVano = Math.min(this._enVano + 1, 5);
    else this._enVano = 0;
    return true;
  },

  /** Vigilancia de fondo. El canal en vivo y el sondeo traen el día a día;
      esto solo comprueba de vez en cuando que no se haya quedado atrás. */
  INTERVALO_HUELLA: 300000,           // 5 minutos
  vigilar(){
    clearInterval(this._huella);
    this._huella = setInterval(() => {
      if (document.hidden && State.view !== 'kds') return;
      if (!Auth.user || !DB.d.config.autoSync) return;
      this.comprobarHuella();
    }, this.INTERVALO_HUELLA);
  },

  /** Consulta periódica: es lo que hace que la comanda aparezca en cocina. */
  /** Canal de avisos del servidor. Esto es lo que hace que la comanda salte
      en cocina al instante: en vez de preguntar cada pocos segundos, el
      aparato se queda escuchando y el servidor le avisa cuando hay algo.
      Si se corta, el navegador reconecta solo. */
  escuchar(){
    if (this._es){ try{ this._es.close(); }catch(e){} this._es = null; }
    clearTimeout(this._reint);
    this.enVivo = false;
    if (!this.activo() || typeof EventSource === 'undefined') return;
    let es;
    try{ es = new EventSource(this.url('/eventos')); }catch(e){ return; }
    this._es = es;
    this._visto = Date.now();

    // Cualquier señal del servidor cuenta como "sigue ahí".
    const vivo = () => { this._visto = Date.now(); if (!this.enVivo){ this.enVivo = true; this._pinta(); } };

    es.onopen = () => {
      vivo();
      this.run(true);          // por si pasó algo mientras estaba desconectado
    };
    es.addEventListener('hola', vivo);
    es.addEventListener('latido', vivo);
    es.onmessage = ev => {
      vivo();
      let d = null;
      try{ d = JSON.parse(ev.data); }catch(e){ return; }
      // Quien acaba de escribir ya tiene ese número: no se pregunta a sí mismo.
      if (d && d.cursor != null && Number(d.cursor) <= Number(this.cursor||0)) return;
      this.run(true);
    };
    es.onerror = () => {
      this.enVivo = false; this._pinta();
      /* Si el navegador dejó la conexión CERRADA no va a reintentar por su
         cuenta: pasa cuando el servidor contesta algo que no es 200, como en
         el primer arranque de Render tras dormirse. Se reabre a mano. */
      if (es.readyState === 2) this._reconectarPronto();
    };
    this._vigilar();
  },

  /** El canal solo cuenta como vivo si además ha dado señales hace poco. Sin
      esto, entre que muere en silencio y el vigilante lo nota, el sondeo de
      respaldo se saltaba por creerlo vivo: justo cuando más falta hacía. */
  SILENCIO_MS: 45000,
  canalVivo(){ return this.enVivo && (Date.now() - (this._visto||0)) < this.SILENCIO_MS; },

  _pinta(){
    UI.refreshStatus();
    if (State.view === 'sync') Router.render();
  },

  _reconectarPronto(){
    clearTimeout(this._reint);
    this._reint = setTimeout(()=>{ if (Auth.user) this.escuchar(); }, 4000);
  },

  /** Vigilante de silencio.

      El caso que rompe a un celular no es que el canal dé error, sino que se
      quede callado: al cambiar de WiFi a datos el socket muere sin avisar, el
      navegador sigue creyéndolo abierto y `onerror` nunca salta. Como el
      servidor late cada 15 segundos, un silencio largo solo puede significar
      que la conexión ya no existe. */
  _vigilar(){
    clearInterval(this._ojo);
    this._ojo = setInterval(() => {
      if (!this._es || !this.activo()) return;
      if (this.canalVivo()) return;
      this.enVivo = false; this._pinta();
      this.escuchar();        // reabre; el vigilante se rearma dentro
    }, 5000);
  },

  /** Red de seguridad, no el mecanismo principal. Con el canal en pie solo se
      consulta si está caído, si hay cola esperando, o una vez por minuto para
      no quedarse callado del todo. */
  startPolling(){
    clearInterval(this._poll);
    /* Al iniciar —por ejemplo justo después de instalar una actualización— se
       sincroniza de inmediato en vez de esperar, para que lo que haya en la
       cola no quede represado. */
    if (Auth.user && this.activo() && navigator.onLine && DB.d.config.autoSync) this.run(true);
    this._poll = setInterval(() => {
      if (!Auth.user || !this.activo() || !navigator.onLine || !DB.d.config.autoSync) return;
      if (document.hidden && State.view !== 'kds') return;
      const callado = !this.lastAt || (Date.now() - new Date(this.lastAt).getTime()) > 60000;
      // Si el servidor avisó que todavía quedan cambios atrás, no se descansa
      // hasta alcanzarlo: es justo el caso que antes dejaba al equipo colgado.
      if (this.canalVivo() && !callado && !DB.d.queue.length && !this.faltan) return;
      this.run(true);
    }, 20000);
  }
};

/* ── 5. Auth ───────────────────────────────────────────────────────────
   PIN de 4 dígitos con hash SHA-256 en cliente. En el backend NestJS la
   credencial va con BCrypt (coste 12) y la sesión con JWT + refresh token.
   ------------------------------------------------------------------- */
const PERMS = {
  admin:      ['*'],
  supervisor: ['dash','pos','comandas','kds','cobrar','menu','inv','buy','clients','cash','reports','audit','sync','descuento','anular','cerrarcaja','alimentacion','gastos'],
  cajero:     ['dash','pos','comandas','kds','cobrar','inv','clients','cash','sync','descuento','cerrarcaja','alimentacion','reports','gastos','gastos:add','suspender'],
  mesero:     ['pos','comandas','inv:read','clients'],
  cocina:     ['kds','comandas:read','inv:read']
};
const ROL_LABEL = {admin:'Administrador', supervisor:'Supervisor', cajero:'Cajero', mesero:'Mesero', cocina:'Cocina'};

const Auth = {
  user:null, token:null, since:null, lastAct:Date.now(), _timer:null, _bound:false,

  can(perm){
    if (!this.user) return false;
    const p = PERMS[this.user.rol] || [];
    if (p.includes('*')) return true;
    if (perm === 'admin') return p.includes('*');
    if (p.includes(perm)) return true;
    if (perm.endsWith(':read') && p.includes(perm.split(':')[0])) return true;
    return false;
  },
  /** Comprueba el PIN contra la clave guardada. Si la clave viene de una versión
      anterior y el PIN es correcto, la actualiza al formato nuevo en el momento.
      Así nadie queda fuera del sistema al actualizar la aplicación. */
  async verificar(u, pin){
    if (!u || !u.pin) return false;
    const h = await Util.hash(pin);
    if (h === u.pin) return true;
    if (Util.esHeredado(u.pin) && Util.hashHeredado(pin) === u.pin){
      u.pin = h; u.act = Util.now();
      DB.touch('users');
      DB.log('usuario:pin-migrado', 'Clave de ' + u.nombre + ' actualizada al formato nuevo', u.id);
      try{ Sync.enqueue('users','update', u); }catch(e){}
      return true;
    }
    return false;
  },
  async login(userId, pin){
    const u = DB.user(userId);
    if (!u || !u.activo) return {ok:false, msg:'Usuario inactivo o inexistente.'};
    if (!(await this.verificar(u, pin))) return {ok:false, msg:'PIN incorrecto. Intenta de nuevo.'};
    this.user = u;
    this.since = Util.now();
    this.token = btoa(JSON.stringify({sub:u.id, rol:u.rol, iat:Date.now()})).slice(0,64);
    this.lastAct = Date.now();
    DB.log('sesion','Inicio de sesi\u00f3n \u00b7 ' + ROL_LABEL[u.rol]);
    this.watch();
    Sesion.guardar();
    Respaldo.iniciar();
    return {ok:true};
  },
  /** Pide la clave de un administrador o supervisor para una acción sensible.
      Resuelve con el usuario que autorizó, o con null si se canceló. */
  _aut:null,
  autorizacionVigente(){
    const min = Number(DB.d.config.minutosClave);
    if (!this._aut || !(min > 0)) return null;
    return (Date.now() - this._aut.ts) < min*60000 ? this._aut.user : null;
  },
  olvidarAutorizacion(){ this._aut = null; },
  autorizar(motivo, detalle){
    const vigente = this.autorizacionVigente();
    if (vigente){
      DB.log('autorizacion:vigente', motivo + ' · autorizó ' + vigente.nombre);
      return Promise.resolve(vigente);
    }
    return new Promise(resolve => {
      const jefes = DB.users().filter(u => u.activo && (u.rol === 'admin' || u.rol === 'supervisor'));
      if (!jefes.length){
        UI.toast('No hay ningún administrador activo que pueda autorizar.','bad');
        return resolve(null);
      }
      const propio = jefes.find(u => u.id === (Auth.user||{}).id);
      let intentos = 0;
      const close = UI.modal({
        title:'Autorización requerida', size:'sm',
        body:'<div class="row" style="gap:11px;align-items:flex-start">' +
            '<span style="color:var(--brass);display:flex;margin-top:2px">' + Util.ico('shield') + '</span>' +
            '<div><b style="font-size:13.5px">' + Util.esc(motivo) + '</b>' +
            (detalle ? '<div class="mut" style="font-size:12.5px;margin-top:3px">' + Util.esc(detalle) + '</div>' : '') +
            '</div></div>' +
          '<label class="f">Administrador<select class="inp" id="auU">' +
            jefes.map(u => '<option value="' + u.id + '"' + (propio && propio.id===u.id ? ' selected':'') + '>' +
              Util.esc(u.nombre) + ' · ' + ROL_LABEL[u.rol] + '</option>').join('') + '</select></label>' +
          '<label class="f">Clave<input class="inp" type="password" id="auP" inputmode="numeric" ' +
            'autocomplete="off" placeholder="••••" maxlength="12" autofocus></label>' +
          (Number(DB.d.config.minutosClave) > 0 ? '<p class="dim" style="font-size:11px">No se volverá a pedir durante ' +
            DB.d.config.minutosClave + ' minutos.</p>' : '') +
          '<div id="auE" class="hide" style="color:var(--ember-hi);font-size:12px"></div>',
        footer:'<button class="btn" data-close>Cancelar</button>' +
               '<button class="btn gold" id="auOk">Autorizar</button>',
        onMount(ov){
          const inp = ov.querySelector('#auP'), err = ov.querySelector('#auE');
          const fallar = (msg) => { err.textContent = msg; err.classList.remove('hide'); inp.value = ''; inp.focus(); };
          const probar = async () => {
            const u = DB.user(ov.querySelector('#auU').value);
            if (!inp.value) return fallar('Escribe la clave.');
            if (!await Auth.verificar(u, inp.value)){
              intentos++;
              DB.log('autorizacion:fallida', motivo + ' · intento ' + intentos + ' como ' + ((u||{}).nombre||'?'));
              if (intentos >= 3){
                close();
                UI.toast('Tres intentos fallidos. La acción quedó registrada en auditoría.','bad', 5000);
                return resolve(null);
              }
              return fallar('Clave incorrecta. Quedan ' + (3-intentos) + ' intentos.');
            }
            DB.log('autorizacion:concedida', motivo + (detalle ? ' · ' + detalle : '') + ' · autorizó ' + u.nombre);
            Auth._aut = {ts:Date.now(), user:u};
            close();
            resolve(u);
          };
          ov.querySelector('#auOk').onclick = probar;
          inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); probar(); } };
          ov.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === ov) resolve(null); });
        }
      });
    });
  },
  logout(motivo){
    this._aut = null;
    clearInterval(Respaldo._timer);
    Sesion.limpiar();
    if (this.user) DB.log('sesion', motivo || 'Cierre de sesi\u00f3n');
    this.user = null; this.token = null;
    clearInterval(this._timer);
    document.getElementById('app').classList.add('hide');
    UI.closeAll();
    Gate.show();
  },
  watch(){
    clearInterval(this._timer);
    if (!this._bound){
      ['click','keydown','touchstart'].forEach(ev =>
        document.addEventListener(ev, ()=>{ Auth.lastAct = Date.now(); }, {passive:true}));
      this._bound = true;
    }
    this._timer = setInterval(()=>{
      const min = Number(DB.d.config.bloqueoMin)||0;
      if (min > 0 && Date.now() - this.lastAct > min*60000) this.logout('Bloqueo autom\u00e1tico por inactividad');
      else Sesion.guardar();
    }, 20000);
  }
};

/* ── Respaldos ──────────────────────────────────────────────────────
   Dos redes de seguridad, porque protegen de cosas distintas:

   1. Puntos de restauración en este equipo. Se toman solos cada pocos
      minutos y antes de cualquier operación destructiva. Sirven para
      deshacer un borrado por error, aunque no haya red.

   2. Copias en el servidor del local. El navegador no puede escribir en
      una carpeta del disco por su cuenta, así que se envían al servidor,
      que las guarda en `respaldos/auto/` del mini-PC. Sirven cuando el
      problema es la tablet misma: se rompe, se pierde o se formatea.
   ------------------------------------------------------------------ */
const Respaldo = {
  META:'jp_bk_meta',
  TOPE:6,            // puntos locales que se conservan
  _timer:null, _vistoV:-1, _ultimoServidor:0,

  /** Fotografía del estado completo del restaurante. */
  instantanea(motivo){
    const datos = {};
    ['config','users','categories','products','meats','staff','clients','sales','orders','purchases','cash','meals','audit']
      .forEach(k => datos[k] = DB.d[k]);
    return {
      version:2, generado:Util.now(), motivo: motivo || 'automático',
      sede: DB.d.config.sedeId, equipo: DB.d.config.nombreEquipo || '',
      usuario: (Auth.user||{}).nombre || 'sistema',
      resumen: {
        ventas: (DB.d.sales||[]).length, platos: DB.prods().length,
        inventario: DB.meats().length, clientes: DB.clients().length,
        compras: DB.purchases().length
      },
      datos
    };
  },
  vacio(dump){
    const r = (dump && dump.resumen) || {};
    return !r.ventas && !r.platos && !r.inventario && !r.compras;
  },

  async lista(){
    try{ return (await Persist.get(this.META)) || []; }catch(e){ return []; }
  },
  /** Guarda un punto de restauración en este equipo. */
  async guardar(motivo){
    const dump = this.instantanea(motivo);
    const id = 'bk_' + Date.now().toString(36);
    const meta = await this.lista();
    try{
      await Persist.set('jp_bk_' + id, dump);
    }catch(e){
      UI.toast('No se pudo guardar el punto de restauración: no hay espacio.','warn');
      return null;
    }
    meta.unshift({id, fecha:dump.generado, motivo:dump.motivo,
      usuario:dump.usuario, resumen:dump.resumen});
    // Rotación: se conservan los más recientes y se borra el resto
    const sobran = meta.splice(this.TOPE);
    for (const v of sobran){ try{ await Persist.set('jp_bk_' + v.id, null); }catch(e){} }
    await Persist.set(this.META, meta);
    this._vistoV = DB._v;
    return id;
  },
  async leer(id){
    try{ return await Persist.get('jp_bk_' + id); }catch(e){ return null; }
  },

  /** Devuelve los datos guardados a su sitio. */
  async restaurar(dump){
    if (!dump || !dump.datos || !dump.datos.config) throw new Error('el respaldo no es válido');
    // Antes de pisar nada, se guarda cómo estaba ahora: restaurar también se deshace
    await this.guardar('antes de restaurar');
    const endpoint = DB.d.config.endpoint;
    const nombreEquipo = DB.d.config.nombreEquipo;
    Object.keys(dump.datos).forEach(k => { DB.d[k] = dump.datos[k]; });
    // La dirección del servidor y el nombre son propios de este aparato, no del
    // respaldo. Si el equipo no tiene ninguna (por ejemplo, después de borrarlo
    // todo), se toma la del respaldo para no dejarlo aislado.
    DB.d.config.endpoint = endpoint || (dump.datos.config || {}).endpoint || '';
    DB.d.config.nombreEquipo = nombreEquipo || (dump.datos.config || {}).nombreEquipo || '';
    DB.touch('config','users','categories','products','meats','staff','clients','sales','orders','purchases','cash','meals','audit');
    await DB.saveAll();
    DB.log('respaldo:restaurar', 'Del ' + Util.dt(dump.generado) + ' · ' +
      dump.resumen.ventas + ' ventas · ' + dump.resumen.platos + ' platos');
  },

  /* --- Copias en el servidor del local --- */
  async enviarServidor(motivo){
    if (!Sync.activo()) return false;
    try{
      const res = await fetch(Sync.url('/respaldo'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({motivo: motivo||'automático', dump: this.instantanea(motivo)})
      });
      if (!res.ok) return false;
      this._ultimoServidor = Date.now();
      return await res.json();
    }catch(e){ return false; }
  },
  async listaServidor(){
    if (!Sync.activo()) return [];
    try{
      const res = await fetch(Sync.url('/respaldos'));
      if (!res.ok) return [];
      return (await res.json()).archivos || [];
    }catch(e){ return []; }
  },
  async leerServidor(nombre){
    const res = await fetch(Sync.url('/respaldo/' + encodeURIComponent(nombre)));
    if (!res.ok) throw new Error('no se pudo leer del servidor');
    return await res.json();
  },

  /** Cada pocos minutos, y solo si hubo cambios desde la última vez. */
  iniciar(){
    clearInterval(this._timer);
    const min = Number(DB.d.config.respaldoMin);
    if (!(min > 0)) return;
    this._timer = setInterval(() => this.ciclo(), min * 60000);
  },
  async ciclo(){
    if (!Auth.user) return;
    if (DB._v === this._vistoV) return;      // nada cambió: no se gasta espacio
    await this.guardar('automático');
    await this.enviarServidor('automático');
  },
  /** Punto obligatorio antes de una operación que destruye datos. */
  async antesDe(motivo){
    const id = await this.guardar(motivo);
    await this.enviarServidor(motivo);
    return id;
  },

  /** Pantalla de recuperación: puntos de este equipo y copias del servidor. */
  async abrir(){
    const close = UI.modal({
      title:'Recuperar datos', size:'lg',
      body:'<div id="rcBody"><div class="wiz-spin" style="margin:30px auto"></div></div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
             '<button class="btn gold" id="rcAhora">Guardar un punto ahora</button>'
    });
    const box = document.getElementById('rcBody');
    const locales = await this.lista();
    const remotos = await this.listaServidor();

    const fila = (r, origen) => {
      const res = r.resumen || {};
      return '<tr><td>' + Util.dt(r.fecha) + '</td>' +
        '<td><span class="badge ' + (origen==='servidor'?'info':'mut') + '">' +
          (origen==='servidor'?'Servidor':'Este equipo') + '</span></td>' +
        '<td class="mut" style="font-size:12px">' + Util.esc(r.motivo||'automático') +
          (r.usuario ? ' · ' + Util.esc(r.usuario) : '') + '</td>' +
        '<td class="n">' + (res.ventas||0) + '</td>' +
        '<td class="n">' + (res.platos||0) + '</td>' +
        '<td class="n">' + (res.inventario||0) + '</td>' +
        '<td class="n"><button class="btn sm gold" data-rest="' + Util.esc(r.id||r.archivo) + '" ' +
          'data-origen="' + origen + '">Recuperar</button></td></tr>';
    };
    const filas = locales.map(r => fila(r,'local')).concat(remotos.map(r => fila(r,'servidor')));

    box.innerHTML =
      '<p style="font-size:13.5px;line-height:1.6">Cada punto guarda cómo estaba el restaurante en ese momento. ' +
      'Al recuperar uno, lo de ahora se guarda antes por si te arrepientes.</p>' +
      (Sync.activo() ? '' : '<p class="dim" style="font-size:12px;margin-top:8px">Este equipo no tiene servidor ' +
        'configurado, así que solo hay puntos guardados aquí. Si el aparato se pierde, se pierden con él.</p>') +
      '<div class="card pad0" style="margin-top:12px">' + UI.table(
        [{t:'Momento'},{t:'Dónde'},{t:'Motivo'},{t:'Ventas',n:1},{t:'Platos',n:1},{t:'Inventario',n:1},{t:'',n:1}],
        filas, {emptyTitle:'Todavía no hay puntos guardados',
                emptyMsg:'Se toman solos cada pocos minutos y antes de borrar datos.'}) + '</div>';

    const self = this;
    document.getElementById('rcAhora').onclick = async () => {
      await self.guardar('manual');
      await self.enviarServidor('manual');
      UI.toast('Punto de recuperación guardado.','ok');
      close(); self.abrir();
    };
    box.querySelectorAll('[data-rest]').forEach(b => b.onclick = async () => {
      const autorizo = await Auth.autorizar('Recuperar datos de un respaldo',
        'se reemplaza todo lo que hay ahora en este equipo');
      if (!autorizo) return;
      let dump = null;
      try{
        dump = b.dataset.origen === 'servidor'
          ? await self.leerServidor(b.dataset.rest)
          : await self.leer(b.dataset.rest);
      }catch(e){ return UI.toast('No se pudo leer el respaldo: ' + e.message,'bad', 5000); }
      if (!dump) return UI.toast('Ese respaldo ya no está disponible.','bad');

      const r = dump.resumen || {};
      if (!(await UI.confirm('Se recuperará el estado del ' + Util.dt(dump.generado) + ': ' +
        (r.ventas||0) + ' ventas, ' + (r.platos||0) + ' platos y ' + (r.inventario||0) + ' insumos. ' +
        'Lo que hay ahora se guarda como punto por si necesitas volver.',
        {ok:'Recuperar', danger:true, title:'Recuperar datos'}))) return;

      try{
        await self.restaurar(dump);
        close();
        UI.toast('Datos recuperados del ' + Util.dt(dump.generado) + '.','ok', 5200);
        Router.go('dash');
      }catch(e){ UI.toast('No se pudo recuperar: ' + e.message,'bad', 5000); }
    });
  }
};

/* ── Sesión del equipo ──────────────────────────────────────────────
   Recargar la página no debería costarle el trabajo a nadie. Aquí se guarda
   quién está usando el equipo, en qué módulo está y qué pedido lleva a medias,
   para devolverlo todo tal cual estaba. Se respeta el bloqueo por inactividad:
   si pasó más tiempo del configurado, la sesión caduca y se pide el PIN.
   ------------------------------------------------------------------ */
const Sesion = {
  KEY:'jp_sesion',
  _pend:null,

  estado(){
    if (!Auth.user) return null;
    return {
      userId: Auth.user.id,
      since: Auth.since,
      lastAct: Auth.lastAct,
      view: State.view,
      filtros: State.filters,
      pos: {
        cart: POS.cart, mesa: POS.mesa, clienteId: POS.clienteId, orderId: POS.orderId,
        descPct: POS.descPct, descVal: POS.descVal, propinaPct: POS.propinaPct,
        nota: POS.nota, cat: POS.cat, q: POS.q,
        tipo: POS.tipo, domicilio: POS.domicilio, entrega: POS.entrega
      }
    };
  },
  /** Guardado diferido: se llama muchas veces y no debe estorbar. */
  guardar(){
    clearTimeout(this._pend);
    this._pend = setTimeout(() => this.guardarYa(), 400);
  },
  async guardarYa(){
    const e = this.estado();
    if (!e) return;
    try{ await Persist.set(this.KEY, e); }catch(err){}
  },
  async limpiar(){
    clearTimeout(this._pend);
    try{ await Persist.set(this.KEY, null); }catch(err){}
  },

  /** Devuelve true si consiguió reanudar la sesión anterior. */
  async restaurar(){
    let e = null;
    try{ e = await Persist.get(this.KEY); }catch(err){ return false; }
    if (!e || !e.userId) return false;

    const u = DB.user(e.userId);
    if (!u || !u.activo || u.borrado) return false;

    // El bloqueo por inactividad también vale entre recargas
    const min = Number(DB.d.config.bloqueoMin) || 0;
    if (min > 0 && Date.now() - (e.lastAct || 0) > min*60000){
      await this.limpiar();
      return false;
    }

    Auth.user = u;
    Auth.since = e.since || Util.now();
    Auth.lastAct = e.lastAct || Date.now();
    Auth.token = btoa(JSON.stringify({sub:u.id, rol:u.rol, iat:Date.now()})).slice(0,64);
    Auth.watch();

    if (e.filtros) State.filters = e.filtros;
    if (e.pos){
      POS.cart = Array.isArray(e.pos.cart) ? e.pos.cart : [];
      POS.mesa = e.pos.mesa || '';
      POS.clienteId = DB.client(e.pos.clienteId) ? e.pos.clienteId : 'cl_1';
      POS.orderId = e.pos.orderId && DB.order(e.pos.orderId) ? e.pos.orderId : null;
      POS.descPct = e.pos.descPct || 0;
      POS.descVal = e.pos.descVal || 0;
      POS.propinaPct = e.pos.propinaPct || 0;
      POS.nota = e.pos.nota || '';
      POS.cat = e.pos.cat || 'all';
      POS.q = e.pos.q || '';
      POS.tipo = POS.TIPOS[e.pos.tipo] ? e.pos.tipo : 'mesa';
      POS.domicilio = Number(e.pos.domicilio)||0;
      POS.entrega = e.pos.entrega || {direccion:'', telefono:'', quien:'mensajero'};
      // Un plato borrado mientras tanto no puede quedar en el carrito
      POS.cart = POS.cart.filter(i => !!DB.product(i.pid));
    }

    const vista = NAV.find(n => n.id === e.view);
    State.view = (vista && Auth.can(vista.perm)) ? e.view : (Auth.can('dash') ? 'dash' : 'pos');

    document.getElementById('gate').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    Sync.escuchar();
    Sync.startPolling();
    Sync.vigilar();
    Sync.puestaAlDia();        // al entrar, lo primero es tener el día de hoy
    Respaldo.iniciar();
    Router.render();
    return true;
  }
};

/* ── 6. UI ─────────────────────────────────────────────────────────────
   Componentes transversales: toasts, modales, formularios declarativos,
   confirmaciones y barra de estado. Todo con delegación de eventos.
   ------------------------------------------------------------------- */
const State = { view:'dash', filters:{}, };

const UI = {
  /* --- toasts --- */
  toast(msg, kind, ms){
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind||'info');
    el.innerHTML = '<div>' + Util.esc(msg) + '</div>';
    box.appendChild(el);
    setTimeout(()=>{ el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; el.style.transition = '.2s'; }, (ms||3400)-220);
    setTimeout(()=> el.remove(), ms||3400);
  },

  /* --- impresión ---
     Imprime SOLO el documento (comanda, precuenta o factura) en una página
     aislada, nunca la pantalla del POS de fondo.
     Antes se marcaba la ventana con una clase y se llamaba a window.print()
     sobre toda la página, confiando en que las reglas @media print
     ocultaran el resto de la app. Eso falla en tablets que imprimen a
     térmica mediante una app puente (RawBT, apps de "impresión en red",
     drivers de fabricante, etc.): muchas de esas apps capturan la pantalla
     o el DOM tal cual está, sin respetar display:none ni @media print, y
     terminan imprimiendo el punto de venta completo en vez del ticket.
     La solución es no depender de que el medio de impresión respete CSS:
     se arma un documento nuevo que contiene ÚNICAMENTE el ticket (con su
     propio CSS embebido) en un iframe oculto, y se imprime ese documento
     aislado. Así, sin importar cómo capture la impresión el dispositivo,
     lo único que existe para capturar es el ticket. */

  /** Detecta si el dispositivo es una tablet o móvil (pantalla táctil sin mouse).
      Se usa para escalar la fuente en tablets y para elegir el método de impresión. */
  esTablet(){
    try{ return matchMedia('(pointer: coarse)').matches && matchMedia('(hover: none)').matches; }
    catch(e){ return false; }
  },

  /** Detecta iOS / iPadOS con precisión.
      iPad en iOS 13+ reporta userAgent de desktop Mac pero tiene maxTouchPoints > 1.
      iPhone siempre lleva 'iPhone' en el UA.
      Esta detección determina si usamos window.open() en lugar del iframe oculto,
      porque Safari en iOS/iPadOS no puede llamar .print() sobre un iframe con
      width:0 / height:0 / visibility:hidden: el diálogo de impresión captura la
      pantalla visible (el overlay negro de la app) en lugar del contenido del iframe. */
  esIOS(){
    try{
      const ua = navigator.userAgent || '';
      if (/iphone|ipad/i.test(ua)) return true;
      // iPad con iOS 13+: se identifica como Mac pero tiene toque
      if (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
      return false;
    }catch(e){ return false; }
  },

  /** CSS del documento aislado que se manda a imprimir.
      anchoMm: ancho físico del rollo ('58' o '80'), para fijar @page y que
        el controlador de la impresora no pagine como si fuera una hoja
        carta/A4 -- esa paginación fantasma es la causa raíz de los cortes
        y silencios intermitentes al imprimir desde el computador: el
        driver cree que hay "página 2, página 3…" y avanza papel en blanco
        entre cada una en vez de imprimir todo seguido.
      tablet: si es true, la letra se escala un poco más grande (pedido
        para impresión desde tablet).
      El resto de reglas (negro puro, sin degradados, sin cortes de
      elemento a mitad de línea) atacan la causa raíz de las manchas y el
      entrelineado irregular: los grises intermedios (#444, #333, etc.) y
      las imágenes con antialiasing se convierten en tramado de puntos al
      pasar por una cabeza térmica monocromática, y eso es lo que se ve
      como "borroso". Forzando negro puro y desactivando el ajuste de
      color del navegador, la impresora recibe solo blanco/negro sólido. */
  ticketCSS(anchoMm, tablet){
    const e = tablet ? 1.15 : 1; // escala de fuente para tablet (+15%)
    const px = (n) => (Math.round(n*e*10)/10) + 'px';
    return (
      '@page{size:' + anchoMm + 'mm auto;margin:0}' +
      // CORRECCIÓN 1: Reset universal de fondo y pseudo-elementos.
      // En WebKit (iOS/iPadOS) los pseudo-elementos ::before y ::after del
      // documento padre pueden "filtrarse" al iframe si el motor los resuelve
      // antes de que la hoja generada termine de cascadear. Se neutralizan
      // aquí de forma explícita para que el iframe sea 100% blanco.
      '*,*::before,*::after{box-sizing:border-box;background:none !important;' +
        'background-image:none !important;background-color:transparent !important;' +
        'box-shadow:none !important;text-shadow:none !important;' +
        'border-color:#000 !important;color:#000 !important}' +
      // CORRECCIÓN 2: html y body con fondo blanco explícito y sin efectos.
      // Los drivers de impresión de Android e iOS capturan el body del iframe
      // como imagen antes de enviarlo a la térmica; si el body tiene cualquier
      // color o degradado, ese color aparece como fondo de página en el papel.
      'html,body{margin:0;padding:0;background:#fff !important;' +
        'background-image:none !important;background-color:#fff !important}' +
      'img{background:#fff !important;background-color:#fff !important}' +
      // CORRECCIÓN 3: .ticket-frame era el portador del fondo #2a2a2a (gris
      // carbón) que entraba al iframe a través de outerHTML. Se fuerza blanco
      // y se eliminan todos los efectos visuales de pantalla.
      '.ticket-frame{background:#fff !important;background-color:#fff !important;' +
        'padding:0 !important;margin:0 !important;' +
        'box-shadow:none !important;border-radius:0 !important;' +
        'max-height:none !important;overflow:visible !important;' +
        'border:none !important}' +
      '.ov,.modal{background:#fff !important;background-color:#fff !important;' +
        'box-shadow:none !important;border:0 !important;' +
        'position:static !important;padding:0 !important;margin:0 !important;' +
        'backdrop-filter:none !important;-webkit-backdrop-filter:none !important}' +
      // Sin gestión de color: evita que el navegador o el driver "aclaren"
      // el negro o tramen grises, visible como manchado en una térmica.
      '*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}' +
      // CORRECCIÓN 4: .ticket recibe fondo y color explícitos DESPUÉS del
      // reset universal para sobrescribir el transparent heredado.
      '.ticket{background:#fff !important;background-color:#fff !important;' +
        'color:#000 !important;' +
        'font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;' +
        'font-size:' + px(13) + ';line-height:1.35;width:100%;margin:0;padding:1mm 2mm 6mm 2mm;' +
        '-webkit-font-smoothing:none;text-rendering:optimizeSpeed}' +
      '.ticket hr{border:0 !important;border-top:1px dashed #000 !important;margin:3px 0}' +
      '.ticket .c{text-align:center}' +
      '.ticket .b{font-weight:700}' +
      '.ticket .lg{font-size:' + px(14) + ';letter-spacing:.08em}' +
      '.ticket table{width:100%;font-size:inherit;border-collapse:collapse;' +
        'background:#fff !important;background-color:#fff !important}' +
      '.ticket td{padding:0;border:0 !important;color:#000 !important;line-height:1.35;' +
        'background:transparent !important}' +
      '.ticket .r{text-align:right}' +
      '.ticket .tk-titulo{font-size:' + px(15) + ';letter-spacing:.08em;color:#000 !important}' +
      '.ticket .tk-mesa{font-size:' + px(22) + ';margin:3px 0;color:#000 !important}' +
      '.ticket .tk-sub{font-size:' + px(11) + ';color:#000 !important}' +
      '.ticket .tk-item{margin-bottom:6px;break-inside:avoid;page-break-inside:avoid}' +
      '.ticket .tk-item-nm{font-size:' + px(14) + ';color:#000 !important}' +
      // Precio: centrado, doble del tamaño base, negrita fuerte — destacado visualmente
      '.ticket .tk-item-p{font-size:' + px(26) + ';font-weight:800;color:#000 !important;' +
        'text-align:right !important;display:block !important;margin:4px 0 2px;' +
        'letter-spacing:-.01em;line-height:1.1}' +
      '.ticket .tk-item-carne{font-size:' + px(13) + ';font-weight:700;color:#000 !important}' +
      '.ticket .tk-item-nota{font-size:' + px(12) + ';font-weight:700;color:#000 !important}' +
      '.ticket .tk-item-ad{font-size:' + px(12) + ';font-weight:700;color:#000 !important}' +
      '.ticket .tk-item-porc{font-size:' + px(11) + ';color:#000 !important}' +
      '.ticket .tk-llevar{font-size:' + px(16) + ';letter-spacing:.1em;' +
        'border:2px solid #000 !important;padding:2px 0;margin:3px 0;' +
        'color:#000 !important;background:#fff !important}' +
      // Evita que una fila o un item queden partidos entre "páginas" virtuales.
      'tr,.tk-item,.c{break-inside:avoid;page-break-inside:avoid;orphans:2;widows:2}' +
      // CORRECCIÓN 5: image-rendering corregido para WebKit en iOS/iPadOS.
      // "crisp-edges" no está soportado en Safari/WebKit; el valor correcto
      // es "-webkit-optimize-contrast" (que sí procesa el motor de Apple)
      // combinado con "pixelated" para los demás navegadores.
      // Esto elimina el dithering de grises alrededor del logo JPEG en la térmica.
      '.ticket img{image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;' +
        'max-width:100%;height:auto}'
    );
  },

  /** CSS para lo que va en hoja (los reportes), no en rollo térmico.
      Mismo principio que el ticket: sin fondos, texto negro, y la cabecera de
      la tabla repetida en cada página para que una tabla larga se entienda. */
  hojaCSS(){
    return (
      '@page{size:auto;margin:0}' +
      '*,*::before,*::after{box-sizing:border-box;background:none !important;' +
        'background-image:none !important;background-color:transparent !important;' +
        'box-shadow:none !important;text-shadow:none !important;color:#000 !important}' +
      'html,body{margin:0;padding:0;background:#fff !important;' +
        'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}' +
      '#pdfdoc{padding:8mm 7mm !important;border-radius:0 !important;font-size:9.5pt;line-height:1.2}' +
      '#pdfdoc h2{font-size:13pt;margin:0 0 1pt;line-height:1.15}' +
      '#pdfdoc h3{font-size:10.5pt;margin:5pt 0 1pt;line-height:1.15}' +
      '#pdfdoc table{width:100%;border-collapse:collapse;font-size:8pt;margin-top:3pt}' +
      '#pdfdoc th{padding:2.5pt 3pt;line-height:1.15;border-bottom:1pt solid #000;text-align:left}' +
      '#pdfdoc td{padding:1.8pt 3pt;line-height:1.2;border-bottom:.4pt solid #999}' +
      '#pdfdoc tfoot td{padding:3pt;border-top:1pt solid #000;border-bottom:0;font-weight:700}' +
      '#pdfdoc thead{display:table-header-group}' +
      '#pdfdoc tfoot{display:table-footer-group}' +
      '#pdfdoc tr{page-break-inside:avoid}'
    );
  },

  imprimir(ov, onDone){
    if (!ov || !ov.isConnected){
      UI.toast('No hay ningún documento abierto para imprimir.','warn');
      return false;
    }
    // Un ticket va en rollo; un reporte, en hoja. Antes solo se contemplaba el
    // ticket, así que los reportes no llegaban a imprimirse nunca.
    const hoja = ov.querySelector('#pdfdoc');
    const contenido = ov.querySelector('.ticket') ||
                      (ov.querySelector('.ticket-frame') && ov.querySelector('.ticket-frame .ticket')) ||
                      ov.querySelector('.ticket-frame') || hoja;
    if (!contenido){
      UI.toast('No hay ningún documento abierto para imprimir.','warn');
      return false;
    }

    const anchoMm = (DB.d.config.ticket === '58') ? '58' : '80';
    const css = (contenido === hoja) ? UI.hojaCSS() : UI.ticketCSS(anchoMm, UI.esTablet());
    const htmlDoc = (
      '<!DOCTYPE html><html><head>' +
      '<meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>Imprimir</title>' +
      '<style>' + css + '</style>' +
      '</head><body>' + contenido.outerHTML + '</body></html>'
    );

    /* ── CAUSA RAÍZ DEFINITIVA DEL FONDO NEGRO EN TABLETS ────────────────
       Tanto Safari en iOS/iPadOS como Chrome en Android presentan el mismo
       comportamiento: cuando se llama print() sobre un iframe con
       width:0 / height:0 / visibility:hidden, el diálogo de impresión del
       sistema operativo NO captura el contenido del iframe sino que hace un
       screenshot de la pantalla VISIBLE de la app.

       Lo que se ve en pantalla en ese momento es el overlay modal (.ov) con
       background:rgba(4,4,4,.72) — prácticamente negro — que es exactamente
       el recuadro oscuro que aparece impreso en el papel, con el logo
       visible en el único cuadro blanco (el div .modal dentro del overlay).

       SOLUCIÓN: Para cualquier dispositivo táctil (tablet o teléfono),
       se abre una ventana nueva con window.open() que contiene ÚNICAMENTE
       el HTML del ticket. Así el sistema operativo captura esa ventana
       blanca (solo el ticket) y no la pantalla oscura de la app.

       La ventana se abre dentro del handler onclick del botón, en el mismo
       tick del evento de usuario, por lo que los bloqueadores de popups de
       Safari y Chrome no la interceptan.

       En equipos de escritorio (mouse disponible, hover funcional) se sigue
       usando el iframe oculto, que es más limpio y no interrumpe el flujo. */

    if (UI.esTablet() || UI.esIOS()){
      /* Intentar window.open primero */
      const ventana = window.open('', '_blank', 'width=420,height=700,scrollbars=yes');
      if (!ventana){
        /* El bloqueador de popups actuó: caer al iframe como respaldo */
        return UI._imprimirIframe(htmlDoc, contenido, onDone);
      }
      ventana.document.write(htmlDoc);
      ventana.document.close();
      const imgs = ventana.document.images
        ? Array.prototype.slice.call(ventana.document.images) : [];
      const pendientes = imgs.filter(im => !im.complete);
      const lanzar = () => {
        try{
          ventana.focus();
          ventana.print();
          /* Cerrar la ventana auxiliar tras un tiempo prudencial.
             En iOS/iPadOS el close() inmediato después de print() cancela
             el diálogo, por eso se espera. */
          setTimeout(() => { try{ ventana.close(); }catch(e){} }, 3500);
          /* Ejecutar el callback (cerrar modal + navegar) en cuanto
             el diálogo de impresión está visible — el usuario ya vio
             la comanda y puede continuar con el siguiente pedido. */
          if (onDone) setTimeout(onDone, 400);
        }catch(e){
          try{ ventana.close(); }catch(ex){}
          UI._imprimirIframe(htmlDoc, contenido, onDone);
        }
      };
      if (pendientes.length){
        let restantes = pendientes.length;
        pendientes.forEach(im => { im.onload = im.onerror = () => { if(--restantes<=0) lanzar(); }; });
        setTimeout(lanzar, 1400);
      } else {
        setTimeout(lanzar, 120);
      }
      return true;
    }

    /* ── Escritorio: iframe oculto ────────────────────────────────────────
       En computadores con mouse el iframe oculto es invisible para el
       diálogo de impresión del SO, que captura el iframe y no la pantalla.
       Solo llega aquí si esTablet() y esIOS() son ambos false. */
    return UI._imprimirIframe(htmlDoc, contenido, onDone);
  },

  /** Imprime usando un iframe oculto (funciona en Chrome, Firefox, Edge,
      Chrome para Android). No usar en Safari iOS/iPadOS. */
  _imprimirIframe(htmlDoc, contenido, onDone){
    // Método de último recurso: imprime la página completa con CSS de impresión.
    // Solo se activa si el iframe falla con excepción (navegador muy restrictivo).
    const metodoAnterior = (ov) => {
      if (!ov) return false;
      document.body.classList.add('imprimiendo');
      ov.classList.add('print-doc');
