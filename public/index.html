const Sales = {
  void(id){
    const v = DB.d.sales.find(s=>s.id===id);
    if (!v || v.estado !== 'pagada') return;
    v.items.forEach(i => { if (i.carne){ const m = DB.meat(i.carne); if (m){ m.gramos += i.gramos*i.qty; m.act = Util.now(); } } });
    const cli = DB.client(v.clienteId);
    if (cli && !cli.sistema){ cli.visitas = Math.max(0, cli.visitas-1); cli.gastado = Math.max(0, cli.gastado - v.total); cli.act = Util.now(); }
    const caja = DB.openCash();
    if (caja){
      const ef = v.pagos.filter(p=>p.metodo==='Efectivo').reduce((a,p)=>a+p.monto,0);
      /* CORRECCIÓN DE RAÍZ (caja: doble descuento al anular una venta en efectivo):
         este movimiento queda en caja.movs SOLO como rastro visible en "Movimientos
         del turno" (para que se vea que hubo una anulación). Views.cash.totals()
         NO lo debe sumar en "egresos": al pasar v.estado a 'anulada' la venta ya
         desaparece de DB.paid(), así que "efectivoVentas"/"total" del turno ya
         bajan solos por esa exclusión. Antes esta línea no llevaba ninguna marca,
         y totals() la sumaba también dentro de "egresos", restando el valor de la
         venta anulada DOS VECES del efectivo esperado. Se marca con
         "reversionAnulacion" para que totals() la excluya de esa suma. */
      if (ef) caja.movs.push({id:Util.uid('mv'), tipo:'egreso', fecha:Util.now(), concepto:'Anulación ' + v.numero, monto:-ef, metodo:'Efectivo', userId:(Auth.user||{}).id, reversionAnulacion:true});
    }
    v.estado = 'anulada'; v.anuladaEn = Util.now(); v.anuladaPor = (Auth.user||{}).id; v.act = Util.now(); v.sync = false;
    DB.touch('sales','meats','clients','cash');
    DB.log('venta:anulada', v.numero + ' · ' + Util.money(v.total), v.id);
    Sync.enqueue('sales','void', v);
    v.items.forEach(i => { if (i.carne){ const m = DB.meat(i.carne); if (m) Sync.enqueue('meats','update', m); } });
    if (cli && !cli.sistema) Sync.enqueue('clients','update', cli);
    if (caja) Sync.enqueue('cash','update', caja);
    UI.toast('Factura ' + v.numero + ' anulada. Inventario restituido.','ok');
    Router.render();
  }
};

/* --- Importación de catálogo e inventario --------------------------
   Acepta un archivo CSV o texto pegado directamente desde Excel. Detecta
   el separador, reconoce los encabezados aunque vengan con tildes o en
   otro orden, valida fila por fila y muestra qué va a pasar antes de
   tocar nada. Nunca importa a medias: o entra todo lo válido, o nada.
   ------------------------------------------------------------------ */
const Importar = {
  /* Sinónimos aceptados para cada columna, ya normalizados */
  CAMPOS:{
    productos:[
      {k:'codigo',  req:false, alias:['codigo','cod','sku','referencia','ref']},
      {k:'nombre',  req:true,  alias:['nombre','producto','plato','descripcion corta','item']},
      {k:'categoria',req:false,alias:['categoria','cat','grupo','linea']},
      {k:'precio',  req:true,  alias:['precio','precio venta','valor','pvp','precio de venta']},
      {k:'costo',   req:false, alias:['costo','costo unitario','coste']},
      {k:'corte',   req:false, alias:['insumo','corte','carne','inventario','materia prima']},
      {k:'gramos',  req:false, alias:['cantidad','gramos','g','peso','gramaje','gramos por porcion','consumo']},
      {k:'tiempo',  req:false, alias:['tiempo','minutos','preparacion','tiempo preparacion']},
      {k:'desc',    req:false, alias:['descripcion','detalle','observacion','nota']},
      {k:'ico',     req:false, alias:['icono','emoji','ico']}
    ],
    personal:[
      {k:'nombre', req:true,  alias:['nombre','nombres','empleado','persona','nombre completo','nombre y apellido']},
      {k:'doc',    req:false, alias:['documento','cedula','cédula','cc','identificacion','identificación','id','numero documento']},
      {k:'cargo',  req:false, alias:['cargo','puesto','rol','area','área','oficio','funcion','función']},
      {k:'activo', req:false, alias:['activo','estado','vigente','habilitado']}
    ],
    cortes:[
      {k:'nombre',  req:true,  alias:['nombre','insumo','corte','carne','producto','item','bebida']},
      {k:'tipo',    req:false, alias:['tipo','clase','categoria','unidad','medida','unidad de medida','um']},
      {k:'presentacion', req:false, alias:['presentacion','tamano','tamaño','envase','contenido','volumen']},
      {k:'gramos',  req:false, alias:['gramos','g','existencia','cantidad','stock','peso','unidades']},
      {k:'minimo',  req:false, alias:['minimo','minimo alerta','alerta','stock minimo','min']},
      {k:'costoGramo',req:false,alias:['costo gramo','costo por gramo','costo g','precio gramo','costo','costo unitario']}
    ]
  },

  /** Parte el texto en filas y columnas respetando comillas. */
  filas(texto){
    const t = String(texto||'').replace(/\r\n?/g,'\n').trim();
    if (!t) return [];
    // El separador es el que más aparece en la primera línea
    const cabecera = t.split('\n')[0];
    const cuenta = c => (cabecera.split(c).length - 1);
    const sep = [['\t',cuenta('\t')],[';',cuenta(';')],[',',cuenta(',')],['|',cuenta('|')]]
      .sort((a,b)=>b[1]-a[1])[0][1] ? [['\t',cuenta('\t')],[';',cuenta(';')],[',',cuenta(',')],['|',cuenta('|')]]
      .sort((a,b)=>b[1]-a[1])[0][0] : ';';
    const out = [];
    let campo = '', fila = [], comillas = false;
    for (let i = 0; i < t.length; i++){
      const c = t[i];
      if (comillas){
        if (c === '"' && t[i+1] === '"'){ campo += '"'; i++; }
        else if (c === '"') comillas = false;
        else campo += c;
      } else if (c === '"') comillas = true;
      else if (c === sep){ fila.push(campo); campo = ''; }
      else if (c === '\n'){ fila.push(campo); out.push(fila); fila = []; campo = ''; }
      else campo += c;
    }
    fila.push(campo); out.push(fila);
    return out.filter(f => f.some(x => String(x).trim() !== ''));
  },

  /** Empareja los encabezados del archivo con los campos que entiende el sistema. */
  mapa(encabezados, tipo){
    const campos = this.CAMPOS[tipo];
    const m = {};
    encabezados.forEach((h, i) => {
      const n = Util.norm(h).replace(/[._-]+/g,' ').replace(/\s+/g,' ').trim();
      const c = campos.find(f => f.alias.includes(n));
      if (c && m[c.k] == null) m[c.k] = i;
    });
    return m;
  },

  /** Reconoce si una fila es carne o bebida, escrito como se escriba. */
  tipo(txt){
    const t = Util.norm(txt).replace(/[.\s]/g,'');
    if (!t) return 'carne';
    if (['bebida','bebidas','gaseosa','cerveza','envase','botella','bot','lata','refresco'].includes(t)) return 'bebida';
    return 'carne';
  },
  numero(v){
    if (v == null) return 0;
    let t = String(v).replace(/[^\d,.\-]/g,'').trim();
    if (!t) return 0;
    // "45.000,50" (Colombia) frente a "45,000.50" (inglés)
    if (t.includes(',') && t.includes('.')) {
      t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
    } else if (t.includes(',')) {
      t = (t.split(',')[1]||'').length === 3 && !/,\d{1,2}$/.test(t) ? t.replace(/,/g,'') : t.replace(',','.');
    } else if ((t.match(/\./g)||[]).length > 1 || /\.\d{3}$/.test(t)) {
      t = t.replace(/\./g,'');
    }
    const n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  },

  /** Convierte el texto en registros listos, con los errores de cada fila. */
  analizar(texto, tipo){
    const filas = this.filas(texto);
    if (filas.length < 2) return {error:'El archivo necesita una fila de encabezados y al menos una de datos.'};
    const mapa = this.mapa(filas[0], tipo);
    const faltan = this.CAMPOS[tipo].filter(f => f.req && mapa[f.k] == null);
    if (faltan.length)
      return {error:'No se encontró la columna ' + faltan.map(f=>'"'+f.k+'"').join(' ni ') +
        '. Encabezados leídos: ' + filas[0].filter(Boolean).join(', ')};

    const val = (f, k) => mapa[k] == null ? '' : String(f[mapa[k]] == null ? '' : f[mapa[k]]).trim();
    const listos = [], errores = [];
    const vistos = new Set();

    filas.slice(1).forEach((f, idx) => {
      const n = idx + 2;   // número de fila real en el archivo
      const nombre = val(f,'nombre');
      if (!nombre) return errores.push({fila:n, msg:'sin nombre'});
      const clave = Util.norm(nombre);
      // En inventario, una misma bebida en dos tamaños son dos filas legítimas:
      // la presentación forma parte de su identidad y no cuenta como repetición.
      const claveFila = tipo === 'cortes'
        ? clave + '|' + Util.norm(this.tipo(val(f,'tipo')) === 'bebida' ? val(f,'presentacion') : '')
        : clave;
      if (vistos.has(claveFila))
        return errores.push({fila:n, msg:'"' + nombre + '" está repetido en el archivo'});
      vistos.add(claveFila);

      if (tipo === 'personal'){
        const doc = val(f,'doc');
        const estado = Util.norm(val(f,'activo'));
        const r = {nombre, doc, cargo: val(f,'cargo') || 'Empleado',
          activo: !estado || ['si','sí','1','activo','x','true','vigente','habilitado'].includes(estado)};
        // Se compara por documento si lo hay; si no, por nombre
        const ya = DB.staff().find(x => (doc && Util.norm(x.doc||'') === Util.norm(doc)) ||
          (!doc && Util.norm(x.nombre) === clave));
        // Un perfil con acceso a la aplicación no se duplica aquí
        const esUsuario = DB.users().some(u => !u.borrado && Util.norm(u.nombre) === clave);
        if (esUsuario)
          return errores.push({fila:n, msg:'"' + nombre + '" ya tiene perfil de acceso; se administra en Equipo'});
        r._accion = ya ? 'actualizar' : 'crear';
        r._id = ya ? ya.id : null;
        return listos.push(r);
      }
    if (tipo === 'cortes'){
        const tipo = this.tipo(val(f,'tipo'));
        const presentacion = tipo === 'bebida' ? val(f,'presentacion') : '';
        const r = {nombre, tipo, presentacion, unidad:DB.unidadTipo(tipo),
          gramos:Math.max(0, Math.round(this.numero(val(f,'gramos')))),
          minimo:Math.max(0, Math.round(this.numero(val(f,'minimo')))),
          costoGramo:Math.max(0, this.numero(val(f,'costoGramo')))};
        // Dos presentaciones de la misma bebida son entradas distintas
        const ya = DB.meats().find(m => Util.norm(m.nombre) === clave &&
          Util.norm(m.presentacion||'') === Util.norm(presentacion));
        r._accion = ya ? 'actualizar' : 'crear';
        r._id = ya ? ya.id : null;
        return listos.push(r);
      }

      const precio = Math.round(this.numero(val(f,'precio')));
      if (precio <= 0) return errores.push({fila:n, msg:'"' + nombre + '" sin precio válido'});
      const gramos = Math.max(0, Math.round(this.numero(val(f,'gramos'))));
      const corteTxt = val(f,'corte');
      const catTxt = val(f,'categoria');
      const r = {
        nombre, precio,
        codigo: val(f,'codigo'),
        costo: Math.max(0, Math.round(this.numero(val(f,'costo')))),
        gramos, tiempo: Math.max(0, Math.round(this.numero(val(f,'tiempo')))),
        desc: val(f,'desc'), ico: Glifo.G[val(f,'ico')] ? val(f,'ico') : '',
        _catTxt: catTxt, _corteTxt: corteTxt
      };
      // Categoría: se busca por nombre; si no existe se creará
      const cat = catTxt ? DB.cats().find(c => Util.norm(c.nombre) === Util.norm(catTxt)) : null;
      r.cat = cat ? cat.id : null;
      r._catNueva = !!catTxt && !cat;
      // Solo se enlaza con inventario si la fila lo pide: las entradas y los
      // postres se preparan en cocina y no descuentan nada.
      r._corteTxt = corteTxt;
      const corte = corteTxt ? DB.meats().find(m => Util.norm(DB.rotulo(m)) === Util.norm(corteTxt) ||
        Util.norm(m.nombre) === Util.norm(corteTxt)) : null;
      r.carne = corte ? corte.id : null;
      r._corteFalta = !!corteTxt && !corte;
      if (!corteTxt) r.gramos = 0;
      else if (corte && !r.gramos)
        errores.push({fila:n, msg:'"' + nombre + '" usa ' + corte.nombre + ' pero no dice cuánto'});

      const ya = r.codigo ? DB.prods().find(p => Util.norm(p.codigo) === Util.norm(r.codigo))
                          : DB.prods().find(p => Util.norm(p.nombre) === clave);
      r._accion = ya ? 'actualizar' : 'crear';
      r._id = ya ? ya.id : null;
      listos.push(r);
    });

    return {listos, errores, columnas:Object.keys(mapa)};
  },

  /** Escribe los registros validados. Devuelve el resumen de lo hecho. */
  aplicar(listos, tipo, opciones){
    const o = opciones || {};
    let creados = 0, actualizados = 0, catsNuevas = 0, cortesNuevos = 0;

    if (tipo === 'personal'){
      listos.forEach(r => {
        if (r._accion === 'actualizar'){
          const e = DB.empleado(r._id);
          if (!e) return;
          Object.assign(e, {nombre:r.nombre, doc:r.doc, cargo:r.cargo, activo:r.activo, act:Util.now()});
          Sync.enqueue('staff','update', e);
          actualizados++;
        } else {
          const e = {id:Util.uid('e'), nombre:r.nombre, doc:r.doc, cargo:r.cargo,
            activo:r.activo, act:Util.now()};
          DB.d.staff.push(e);
          Sync.enqueue('staff','create', e);
          creados++;
        }
      });
      DB.touch('staff');
      DB.log('empleado:importar', creados + ' creados · ' + actualizados + ' actualizados');
      return {creados, actualizados, catsNuevas:0, cortesNuevos:0};
    }

    if (tipo === 'cortes'){
      listos.forEach(r => {
        if (r._accion === 'actualizar'){
          const m = DB.meat(r._id);
          Object.assign(m, {nombre:r.nombre, presentacion:r.presentacion||m.presentacion||'',
            tipo:r.tipo || m.tipo || 'carne', unidad:DB.unidadTipo(r.tipo || m.tipo),
            gramos:r.gramos, minimo:r.minimo,
            costoGramo:r.costoGramo || m.costoGramo, act:Util.now()});
          Sync.enqueue('meats','update', m); actualizados++;
        } else {
          const m = {id:Util.uid('m'), nombre:r.nombre, presentacion:r.presentacion||'',
            tipo:r.tipo||'carne', unidad:DB.unidadTipo(r.tipo), gramos:r.gramos,
            minimo:r.minimo || 0, costoGramo:r.costoGramo || 0, unidadMigrada:true, act:Util.now()};
          DB.d.meats.push(m); Sync.enqueue('meats','create', m); creados++;
        }
      });
      DB.touch('meats');
    } else {
      // Categorías nuevas primero, para poder enlazarlas
      listos.forEach(r => {
        if (!r._catNueva || !o.crearCategorias) return;
        let c = DB.cats().find(x => Util.norm(x.nombre) === Util.norm(r._catTxt));
        if (!c){
          c = {id:Util.uid('c'), nombre:r._catTxt, ico:Glifo.deducir(r._catTxt, null), orden:DB.cats().length+1, act:Util.now()};
          DB.d.categories.push(c); Sync.enqueue('categories','create', c); catsNuevas++;
        }
        r.cat = c.id;
      });
      // Lo mencionado que aún no existe se crea en cero. Si el nombre suena a
      // bebida se cuenta por envases; si no, se asume carne al peso.
      listos.forEach(r => {
        if (!r._corteFalta || !o.crearCortes) return;
        let m = DB.meats().find(x => Util.norm(x.nombre) === Util.norm(r._corteTxt));
        if (!m){
          const suenaBebida = /gaseosa|cerveza|agua|jugo|soda|refresco|malta|licor|vino|botella|lata/
            .test(Util.norm(r._corteTxt));
          const tipo = suenaBebida ? 'bebida' : 'carne';
          m = {id:Util.uid('m'), nombre:r._corteTxt, presentacion:'', tipo, unidad:DB.unidadTipo(tipo),
            gramos:0, minimo:0, costoGramo:r.costo||0, unidadMigrada:true, act:Util.now()};
          DB.d.meats.push(m); Sync.enqueue('meats','create', m); cortesNuevos++;
        }
        r.carne = m.id;
        if (!r.gramos) r.gramos = 1;
      });
      const primera = (DB.cats()[0]||{}).id;
      listos.forEach(r => {
        const datos = {nombre:r.nombre, precio:r.precio, costo:r.costo, gramos:r.gramos,
          tiempo:r.tiempo, desc:r.desc, ico:r.ico, cat:r.cat || primera,
          carne:r.carne || null, activo:true, act:Util.now()};
        /* Ningún plato puede quedar sin código: uno solo así bloqueaba
           después la creación de platos nuevos. */
        const codImp = () => 'IMP-' + String(DB.d.products.length + 1).padStart(3,'0');
        if (r._accion === 'actualizar'){
          const p = DB.product(r._id);
          Object.assign(p, datos, {codigo: r.codigo || p.codigo || codImp()});
          Sync.enqueue('products','update', p); actualizados++;
        } else {
          const p = Object.assign({id:Util.uid('p'), codigo: r.codigo || codImp()}, datos);
          DB.d.products.push(p); Sync.enqueue('products','create', p); creados++;
        }
      });
      DB.touch('products','categories','meats');
    }
    DB.log('importar:' + tipo, creados + ' creados · ' + actualizados + ' actualizados' +
      (catsNuevas ? ' · ' + catsNuevas + ' categorías nuevas' : '') +
      (cortesNuevos ? ' · ' + cortesNuevos + ' cortes nuevos' : ''));
    return {creados, actualizados, catsNuevas, cortesNuevos};
  },

  plantilla(tipo){
    const csv = tipo === 'personal'
      ? 'nombre;documento;cargo;activo\n' +
        'María Restrepo;1036123456;Cocina;si\n' +
        'Carlos Duque;71234567;Mesero;si\n' +
        'Ana Betancur;43567890;Aseo;si\n'
      : tipo === 'cortes'
      ? 'nombre;tipo;presentacion;cantidad;minimo;costo_unitario\n' +
        'Lomo fino;carne;Porción de 300 g;40;10;11400\n' +
        'Punta de anca;carne;Porción de 500 g;35;10;16000\n' +
        'Gaseosa;bebida;400 ml;48;12;2000\n' +
        'Gaseosa;bebida;1,5 L;18;6;4200\n' +
        'Cerveza nacional;bebida;330 ml;72;24;3200\n'
      : 'codigo;nombre;categoria;precio;costo;insumo;cantidad;tiempo;descripcion\n' +
        'CAR-001;Churrasco;Carnes;48000;17000;Lomo fino;1;18;Con chimichurri de la casa\n' +
        'BEB-001;Gaseosa 400 ml;Bebidas;5000;2000;Gaseosa;1;1;\n' +
        'ENT-001;Chorizo santarrosano;Entradas;14000;5000;;;8;\n';
    Util.download('plantilla-' + tipo + '.csv', csv, 'text/csv;charset=utf-8');
  },

  /* --- Interfaz --- */
  abrir(tipo){
    const esCorte = tipo === 'cortes';
    const esPersonal = tipo === 'personal';
    const titulo = esPersonal ? 'Cargar empleados desde archivo'
      : esCorte ? 'Importar cortes de inventario' : 'Importar platos a la carta';
    let analisis = null;

    const close = UI.modal({
      title:titulo, size:'lg',
      body:
        '<div id="impPaso1">' +
          '<p style="font-size:13.5px;line-height:1.6">Sube un archivo <b>CSV</b> o copia las celdas ' +
            'desde Excel y pégalas abajo. La primera fila debe traer los nombres de las columnas.</p>' +
          '<div class="row wrap" style="margin-top:12px;gap:9px">' +
            '<input type="file" id="impFile" accept=".csv,.txt,text/csv,text/plain" class="hide">' +
            '<button class="btn" id="impElegir">' + Util.ico('down') + ' Elegir archivo</button>' +
            '<button class="btn ghost" id="impPlant">Descargar plantilla</button>' +
          '</div>' +
          '<label class="f" style="margin-top:14px">O pega aquí el contenido' +
            '<textarea class="inp" id="impTxt" rows="7" style="font-family:var(--mono);font-size:12px" ' +
            'placeholder="' + (esPersonal ? 'nombre;documento;cargo'
              : esCorte ? 'nombre;tipo;presentacion;cantidad;minimo;costo_unitario'
              : 'codigo;nombre;categoria;precio;costo;insumo;cantidad') + '"></textarea></label>' +
          '<p class="dim" style="font-size:11.5px">Columnas que reconoce: ' +
            Util.esc(this.CAMPOS[tipo].map(f=>f.k).join(', ')) + '. ' +
            (esPersonal ? 'Solo hace falta el nombre. Si pones documento, se usa para no duplicar a nadie al volver a cargar la lista.'
             : esCorte ? 'Solo hace falta el nombre. En "tipo" escribe carne o bebida, y en "cantidad" las porciones o envases que tienes.'
                     : 'Solo hacen falta nombre y precio. En "cantidad" va cuánto descuenta, casi siempre 1. Deja "insumo" vacío en lo que se prepara en cocina.') + '</p>' +
        '</div>' +
        '<div id="impPaso2" class="hide"></div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn" id="impVolver" style="display:none">Volver</button>' +
             '<button class="btn gold" id="impRevisar">Revisar</button>' +
             '<button class="btn pri" id="impOk" style="display:none">Importar</button>',
      onMount(ov){
        const p1 = ov.querySelector('#impPaso1'), p2 = ov.querySelector('#impPaso2');
        const bRev = ov.querySelector('#impRevisar'), bOk = ov.querySelector('#impOk'), bVol = ov.querySelector('#impVolver');
        const file = ov.querySelector('#impFile');

        ov.querySelector('#impElegir').onclick = () => file.click();
        ov.querySelector('#impPlant').onclick = () => Importar.plantilla(tipo);
        file.onchange = async () => {
          const f = file.files[0]; if (!f) return;
          ov.querySelector('#impTxt').value = await f.text();
          UI.toast('Archivo "' + f.name + '" cargado. Pulsa Revisar.','ok');
        };

        bVol.onclick = () => {
          p1.classList.remove('hide'); p2.classList.add('hide');
          bRev.style.display = ''; bOk.style.display = 'none'; bVol.style.display = 'none';
        };

        bRev.onclick = () => {
          const txt = ov.querySelector('#impTxt').value;
          if (!txt.trim()) return UI.toast('Sube un archivo o pega el contenido primero.','warn');
          analisis = Importar.analizar(txt, tipo);
          if (analisis.error) return UI.toast(analisis.error,'bad', 6500);
          if (!analisis.listos.length) return UI.toast('No se encontró ninguna fila válida.','bad');

          const crear = analisis.listos.filter(r=>r._accion==='crear').length;
          const actualizar = analisis.listos.filter(r=>r._accion==='actualizar').length;
          const catsNuevas = Array.from(new Set(analisis.listos.filter(r=>r._catNueva).map(r=>r._catTxt)));
          const cortesFaltan = Array.from(new Set(analisis.listos.filter(r=>r._corteFalta).map(r=>r._corteTxt)));

          p2.innerHTML =
            '<div class="grid g-kpi" style="margin-bottom:12px">' +
              UI.kpi('Se van a crear', String(crear),
                esPersonal ? 'empleados nuevos' : esCorte ? 'cortes nuevos' : 'platos nuevos') +
              UI.kpi('Se van a actualizar', String(actualizar), 'ya existen en el sistema') +
              UI.kpi('Filas con problema', String(analisis.errores.length), analisis.errores.length ? 'se omitirán' : 'ninguna') +
            '</div>' +
            (catsNuevas.length ? '<label class="row" style="gap:9px;cursor:pointer;padding:8px 0">' +
              '<input type="checkbox" id="impCats" checked style="width:17px;height:17px;accent-color:#A3231C">' +
              '<span style="font-size:13px">Crear ' + catsNuevas.length + ' categoría(s) que no existen: <b>' +
              Util.esc(catsNuevas.join(', ')) + '</b></span></label>' : '') +
            (cortesFaltan.length ? '<label class="row" style="gap:9px;cursor:pointer;padding:8px 0">' +
              '<input type="checkbox" id="impCortes" checked style="width:17px;height:17px;accent-color:#A3231C">' +
              '<span style="font-size:13px">Crear ' + cortesFaltan.length + ' corte(s) de inventario en cero: <b>' +
              Util.esc(cortesFaltan.join(', ')) + '</b></span></label>' : '') +
            (analisis.errores.length ?
              '<div class="card" style="border-color:var(--ember-dim);margin:10px 0"><div class="eyebrow" style="margin-bottom:7px">' +
              'Filas que se omitirán</div>' + analisis.errores.slice(0,8).map(e =>
                '<div style="font-size:12.5px;color:var(--ash)">Fila ' + e.fila + ': ' + Util.esc(e.msg) + '</div>').join('') +
              (analisis.errores.length > 8 ? '<div class="dim" style="font-size:11.5px;margin-top:5px">y ' +
                (analisis.errores.length-8) + ' más</div>' : '') + '</div>' : '') +
            '<div class="eyebrow" style="margin:12px 0 6px">Vista previa</div>' +
            '<div class="card pad0">' + UI.table(
              esPersonal ? [{t:'Nombre'},{t:'Documento'},{t:'Cargo'},{t:'Estado'},{t:'Acción'}]
              : esCorte ? [{t:'Producto'},{t:'Tipo'},{t:'Existencia',n:1},{t:'Mínimo',n:1},{t:'Costo',n:1},{t:'Acción'}]
                      : [{t:'Código'},{t:'Plato'},{t:'Categoría'},{t:'Precio',n:1},{t:'Insumo'},{t:'Cantidad',n:1},{t:'Acción'}],
              analisis.listos.slice(0,60).map(r => esPersonal
                ? '<tr><td style="font-weight:600">' + Util.esc(r.nombre) + '</td>' +
                  '<td class="dim">' + Util.esc(r.doc||'—') + '</td>' +
                  '<td>' + Util.esc(r.cargo) + '</td>' +
                  '<td><span class="badge ' + (r.activo?'ok':'mut') + '">' +
                    (r.activo?'Activo':'Inactivo') + '</span></td>' +
                  '<td><span class="badge ' + (r._accion==='crear'?'ok':'info') + '">' + r._accion + '</span></td></tr>'
                : esCorte
                ? '<tr><td>' + Util.esc(r.nombre) +
                    (r.presentacion ? ' <span class="dim">' + Util.esc(r.presentacion) + '</span>' : '') + '</td><td>' +
                    '<span class="badge ' + (r.tipo==='bebida'?'info':'gold') + '">' +
                    (r.tipo==='bebida'?'Bebida':'Carne') + '</span></td>' +
                  '<td class="n">' + Util.cantIns(r.gramos, r) + '</td>' +
                  '<td class="n">' + Util.cantIns(r.minimo, r) + '</td><td class="n">' + Util.money(r.costoGramo) + '</td>' +
                  '<td><span class="badge ' + (r._accion==='crear'?'ok':'info') + '">' + r._accion + '</span></td></tr>'
                : '<tr><td class="num">' + Util.esc(r.codigo||'—') + '</td><td>' + Util.esc(r.nombre) + '</td>' +
                  '<td>' + Util.esc(r._catTxt||'—') + (r._catNueva?' <span class="badge warn">nueva</span>':'') + '</td>' +
                  '<td class="n">' + Util.money(r.precio) + '</td>' +
                  '<td>' + Util.esc(r._corteTxt||'—') + (r._corteFalta?' <span class="badge warn">falta</span>':'') + '</td>' +
                  '<td class="n">' + (r.gramos ? r.gramos.toLocaleString('es-CO') : '—') + '</td>' +
                  '<td><span class="badge ' + (r._accion==='crear'?'ok':'info') + '">' + r._accion + '</span></td></tr>')) +
            '</div>' +
            (analisis.listos.length > 60 ? '<p class="dim" style="font-size:11.5px;margin-top:8px">Mostrando 60 de ' +
              analisis.listos.length + ' filas.</p>' : '');

          p1.classList.add('hide'); p2.classList.remove('hide');
          bRev.style.display = 'none'; bOk.style.display = ''; bVol.style.display = '';
        };

        bOk.onclick = () => {
          const o = {
            crearCategorias: !ov.querySelector('#impCats') || ov.querySelector('#impCats').checked,
            crearCortes: !ov.querySelector('#impCortes') || ov.querySelector('#impCortes').checked
          };
          const res = Importar.aplicar(analisis.listos, tipo, o);
          close();
          UI.toast(res.creados + ' creados y ' + res.actualizados + ' actualizados.' +
            (res.catsNuevas ? ' ' + res.catsNuevas + ' categorías nuevas.' : '') +
            (res.cortesNuevos ? ' ' + res.cortesNuevos + ' cortes nuevos.' : ''), 'ok', 5000);
          Router.render();
        };
      }
    });
  }
};

            ? '<span class="dim" style="font-size:10px">desde </span>' + Util.money(DB.desdeBandeja(p))
            : Util.money(p.precio)) + '</td>' +
        '<td class="n"><span class="badge ' + (margen>=55?'ok':margen>=35?'warn':'bad') + '">' + margen + '%</span></td>' +
        '<td>' + (p.activo ? '<span class="badge ok">Activo</span>' : '<span class="badge mut">Oculto</span>') + '</td>' +
        '<td class="n"><button class="btn sm ghost" data-edit="' + p.id + '">Editar</button>' +
          '<button class="btn sm ghost" data-del="' + p.id + '" style="color:var(--ash-dim)">Quitar</button></td></tr>';
    });
    // Un plato que se llama bandeja pero no está marcado como tal no pregunta
    // la carne ni descuenta inventario: casi siempre es un olvido al crearlo.
    const sospechosos = DB.prods().filter(x => !x.bandeja &&
      /bandeja/.test(Util.norm(x.nombre) + ' ' + Util.norm((DB.cat(x.cat)||{}).nombre)));
    return '<div class="view-head"><div><div class="eyebrow">' + DB.prods().length + ' platos · ' + cats.length + ' categorías</div>' +
      '<h2>Carta</h2></div></div>' +
      (sospechosos.length ? '<div class="card" style="margin-bottom:14px;border-color:var(--ember-dim)">' +
        '<div class="row"><span style="color:var(--ember-hi);display:flex">' + Util.ico('warn') + '</span>' +
        '<div><b style="font-size:13.5px">' + sospechosos.length +
          ' plato(s) parecen bandejas pero no están marcados</b>' +
        '<div class="dim" style="font-size:12px">' + Util.esc(sospechosos.map(x=>x.nombre).join(', ')) +
        '. Así no piden la carne al vender ni descuentan del inventario.</div></div>' +
        '<div class="row right" style="gap:7px">' + sospechosos.slice(0,3).map(x =>
          '<button class="btn gold sm" data-fixband="' + x.id + '">Arreglar ' + Util.esc(x.nombre) + '</button>').join('') +
        '</div></div></div>' : '') +
      '<div class="card" style="margin-bottom:14px"><div class="row wrap">' +
        '<div class="search">' + Util.ico('search') + '<input class="inp" id="mq" placeholder="Buscar por nombre o código" value="' + Util.esc(f.q) + '"></div>' +
        '<div class="chips">' + '<button class="chip ' + (f.cat==='all'?'on':'') + '" data-c="all">Todo</button>' +
        cats.map(c=>'<button class="chip ' + (f.cat===c.id?'on':'') + '" data-c="' + c.id + '">' +
          Util.esc(c.nombre) + '</button>').join('') + '</div>' +
      '</div></div>' +
      '<div class="card pad0">' + UI.table(
        [{t:'Plato'},{t:'Categoría'},{t:'Descuenta de'},{t:'Costo',n:1},{t:'Precio',n:1},{t:'Margen',n:1},{t:'Estado'},{t:'',n:1}],
        rows, {emptyTitle:'Ningún plato coincide', emptyMsg:'Ajusta el filtro o crea uno nuevo.'}) + '</div>';
  },
  mount(){
    const q = document.getElementById('mq');
    q.oninput = Util.debounce(() => { State.filters.menu.q = q.value; Router.render(); }, 220);
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { State.filters.menu.cat = b.dataset.c; Router.render(); });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Views.menu.form(b.dataset.edit));
    document.querySelectorAll('[data-fixband]').forEach(b => b.onclick = () => {
      UI.toast('Marca "Es una bandeja" y ponle precio a cada carne.','info', 5200);
      Views.menu.form(b.dataset.fixband);
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const p = DB.product(b.dataset.del);
      if (!(await UI.confirm('¿Quitar "' + p.nombre + '" de la carta? El histórico de ventas no se altera.', {ok:'Quitar', danger:true}))) return;
      p.borrado = true; p.activo = false; p.act = Util.now();
      DB.touch('products'); DB.log('carta:eliminar', p.nombre); Sync.enqueue('products','update', p);
      UI.toast('Plato retirado de la carta.','ok'); Router.render();
    });
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'new') Views.menu.form();
      if (a === 'cat') Views.menu.cats();
      if (a === 'imp') Importar.abrir('productos');
      if (a === 'exp') Reports.csv('carta', DB.prods().map(p => ({
        codigo:p.codigo, nombre:p.nombre, categoria:(DB.cat(p.cat)||{}).nombre||'',
        precio:p.precio, costo:p.costo, corte:(DB.meat(p.carne)||{}).nombre||'',
        gramos:p.gramos, tiempo:p.tiempo, descripcion:p.desc})));
    });
  },
  form(id){
    const p = id ? DB.product(id) : null;
    /** Genera el siguiente código interno secuencial basado en la categoría */
    const siguienteCodigo = (catId) => {
      const cat = DB.cat(catId);
      /* Prefijo: primeras 3 letras del nombre de la categoría, sin tildes, en mayúscula */
      const prefijo = cat ? Util.norm(cat.nombre).slice(0,3).toUpperCase() : 'PLT';
      const regex = new RegExp('^' + prefijo + '-(\\d+)$', 'i');
      let max = 0;
      DB.prods().forEach(prod => {
        const m = (prod.codigo || '').match(regex);
        if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; }
      });
      return prefijo + '-' + String(max + 1).padStart(3, '0');
    };
    const codigoInicial = p ? p.codigo : siguienteCodigo('c_ban');
    UI.formModal({
      title: p ? 'Editar ' + p.nombre : 'Nuevo plato', size:'lg', ok: p?'Guardar cambios':'Crear plato',
      groups:[
        {title:'Identificación', fields:[
          {k:'nombre', label:'Nombre', val:p?p.nombre:'', req:true},
          {k:'codigo', label:'Código interno', val:codigoInicial, req:true, ph:'CAR-007',
           hint:p ? '' : 'Generado automáticamente. Puedes modificarlo.'},
          {k:'cat', label:'Categoría', type:'select', val:p?p.cat:'c_ban', opts:DB.cats().map(c=>({v:c.id,t:c.nombre}))},
          {k:'ico', label:'Dibujo del plato', type:'glifo', val:p?Glifo.para(p):'',
           hint:'Se propone solo según el nombre; tócalo si prefieres otro'}
        ]},
        {title:'Precio y costo', fields:[
          {k:'precio', label:'Precio de venta', type:'number', val:p?p.precio:0, min:0, req:true,
           hint:'En una bandeja es solo el precio de partida: manda el de cada carne'},
          {k:'costo', label:'Costo estimado', type:'number', val:p?p.costo:0, min:0},
          {k:'tiempo', label:'Tiempo de preparación (min)', type:'number', val:p?p.tiempo:10, min:0}
        ]},
        {title:'Consumo de inventario', fields:[
          {k:'bandeja', label:'Es una bandeja: la carne se elige al vender', type:'check',
           val:p?!!p.bandeja:false, full:true},
          {k:'carnesBandeja', label:'Carnes de la bandeja y su precio', type:'carnes',
           val:DB.opcionesBandeja(p||{}), base:(p?p.precio:0),
           hint:'Marca cada carne y ponle su precio. Si no marcas ninguna, se ofrecen todas al precio de arriba'},
          {k:'carne', label:'Descuenta de (platos que no son bandeja)', type:'select', val:p&&p.carne?p.carne:'',
           opts:[{v:'', t:'No lleva inventario (se prepara en cocina)'}]
             .concat(DB.meats().filter(m=>(m.tipo||'carne')==='carne')
               .map(m=>({v:m.id, t:'Carne · ' + DB.rotulo(m)})))
             .concat(DB.meats().filter(m=>m.tipo==='bebida')
               .map(m=>({v:m.id, t:'Bebida · ' + DB.rotulo(m)})))
             .concat([{v:'__nueva', t:'➕ Crear una bebida con el nombre de este plato'}])},
          {k:'gramos', label:'Cuánto descuenta', type:'number', val:p?(p.gramos||0):0, min:0,
           hint:'Casi siempre 1: una porción de carne o un envase. Déjalo en cero si no lleva inventario.'}
        ]},
        {title:'Insumos adicionales del plato', fields:[
          {k:'insumosExtra', label:'', type:'hidden',
           val:p && p.insumosExtra ? JSON.stringify(p.insumosExtra) : '[]'}
        ]},
        {title:'Detalle', fields:[
          {k:'desc', label:'Descripción para la carta', type:'textarea', val:p?p.desc:'', full:true},
          {k:'activo', label:'Visible en el punto de venta', type:'check', val:p?p.activo:true, full:true}
        ]},
        /* INTERVENCIÓN 4: Adiciones rápidas por defecto del plato.
           Se guardan en p.adicionesDefault y se ofrecen como burbujas flotantes
           al mesero cuando abre la nota del ítem en el carrito. */
        {title:'Adiciones rápidas del plato', fields:[
          {k:'adicionesDefault', label:'', type:'hidden',
           val:p && p.adicionesDefault ? JSON.stringify(p.adicionesDefault) : '[]'}
        ]}
      ],
      onSave(d, close){
        if (!Glifo.G[d.ico]) d.ico = '';   // vacío = se deduce del nombre
        /* CORRECCIÓN DE RAÍZ (no se podían crear platos nuevos): esta
           comprobación hacía x.codigo.toLowerCase() sobre TODOS los platos.
           Bastaba que uno solo, viejo o importado, no tuviera código para
           que reventara aquí con un TypeError: el guardado se interrumpía,
           no se creaba nada y no aparecía ningún mensaje — el botón "Crear
           plato" parecía no hacer nada. Se compara de forma segura y los
           platos sin código simplemente no cuentan como duplicado. */
        const codNuevo = String(d.codigo == null ? '' : d.codigo).trim();
        if (!codNuevo) d.codigo = siguienteCodigo(d.cat);
        else d.codigo = codNuevo;
        const codCmp = String(d.codigo).toLowerCase();
        if (DB.prods().some(x => {
              const c = String(x.codigo == null ? '' : x.codigo).trim().toLowerCase();
              return c && c === codCmp && (!p || x.id !== p.id);
            }))
          return 'Ya existe un plato con ese código interno.';
        // Bebida nueva con el nombre del plato: el atajo al cargar la carta de bar
        if (d.carne === '__nueva'){
          const ya = DB.meats().find(m => m.tipo === 'bebida' && Util.norm(m.nombre) === Util.norm(d.nombre));
          if (ya) d.carne = ya.id;
          else {
            const m = {id:Util.uid('m'), nombre:d.nombre, presentacion:'', tipo:'bebida', unidad:'und',
              gramos:0, minimo:0, costoGramo:d.costo||0, act:Util.now()};
            DB.d.meats.push(m);
            Sync.enqueue('meats','create', m);
            d.carne = m.id;
            UI.toast('Bebida "' + m.nombre + '" creada en cero. Registra las existencias con una compra.','info', 5200);
          }
          if (!d.gramos) d.gramos = 1;
        }
        try{ d.carnesBandeja = JSON.parse(d.carnesBandeja||'[]'); }catch(e){ d.carnesBandeja = []; }
        if (!Array.isArray(d.carnesBandeja)) d.carnesBandeja = [];
        if (d.bandeja){
          // La bandeja no lleva carne fija: se elige al vender, y con ella el precio
          d.carne = null;
          d.gramos = Math.max(1, Number(d.gramos)||1);
          if (!DB.meats().some(m => (m.tipo||'carne') === 'carne'))
            return 'Para armar una bandeja primero necesitas carnes en el inventario.';
          const sinPrecio = d.carnesBandeja.filter(x => !(Number(x.precio) > 0));
          if (sinPrecio.length)
            return 'Ponle precio a cada carne marcada: ' +
              sinPrecio.map(x => (DB.meat(x.id)||{}).nombre).filter(Boolean).join(', ') + '.';
          // El precio del plato pasa a ser el más barato, para mostrar "desde"
          if (d.carnesBandeja.length)
            d.precio = Math.min.apply(null, d.carnesBandeja.map(x => Number(x.precio)));
        } else {
          d.carnesBandeja = [];
          if (d.carne && !d.gramos) d.gramos = 1;   // lo normal: una porción o un envase
          if (!d.carne) d.gramos = 0;
        }
        d.porcionMigrada = true;
        /* Parsear insumos extras */
        try{ d.insumosExtra = JSON.parse(d.insumosExtra||'[]').filter(ie => ie.id); }catch(e){ d.insumosExtra = []; }
        if (!Array.isArray(d.insumosExtra)) d.insumosExtra = [];
        /* Parsear adiciones rápidas por defecto */
        try{ d.adicionesDefault = JSON.parse(d.adicionesDefault||'[]'); }catch(e){ d.adicionesDefault = []; }
        if (!Array.isArray(d.adicionesDefault)) d.adicionesDefault = [];
        const obj = Object.assign(p || {id:Util.uid('p')}, d, {carne:d.carne||null, act:Util.now()});
        if (!p) DB.d.products.push(obj);
        DB.touch('products','meats');
        DB.log(p?'carta:editar':'carta:crear', obj.nombre);
        Sync.enqueue('products', p?'update':'create', obj);
        close(); UI.toast(p?'Plato actualizado.':'Plato agregado a la carta.','ok'); Router.render();
      }
    });
    /* FASE 3: Al crear un plato nuevo, actualizar el código cuando cambie la categoría */
    if (!p){
      setTimeout(() => {
        const selCat = document.querySelector('#mform [name="cat"]');
        const inpCod = document.querySelector('#mform [name="codigo"]');
        if (selCat && inpCod){
          let codigoEditadoManualmente = false;
          inpCod.addEventListener('input', () => { codigoEditadoManualmente = true; });
          selCat.addEventListener('change', () => {
            if (!codigoEditadoManualmente){
              inpCod.value = siguienteCodigo(selCat.value);
            }
          });
        }
        /* ── Insumos adicionales: UI dinámica ── */
        const hiddenIE = document.querySelector('#mform [name="insumosExtra"]');
        if (hiddenIE){
          let extras = [];
          try{ extras = JSON.parse(hiddenIE.value||'[]'); }catch(e){ extras = []; }
          if (!Array.isArray(extras)) extras = [];
          const allInsumos = DB.meats().map(m=>({v:m.id, t:(m.tipo==='bebida'?'Bebida':'Carne') + ' · ' + DB.rotulo(m)}));
          const wrapper = document.createElement('div');
          wrapper.id = 'ieWrap';
          hiddenIE.parentElement.appendChild(wrapper);
          const pintaIE = () => {
            hiddenIE.value = JSON.stringify(extras);
            wrapper.innerHTML =
              '<p style="font-size:12.5px;color:var(--ash-dim);margin:0 0 8px">Si este plato lleva varios productos del inventario, agrégalos aquí. Cada uno se descontará al vender.</p>' +
              extras.map((ie, i) =>
                '<div class="row" style="margin-bottom:6px;gap:6px">' +
                  '<select class="inp" data-ie-sel="' + i + '" style="flex:2">' +
                    '<option value="">Seleccionar insumo…</option>' +
                    allInsumos.map(o => '<option value="' + o.v + '"' + (o.v===ie.id?' selected':'') + '>' + Util.esc(o.t) + '</option>').join('') +
                  '</select>' +
                  '<input class="inp num" type="number" data-ie-qty="' + i + '" value="' + (ie.qty||1) + '" min="1" placeholder="Cant" style="flex:.6;text-align:center" title="Porciones a descontar">' +
                  '<button class="btn sm ghost" data-ie-rm="' + i + '" style="color:var(--ash-dim)">×</button>' +
                '</div>'
              ).join('') +
              '<button class="btn sm ghost" id="ieAdd" style="margin-top:4px">' + Util.ico('plus') + ' Agregar otro insumo</button>';
            wrapper.querySelectorAll('[data-ie-sel]').forEach(s => s.onchange = () => {
              extras[+s.dataset.ieSel].id = s.value;
              const m = DB.meat(s.value);
              extras[+s.dataset.ieSel].nombre = m ? m.nombre : '';
              hiddenIE.value = JSON.stringify(extras);
            });
            wrapper.querySelectorAll('[data-ie-qty]').forEach(inp => inp.oninput = () => {
              extras[+inp.dataset.ieQty].qty = Math.max(1, parseInt(inp.value,10)||1);
              hiddenIE.value = JSON.stringify(extras);
            });
            wrapper.querySelectorAll('[data-ie-rm]').forEach(b => b.onclick = () => { extras.splice(+b.dataset.ieRm, 1); pintaIE(); });
            const addBtn = wrapper.querySelector('#ieAdd');
            if (addBtn) addBtn.onclick = () => { extras.push({id:'', qty:1, nombre:''}); pintaIE(); };
          };
          pintaIE();
        }

        /* ── Adiciones rápidas por defecto del plato ── */
        const hiddenAD = document.querySelector('#mform [name="adicionesDefault"]');
        if (hiddenAD){
          let adDefs = [];
          try{ adDefs = JSON.parse(hiddenAD.value||'[]'); }catch(e){ adDefs = []; }
          if (!Array.isArray(adDefs)) adDefs = [];

          /* Burbujas de adiciones comunes como acceso rápido */
          const BURBUJAS_RAPIDAS = [
            {nombre:'Aguacate', precio:2000}, {nombre:'Papas Fritas', precio:3000},
            {nombre:'Patacón', precio:2500}, {nombre:'Huevo Frito', precio:1500},
            {nombre:'Tajadas', precio:1500}, {nombre:'Ensalada Especial', precio:2000},
            {nombre:'Arroz Extra', precio:1000}, {nombre:'Queso', precio:2000},
            {nombre:'Crema de Leche', precio:1500}, {nombre:'Chorizo Extra', precio:4000},
            {nombre:'Chicharrón', precio:3500}
          ];

          const wrapAD = document.createElement('div');
          wrapAD.id = 'adDefWrap';
          hiddenAD.parentElement.appendChild(wrapAD);

          const pintaAD = () => {
            hiddenAD.value = JSON.stringify(adDefs);
            wrapAD.innerHTML =
              '<p style="font-size:12.5px;color:var(--ash-dim);margin:0 0 8px">Estas adiciones aparecerán como burbujas flotantes en el módulo Vender al registrar una nota para este plato. El mesero puede seleccionarlas con un toque.</p>' +
              /* Burbujas de acceso rápido */
              '<div style="margin-bottom:10px"><span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim)">Adiciones frecuentes</span>' +
              '<div class="chips wrap" style="margin-top:5px">' +
                BURBUJAS_RAPIDAS.map(b => {
                  const yaEsta = adDefs.some(d => d.nombre.toLowerCase() === b.nombre.toLowerCase());
                  return '<button type="button" class="chip' + (yaEsta?' on':'') + '" data-adburbuja="' +
                    Util.esc(b.nombre) + '" data-adprecio="' + b.precio + '">' +
                    Util.esc(b.nombre) + (yaEsta ? ' ✓' : ' + $' + b.precio.toLocaleString('es-CO')) +
                    '</button>';
                }).join('') +
              '</div></div>' +
              /* Lista actual */
              (adDefs.length
                ? '<div style="margin-bottom:8px">' +
                  adDefs.map((d, i) =>
                    '<div class="row" style="gap:6px;padding:5px 8px;background:var(--char-900);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:4px">' +
                      '<span style="flex:1;font-size:13px">' + Util.esc(d.nombre) + '</span>' +
                      '<b class="num" style="font-size:13px">+ ' + Util.money(d.precio) + '</b>' +
                      '<button type="button" class="btn sm ghost" data-adrm="' + i + '" style="color:var(--ash-dim);padding:2px 6px">✕</button>' +
                    '</div>').join('') +
                  '</div>'
                : '<div class="dim" style="font-size:12px;padding:6px 0 10px">Sin adiciones rápidas aún.</div>') +
              /* Formulario para agregar adición personalizada */
              '<div class="row" style="gap:6px;margin-top:4px">' +
                '<input class="inp" id="adDef-nom" placeholder="Nombre de la adición" style="flex:2">' +
                '<input class="inp num" id="adDef-pre" type="number" min="0" placeholder="Precio" style="flex:1">' +
                '<button type="button" class="btn sm gold" id="adDef-btn">+ Agregar</button>' +
              '</div>';

            /* Burbujas rápidas */
            wrapAD.querySelectorAll('[data-adburbuja]').forEach(b => b.onclick = () => {
              const nom = b.dataset.adburbuja;
              const pre = Number(b.dataset.adprecio)||0;
              const yaEsta = adDefs.some(d => d.nombre.toLowerCase() === nom.toLowerCase());
              if (yaEsta){
                adDefs = adDefs.filter(d => d.nombre.toLowerCase() !== nom.toLowerCase());
              } else {
                adDefs.push({nombre:nom, precio:pre});
              }
              pintaAD();
            });

            /* Quitar adición */
            wrapAD.querySelectorAll('[data-adrm]').forEach(b => b.onclick = () => {
              adDefs.splice(Number(b.dataset.adrm), 1); pintaAD();
            });

            /* Agregar personalizada */
            const btnAD = wrapAD.querySelector('#adDef-btn');
            if (btnAD) btnAD.onclick = () => {
              const nom = (wrapAD.querySelector('#adDef-nom').value||'').trim();
              const pre = Math.max(0, Number(wrapAD.querySelector('#adDef-pre').value)||0);
              if (!nom) return UI.toast('Escribe el nombre de la adición.','warn');
              if (!pre) return UI.toast('Indica el precio de la adición.','warn');
              if (adDefs.some(d=>d.nombre.toLowerCase()===nom.toLowerCase()))
                return UI.toast('Esa adición ya está en la lista.','warn');
              adDefs.push({nombre:nom, precio:pre});
              wrapAD.querySelector('#adDef-nom').value = '';
              wrapAD.querySelector('#adDef-pre').value = '';
              pintaAD();
            };
          };
          pintaAD();
        }
      }, 60);
    }
  },
  cats(){
    const paint = (ov) => {
      ov.querySelector('#clist').innerHTML = DB.cats().sort((a,b)=>a.orden-b.orden).map(c =>
        '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line-soft)">' +
        '<span class="' + Glifo.tono(c.ico) + '">' + Glifo.svg(Glifo.G[c.ico] ? c.ico : 'plato', 22) + '</span>' +
        '<b style="font-size:13px">' + Util.esc(c.nombre) + '</b>' +
        '<span class="dim right" style="font-size:11.5px">' + DB.prods().filter(p=>p.cat===c.id).length + ' platos</span>' +
        '<button class="btn sm ghost" data-cedit="' + c.id + '">Editar</button>' +
        '<button class="btn sm ghost" data-cdel="' + c.id + '" style="color:var(--ash-dim)">Quitar</button></div>').join('');
      ov.querySelectorAll('[data-cedit]').forEach(b => b.onclick = () => {
        const cat = DB.cat(b.dataset.cedit);
        UI.formModal({title:'Editar ' + cat.nombre, size:'sm', ok:'Guardar',
          fields:[
            {k:'nombre', label:'Nombre', val:cat.nombre, req:true},
            {k:'ico', label:'Dibujo', type:'glifo', val:Glifo.G[cat.ico] ? cat.ico : 'plato'},
            {k:'orden', label:'Orden en la carta', type:'number', val:cat.orden, min:1, full:true}
          ],
          onSave(d, close){
            if (DB.cats().some(x => Util.norm(x.nombre) === Util.norm(d.nombre) && x.id !== cat.id))
              return 'Ya existe otra categoría con ese nombre.';
            Object.assign(cat, d, {act:Util.now()});
            DB.touch('categories'); DB.log('categoria:editar', cat.nombre, cat.id);
            Sync.enqueue('categories','update', cat);
            close(); paint(ov); Router.render(); UI.toast('Categoría actualizada.','ok');
          }});
      });
      ov.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
        if (DB.prods().some(p=>p.cat===b.dataset.cdel)) return UI.toast('Primero mueve los platos de esa categoría.','warn');
        if (!(await UI.confirm('¿Quitar esta categoría?', {ok:'Quitar', danger:true}))) return;
        const cat = DB.cat(b.dataset.cdel);
        cat.borrado = true; cat.act = Util.now();
        DB.touch('categories'); DB.log('categoria:eliminar', cat.nombre, cat.id);
        Sync.enqueue('categories','update', cat); paint(ov); Router.render();
      });
    };
    UI.modal({title:'Categorías de la carta',
      body:'<div id="clist"></div>' +
        '<div class="row" style="margin-top:14px"><input type="hidden" id="cico" value="plato">' +
        '<input class="inp" id="cnom" placeholder="Nombre de la categoría"><button class="btn gold" id="cadd">Agregar</button></div>',
      onMount(ov){
        paint(ov);
        ov.querySelector('#cadd').onclick = () => {
          const n = ov.querySelector('#cnom').value.trim();
          if (!n) return UI.toast('Escribe el nombre de la categoría.','warn');
          if (DB.cats().some(x => Util.norm(x.nombre) === Util.norm(n)))
            return UI.toast('Ya existe una categoría con ese nombre.','warn');
          const cat = {id:Util.uid('c'), nombre:n, ico:Glifo.deducir(n, null),
            orden:DB.cats().length+1, act:Util.now()};
          DB.d.categories.push(cat);
          DB.touch('categories'); DB.log('categoria:crear', n, cat.id);
          Sync.enqueue('categories','create', cat);
          ov.querySelector('#cnom').value = ''; paint(ov); Router.render();
        };
      }});
  }
};

/* --- Inventario (solo carnes, solo gramos) --------------------------- */
Views.inv = {
  TIPOS:[{v:'carne',  t:'Carne · se cuenta por porciones'},
         {v:'bebida', t:'Bebida en envase · se cuenta por unidades'}],
  UNI_NOMBRE:{g:'gramos', ml:'mililitros', und:'unidades'},

  filtros(){ return State.filters.inv || (State.filters.inv = {q:'', f:'todos', vista:''}); },

  /** Lista visible según buscador y filtro, con lo crítico primero. */
  lista(){
    const f = this.filtros(), q = Util.norm(f.q);
    return DB.meats().filter(m => {
      if (q && !Util.norm(DB.rotulo(m)).includes(q)) return false;
      if (f.f === 'criticos') return DB.stockState(m) !== 'ok';
      if (f.f === 'agotados') return m.gramos <= 0;
      if (f.f === 'carne' || f.f === 'bebida') return (m.tipo||'carne') === f.f;
      return true;
    }).sort((a,b) => {
      const orden = {bad:0, warn:1, ok:2};
      const d = orden[DB.stockState(a)] - orden[DB.stockState(b)];
      return d !== 0 ? d : a.nombre.localeCompare(b.nombre, 'es');
    });
  },
  /** Con pocos insumos se ven mejor las fichas; con muchos, la lista. */
  vistaActual(){
    const f = this.filtros();
    return f.vista || (DB.meats().length > 12 ? 'tabla' : 'fichas');
  },

  actions(){
    if (!Auth.can('inv')) return '';
    const sobran = DB.prods().filter(p => {
      const m = p.carne ? DB.meat(p.carne) : null;
      return m && m.tipo === 'bebida' && Util.norm(m.nombre) === Util.norm(p.nombre) &&
        !DB.purchases().some(c => c.meatId === m.id);
    }).length;
    return (sobran ? '<button class="btn" data-act="limpiar">' + Util.ico('warn') +
        '<span>Limpiar ' + sobran + '</span></button>' : '') +
      '<button class="btn gold" data-act="conteo">' + Util.ico('chk') + '<span>Conteo rápido</span></button>' +
      '<button class="btn" data-act="imp">' + Util.ico('down') + '<span>Importar</span></button>' +
      '<button class="btn" data-act="exp">Exportar</button>' +
      '<button class="btn pri" data-act="new">' + Util.ico('plus') + '<span>Nuevo</span></button>';
