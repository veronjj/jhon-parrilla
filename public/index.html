      let hecho = false;
      const limpiar = () => {
        if (hecho) return; hecho = true;
        ov.classList.remove('print-doc');
        document.body.classList.remove('imprimiendo');
        window.removeEventListener('afterprint', limpiar);
        if (onDone) onDone();
      };
      window.addEventListener('afterprint', limpiar);
      setTimeout(limpiar, 5000);
      try{ window.print(); }catch(e){ limpiar(); return false; }
      return true;
    };

    let frame = document.getElementById('print-frame');
    if (!frame){
      frame = document.createElement('iframe');
      frame.id = 'print-frame';
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      document.body.appendChild(frame);
    }

    let doc;
    try{
      doc = frame.contentWindow.document;
      doc.open();
      doc.write(htmlDoc);
      doc.close();
    }catch(e){
      // El iframe no pudo escribirse: usar la página completa como respaldo
      const ovEl = contenido && contenido.closest ? contenido.closest('.ov') : null;
      return metodoAnterior(ovEl);
    }

    const lanzar = () => {
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
        /* En escritorio, afterprint es fiable; ejecutar callback al terminar */
        const afterFn = () => {
          frame.contentWindow.removeEventListener('afterprint', afterFn);
          if (onDone) onDone();
        };
        frame.contentWindow.addEventListener('afterprint', afterFn);
        setTimeout(afterFn, 8000); /* seguro por si afterprint no dispara */
      }catch(e){
        const ovEl = contenido && contenido.closest ? contenido.closest('.ov') : null;
        metodoAnterior(ovEl);
      }
    };
    const imgs = doc.images ? Array.prototype.slice.call(doc.images) : [];
    const pendientes = imgs.filter(im => !im.complete);
    if (pendientes.length){
      let restantes = pendientes.length;
      pendientes.forEach(im => { im.onload = im.onerror = () => { if(--restantes<=0) lanzar(); }; });
      setTimeout(lanzar, 1200);
    } else {
      setTimeout(lanzar, 50);
    }
    return true;
  },

  /* --- modales --- */
  _stack:[],
  modal(opts){
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML =
      '<div class="modal ' + (opts.size||'') + '" role="dialog" aria-modal="true">' +
        (opts.title === false ? '' :
        '<div class="modal-h"><h3>' + Util.esc(opts.title||'') + '</h3>' +
          '<button class="btn icon ghost right" data-close aria-label="Cerrar">' + Util.ico('x') + '</button></div>') +
        '<div class="modal-b">' + (opts.body||'') + '</div>' +
        (opts.footer ? '<div class="modal-f">' + opts.footer + '</div>' : '') +
      '</div>';
    document.getElementById('modals').appendChild(ov);
    const close = () => { ov.remove(); this._stack = this._stack.filter(x=>x!==close); };
    this._stack.push(close);
    ov.addEventListener('click', e => {
      if (e.target === ov || e.target.closest('[data-close]')) close();
    });
    if (opts.onMount) opts.onMount(ov, close);
    const first = ov.querySelector('[autofocus], .inp, .btn.pri');
    if (first) setTimeout(()=> first.focus(), 60);
    return close;
  },
  closeAll(){ this._stack.slice().forEach(fn=>fn()); },

  /** Pregunta antes de subir en uno la cantidad de algo que YA está en el
      pedido. Un toque de más en una pantalla táctil no puede cambiar la
      cuenta en silencio. El marcador #repBox hace de cerrojo: mientras el
      diálogo está abierto, otro toque sobre la misma tarjeta no abre un
      segundo. Resuelve true solo si se confirma. */
  /** Confirmación para subir la cantidad de un plato que ya está en el
      pedido. Devuelve la cantidad TOTAL que debe quedar, o 0 si se cancela.
      Trae un contador para poder poner varios de una vez, en lugar de
      confirmar uno por uno. */
  repetir(o){
    if (document.getElementById('repBox')) return Promise.resolve(0);
    const qty = Math.max(1, Number(o.qty)||1);
    const unit = Math.max(0, Number(o.unit)||0);
    const max = Number(o.max);
    const tope = (isFinite(max) && max > 0) ? qty + max : 9999;
    let destino = Math.min(tope, qty + 1);
    return new Promise(res => {
      let resuelto = false;
      const fin = (v) => { if (resuelto) return; resuelto = true; res(v); };
      const cerrar = this.modal({
        title:'¿Agregar otro?', size:'sm',
        body:'<div id="repBox" class="col" style="gap:12px;text-align:center">' +
          '<div style="font-family:var(--serif);font-size:21px;line-height:1.25">' + Util.esc(o.nombre||'') + '</div>' +
          (o.detalle ? '<div class="dim" style="font-size:12.5px;margin-top:-6px">' + Util.esc(o.detalle) + '</div>' : '') +
          '<div class="row" style="justify-content:center;align-items:center;gap:16px">' +
            '<div><div class="eyebrow">Ahora</div>' +
              '<div class="num" style="font-size:30px;font-weight:700">' + qty + '</div></div>' +
            '<span style="font-size:22px;color:var(--ash-dim)">&rarr;</span>' +
            '<div><div class="eyebrow" style="color:var(--brass-hi)">Quedaría</div>' +
              '<div class="row" style="justify-content:center;align-items:center;gap:10px">' +
                '<button type="button" class="btn icon" id="repMenos" ' +
                  'style="width:38px;height:38px;font-size:20px;line-height:1">−</button>' +
                '<span class="num" id="repVal" style="font-size:30px;font-weight:700;color:var(--brass-hi);min-width:44px">' +
                  destino + '</span>' +
                '<button type="button" class="btn icon" id="repMas" ' +
                  'style="width:38px;height:38px;font-size:20px;line-height:1">+</button>' +
              '</div></div>' +
          '</div>' +
          (unit ? '<div style="padding:9px 12px;border-radius:var(--r);background:var(--char-900)">' +
            '<div class="row" style="justify-content:space-between"><span class="dim" style="font-size:12px">Esta línea pasa de</span>' +
            '<b class="num" style="font-size:13px" id="repImp">' + Util.money(unit*qty) + ' a ' + Util.money(unit*destino) + '</b></div></div>' : '') +
          '<p class="dim" style="font-size:11.5px;line-height:1.5;margin:0">Ese plato ya está en el pedido. ' +
            'Confirma solo si el cliente pidió otro igual.</p>' +
          '<p class="dim" id="repTope" style="font-size:11.5px;margin:0;color:var(--ember-hi);display:none"></p>' +
        '</div>',
        footer:'<button class="btn" id="repNo" style="min-width:132px;padding:12px">No, dejar en ' + qty + '</button>' +
               '<button class="btn pri" id="repSi" style="min-width:132px;padding:12px">Sí, agregar</button>',
        onMount(ov, close){
          const val = ov.querySelector('#repVal');
          const imp = ov.querySelector('#repImp');
          const avisoTope = ov.querySelector('#repTope');
          const pinta = () => {
            val.textContent = destino;
            if (imp) imp.textContent = Util.money(unit*qty) + ' a ' + Util.money(unit*destino);
            if (avisoTope){
              const enTope = destino >= tope && tope < 9999;
              avisoTope.style.display = enTope ? '' : 'none';
              if (enTope) avisoTope.textContent = 'Es lo máximo que alcanza con el inventario disponible.';
            }
          };
          const mover = (d) => { destino = Math.min(tope, Math.max(qty + 1, destino + d)); pinta(); };
          const bm = ov.querySelector('#repMenos'); if (bm) bm.onclick = () => mover(-1);
          const bp = ov.querySelector('#repMas');  if (bp) bp.onclick = () => mover(1);
          /* Cerrar por la X, por el fondo o con Escape cuenta como "no". */
          ov.addEventListener('click', e => {
            if (e.target === ov || e.target.closest('[data-close]')) fin(0);
          });
          const no = ov.querySelector('#repNo');
          if (no) no.onclick = () => { fin(0); close(); };
          const si = ov.querySelector('#repSi');
          if (si) si.onclick = () => { fin(destino); close(); };
          pinta();
        }
      });
      void cerrar;
    });
  },
  confirm(msg, opts){
    opts = opts || {};
    return new Promise(res => {
      const close = this.modal({
        title: opts.title || 'Confirmar', size:'sm',
        body: '<p style="line-height:1.6">' + Util.esc(msg) + '</p>',
        footer:'<button class="btn" data-close>Cancelar</button>' +
               '<button class="btn ' + (opts.danger ? 'pri' : 'gold') + '" data-ok>' + Util.esc(opts.ok || 'Confirmar') + '</button>',
        onMount(ov){
          ov.querySelector('[data-ok]').onclick = () => { close(); res(true); };
          ov.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === ov) res(false); });
        }
      });
    });
  },

  /* --- formularios declarativos --- */
  field(f){
    const v = f.val == null ? '' : f.val;
    const req = f.req ? ' required' : '';
    let inner;
    if (f.type === 'textarea')
      inner = '<textarea class="inp" name="' + f.k + '" placeholder="' + Util.esc(f.ph||'') + '"' + req + '>' + Util.esc(v) + '</textarea>';
    else if (f.type === 'select')
      inner = '<select class="inp" name="' + f.k + '"' + req + '>' +
        (f.opts||[]).map(o => '<option value="' + Util.esc(o.v) + '"' + (String(o.v)===String(v)?' selected':'') + '>' + Util.esc(o.t) + '</option>').join('') +
        '</select>';
    else if (f.type === 'check')
      // Las casillas no admitían pista; algunas la necesitan para explicar el
      // matiz de lo que activan. Sin `hint` se pinta exactamente como antes.
      return '<div' + (f.full ? ' style="grid-column:1/-1"' : '') + '>' +
        '<label class="row" style="gap:9px;cursor:pointer;padding:8px 0">' +
        '<input type="checkbox" name="' + f.k + '"' + (v ? ' checked':'') + ' style="width:17px;height:17px;accent-color:#A3231C">' +
        '<span style="font-size:13px">' + Util.esc(f.label) + '</span></label>' +
        (f.hint ? '<span class="dim" style="font-size:10.5px;display:block;margin:-4px 0 6px 26px">' +
          Util.esc(f.hint) + '</span>' : '') +
        '</div>';
    else if (f.type === 'glifo'){
      const sel = f.val || '';
      return '<div class="f" style="grid-column:1/-1"><span>' + Util.esc(f.label) + '</span>' +
        '<input type="hidden" name="' + f.k + '" value="' + Util.esc(sel) + '">' +
        '<div class="gpick" data-glifos="' + f.k + '">' +
          Glifo.claves().map(k => '<button type="button" data-g="' + k + '" class="' + (k===sel?'on':'') + '">' +
            '<span class="' + Glifo.tono(k) + '">' + Glifo.svg(k, 30) + '</span>' +
            '<span>' + Util.esc(Glifo.etiqueta(k)) + '</span></button>').join('') +
        '</div>' +
        (f.hint ? '<span class="dim" style="font-size:10.5px">' + Util.esc(f.hint) + '</span>' : '') +
      '</div>';
    }
    else if (f.type === 'carnes'){
      // Cada carne de la bandeja lleva su propio precio de venta
      const sel = {};
      (Array.isArray(f.val) ? f.val : []).forEach(x =>
        typeof x === 'string' ? (sel[x] = f.base||0) : (sel[x.id] = Number(x.precio)||f.base||0));
      const carnes = DB.meats().filter(m => (m.tipo||'carne') === 'carne');
      return '<div class="f" style="grid-column:1/-1"><span>' + Util.esc(f.label) + '</span>' +
        '<input type="hidden" name="' + f.k + '" value="' + Util.esc(JSON.stringify(
          Object.keys(sel).map(id => ({id, precio:sel[id]})))) + '">' +
        (carnes.length
          ? '<div class="bprecios" data-carnes="' + f.k + '">' + carnes.map(m => {
              const on = sel[m.id] !== undefined;
              return '<div class="bfila ' + (on?'on':'') + '" data-fila="' + m.id + '">' +
                '<button type="button" class="bmarca" data-m="' + m.id + '">' +
                  '<span class="g-carne">' + Glifo.svg('corte', 22) + '</span>' +
                  '<b>' + Util.esc(m.nombre) + '</b>' +
                  '<span class="dim">' + Util.cantIns(m.gramos, m) + '</span></button>' +
                '<label class="bpre"><span>Precio</span>' +
                  '<input class="inp num" type="number" min="0" step="500" data-precio="' + m.id + '" ' +
                  'value="' + (on ? sel[m.id] : (f.base||0)) + '"' + (on?'':' disabled') + '></label>' +
              '</div>';
            }).join('') + '</div>'
          : '<span class="dim" style="font-size:11.5px">Todavía no hay carnes en el inventario.</span>') +
        (f.hint ? '<span class="dim" style="font-size:10.5px">' + Util.esc(f.hint) + '</span>' : '') +
      '</div>';
    }
    else if (f.type === 'hidden')
      return '<input type="hidden" name="' + f.k + '" value="' + Util.esc(v) + '">';
    else if (f.type === 'image')
      inner = '<input type="file" accept="image/*" class="inp" name="' + f.k + '" data-img>';
    else
      inner = '<input class="inp" type="' + (f.type||'text') + '" name="' + f.k + '" value="' + Util.esc(v) + '"' +
        ' placeholder="' + Util.esc(f.ph||'') + '"' + (f.min!=null?' min="'+f.min+'"':'') + (f.step?' step="'+f.step+'"':'') +
        (f.max!=null?' max="'+f.max+'"':'') + req + (f.ro?' readonly':'') + '>';
    return '<label class="f"' + (f.full ? ' style="grid-column:1/-1"' : '') + '>' + Util.esc(f.label) + inner +
      (f.hint ? '<span class="dim" style="font-size:10.5px">' + Util.esc(f.hint) + '</span>' : '') + '</label>';
  },
  formModal(o){
    const groups = o.groups || [{fields:o.fields}];
    const body = groups.map(g =>
      (g.title ? '<div class="eyebrow" style="margin-top:2px">' + Util.esc(g.title) + '</div>' : '') +
      '<div class="grid g-form">' + g.fields.map(f => this.field(f)).join('') + '</div>'
    ).join('');
    const close = this.modal({
      title:o.title, size:o.size||'',
      body:'<form id="mform" autocomplete="off">' + body + '</form>' + (o.extra||''),
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn gold" data-save>' + Util.esc(o.ok||'Guardar') + '</button>',
      onMount(ov){
        const form = ov.querySelector('#mform');
        ov.querySelectorAll('[data-carnes]').forEach(caja => {
          const oculto = ov.querySelector('input[name="' + caja.dataset.carnes + '"]');
          const recalcular = () => {
            oculto.value = JSON.stringify(Array.from(caja.querySelectorAll('.bfila.on')).map(f => ({
              id: f.dataset.fila,
              precio: Math.max(0, Number(f.querySelector('[data-precio]').value)||0)
            })));
          };
          caja.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
            const fila = b.closest('.bfila');
            fila.classList.toggle('on');
            const inp = fila.querySelector('[data-precio]');
            inp.disabled = !fila.classList.contains('on');
            if (!inp.disabled && !Number(inp.value)){
              const base = ov.querySelector('#mform [name=precio]');
              inp.value = base ? (Number(base.value)||0) : 0;
            }
            if (!inp.disabled) inp.focus();
            recalcular();
          });
          caja.querySelectorAll('[data-precio]').forEach(i => i.oninput = recalcular);
          recalcular();
        });
        ov.querySelectorAll('[data-glifos]').forEach(caja => {
          const oculto = ov.querySelector('input[name="' + caja.dataset.glifos + '"]');
          caja.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
            caja.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b));
            oculto.value = b.dataset.g;
          });
        });
        ov.querySelectorAll('[data-img]').forEach(inp => {
          inp.addEventListener('change', async () => {
            const f = inp.files[0]; if(!f) return;
            try{ inp.dataset.value = await Util.imagen(f); }
            catch(e){ UI.toast('No se pudo usar esa imagen: ' + e.message,'bad'); inp.value = ''; }
          });
        });
        const submit = () => {
          if (!form.reportValidity()) return;
          const data = {};
          form.querySelectorAll('[name]').forEach(el => {
            if (el.type === 'checkbox') data[el.name] = el.checked;
            else if (el.type === 'file') data[el.name] = el.dataset.value || null;
            else if (el.type === 'number') data[el.name] = el.value === '' ? null : Number(el.value);
            else data[el.name] = el.value.trim();
          });
          /* Si onSave falla, el usuario tiene que enterarse. Antes, una
             excepción aquí dejaba el formulario intacto y mudo: parecía que
             el botón de guardar estuviera muerto. */
          let resultado;
          try{ resultado = o.onSave(data, close); }
          catch(e){
            console.error('Error al guardar el formulario:', e);
            UI.toast('No se pudo guardar: ' + (e && e.message ? e.message : e) +
              '. Nada quedó a medias; vuelve a intentarlo.','bad', 7000);
            return;
          }
          Promise.resolve(resultado).catch(e => {
            console.error('Error al guardar el formulario:', e);
            UI.toast('No se pudo guardar: ' + (e && e.message ? e.message : e) + '.','bad', 7000);
            return null;
          }).then(err => {
            if (typeof err === 'string') UI.toast(err, 'bad');
          });
        };
        ov.querySelector('[data-save]').onclick = submit;
        form.addEventListener('submit', e => { e.preventDefault(); submit(); });
        /* Llamar al onMount del llamador si lo tiene, para que pueda
           enlazar handlers propios con el DOM ya en el árbol. */
        if (o.onMount) o.onMount(ov, close);
      }
    });
    return close;
  },

  /* --- bloques reutilizables --- */
  kpi(eyebrow, val, sub, trend){
    return '<div class="card kpi"><div class="eyebrow">' + Util.esc(eyebrow) + '</div>' +
      '<div class="val">' + val + '</div>' +
      '<div class="sub">' + (sub||'') + (trend ? ' <span class="trend ' + (trend.dir) + '">' + trend.txt + '</span>' : '') + '</div></div>';
  },
  empty(title, msg, action){
    return '<div class="empty"><h4>' + Util.esc(title) + '</h4><p style="font-size:12.5px">' + Util.esc(msg||'') + '</p>' +
      (action ? '<div style="margin-top:14px">' + action + '</div>' : '') + '</div>';
  },
  table(cols, rows, opts){
    opts = opts || {};
    if (!rows.length) return this.empty(opts.emptyTitle||'Nada por aquí todavía', opts.emptyMsg||'', opts.emptyAction);
    return '<div class="tbl-wrap"><table><thead><tr>' +
      cols.map(c => '<th class="' + (c.n?'n':'') + '">' + Util.esc(c.t) + '</th>').join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  },
  hbar(name, val, max, label){
    return '<div class="hbar"><div class="hn">' + Util.esc(name) + '</div>' +
      '<div class="ht"><i style="width:' + (max ? Math.max(2, (val/max)*100) : 0) + '%"></i></div>' +
      '<div class="hv">' + (label==null?val:label) + '</div></div>';
  },
  refreshStatus(){
    const el = document.getElementById('netPill');
    if (!el) return;
    const on = navigator.onLine, q = Sync.pending();
    const ocupado = Sync.running || Sync.hidratando;
    const dot = ocupado ? 'sync' : (on ? 'on' : 'off');
    const txt = Sync.hidratando ? 'Poniendo al día…'
      : Sync.running ? (Sync.faltan ? 'Trayendo lo pendiente…' : 'Sincronizando…')
      : on ? (q ? q + ' en cola' : (Sync.activo() && Sync.alDia ? 'Al día' : 'En línea'))
      : 'Sin conexión' + (q ? ' · ' + q : '');
    el.innerHTML = '<span class="dot ' + dot + '"></span>' + Util.esc(txt);
    el.title = 'Almacenamiento: ' + Persist.label();
  }
};

  /** Cabecera de la tarjeta: logo con órbita de destellos premium. */
  cabecera(){
    const logo = (DB.d.config.logo||'').trim() || this.LOGO_EMBEDDED;
    return '<div class="gate-orbit">' +
      '<div class="orbit-ring"></div>' +
      '<div class="orb-dot orb-a"></div><div class="orb-dot orb-b"></div>' +
      '<div class="orb-dot orb-c"></div><div class="orb-dot orb-d"></div>' +
      '<div class="orbit-logo">' +
        (logo ? '<img src="' + Util.esc(logo) + '" alt="Jhon Parrilla">' : this.EMBLEMA) +
      '</div>' +
    '</div>';
  },
  show(){
    const g = document.getElementById('gate');
    g.classList.remove('hide');
    this.pin = '';
    const activos = DB.users().filter(u => u.activo);
    if (!activos.length){
      // Sin usuarios no se muestra una lista vacía: se explica y se ofrece salida
      g.innerHTML = '<div class="gate-card">' +
        '<div class="brand"><div class="brand-mark">Jhon Parrilla</div>' +
        '<div class="brand-sub">Restaurante</div></div>' +
        '<div class="card" style="border-color:var(--ember-dim);margin-top:14px">' +
        '<b style="font-size:14px">Este equipo no tiene usuarios</b>' +
        '<p class="mut" style="font-size:12.5px;margin-top:7px;line-height:1.6">' +
        'Pasa cuando se trajeron datos de un servidor que todavía no tenía la base publicada. ' +
        'Publícala desde el equipo de la caja, o restaura los perfiles de fábrica aquí.</p></div>' +

        '</select></label>' +

        '<div class="keypad">' +
          [1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('') +
          '<button data-k="del">←</button><button data-k="0">0</button>' +
          '<button class="k-ok" data-k="ok">Entrar</button>' +
        '</div>' +
        '<p class="dim center" style="font-size:10.5px;margin-top:16px">PIN inicial de todos los perfiles: 1234 · cámbialo en Equipo</p>' +
        '</div>' +
        '<div id="gAyuda" class="hide" style="margin-top:12px;padding:11px 12px;border-radius:var(--r);' +
          'background:var(--char-800);border:1px solid var(--line);font-size:11.5px;line-height:1.55;color:var(--ash)"></div>' +
      '</div>';
    g.querySelector('#gu').onchange = e => { this.userId = e.target.value; this.pin=''; this.dots(); };
    g.querySelectorAll('.keypad button').forEach(b => b.onclick = () => this.key(b.dataset.k));
    /* Shimmer periódico en el teclado cada 4 s */
    if (this._shimmerTimer) clearInterval(this._shimmerTimer);
    this._shimmerTimer = setInterval(()=>{
      const kp = g.querySelector('.keypad');
      if (!kp || g.classList.contains('hide')) return;
      kp.classList.add('shimmer');
      setTimeout(()=> kp.classList.remove('shimmer'), 900);
    }, 4000);
    document.onkeydown = e => {
      if (document.getElementById('gate').classList.contains('hide')) return;
      if (/^[0-9]$/.test(e.key)) this.key(e.key);
      else if (e.key === 'Backspace') this.key('del');
      else if (e.key === 'Enter') this.key('ok');
    };
  },
  dots(){
    const d = document.getElementById('gd');
    if (d) d.querySelectorAll('i').forEach((el,i) => el.classList.toggle('on', i < this.pin.length));
  },
  async key(k){
    if (k === 'del') this.pin = this.pin.slice(0,-1);
    else if (k === 'ok') return this.submit();
    else if (this.pin.length < 4) this.pin += k;
    this.dots();
    if (this.pin.length === 4) setTimeout(()=>this.submit(), 130);
  },
  async submit(){
    if (this.pin.length < 4) return UI.toast('Ingresa los 4 dígitos del PIN.','warn');
    const r = await Auth.login(this.userId, this.pin);
    this.pin = ''; this.dots();
    if (!r.ok){
      this.fallos++;
      UI.toast(r.msg,'bad');
      if (this.fallos >= 3){
        const a = document.getElementById('gAyuda');
        if (a){
          a.classList.remove('hide');
          a.innerHTML = '<b style="color:var(--bone)">¿No logras entrar?</b><br>' +
            'Prueba con <b class="num">1234</b>, que es el PIN de fábrica.<br>' +
            'Si actualizaste la aplicación, asegúrate de que <b>todos</b> los equipos usen el mismo archivo: ' +
            'una tablet con la versión vieja y otra con la nueva no se entienden.<br>' +
            'Si nada funciona, entra desde el equipo servidor y restablece el PIN en <b>Equipo</b>.';
        }
      }
      return;
    }
    this.fallos = 0;
    document.getElementById('gate').classList.add('hide');
    document.onkeydown = null;
    if (this._shimmerTimer){ clearInterval(this._shimmerTimer); this._shimmerTimer = null; }
    document.getElementById('app').classList.remove('hide');
    Sync.escuchar();
    Sync.startPolling();
    Sync.vigilar();
    Sync.puestaAlDia();        // al entrar, lo primero es tener el día de hoy
    Router.go(Auth.can('dash') ? 'dash' : (Auth.can('pos') ? 'pos' : 'kds'));
    UI.toast('Bienvenido, ' + Auth.user.nombre.split(' ')[0] + '.','ok');
  }
};

/* Identidad de este aparato: si es el servidor o un equipo conectado.
   El servidor responde quién le está preguntando, así que no se adivina. */
const Equipo = {
  info:null, comprobado:0,

  async resolver(){
    if (!Sync.activo()) return null;
    if (this.info && Date.now() - this.comprobado < 60000) return this.info;
    this.info = await Sync.probar(DB.d.config.endpoint, 3500);
    this.comprobado = Date.now();
    return this.info;
  },
  /** Texto corto y sin jerga: "Este equipo es el servidor" o a cuál está conectado. */
  texto(info){
    const nombre = (DB.d.config.nombreEquipo||'').trim();
    const dir = (DB.d.config.endpoint||'').replace(/^https?:\/\//,'');
    if (!Sync.activo()) return {dot:'off', txt:(nombre ? nombre + ' · ' : '') + 'Equipo independiente'};
    if (!info) return {dot:'off', txt:(nombre ? nombre + ' · ' : '') + 'Sin conexión con ' + dir};
    return {dot:'on', txt:(nombre ? nombre + ' · ' : 'Equipo conectado · ') + 'servidor ' + dir};
  },
  async pintar(){
    const el = document.getElementById('eqPie');
    if (!el) return;
    const previo = this.texto(this.info);
    el.innerHTML = '<span class="dot ' + previo.dot + '" style="width:6px;height:6px"></span>' +
      '<span class="num">' + Util.esc(previo.txt) + '</span>';
    const info = await this.resolver();
    const t = this.texto(info);
    const el2 = document.getElementById('eqPie');
    if (el2) el2.innerHTML = '<span class="dot ' + t.dot + '" style="width:6px;height:6px"></span>' +
      '<span class="num">' + Util.esc(t.txt) + '</span>';
  }
};

const Router = {
  _timer:null,
  go(view){
    if (view === 'more') return this.sheet();
    clearInterval(this._timer); this._timer = null;
    const item = NAV.find(n => n.id === view);
    if (item && !Auth.can(item.perm)) return UI.toast('Tu rol no tiene acceso a este módulo.','warn');
    State.view = view;
    this.drawer(false);
    this.render();
    const m = document.getElementById('main'); if (m) m.scrollTop = 0;
    window.scrollTo(0,0);
  },
  /** Cajón lateral en tablet y celular. Sin argumento, alterna. */
  drawer(abrir){
    const a = document.getElementById('aside');
    if (!a) return;
    const v = abrir == null ? !a.classList.contains('open') : !!abrir;
    a.classList.toggle('open', v);
    document.body.classList.toggle('drawer', v);
    let sc = document.getElementById('scrim');
    if (v && !sc){
      sc = document.createElement('div');
      sc.id = 'scrim';
      sc.onclick = () => Router.drawer(false);
      document.body.appendChild(sc);
    } else if (!v && sc) sc.remove();
    if (v){
      const act = a.querySelector('.nav-item.active');
      if (act) act.scrollIntoView({block:'center'});
    }
  },
  abierto(){ const a = document.getElementById('aside'); return !!(a && a.classList.contains('open')); },

  sheet(){
    const items = NAV.filter(n => n.id && Auth.can(n.perm));
    UI.modal({
      title:'Todos los módulos',
      body:'<div class="grid g-3">' + items.map(n =>
        '<button class="card" data-nav="' + n.id + '" style="display:flex;gap:11px;align-items:center;text-align:left">' +
        '<span style="color:var(--brass);display:flex">' + Util.ico(n.ico) + '</span><b style="font-size:13.5px;font-weight:600">' + n.t + '</b></button>'
      ).join('') + '</div>',
      onMount(ov, close){
        ov.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { close(); Router.go(b.dataset.nav); });
      }
    });
  },
  render(){
    const v = Views[State.view] || Views.dash;
    const meta = NAV.find(n => n.id === State.view) || {t:'Tablero'};
    document.getElementById('title').textContent = meta.t;
    const sect = (()=>{ let s=''; for(const n of NAV){ if(n.sect) s=n.sect; if(n.id===State.view) return s; } return 'Operación'; })();
    document.getElementById('crumb').textContent = DB.d.config.sede + ' · ' + sect;
    const main = document.getElementById('main');
    main.classList.toggle('flush', State.view === 'pos');
    clearInterval(this._timer); this._timer = null;

    /* ── Guardar foco y cursor del input activo antes de destruir el DOM ── */
    let focusId = null, focusSel = 0, focusCursor = 0;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id && main.contains(ae)){
      focusId = ae.id;
      try{ focusSel = ae.selectionStart || 0; focusCursor = ae.selectionEnd || 0; }catch(e){ focusSel = focusCursor = (ae.value||'').length; }
    }

    main.innerHTML = v.html();
    const fab = document.getElementById('cartfab');
    if (fab) fab.classList.toggle('hide', State.view !== 'pos');
    document.getElementById('topActions').innerHTML =
      '<button class="pill" id="netPill" title="Estado"></button>' +
      (v.actions ? v.actions() : '');
    UI.refreshStatus();
    document.getElementById('netPill').onclick = () => Auth.can('sync') ? Router.go('sync') : Sync.run();
    if (v.mount) v.mount();
    this.chrome();
    Sesion.guardar();

    /* ── Restaurar foco y cursor en el input recién creado ── */
    if (focusId){
      const el = document.getElementById(focusId);
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')){
        el.focus();
        try{ el.setSelectionRange(focusSel, focusCursor); }catch(e){}
      }
    }
  },
  chrome(){
    const nav = document.getElementById('nav');
    let html = '';
    // Una sección solo se dibuja si el rol tiene al menos un módulo debajo.
    const visible = {};
    let sectActual = null;
    NAV.forEach(n => {
      if (n.sect){ sectActual = n.sect; visible[sectActual] = visible[sectActual] || false; return; }
      if (sectActual && Auth.can(n.perm)) visible[sectActual] = true;
    });
    NAV.forEach(n => {
      if (n.sect){ if (visible[n.sect]) html += '<div class="nav-sect eyebrow">' + n.sect + '</div>'; return; }
      if (!Auth.can(n.perm)) return;
      const alerts = n.id === 'inv' ? DB.lowStock().length :
        n.id === 'sync' ? Sync.pending() :
        n.id === 'kds' ? DB.openOrders().filter(o=>o.estado==='pendiente'||o.estado==='preparando').length :
        n.id === 'orders' ? DB.openOrders().length : 0;
      html += '<button class="nav-item ' + (State.view===n.id?'active':'') + '" data-nav="' + n.id + '">' +
        Util.ico(n.ico) + '<span>' + n.t + '</span>' + (alerts ? '<span class="tag">' + alerts + '</span>' : '') + '</button>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => Router.go(b.dataset.nav));

    const u = Auth.user || {nombre:'—', rol:'mesero'};
    document.getElementById('asideFoot').innerHTML =
      '<div class="who"><div class="avatar">' + Util.esc(u.nombre.slice(0,1)) + '</div>' +
      '<div style="min-width:0"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
      Util.esc(u.nombre) + '</div><div class="dim" style="font-size:10.5px">' + ROL_LABEL[u.rol] + '</div></div>' +
      '<button class="btn icon ghost right" id="btnOut" title="Cerrar sesión">' + Util.ico('lock') + '</button></div>' +
      '<div class="equipo-pie" id="eqPie"></div>';
    document.getElementById('btnOut').onclick = () => Auth.logout();
    Equipo.pintar();

    let tb = document.getElementById('tabbar');
    if (!tb){ tb = document.createElement('nav'); tb.id = 'tabbar'; document.body.appendChild(tb); }
    tb.innerHTML = TABS.filter(t => Auth.can(t.perm)).map(t =>
      '<button data-nav="' + t.id + '" class="' + (State.view===t.id?'active':'') + '">' + Util.ico(t.ico) + '<span>' + t.t + '</span></button>').join('');
    tb.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => Router.go(b.dataset.nav));

    const burger = document.getElementById('burger');
    const movil = window.innerWidth <= 1024;
    burger.classList.toggle('hide', !movil);
    burger.onclick = () => Router.drawer(true);
    document.getElementById('asideClose').onclick = () => Router.drawer(false);
    if (!movil) Router.drawer(false);   // al volver a pantalla grande el cajón deja de ser cajón
  }
};

/* ── 8. Métricas y gráficos ────────────────────────────────────────── */
const Metrics = {
  totals(sales){
    return sales.reduce((a,s) => {
      a.n++; a.bruto += s.subtotal; a.desc += s.descuento; a.imp += s.impuesto;
      a.prop += s.propina; a.total += s.total; a.costo += s.costo || 0;
      a.dom += s.domicilio || 0;
      if (s.tipo && s.tipo !== 'mesa') a.llevar++;
      return a;
    }, {n:0, bruto:0, desc:0, imp:0, prop:0, total:0, costo:0, dom:0, llevar:0});
  },
  between(from, to){
    return DB.paid().filter(s => { const d = s.fecha.slice(0,10); return d >= from && d <= to; });
  },
  topProducts(sales, limit){
    const map = {};
    sales.forEach(s => s.items.forEach(it => {
      const k = it.pid;
      map[k] = map[k] || {nombre:it.nombre, qty:0, total:0, gramos:0};
      map[k].qty += it.qty; map[k].total += it.total; map[k].gramos += (it.gramos||0) * it.qty;
    }));
    return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0, limit||6);
  },
  byDay(days){
    const out = [];
    for (let i = days-1; i >= 0; i--){
      const d = Util.daysAgo(i), key = d.toISOString().slice(0,10);
      const s = DB.salesOf(key);
      out.push({key, label:d.toLocaleDateString('es-CO',{weekday:'short'}).slice(0,3),
        total:s.reduce((a,x)=>a+x.total,0), n:s.length});
    }
    return out;
  },
  byPayment(sales){
    const m = {};
    sales.forEach(s => (s.pagos||[]).forEach(p => { m[p.metodo] = (m[p.metodo]||0) + p.monto; }));
    return m;
  }
};

const Chart = {
  bars(data, opts){
    opts = opts || {};
    const W = 640, H = 190, pl = 44, pb = 24, pt = 12;
    const max = Math.max(1, ...data.map(d=>d.total));
    const bw = (W - pl - 8) / data.length;
    const y = v => pt + (H - pt - pb) * (1 - v/max);
    let g = '';
    for (let i = 0; i <= 3; i++){
      const yy = pt + (H - pt - pb) * (i/3);
      g += '<line class="gl" x1="' + pl + '" y1="' + yy + '" x2="' + W + '" y2="' + yy + '"/>' +
           '<text class="lbl" x="' + (pl-7) + '" y="' + (yy+3) + '" text-anchor="end">' +
           Util.money(max*(1-i/3), false) + '</text>';
    }
    const bars = data.map((d,i) => {
      const x = pl + i*bw + bw*0.18, w = bw*0.64, h = Math.max(2, (H-pt-pb) - (y(d.total)-pt));
      return '<rect class="bar-r" x="' + x + '" y="' + y(d.total) + '" width="' + w + '" height="' + h + '" rx="3">' +
        '<title>' + Util.esc(d.label) + ': ' + Util.money(d.total) + ' · ' + d.n + ' ventas</title></rect>' +
        '<text class="lbl" x="' + (x + w/2) + '" y="' + (H-7) + '" text-anchor="middle">' + Util.esc(d.label) + '</text>';
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' +
      Util.esc(opts.aria||'Ventas por día') + '">' +
      '<defs><linearGradient id="gsear" x1="0" y1="1" x2="0" y2="0">' +
      '<stop offset="0%" stop-color="#A3231C"/><stop offset="70%" stop-color="#D64330"/><stop offset="100%" stop-color="#C8A24A"/>' +
      '</linearGradient></defs>' + g + bars + '</svg>';
  },
  donut(entries){
    const total = entries.reduce((a,e)=>a+e[1],0) || 1;
    const cols = ['#A3231C','#C8A24A','#3E7C9B','#3E9B62','#C9821F','#7A6530'];
    let acc = 0, segs = '';
    entries.forEach((e,i) => {
      const frac = e[1]/total, r = 54, C = 2*Math.PI*r;
      segs += '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + cols[i%6] + '" stroke-width="22"' +
        ' stroke-dasharray="' + (frac*C) + ' ' + C + '" stroke-dashoffset="' + (-acc*C) + '" transform="rotate(-90 70 70)"><title>' +
        Util.esc(e[0]) + ': ' + Util.money(e[1]) + '</title></circle>';
      acc += frac;
    });
    return '<div class="row wrap" style="gap:18px;align-items:center">' +
      '<svg viewBox="0 0 140 140" style="width:132px;height:132px;flex:none">' + segs +
      '<text x="70" y="66" text-anchor="middle" fill="#9A9187" font-size="9" font-family="ui-monospace,monospace">TOTAL</text>' +
      '<text x="70" y="82" text-anchor="middle" fill="#F2EDE6" font-size="13" font-family="ui-monospace,monospace">' +
      Util.money(total) + '</text></svg>' +
      '<div class="col" style="gap:7px;flex:1;min-width:150px">' + entries.map((e,i) =>
        '<div class="row" style="gap:8px"><span class="dot" style="background:' + cols[i%6] + '"></span>' +
        '<span style="font-size:12.5px">' + Util.esc(e[0]) + '</span>' +
        '<b class="num right" style="font-size:12.5px">' + Util.money(e[1]) + '</b></div>').join('') +
      '</div></div>';
  }
};

  /** KPI del turno abierto: lo mismo que la cajera verá al liquidar. */
  kpisTurno(caja){
    if (!caja)
      return '<div class="card" style="margin-bottom:14px;border-color:var(--brass-dim)">' +
        '<div class="row"><span style="color:var(--brass-hi);display:flex">' + Util.ico('cash','ico-min') + '</span>' +
        '<div><b style="font-size:13.5px">No hay un turno de caja abierto</b>' +
        '<div class="dim" style="font-size:12px">Abre la caja para empezar a cobrar y ver aquí el avance de tu turno.</div></div>' +
        (Auth.can('cash') ? '<button class="btn gold right" data-act="ir-caja">Ir a Caja</button>' : '') +
        '</div></div>';
    const t = Views.cash.totals(caja);
    const gastos = t.gastosTotal || 0;
    const liquidar = t.efectivoVentas - gastos;
    const ticket = t.ventas.length ? t.total / t.ventas.length : 0;
    return '<div class="grid g-kpi" style="margin-bottom:14px">' +
      UI.kpi('Ventas de mi turno', Util.money(t.total), t.ventas.length + ' facturas · desde ' + Util.time(caja.apertura)) +
      UI.kpi('Efectivo cobrado', Util.money(t.efectivoVentas), 'Lo que va entrando al cajón') +
      UI.kpi('Transferencias', Util.money(t.transferencias), 'Nequi, Daviplata, transferencia') +
      UI.kpi('Gastos del turno', Util.money(gastos), 'Salidas registradas en tu turno') +
      UI.kpi('Efectivo a liquidar', Util.money(liquidar), 'Efectivo cobrado menos gastos') +
      UI.kpi('Ticket promedio', Util.money(ticket), 'Base en caja ' + Util.money(caja.base)) +
    '</div>';
  },
  mount(){
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'ir-pos') Router.go('pos');
      if (a === 'ir-caja') Router.go('cash');
      if (a === 'ir-inv') Router.go('inv');
      if (a === 'ir-rep') Router.go('reports');
      if (a === 'ir-dom') Router.go('domicilios');
    });
    document.querySelectorAll('[data-sale]').forEach(tr => tr.onclick = () => Ticket.open(tr.dataset.sale));
    /* Botones turno domiciliario */
    document.querySelectorAll('[data-domturno]').forEach(b => b.onclick = () => {
      const d = (DB.d.domiciliarios||[]).find(x=>x.id===b.dataset.domturno);
      if (!d) return;
      if (d.enTurno){
        d.enTurno = false; d.finTurno = Util.now(); d.act = Util.now();
        DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
        DB.log('domiciliario:fin-turno', d.nombre);
        UI.toast(d.nombre + ' finalizó turno.','ok');
      } else {
        d.enTurno = true; d.inicioTurno = Util.now(); d.finTurno = null; d.act = Util.now();
        DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
        DB.log('domiciliario:inicio-turno', d.nombre);
        UI.toast(d.nombre + ' inició turno.','ok');
      }
      Router.render();
    });
  }
};

/* --- Punto de venta -------------------------------------------------
   Regla de oro del flujo: tocar producto → cobrar. Dos gestos.
   Todo lo demás (nota, descuento, división) es opcional y no bloquea.
   ------------------------------------------------------------------ */
const POS = {
  cart:[], cat:'all', q:'', mesa:'', clienteId:'cl_1', descPct:0, descVal:0, propinaPct:0, nota:'',
  orderId:null, tipo:'mesa', domicilio:0, entrega:{direccion:'', telefono:'', quien:'mensajero'},

  calc(){
    const c = DB.d.config;
    const adTotal = (i) => (i.adiciones||[]).reduce((s,x)=>s+x.precio,0);
    const subtotal = this.cart.reduce((a,i)=>a + (i.precio + adTotal(i))*i.qty, 0);
    let descuento = Math.round(subtotal * (Number(this.descPct)||0)/100) + (Number(this.descVal)||0);
    descuento = Math.min(descuento, subtotal);
    const base = subtotal - descuento;
    const impuesto = c.impuestoIncluido ? 0 : Math.round(base * (Number(c.impuesto)||0)/100);
    const propina = Math.round(base * (Number(this.propinaPct)||0)/100);
    // El domicilio es un servicio aparte: se suma al final y no paga impuesto
    // de consumo ni entra en el cálculo de la propina.
    const domicilio = this.esLlevar() ? Math.max(0, Math.round(Number(this.domicilio)||0)) : 0;
    const costo = this.cart.reduce((a,i)=>{ const p = DB.product(i.pid); return a + ((p&&p.costo)||0)*i.qty; },0);
    return {subtotal, descuento, base, impuesto, propina, domicilio, costo,
            total: base + impuesto + propina + domicilio};
  },
  /* CORRECCIÓN DE RAÍZ (se cobraba de menos): al pulsar "Agregar" sobre una
     comanda abierta, el carrito arranca VACÍO — solo lleva la ronda nueva —
     pero this.orderId ya apunta a la comanda. El botón del carrito decía
     entonces "Cobrar $20.000" (solo la ronda nueva) y, al confirmarlo, la
     venta se hacía por ese valor y la comanda entera quedaba marcada como
     'cobrada': las rondas anteriores nunca se facturaban. Era facilísimo
     caer en el error, porque el botón está justo debajo de "Agregar a la
     comanda". La regla correcta es una sola: si hay una comanda abierta, la
     cuenta es la comanda COMPLETA más lo que aún no se ha enviado. */

  /** Platos que ya están en la comanda abierta y todavía no en el carrito. */
  pendientesComanda(){
    if (!this.orderId) return [];
    const o = DB.order(this.orderId);
    if (!o || !Array.isArray(o.items)) return [];
    if (o.estado === 'cobrada' || o.estado === 'cancelada' || o.estado === 'eliminada') return [];
    const enCarro = new Set(this.cart.map(i => i.lid).filter(Boolean));
    return o.items.filter(i => !i.lid || !enCarro.has(i.lid)).map(i => ({
      lid: i.lid || Util.uid('l'), pid:i.pid, nombre:i.nombre, precio:i.precio,
      gramos:i.gramos, qty:i.qty, nota:i.nota || '',
      adiciones: Array.isArray(i.adiciones) ? i.adiciones.map(a=>Object.assign({},a)) : [],
      carne: i.carne, carneNombre: i.carneNombre || ''
    }));
  },
  /** Suma de lo que ya está en cocina y aún no se ve en el carrito. */
  subtotalPendiente(){
    return this.pendientesComanda().reduce((a,i) =>
      a + (i.precio + (i.adiciones||[]).reduce((s,x)=>s+(x.precio||0),0)) * i.qty, 0);
  },
  /** Los totales de la cuenta completa de la mesa, sin tocar el carrito. */
  calcCuenta(){
    const faltan = this.pendientesComanda();
    if (!faltan.length) return this.calc();
    const original = this.cart;
    this.cart = faltan.concat(original);
    const t = this.calc();
    this.cart = original;
    return t;
  },
  /** Mete en el carrito lo ya enviado a cocina. Devuelve cuántas líneas sumó. */
  completarCuenta(){
    const faltan = this.pendientesComanda();
    if (!faltan.length) return 0;
    this.cart = faltan.concat(this.cart);
    return faltan.length;
  },

  /** El pedido sale del local: lo lleva un mensajero o lo recoge el cliente. */
  esLlevar(){ return this.tipo === 'domicilio' || this.tipo === 'recoge'; },
  TIPOS:{
    mesa:     {t:'En mesa',    corto:'Mesa',       ico:'table'},
    domicilio:{t:'Domicilio',  corto:'Domicilio',  ico:'pos'},
    recoge:   {t:'Lo recoge el cliente', corto:'Para llevar', ico:'buy'}
  },
  /** Valores sugeridos, ya filtrados por el mínimo y el máximo configurados. */
  opcionesDomicilio(){
    const c = DB.d.config;
    const min = Number(c.domicilioMin)||0, max = Number(c.domicilioMax)||Infinity;
    return String(c.domicilioOpciones||'').split(',')
      .map(x => Math.round(Number(String(x).replace(/[^\d]/g,''))||0))
      .filter(v => v > 0 && v >= min && v <= max)
      .filter((v,i,a) => a.indexOf(v) === i)
      .sort((a,b) => a-b);
  },
  add(pid, opciones){
    const p = DB.product(pid);
    if (!p || !p.activo) return;
    const o = opciones || {};
    // Una bandeja no trae carne fija: se elige al momento de venderla
    if (p.bandeja && !o.carne) return this.pedirBandeja(p);

    const insumo = o.carne !== undefined ? o.carne : p.carne;
    const cantidad = p.gramos || (insumo ? 1 : 0);
    if (insumo){
      const disp = DB.available(insumo);
      if (disp < cantidad){
        const m = DB.meat(insumo);
        return UI.toast('No alcanza el inventario de ' + m.nombre + ': quedan ' +
          Util.cantIns(Math.max(0,disp), m) + ' y este plato usa ' + Util.cantIns(cantidad, m) + '.','bad', 4200);
      }
    }
    const nota = o.nota || '';
    // En una bandeja el precio depende de la carne que se eligió
    const precio = p.bandeja ? this.precioBandeja(p, insumo) : Number(p.precio)||0;
    // Dos bandejas iguales solo se agrupan si llevan la misma carne y la misma nota
    const ex = this.cart.find(i => i.pid === pid && !i.nota && !nota &&
      (i.carne === undefined || i.carne === insumo));
    if (ex){
      /* MEJORA (cantidades duplicadas): repetir un plato que YA está en el
         pedido no puede ser un gesto invisible. En una pantalla táctil un
         toque de más — o el mismo toque contado dos veces — subía la
         cantidad sin que nadie lo notara, y la mesa terminaba con platos
         que nadie pidió. Ahora se pregunta, diciendo en cuánto está y en
         cuánto quedaría. Se puede desactivar en Configuración. */
      if (DB.d.config.confirmarRepetir === false){
        ex.qty++;
        this.paint(); this.mostrarCarrito();
        return;
      }
      return this.confirmarRepetir(ex);
    }
    this.cart.push({lid:Util.uid('l'), pid, nombre:p.nombre, precio,
      gramos:cantidad, qty:1, nota, adiciones: [], carne:insumo || null,
      carneNombre: insumo ? DB.rotulo(DB.meat(insumo)) : ''});
    this.paint();
    this.mostrarCarrito();
  },

  /** Pregunta antes de subir la cantidad de un plato que ya está en el pedido.
      Sirve tanto para volver a tocar el plato en la carta como para el botón
      "+" del carrito: ese botón subía la cantidad en silencio y sin tope, y
      era por donde se colaban la mayoría de las cantidades duplicadas. */
  async confirmarRepetir(linea){
    const adTotal = (linea.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
    const unit = (Number(linea.precio)||0) + adTotal;
    const qty = Number(linea.qty)||1;
    /* Cuántas porciones más permite el inventario, para no ofrecer de más. */
    let margen = Infinity;
    if (linea.carne){
      const porcion = Number(linea.gramos)||1;
      margen = porcion > 0 ? Math.floor(DB.available(linea.carne) / porcion) : Infinity;
      if (margen < 1){
        const m = DB.meat(linea.carne);
        return UI.toast('No alcanza el inventario de ' + ((m||{}).nombre||'ese insumo') +
          ' para una porción más.','bad', 4200);
      }
    }
    const destino = await UI.repetir({nombre:linea.nombre, detalle:linea.carneNombre,
      unit, qty, max:margen});
    if (!destino || destino <= qty) return;
    const viva = this.cart.find(x => x.lid === linea.lid);
    if (!viva) return UI.toast('Ese plato ya no está en el pedido.','warn');
    const suma = destino - (Number(viva.qty)||1);
    if (suma <= 0) return;
    if (viva.carne){
      const porcion = Number(viva.gramos)||1;
      if (DB.available(viva.carne) < porcion * suma){
        const m = DB.meat(viva.carne);
        return UI.toast('No alcanza el inventario de ' + ((m||{}).nombre||'ese insumo') +
          ' para ' + suma + ' porción(es) más.','bad', 4200);
      }
    }
    viva.qty = destino;
    this.paint(); this.mostrarCarrito();
    UI.toast(viva.nombre + ' · ahora van ' + viva.qty + '.','ok');
  },

  /** En pantallas pequeñas el carrito es una hoja que se abre desde el botón
      flotante. Al agregar el primer plato se abre sola, para que estén a la
      vista la nota, las cantidades y el total. */
  _mostrado:false,
  mostrarCarrito(){
    if (window.innerWidth > 860) return;
    if (this._mostrado) return;              // una sola vez por pedido
    const c = document.getElementById('cart');
    if (!c) return;
    this._mostrado = true;
    if (!c.classList.contains('open')) c.classList.add('open');
  },

  /** Carnes que admite una bandeja, cada una con su precio.
      Devuelve [{m, precio}]. Si no se configuró ninguna, se ofrecen todas
      las carnes al precio base del plato. */
  carnesDe(p){
    const todas = DB.meats().filter(m => (m.tipo||'carne') === 'carne');
    const conf = DB.opcionesBandeja(p);
    if (!conf.length) return todas.map(m => ({m, precio:Number(p.precio)||0}));
    const out = [];
    conf.forEach(o => {
      const m = DB.meat(o.id);
      if (m && !m.borrado) out.push({m, precio: Number(o.precio) || Number(p.precio) || 0});
    });
    return out.length ? out : todas.map(m => ({m, precio:Number(p.precio)||0}));
  },
  /** Precio de una carne dentro de una bandeja. */
  precioBandeja(p, meatId){
    const o = this.carnesDe(p).find(x => x.m.id === meatId);
    return o ? o.precio : (Number(p.precio)||0);
  },

  /** Diálogo de la bandeja: qué carne lleva y qué observación va para cocina. */
  pedirBandeja(p, lid){
    const linea = lid ? this.cart.find(i => i.lid === lid) : null;
    const carnes = this.carnesDe(p);
    if (!carnes.length) return UI.toast('No hay carnes en el inventario para armar la bandeja.','warn', 4600);
    let sel = linea ? linea.carne : null;
    const nota = linea ? linea.nota : '';
    const sugeridas = ['Frijol','Espagueti','Huevo','Sin Ensalada','Doble Arroz','Solo Maduro','Solo Papas'];
    const coccion = ['Término Azul','Término Medio','Tres Cuartos','Bien Asado','Sin Sal','Sin Picante'];
    const ensaladas = ['Ensalada de cebolla y tomate','Ensalada de remolacha','Ensalada agridulce','Ensalada de repollo','Ensalada de lechuga'];
    const jugos = ['Tomate','Guayaba','Tropical','Piña','Curuba','Guarapo','Claro','Mazamorra','Mango','Banano'];
    const sopas = ['Sopa del día','Menudencia','Pescado'];

    const close = UI.modal({
      title:(linea ? 'Editar ' : '') + p.nombre, size:'lg',
      body:'<div class="row" style="margin-bottom:9px"><span class="eyebrow">Paso 1 · elige la carne</span>' +
          '<span class="dim right" style="font-size:11.5px">el precio cambia según la carne</span></div>' +
        '<div class="bandeja-carnes">' + carnes.map(o => {
          const disp = DB.available(o.m.id);
          const falta = disp < (p.gramos || 1);
          return '<button class="bcarne ' + (falta?'off':'') + '" data-c="' + o.m.id + '"' +
            ' data-precio="' + o.precio + '"' + (falta?' disabled':'') + '>' +
            '<span class="ic">' + Glifo.de({ico:'', nombre:o.m.nombre, cat:'c_car'}, 26) + '</span>' +
            '<b>' + Util.esc(o.m.nombre) + '</b>' +
            '<span class="bprecio">' + Util.money(o.precio) + '</span>' +
            '<span class="dim">' + (falta ? 'agotada' : Util.cantIns(Math.max(0,disp), o.m)) + '</span>' +
          '</button>';
        }).join('') + '</div>' +
        '<div class="eyebrow" style="margin:16px 0 7px">Paso 2 · indicaciones para cocina</div>' +
        '<textarea class="inp" id="bNota" rows="2" ' +
          'placeholder="Escribe la indicación o selecciona las opciones rápidas">' + Util.esc(nota) + '</textarea>' +
        '<div style="margin-top:8px"><span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Sopa</span>' +
        '<div class="chips wrap" style="margin-top:4px">' +
          sopas.map(x => '<button class="chip" data-s="Sopa: ' + Util.esc(x) + '">' + x + '</button>').join('') + '</div></div>' +
        '<div style="margin-top:8px"><span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Término de cocción</span>' +
        '<div class="chips wrap" style="margin-top:4px">' +
          coccion.map(x => '<button class="chip" data-s="' + Util.esc(x) + '">' + x + '</button>').join('') + '</div></div>' +
        '<div style="margin-top:8px"><span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Acompañamientos</span>' +
        '<div class="chips wrap" style="margin-top:4px">' +
          sugeridas.map(x => '<button class="chip" data-s="' + Util.esc(x) + '">' + x + '</button>').join('') + '</div></div>' +
        '<div style="margin-top:8px"><span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Ensaladas</span>' +
        '<div class="chips wrap" style="margin-top:4px">' +
          ensaladas.map(x => '<button class="chip" data-s="' + Util.esc(x) + '">' + x + '</button>').join('') + '</div></div>' +
        '<div style="margin-top:8px"><span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Jugo incluido</span>' +
        '<div class="chips wrap" style="margin-top:4px">' +
          jugos.map(x => '<button class="chip" data-s="Jugo de ' + Util.esc(x) + '">' + x + '</button>').join('') + '</div></div>' +
        '<p class="dim" style="font-size:11.5px;margin-top:8px">Escribe o selecciona las indicaciones. Todo se envía a cocina con la comanda. ' +
          'Solo la carne descuenta del inventario.</p>' +
        '<div class="bandeja-total" id="bTotal"></div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn pri" id="bOk">' + (linea ? 'Guardar' : 'Agregar al pedido') + '</button>' +
             (Auth.can('comandas') ? '<button class="btn gold" id="bEnviar" ' +
               'title="Agrega y manda la comanda a cocina">' + Util.ico('fire') + ' Y enviar a cocina</button>' : ''),
      onMount(ov){
        const total = ov.querySelector('#bTotal');
        const marca = () => {
          ov.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === sel));
          const o = carnes.find(x => x.m.id === sel);
          total.innerHTML = o
            ? '<span>' + Util.esc(p.nombre) + ' con ' + Util.esc(o.m.nombre) + '</span>' +
              '<b class="num">' + Util.money(o.precio) + '</b>'
            : '<span class="dim">Elige la carne para ver el precio</span>';
        };
        ov.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { sel = b.dataset.c; marca(); });
        ov.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
          const ta = ov.querySelector('#bNota');
          const val = b.dataset.s;
          const actual = ta.value || '';
          const yaEsta = actual.split(',').map(s=>s.trim()).some(s => s.toLowerCase() === val.toLowerCase());
          if (yaEsta){
            const ok = await UI.confirm(
              '«' + val + '» ya está en las indicaciones. ¿Deseas agregarlo de nuevo?',
              {ok:'Sí, agregar otra vez', title:'Indicación duplicada'});
            if (!ok) return;
          }
          ta.value = (actual ? actual + ', ' : '') + val;
          requestAnimationFrame(() => {
            ta.focus();
            const len = ta.value.length;
            ta.setSelectionRange(len, len);
            ta.scrollTop = ta.scrollHeight;
          });
        });
        marca();
        /* CORRECCIÓN DE RAÍZ (comanda con el valor duplicado): "Agregar al
           pedido" y "Y enviar a cocina" cerraban el modal y llamaban a
           confirmar() sin ningún cerrojo. En pantallas táctiles (tablet/
           POS) un mismo toque puede disparar tanto "touchend" como
           "click" sobre el mismo botón, o el operario alcanza a tocar dos
           veces antes de que el modal desaparezca; cada disparo volvía a
           ejecutar POS.add(...) (o sumaba de nuevo el precio a la línea
           editada) y, si era "Y enviar a cocina", además duplicaba el
           envío a POS.sendKitchen(), quedando el plato dos veces en el
           carrito/la comanda y su valor sumado dos veces al total. Con
           _confirmado, solo el primer disparo hace algo; los siguientes
           se ignoran. */
        let _confirmado = false;
        const confirmar = (enviar) => {
          if (_confirmado) return;          // idempotente: un solo disparo
          if (!sel) return UI.toast('Elige la carne de la bandeja.','warn');
          _confirmado = true;
          const texto = (ov.querySelector('#bNota').value||'').trim();
          // El modal se cierra primero: al enviar a cocina se abre el de la
          // comanda, y no deben quedar dos ventanas encima.
          close();
          if (linea){
            const m = DB.meat(sel);
            linea.carne = sel; linea.carneNombre = DB.rotulo(m); linea.nota = texto;
            linea.precio = POS.precioBandeja(p, sel);   // el precio sigue a la carne
            POS.paint();
          } else {
            POS.add(p.id, {carne:sel, nota:texto});
          }
          if (enviar) setTimeout(() => POS.sendKitchen(), 0);
        };
        ov.querySelector('#bOk').onclick = () => confirmar(false);
        const env = ov.querySelector('#bEnviar');
        if (env) env.onclick = () => confirmar(true);
      }
    });
  },
  inc(lid, d){
    const it = this.cart.find(i=>i.lid===lid); if(!it) return;
    if (d > 0){
      const p = DB.product(it.pid);
      if (p && p.carne && DB.available(p.carne) < p.gramos)
        return UI.toast('Inventario insuficiente para una porción más.','warn');
      /* El "+" del carrito también pregunta: es el mismo gesto de repetir
         un plato, y en pantalla táctil es el más fácil de tocar de más. */
      if (DB.d.config.confirmarRepetir !== false) return this.confirmarRepetir(it);
    }
    it.qty += d;
    if (it.qty <= 0) this.cart = this.cart.filter(i=>i.lid!==lid);
    this.paint();
  },
  remove(lid){ this.cart = this.cart.filter(i=>i.lid!==lid); this.paint(); },
  async clear(ask){
    if (!this.cart.length) return;
    if (ask && !(await UI.confirm('Se descartarán ' + this.cart.length + ' líneas del pedido en curso.', {ok:'Cancelar venta', danger:true, title:'Cancelar venta'}))) return;
    DB.log('venta:cancelada', this.cart.length + ' líneas descartadas antes de cobrar');
    this.reset();
    Router.render();
  },
  note(lid){
    const it = this.cart.find(i=>i.lid===lid); if(!it) return;
    const chipsCoccion = ['Término Azul','Término Medio','Tres Cuartos','Bien Asado','Sin Sal','Sin Picante'];
    const chipsAcomp = ['Frijol','Espagueti','Huevo','Sin Ensalada','Doble Arroz','Solo Maduro','Solo Papas'];
    const chipsEnsalada = ['Ensalada de cebolla y tomate','Ensalada de remolacha','Ensalada agridulce','Ensalada de repollo','Ensalada de lechuga'];
    const p = DB.product(it.pid);
    const esDesayuno = p && ((DB.cat(p.cat)||{}).id === 'c_des' || /desayuno/i.test((DB.cat(p.cat)||{}).nombre));
    const jugos = ['Tomate','Guayaba','Tropical','Piña','Curuba','Guarapo','Claro','Mazamorra','Mango','Banano'];
    const sopas = ['Sopa del día','Menudencia','Pescado'];
    const excluirCarnes = ['tilapia','punta de anca','churrasco','trucha',
      'picada para 2','picada para dos','picada para 4','picada para cuatro',
      'sopa del dia','sopa del día','calentado',
      'salchichas zenu','salchichas zenú','salchicha zenu','salchicha zenú',
      'lonchitas','lonchita','arepa tela','ensalada','desayuno sencillo'];
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const carnesDesayuno = esDesayuno
      ? DB.meats().filter(m => (m.tipo||'carne')==='carne' && !excluirCarnes.some(e=>norm(m.nombre).includes(norm(e)))).map(m=>m.nombre)
      : [];

    /* ── ARQUITECTURA DEFINITIVA: array temporal independiente ──────────
       Se trabaja sobre una COPIA LOCAL de nota y adiciones.
       it.nota e it.adiciones SOLO se actualizan al pulsar Guardar.
       Esto elimina cualquier problema de mutación prematura, referencia
       obsoleta o pérdida de datos por repintado del carrito. */
    let notaTmp = it.nota || '';
    let adicionesTmp = Array.isArray(it.adiciones) ? it.adiciones.slice() : [];

    /* ── Constructor de grupos de chips ── */
    const grpChips = (titulo, items) =>
      '<div style="margin-top:10px">' +
        '<span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">' + titulo + '</span>' +
        '<div class="chips wrap" style="margin-top:5px">' +
          items.map(c => '<button type="button" class="chip" data-chip="' + Util.esc(c) + '">' + Util.esc(c) + '</button>').join('') +
        '</div></div>';

    /* Chips de adiciones por defecto del plato (con precio definido).
       INTERVENCIÓN: ahora se muestran dentro de la misma cuadrícula amplia
       de "Adiciones con cargo" (icono + nombre), no como chips de texto. */
    const adDefHTML = (p && p.adicionesDefault && p.adicionesDefault.length)
      ? p.adicionesDefault.map(a =>
          '<button type="button" class="ad-chip" data-adchip="' + Util.esc(a.nombre) + '" data-adprecio="' + (Number(a.precio)||0) + '">' +
          '<span class="ad-chip-ico">⊕</span><span>' + Util.esc(a.nombre) + '</span></button>').join('')
      : '';

    const bodyHTML =
      '<label style="display:block;font-size:12px;color:var(--ash-dim);margin-bottom:5px">Indicación para cocina</label>' +
      '<textarea id="nota-ta" class="inp" rows="3" style="width:100%;resize:vertical" ' +
        'placeholder="Escribe la indicación o selecciona opciones rápidas">' + Util.esc(notaTmp) + '</textarea>' +
      grpChips('Sopa', sopas) +
      grpChips('Cocción', chipsCoccion) +
      grpChips('Acompañamientos', chipsAcomp) +
      grpChips('Ensaladas', chipsEnsalada) +
      (esDesayuno && carnesDesayuno.length ? grpChips('Carne', carnesDesayuno.map(c=>'Carne: '+c)) : '') +
      grpChips('Jugo incluido', jugos.map(c=>'Jugo de '+c)) +
      (esDesayuno ? grpChips('Bebida incluida', ['Café con Leche','Chocolate con Leche','Chocolate sin Leche','Tinto'].map(c=>'Bebida: '+c)) : '') +
      '<hr style="border-color:var(--line);margin:12px 0 8px">' +
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">' +
        '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)">⊕ Adiciones con cargo — toca para agregar</span>' +
      '</div>' +
      /* INTERVENCIÓN: espacio amplio en cuadrícula (ver .ad-grid en <style>)
         para ver de un vistazo todas las adiciones disponibles. Cada botón
         solo lleva el icono y el nombre; la lógica de selección
         (data-adchip / data-adprecio) queda exactamente igual. */
      '<div class="ad-grid">' +
        adDefHTML +
        '<button type="button" class="ad-chip" data-adchip="Aguacate"><span class="ad-chip-ico">🥑</span><span>Aguacate</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Papas Fritas"><span class="ad-chip-ico">🍟</span><span>Papas Fritas</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Tajadas Maduro"><span class="ad-chip-ico">🍌</span><span>Tajadas Maduro</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Patacón"><span class="ad-chip-ico">🫓</span><span>Patacón</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Sopa"><span class="ad-chip-ico">🍲</span><span>Sopa</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Jugo"><span class="ad-chip-ico">🧃</span><span>Jugo</span></button>' +
        '<button type="button" class="ad-chip" data-adchip="Huevo"><span class="ad-chip-ico">🍳</span><span>Huevo</span></button>' +
      '</div>' +
      '<div class="row" style="gap:6px;margin-top:8px">' +
        '<input class="inp" id="ad-nombre" placeholder="Nombre de la adición" style="flex:2">' +
        '<input class="inp num" id="ad-precio" type="number" min="0" step="500" placeholder="Precio ($0 = sin cargo)" style="flex:1">' +
        '<button type="button" id="ad-btn" style="' +
          'display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;' +
          'background:linear-gradient(180deg,#3EB86A 0%,#2E9A55 60%,#22753E 100%);' +
          'color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;white-space:nowrap;' +
          'box-shadow:0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);' +
          'text-shadow:0 1px 1px rgba(0,0,0,.35);transition:.12s;' +
          '" onmousedown="this.style.transform=\'translateY(2px)\';this.style.boxShadow=\'0 1px 0 #1A5C2E,0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)\'"' +
          ' onmouseup="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)\'"' +
          ' onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)\'">' +
          '＋ Agregar Adición' +
        '</button>' +
      '</div>' +
      '<div id="adiciones-list" style="margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden"></div>';

    const close = UI.modal({
      title: 'Nota · ' + it.nombre, size:'sm nota-xl',
      body: bodyHTML,
      footer: '<button type="button" class="btn" data-close>Cancelar</button>' +
              /* INTERVENCIÓN: botón "Guardar y Nuevo Pedido" — naranja, en
                 alto relieve, mismo tamaño y estilo de botón que "Guardar y
                 enviar a cocina" (misma clase base .btn, solo cambia el
                 color). Va primero; guarda la nota/adiciones del plato
                 actual (misma lógica de ejecutarGuardar) y de inmediato
                 redirige a la mesera al módulo Vender, sección de platos
                 con la categoría "Todo", para continuar con un nuevo plato. */
              '<button type="button" class="btn" id="nota-nuevo-pedido" style="' +
                'background:linear-gradient(180deg,#FF9A3D 0%,#FB7B1E 55%,#E35F05 100%);' +
                'border:1px solid #E35F05;color:#fff;font-weight:800;' +
                'box-shadow:0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);' +
                'text-shadow:0 1px 1px rgba(0,0,0,.35);transition:.12s" ' +
                'onmousedown="this.style.transform=\'translateY(2px)\';this.style.boxShadow=\'0 1px 0 #B8460A,0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)\'" ' +
                'onmouseup="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
                'onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
                'title="Guarda este plato y de inmediato lleva al módulo Vender para continuar con un nuevo plato">' +
                Util.ico('plus') + ' Guardar y Nuevo Pedido</button>' +
              (POS.cart.length && Auth.can('comandas')
                ? '<button type="button" class="btn pri" id="nota-enviar" title="Guarda y manda la comanda a cocina">' +
                  Util.ico('fire') + ' Guardar y enviar a cocina</button>'
                : ''),
      onMount(ov, cerrar){
        const ta = ov.querySelector('#nota-ta');
        const adBox = ov.querySelector('#adiciones-list');

        /* ── Render de la lista de adiciones temporales ── */
        const paintAd = () => {
          adBox.innerHTML = adicionesTmp.length
            ? adicionesTmp.map((a, i) =>
                '<div class="row" style="gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center">' +
                  '<span style="flex:1;font-size:13px;font-weight:600">' + Util.esc(a.nombre) + '</span>' +
                  '<b class="num" style="font-size:13px;white-space:nowrap;color:var(--brass)">' +
                    (a.precio > 0 ? '+ ' + Util.money(a.precio) : '<span class="dim">sin cargo</span>') +
                  '</b>' +
                  '<button type="button" class="btn sm ghost" data-addel="' + i + '" ' +
                    'style="color:var(--ash-dim);padding:2px 6px;flex:none" title="Quitar">✕</button>' +
                '</div>').join('')
            : '<div class="dim" style="padding:10px 8px;font-size:12px;text-align:center">Sin adiciones — toca un chip para agregar</div>';
        };
        /* paintAd() inicial se llama después de definir actualizarChips (más abajo) */

        /* ── Función interna: agregar adición al array temporal ──
           Precio 0 es válido (indica sin cargo adicional).
           Solo bloquea si el nombre está vacío. */
        /* Actualiza el estado visual "on" de los chips según adicionesTmp.
           Un chip queda marcado (on) si ya fue agregado a la lista de adiciones. */
        const actualizarChips = () => {
          ov.querySelectorAll('[data-adchip]').forEach(b => {
            const nom = b.dataset.adchip;
            const yaEsta = adicionesTmp.some(a => a.nombre.toLowerCase() === nom.toLowerCase());
            b.classList.toggle('on', yaEsta);
            b.style.opacity = yaEsta ? '0.55' : '';
            b.title = yaEsta ? nom + ' ya agregado' : '';
          });
        };

        const agregarAdicion = (nom, pre) => {
          nom = String(nom||'').trim();
          if (!nom) return;
          pre = Math.max(0, Number(pre)||0);
          /* Si ya existe: quitarlo (toggle) en lugar de mostrar error */
          const idx = adicionesTmp.findIndex(a => a.nombre.toLowerCase() === nom.toLowerCase());
          if (idx >= 0){
            adicionesTmp.splice(idx, 1);
            paintAd();
            actualizarChips();
            return;
          }
          adicionesTmp.push({nombre:nom, precio:pre});
          paintAd();
          actualizarChips();
        };

        /* ── Chips de indicaciones de cocina (texto libre en textarea) ── */
        ov.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', async () => {
          const val = b.dataset.chip;
          const actual = ta.value || '';
          const yaEsta = actual.split(',').map(s=>s.trim()).some(s=>s.toLowerCase()===val.toLowerCase());
          if (yaEsta){
            const ok = await UI.confirm(
              '«' + val + '» ya está en las indicaciones. ¿Deseas agregarlo de nuevo?',
              {ok:'Sí, agregar otra vez', title:'Indicación duplicada'});
            if (!ok) return;
          }
          ta.value = (actual ? actual + ', ' : '') + val;
          ta.scrollTop = ta.scrollHeight;
        }));

        /* ── Chips de adiciones rápidas ──
           Al tocar un chip: pre-rellena el nombre en el campo de texto
           y mueve el foco al campo de precio para que el usuario lo ingrese
           manualmente. El botón verde "Agregar Adición" confirma la acción.
           INTERVENCIÓN: se usa la clase propia "ad-sel" (resaltado dorado,
           bien visible) para marcar el chip que se está seleccionando, sin
           tocar la clase "on" que actualizarChips() usa para las adiciones
           ya agregadas — así ambas señales visuales conviven sin pisarse. */
        ov.querySelectorAll('[data-adchip]').forEach(b => b.addEventListener('click', () => {
          const nom = b.dataset.adchip;
          const inpNom = ov.querySelector('#ad-nombre');
          const inpPre = ov.querySelector('#ad-precio');
          /* Pre-rellenar nombre y limpiar precio para que el usuario lo ingrese */
          inpNom.value = nom;
          inpPre.value = '';
          inpPre.focus();
          /* Marcar chip visualmente como seleccionado (nombre ya en el campo) */
          ov.querySelectorAll('[data-adchip]').forEach(c => c.classList.remove('ad-sel'));
          b.classList.add('ad-sel');
        }));

        /* ── Botón Agregar Adición (verde) ── */
        ov.querySelector('#ad-btn').addEventListener('click', () => {
          const nom = (ov.querySelector('#ad-nombre').value||'').trim();
          const pre = Math.max(0, Number(ov.querySelector('#ad-precio').value)||0);
          if (!nom) return UI.toast('Escribe el nombre de la adición.','warn');
          agregarAdicion(nom, pre);  /* ya llama paintAd + actualizarChips */
          ov.querySelector('#ad-nombre').value = '';
          ov.querySelector('#ad-precio').value = '';
          /* Limpiar resaltado de selección rápida al agregar (ya quedó
             reflejado por actualizarChips con la clase "on" si corresponde) */
          ov.querySelectorAll('[data-adchip]').forEach(c => c.classList.remove('ad-sel'));
        });

        /* ── Eliminar adición de la lista temporal ── */
        adBox.addEventListener('click', e => {
          const del = e.target.closest('[data-addel]');
          if (!del) return;
          adicionesTmp.splice(Number(del.dataset.addel), 1);
          paintAd();
          actualizarChips();
        });

        /* ── Pintar estado inicial: lista de adiciones ya guardadas + chips activos ── */
        paintAd();
        actualizarChips();

        /* ── GUARDAR: corrección definitiva de causa raíz ────────────────
           1. Flag _guardado evita doble ejecución sin usar {once:true}.
           2. Se asignan los datos AL OBJETO del carrito PRIMERO.
           3. Luego se cierra el modal (ov.remove()).
           4. Finalmente se repinta el carrito y se persiste la sesión.
           Esto garantiza que POS.cart ya tiene los datos correctos cuando
           paintCart() reconstruye el DOM, y que el modal ya no existe
           cuando Sesion.guardar() dispara su setTimeout de 400 ms. ── */
        let _guardado = false;
        const ejecutarGuardar = (enviar) => {
          if (_guardado) return;          // idempotente: un solo disparo
          _guardado = true;

          /* 1. Capturar valores desde el DOM del modal (aún vivo) */
          const notaFinal    = (ta.value || '').trim();
          const adicionesFinal = adicionesTmp.slice();  // copia profunda

          /* 2. Escribir en el objeto del carrito (referencia directa) */
          it.nota      = notaFinal;
          it.adiciones = adicionesFinal;

          /* 3. Cerrar el modal ANTES de repintar — usa 'cerrar' (parámetro de onMount),
                 NO 'close' (variable externa aún undefined cuando onMount ejecuta) */
          cerrar();

          /* 4. Repintar carrito con los datos ya escritos en POS.cart */
          POS.paintCart();
          // En pantallas pequeñas el carrito es una hoja: si queda cerrada, el
          // botón de enviar a cocina no se ve y parece que no pasó nada.
          if (!enviar && window.innerWidth <= 860){
            const cajon = document.getElementById('cart');
            if (cajon && !cajon.classList.contains('open')) cajon.classList.add('open');
          }

          /* 5. Persistir en sesión */
          Sesion.guardar();

          /* 6. Toast descriptivo de confirmación */
          const totalAd = adicionesFinal.reduce((s,a) => s + a.precio, 0);
          const partes  = adicionesFinal.map(a =>
            a.nombre + (a.precio > 0 ? ' +$' + Util.money(a.precio, false) : '')
          );
          const resumen = partes.length ? ': ' + partes.join(', ') : '';
          UI.toast('✓ Guardado' + resumen + (totalAd > 0 ? ' · Total adiciones: +$' + Util.money(totalAd, false) : ''),
            'ok', enviar ? 1400 : 2600);

          /* 7. Resalte inmediato de la línea, sin esperas */
          const el = document.querySelector('[data-linea="' + it.lid + '"]');
          if (el) {
            el.style.transition = 'background .2s';
            el.style.background = 'rgba(62,155,98,.22)';
            setTimeout(() => { el.style.background = ''; }, 1400);
          }

          /* 8. Si se pidió, la comanda sale a cocina con esto ya incorporado.
                Se encadena en el siguiente ciclo para que el modal de la nota
                haya desaparecido antes de que se abra el de la comanda. */
          if (enviar) setTimeout(() => POS.sendKitchen(), 0);
        };

        const btnSave = ov.querySelector('#nota-save'); if (btnSave) btnSave.addEventListener('click', () => ejecutarGuardar(false));
        const directo = ov.querySelector('#nota-enviar');
        if (directo) directo.addEventListener('click', () => ejecutarGuardar(true));

        /* INTERVENCIÓN (corrección): "Guardar y Nuevo Pedido" — primero
           GARANTIZA el guardado del pedido actual (reutiliza exactamente
           ejecutarGuardar(false), la misma lógica probada del botón
           Guardar). Luego, para asegurar la salida total con un solo
           clic —incluida esta nota y cualquier otro modal que pudiera
           quedar abierto (p. ej. el de mesa/pedido)— se fuerza el cierre
           de todos los modales con UI.closeAll() antes de redirigir de
           forma automática al módulo Vender para escoger un nuevo plato. */
        const btnNuevoPedido = ov.querySelector('#nota-nuevo-pedido');
        if (btnNuevoPedido) btnNuevoPedido.addEventListener('click', () => {
          ejecutarGuardar(false);
          UI.closeAll();
          POS.nuevoPedido();
        });
      }
    });
  },
  products(){
    const q = Util.norm(this.q);
    return DB.prods().filter(p => {
      if (!p.activo) return false;
      if (this.cat !== 'all' && p.cat !== this.cat) return false;
      if (!q) return true;
      return Util.norm(p.nombre).includes(q) || Util.norm(p.codigo).includes(q) || Util.norm(p.desc).includes(q);
    });
  },
