  },

  /** Conteo físico: se escriben todas las existencias reales de una vez, con una
      sola autorización. Es la forma normal de cuadrar el inventario de la semana. */
  async conteo(){
    const lista = this.lista();
    if (!lista.length) return UI.toast('No hay insumos que contar.','warn');
    const autorizo = await this.permiso('Registrar un conteo de inventario', lista.length + ' insumos a revisar');
    if (!autorizo) return;

    const close = UI.modal({
      title:'Conteo rápido', size:'lg',
      body:'<p style="font-size:13.5px;line-height:1.6">Escribe lo que hay <b>de verdad</b> en la nevera y en la barra. ' +
        'Lo que dejes en blanco no se toca. La diferencia queda registrada como ajuste de conteo.</p>' +
        '<div class="card pad0" style="margin-top:12px"><div class="tbl-wrap"><table><thead><tr>' +
          '<th>Insumo</th><th class="n">Según el sistema</th><th class="n">Contado</th><th class="n">Diferencia</th>' +
        '</tr></thead><tbody>' +
        lista.map(m => {
          const u = m.unidad||'g';
          return '<tr><td><div style="font-weight:600">' + Util.esc(DB.rotulo(m)) + '</div>' +
            '<div class="dim" style="font-size:11px">' + (m.tipo === 'bebida' ? 'envases' : 'porciones') + '</div></td>' +
            '<td class="n">' + Util.cantIns(m.gramos, m) + '</td>' +
            '<td class="n"><input class="inp num" type="number" data-c="' + m.id + '" ' +
              'style="width:110px;text-align:right" placeholder="\u2014"></td>' +
            '<td class="n" data-d="' + m.id + '" style="min-width:96px">\u2014</td></tr>';
        }).join('') + '</tbody></table></div></div>' +
        '<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)">' +
          '<span class="mut" style="font-size:12.5px">Insumos con diferencia</span>' +
          '<b class="num right" id="ctNum">0</b></div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn ghost" id="ctCeros">Marcar agotados los vacíos</button>' +
             '<button class="btn pri" id="ctOk">Guardar conteo</button>',
      onMount(ov){
        const pinta = () => {
          let n = 0;
          lista.forEach(m => {
            const inp = ov.querySelector('[data-c="' + m.id + '"]');
            const celda = ov.querySelector('[data-d="' + m.id + '"]');
            if (inp.value === ''){ celda.textContent = '\u2014'; celda.style.color = ''; return; }
            const dif = Math.round(Number(inp.value)) - m.gramos;
            if (dif !== 0) n++;
            celda.textContent = (dif > 0 ? '+' : '') + Util.cantIns(dif, m);
            celda.style.color = dif === 0 ? 'var(--ash-dim)' : (dif > 0 ? 'var(--ok)' : 'var(--ember-hi)');
          });
          ov.querySelector('#ctNum').textContent = n;
        };
        ov.querySelectorAll('[data-c]').forEach(i => i.oninput = pinta);
        ov.querySelector('#ctCeros').onclick = () => {
          ov.querySelectorAll('[data-c]').forEach(i => { if (i.value === '') i.value = '0'; });
          pinta();
        };
        ov.querySelector('#ctOk').onclick = async () => {
          const cambios = [];
          lista.forEach(m => {
            const inp = ov.querySelector('[data-c="' + m.id + '"]');
            if (inp.value === '') return;
            const nuevo = Math.max(0, Math.round(Number(inp.value)));
            if (nuevo !== m.gramos) cambios.push({m, antes:m.gramos, nuevo});
          });
          if (!cambios.length){ close(); return UI.toast('No había diferencias que registrar.','info'); }
          const faltantes = cambios.filter(c => c.nuevo < c.antes).length;
          if (!(await UI.confirm('Se ajustarán ' + cambios.length + ' insumos' +
            (faltantes ? ', ' + faltantes + ' de ellos hacia abajo' : '') +
            '. Queda todo registrado en auditoría a nombre de ' + autorizo.nombre + '.',
            {ok:'Guardar conteo'}))) return;
          cambios.forEach(({m, antes, nuevo}) => {
            m.gramos = nuevo; m.act = Util.now();
            DB.log('inventario:conteo', m.nombre + ' \u00b7 ' + Util.cantIns(antes, m) + ' \u2192 ' +
              Util.cantIns(nuevo, m) + ' \u00b7 autorizó ' + autorizo.nombre, m.id);
            Sync.enqueue('meats','update', m);
          });
          DB.touch('meats');
          close();
          UI.toast('Conteo guardado: ' + cambios.length + ' insumos ajustados.','ok', 4600);
          Router.render();
        };
      }
    });
  },

  /** Limpieza: quita el inventario a los platos que ya no deben llevarlo.
      El sistema solo controla carnes y bebidas en envase; lo que se prepara
      en cocina se vende sin descontar existencias. */
  async limpiarPreparados(){
    const conInv = DB.prods().filter(p => p.carne);
    const sobran = conInv.filter(p => {
      const m = DB.meat(p.carne);
      // Un plato cuyo insumo se llama igual que él es de los que se crearon
      // automáticamente cuando el inventario cubría todo.
      return m && m.tipo === 'bebida' && Util.norm(m.nombre) === Util.norm(p.nombre) &&
        !DB.purchases().some(c => c.meatId === m.id);
    });
    if (!sobran.length) return UI.toast('No hay nada que limpiar: el inventario ya es solo de carnes y bebidas.','ok', 4600);

    const autorizo = await this.permiso('Limpiar el inventario',
      sobran.length + ' entradas creadas automáticamente');
    if (!autorizo) return;
    if (!(await UI.confirm('Se quitará el inventario a ' + sobran.length + ' plato(s) preparados en cocina ' +
      '(' + sobran.slice(0,4).map(p=>p.nombre).join(', ') + (sobran.length>4?'…':'') + ') ' +
      'y se eliminarán sus entradas del inventario. Las carnes y las bebidas no se tocan.',
      {ok:'Limpiar', danger:true}))) return;

    let quitados = 0;
    sobran.forEach(p => {
      const m = DB.meat(p.carne);
      p.carne = null; p.gramos = 0; p.act = Util.now();
      Sync.enqueue('products','update', p);
      if (m && !DB.prods().some(x => x.carne === m.id)){
        m.borrado = true; m.act = Util.now();
        Sync.enqueue('meats','update', m);
        quitados++;
      }
    });
    DB.touch('products','meats');
    DB.log('inventario:limpiar', quitados + ' entradas retiradas · autorizó ' + autorizo.nombre);
    UI.toast(quitados + ' entradas retiradas. El inventario quedó solo con carnes y bebidas.','ok', 5000);
    Router.render();
  },
  /** Puerta de administrador para tocar existencias. Crear no la pide: no hay
      nada que perder.

      El cajero queda exento: es quien recibe la mercancía y cuadra el conteo
      varias veces al día, y pedirle una clave ajena en cada ajuste solo lleva
      a que termine usando el perfil del administrador para todo, que es peor.
      Sigue quedando registrado en la bitácora quién hizo cada movimiento. */
  async permiso(motivo, detalle){
    if (!DB.d.config.claveInventario) return {nombre:(Auth.user||{}).nombre};
    /* El cajero queda exento, y solo en inventario: es quien recibe la
       mercancía y cuadra el conteo varias veces al día, y pedirle una clave
       ajena en cada ajuste acaba en que termine entrando con el perfil del
       administrador, que es bastante peor.

       Fuera de aquí nada cambia: anular una comida, borrar un gasto, tocar un
       movimiento de caja, editar una factura o recuperar un respaldo le siguen
       pidiendo autorización como a todo el mundo. */
    if ((Auth.user||{}).rol === 'cajero') return {id:Auth.user.id, nombre:Auth.user.nombre};
    return await Auth.autorizar(motivo, detalle);
  },
  async form(id){
    const m = id ? DB.meat(id) : null;
    let autorizo = null;
    if (m){
      autorizo = await this.permiso('Editar un corte del inventario',
        m.nombre + ' · ' + Util.cantIns(m.gramos, m) + ' en existencia');
      if (!autorizo) return;
    }
    UI.formModal({
      title: m ? 'Editar ' + DB.rotulo(m) : 'Nuevo producto de inventario',
      ok: m?'Guardar':'Crear',
      fields:[
        {k:'tipo', label:'Qué es', type:'select', val:m?(m.tipo||'carne'):'carne',
         opts:Views.inv.TIPOS.map(x=>({v:x.v, t:x.t})), full:true},
        {k:'nombre', label:'Nombre', val:m?m.nombre:'', req:true,
         ph:'Lomo fino, Gaseosa, Cerveza nacional'},
        {k:'presentacion', label:'Presentación', val:m?(m.presentacion||''):'',
         ph:'Porción de 350 g · 400 ml · 330 ml lata',
         hint:'En carnes, el tamaño de la porción. En bebidas, cada envase se cuenta aparte'},
        {k:'gramos', label:'Existencia actual', type:'number', val:m?m.gramos:0, min:0, req:true,
         hint:'Porciones listas en carnes; envases en bebidas'},
        {k:'minimo', label:'Mínimo de alerta', type:'number', val:m?m.minimo:0, min:0, req:true},
        {k:'costoGramo', label:'Costo unitario', type:'number', val:m?m.costoGramo:0, min:0, step:'0.01',
         hint:'Lo que cuesta una porción o un envase'}
      ],
      onSave(d, close){
        if (!String(d.nombre||'').trim()) return 'Ponle un nombre.';
        d.unidad = DB.unidadTipo(d.tipo);
        d.unidadMigrada = true;   // ya nace contado en porciones
        // Dos presentaciones de la misma bebida son productos distintos y válidos
        const igual = x => Util.norm(x.nombre) === Util.norm(d.nombre) &&
          Util.norm(x.presentacion||'') === Util.norm(d.presentacion||'');
        if (DB.meats().some(x => igual(x) && (!m || x.id !== m.id)))
          return d.tipo === 'bebida'
            ? 'Ya existe esa bebida en esa presentación.'
            : 'Ya existe un corte con ese nombre.';
        const antes = m ? {gramos:m.gramos, minimo:m.minimo, costoGramo:m.costoGramo} : null;
        const obj = Object.assign(m || {id:Util.uid('m')}, d, {act:Util.now()});
        if (!m) DB.d.meats.push(obj);
        DB.touch('meats');
        DB.log(m?'inventario:editar':'inventario:crear',
          DB.rotulo(obj) + ' · ' + Util.cantIns(obj.gramos, obj) +
          (antes && antes.gramos !== obj.gramos ? ' · existencia ' + Util.cantIns(antes.gramos, obj) +
            ' → ' + Util.cantIns(obj.gramos, obj) : '') +
          (autorizo ? ' · autorizó ' + autorizo.nombre : ''), obj.id);
        Sync.enqueue('meats', m?'update':'create', obj);
        close(); UI.toast('Corte guardado.','ok'); Router.render();
      }
    });
  },
  async adjust(id){
    const m = DB.meat(id);
    const u = m.unidad || 'g';
    const autorizo = await this.permiso('Ajustar existencias',
      m.nombre + ' · ' + Util.cantIns(m.gramos, m) + ' en existencia');
    if (!autorizo) return;
    UI.formModal({
      title:'Ajustar ' + m.nombre, ok:'Aplicar ajuste',
      extra:'<p class="dim" style="font-size:11.5px;margin-top:8px">Existencia actual: <b class="num">' +
        Util.cantIns(m.gramos, m) + '</b>. Usa valores negativos para merma o desperdicio.</p>',
      fields:[
        {k:'gramos', label:'Cantidad a ajustar (+/−) en ' +
           (m.tipo === 'bebida' ? 'envases' : 'porciones'), type:'number', val:0, req:true},
        {k:'motivo', label:'Motivo', type:'select', val:'merma', opts:[
          {v:'merma',t:'Merma o desperdicio'},{v:'conteo',t:'Corrección de conteo físico'},
          {v:'devolucion',t:'Devolución a proveedor'},{v:'consumo',t:'Consumo interno'},{v:'otro',t:'Otro'}]},
        {k:'nota', label:'Observación', val:'', full:true}
      ],
      onSave(d, close){
        if (!d.gramos) return 'Indica una cantidad distinta de cero.';
        const antes = m.gramos;
        m.gramos = Math.max(0, m.gramos + d.gramos); m.act = Util.now();
        DB.touch('meats');
        DB.log('inventario:ajuste', m.nombre + ' · ' + (d.gramos>0?'+':'') + Util.cantIns(d.gramos, m) + ' · ' + d.motivo +
          (d.nota?' · '+d.nota:'') + (autorizo && autorizo.nombre ? ' · autorizó ' + autorizo.nombre : ''), m.id);
        Sync.enqueue('meats','adjust', m);
        close(); UI.toast(m.nombre + ': ' + Util.cantIns(antes, m) + ' → ' + Util.cantIns(m.gramos, m),'ok'); Router.render();
      }
    });
  },
  async remove(id){
    const m = DB.meat(id); if (!m) return;
    // Un corte que algún plato descuenta no se puede borrar sin romper la carta.
    const usado = DB.prods().filter(p => p.carne === m.id);
    const reservado = DB.reserved(m.id);
    if (reservado > 0)
      return UI.toast('Hay ' + Util.cantIns(reservado, m) + ' de ' + m.nombre +
        ' comprometidos en comandas abiertas. Ciérralas primero.','warn', 5200);

    const uni = m.unidad || 'g';
    const autorizo = await this.permiso('Eliminar un insumo del inventario',
      m.nombre + ' · ' + Util.cantIns(m.gramos, m) + ' en existencia · valor ' + Util.money(m.gramos*(m.costoGramo||0)));
    if (!autorizo) return;
    if (!(await UI.confirm('Se elimina "' + DB.rotulo(m) + '" del inventario' +
      (m.gramos > 0 ? ', junto con ' + Util.cantIns(m.gramos, m) + ' que figuran en existencia' : '') +
      (usado.length ? '. Los ' + usado.length + ' plato(s) que lo usan (' +
        usado.slice(0,3).map(p=>p.nombre).join(', ') + (usado.length>3?'…':'') +
        ') pasarán a venderse sin descontar inventario' : '') +
      '. El histórico de ventas y compras se conserva intacto.',
      {ok:'Eliminar', danger:true, title:'Eliminar ' + m.nombre}))) return;

    usado.forEach(p => {
      p.carne = null; p.gramos = 0; p.act = Util.now();
      Sync.enqueue('products','update', p);
    });
    if (usado.length) DB.touch('products');

    m.borrado = true; m.act = Util.now();
    DB.touch('meats');
    DB.log('inventario:eliminar', DB.rotulo(m) + ' · ' + Util.cantIns(m.gramos, m) + ' en existencia' +
      (usado.length ? ' · ' + usado.length + ' platos desvinculados' : '') +
      (autorizo.nombre ? ' · autorizó ' + autorizo.nombre : ''), m.id);
    Sync.enqueue('meats','update', m);
    UI.toast('Corte eliminado del inventario.','ok');
    Router.render();
  }
};



/* --- Compras --------------------------------------------------------- */
Views.buy = {
  actions(){ return '<button class="btn pri" data-act="new">' + Util.ico('plus') + '<span>Registrar compra</span></button>'; },
  html(){
    const list = DB.purchases().slice().reverse();
    const mes = Util.monthKey(Util.today());
    const delMes = list.filter(p=>Util.monthKey(p.fecha)===mes);
    const gasto = delMes.reduce((a,p)=>a+p.total,0);
    const porTipo = {carne:0, bebida:0};
    delMes.forEach(p => { porTipo[DB.tipoDe(p.meatId)] += p.gramos; });
    const ingresado = [
      porTipo.carne ? porTipo.carne + ' porciones' : '',
      porTipo.bebida ? porTipo.bebida + ' envases' : ''
    ].filter(Boolean).join(' · ') || '—';
    const kilos = delMes.reduce((a,p)=>a+p.gramos,0);
    const prov = {};
    list.forEach(p => { prov[p.proveedor] = (prov[p.proveedor]||0) + p.total; });
    const rows = list.slice(0,60).map(p => {
      const m = DB.meat(p.meatId);
      return '<tr><td class="num">' + Util.esc(p.factura||'—') + '</td>' +
        '<td>' + Util.date(p.fecha) + '</td>' +
        '<td>' + Util.esc(p.proveedor) + '</td>' +
        '<td>' + Util.esc(m?DB.rotulo(m):'(eliminado del inventario)') + '</td>' +
        '<td class="n">' + Util.cantIns(p.gramos, m) + '</td>' +
        '<td class="n">' + Util.money(p.costoGramo) + '</td>' +
        '<td class="n">' + Util.money(p.total) + '</td>' +
        '<td class="n"><button class="btn sm ghost" data-edit="' + p.id + '">Editar</button>' +
        '<button class="btn sm ghost" data-del="' + p.id + '" style="color:var(--ash-dim)">Eliminar</button></td></tr>';
    });
    return '<div class="view-head"><div><div class="eyebrow">Entradas de mercancía</div><h2>Compras</h2></div></div>' +
      '<div class="grid g-kpi" style="margin-bottom:14px">' +
        UI.kpi('Compras del mes', Util.money(gasto), delMes.length + ' facturas registradas') +
        UI.kpi('Mercancía ingresada', ingresado, 'En el mes en curso') +
        UI.kpi('Costo medio', Util.money(kilos ? gasto/kilos : 0), 'Por unidad de medida, ponderado') +
        UI.kpi('Proveedores', String(Object.keys(prov).length), Object.keys(prov).slice(0,2).join(', ') || 'Sin registros') +
      '</div>' +
      '<div class="card pad0"><div class="card-h"><h3>Historial de compras</h3>' +
        '<button class="btn sm right" data-exp="compras">' + Util.ico('down') + ' CSV</button></div>' +
        UI.table([{t:'Factura'},{t:'Fecha'},{t:'Proveedor'},{t:'Corte'},{t:'Cantidad',n:1},{t:'Costo/g',n:1},{t:'Total',n:1},{t:'',n:1}], rows,
          {emptyTitle:'Sin compras registradas', emptyMsg:'Registra la primera entrada de carne para alimentar el inventario.'}) + '</div>';
  },
  mount(){
    const n = document.querySelector('[data-act=new]'); if (n) n.onclick = () => this.form();
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => this.edit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => this.remove(b.dataset.del));
    const e = document.querySelector('[data-exp]');
    if (e) e.onclick = () => Reports.csv('compras', DB.purchases().map(p=>({
      factura:p.factura, fecha:p.fecha, proveedor:p.proveedor, corte:(DB.meat(p.meatId)||{}).nombre||'',
      gramos:p.gramos, costo_gramo:p.costoGramo, total:p.total})));
  },
  form(meatId){
    const provs = Array.from(new Set(DB.purchases().map(p=>p.proveedor))).filter(Boolean);
    UI.formModal({
      title:'Registrar compra', ok:'Registrar y sumar al inventario', size:'lg',
      extra:'<p class="dim" style="font-size:11.5px;margin-top:8px">Al guardar, la cantidad se suma al insumo y su ' +
        'costo por porción o envase se recalcula como promedio ponderado.</p>',
      groups:[
        {title:'Documento', fields:[
          {k:'factura', label:'Número de factura', val:'', ph:'FV-1024'},
          {k:'fecha', label:'Fecha', type:'date', val:Util.today(), req:true},
          {k:'proveedor', label:'Proveedor', val:'', req:true, ph:'Frigorífico del Norte'}
        ]},
        {title:'Mercancía', fields:[
          {k:'meatId', label:'Qué se compró', type:'select', val:meatId||'',
           opts:DB.meats().filter(m=>(m.tipo||'carne')==='carne').map(m=>({v:m.id, t:'Carne · ' + m.nombre}))
             .concat(DB.meats().filter(m=>m.tipo==='bebida').map(m=>({v:m.id, t:'Bebida · ' + DB.rotulo(m)}))), req:true},
          {k:'gramos', label:'Cantidad comprada', type:'number', val:0, min:1, req:true,
           hint:'Porciones si es carne (10 kg porcionados a 500 g son 20); envases si es bebida'},
          {k:'total', label:'Total pagado', type:'number', val:0, min:0, req:true}
        ]},
        {title:'Notas', fields:[{k:'nota', label:'Observación', val:'', full:true}]}
      ],
      onSave(d, close){
        const m = DB.meat(d.meatId);
        if (!m) return 'Selecciona un insumo válido.';
        if (!d.gramos || d.gramos <= 0) return 'La cantidad debe ser mayor a cero.';
        const costoGramo = d.total / d.gramos;
        const valorPrev = m.gramos * (m.costoGramo||0);
        m.costoGramo = Number((((valorPrev + d.total) / (m.gramos + d.gramos)) || costoGramo).toFixed(2));
        m.gramos += d.gramos; m.act = Util.now();
        const compra = Object.assign({id:Util.uid('co'), costoGramo:Number(costoGramo.toFixed(2)),
          userId:(Auth.user||{}).id, sede:DB.d.config.sedeId, act:Util.now()}, d);
        DB.d.purchases.push(compra);
        DB.touch('purchases','meats');
        DB.log('compra:registrar', m.nombre + ' · ' + Util.cantIns(d.gramos, m) + ' · ' + Util.money(d.total) + ' · ' + d.proveedor, compra.id);
        Sync.enqueue('purchases','create', compra);
        Sync.enqueue('meats','update', m);
        close(); UI.toast('Compra registrada. ' + m.nombre + ' ahora tiene ' + Util.cantIns(m.gramos, m) + '.','ok'); Router.render();
      }
    });
    setTimeout(()=>{
      this.datalist(provs);
    }, 60);
  },
  datalist(provs){
    {
      const inp = document.querySelector('#mform [name=proveedor]');
      if (inp && provs.length){
        const dl = document.createElement('datalist'); dl.id = 'dlprov';
        dl.innerHTML = provs.map(p=>'<option value="' + Util.esc(p) + '">').join('');
        inp.after(dl); inp.setAttribute('list','dlprov');
      }
    }
  },

  /** El costo por gramo sale siempre del promedio ponderado de las compras vigentes.
      Así editar o eliminar una factura deja el costo consistente, no arrastrado. */
  recalc(meatId){
    const m = DB.meat(meatId); if (!m) return;
    const cs = DB.purchases().filter(x => x.meatId === meatId);
    const g = cs.reduce((a,x)=>a+x.gramos, 0);
    const t = cs.reduce((a,x)=>a+x.total, 0);
    if (g > 0){ m.costoGramo = Number((t/g).toFixed(2)); m.act = Util.now(); DB.touch('meats'); }
  },

  async edit(id){
    const compra = DB.purchases().find(x=>x.id===id); if (!compra) return;
    const m = DB.meat(compra.meatId);
    if (!m) return UI.toast('El corte de esa compra ya no existe en el inventario.','warn');
    const autorizo = await Views.inv.permiso('Editar una compra registrada',
      compra.proveedor + ' · ' + Util.cantIns(compra.gramos, m) + ' de ' + m.nombre + ' · ' + Util.money(compra.total));
    if (!autorizo) return;

    UI.formModal({
      title:'Editar compra ' + (compra.factura || ''), ok:'Guardar cambios', size:'lg',
      extra:'<p class="dim" style="font-size:11.5px;margin-top:8px">Si cambias la cantidad, la diferencia se suma o se resta ' +
        'del inventario de ' + Util.esc(m.nombre) + ', que hoy tiene ' + Util.cantIns(m.gramos, m) + '.</p>',
      groups:[
        {title:'Documento', fields:[
          {k:'factura', label:'Número de factura', val:compra.factura},
          {k:'fecha', label:'Fecha', type:'date', val:String(compra.fecha).slice(0,10), req:true},
          {k:'proveedor', label:'Proveedor', val:compra.proveedor, req:true}
        ]},
        {title:'Mercancía', fields:[
          {k:'gramos', label:'Cantidad (g)', type:'number', val:compra.gramos, min:1, req:true},
          {k:'total', label:'Total pagado', type:'number', val:compra.total, min:0, req:true}
        ]},
        {title:'Notas', fields:[{k:'nota', label:'Observación', val:compra.nota||'', full:true}]}
      ],
      onSave(d, close){
        if (!d.gramos || d.gramos <= 0) return 'La cantidad debe ser mayor a cero.';
        const delta = d.gramos - compra.gramos;
        if (delta < 0 && m.gramos + delta < 0)
          return 'No se puede reducir tanto: solo quedan ' + Util.cantIns(m.gramos, m) + ' en existencia.';
        const antes = {gramos:compra.gramos, total:compra.total};
        m.gramos += delta; m.act = Util.now();
        Object.assign(compra, d, {costoGramo:Number((d.total/d.gramos).toFixed(2)), act:Util.now()});
        DB.touch('purchases','meats');
        Views.buy.recalc(compra.meatId);
        DB.log('compra:editar', (compra.factura||compra.id) + ' · ' + m.nombre + ' · ' +
          Util.cantIns(antes.gramos, m) + ' → ' + Util.cantIns(compra.gramos, m) + ' · ' +
          Util.money(antes.total) + ' → ' + Util.money(compra.total) + ' · autorizó ' + autorizo.nombre, compra.id);
        Sync.enqueue('purchases','update', compra);
        Sync.enqueue('meats','update', m);
        close(); UI.toast('Compra actualizada. ' + m.nombre + ': ' + Util.cantIns(m.gramos, m) + '.','ok'); Router.render();
      }
    });
    setTimeout(()=>Views.buy.datalist(Array.from(new Set(DB.purchases().map(x=>x.proveedor))).filter(Boolean)), 60);
  },

  async remove(id){
    const compra = DB.purchases().find(x=>x.id===id); if (!compra) return;
    const m = DB.meat(compra.meatId);
    if (m && m.gramos < compra.gramos)
      return UI.toast('No se puede eliminar: de ' + Util.cantIns(compra.gramos, m) + ' solo quedan ' +
        Util.cantIns(m.gramos, m) + ' en existencia, el resto ya se vendió. Usa un ajuste de inventario.','bad', 6500);

    const autorizo = await Views.inv.permiso('Eliminar una compra registrada',
      compra.proveedor + ' · ' + Util.cantIns(compra.gramos, m) + ' · ' + Util.money(compra.total));
    if (!autorizo) return;
    if (!(await UI.confirm('Se elimina la compra de ' + Util.money(compra.total) + ' a ' + compra.proveedor +
      (m ? ' y se descuentan ' + Util.cantIns(compra.gramos, m) + ' del inventario de ' + m.nombre : '') + '.',
      {ok:'Eliminar compra', danger:true}))) return;

    if (m){ m.gramos = Math.max(0, m.gramos - compra.gramos); m.act = Util.now(); }
    compra.borrado = true; compra.act = Util.now();
    DB.touch('purchases','meats');
    this.recalc(compra.meatId);
    DB.log('compra:eliminar', (compra.factura||compra.id) + ' · ' + compra.proveedor + ' · ' +
      Util.cantIns(compra.gramos, m) + ' · ' + Util.money(compra.total) + ' · autorizó ' + autorizo.nombre, compra.id);
    Sync.enqueue('purchases','update', compra);
    if (m) Sync.enqueue('meats','update', m);
    UI.toast('Compra eliminada e inventario corregido.','ok');
    Router.render();
  }
};

/* --- Alimentación del personal --------------------------------------
   Cada persona tiene derecho a un plato al día. Se elige la carne, se
   descuenta del inventario igual que una venta, y queda bloqueado hasta
   el día siguiente. No es una venta: no entra en caja ni en la facturación,
   pero sí cuenta como costo del negocio.
   ------------------------------------------------------------------- */
Views.comidas = {
  filtros(){ return State.filters.comidas || (State.filters.comidas = {fecha:Util.today(), q:''}); },

  /** Busca un insumo del inventario por nombre, con tolerancia: primero
      exacto, luego sin plural, luego por coincidencia parcial. No filtra
      por tipo, porque un insumo migrado de una versión anterior pudo
      quedar marcado como 'bebida' solo por venderse por unidad, y aun así
      es comida del personal perfectamente válida. */
  buscarInsumo(nombre){
    const q = Util.norm(nombre||'').trim();
    if (!q) return null;
    const todos = DB.meats();
    const sinPlural = t => t.replace(/e?s$/,'');
    return todos.find(m => Util.norm(m.nombre) === q)
        || todos.find(m => sinPlural(Util.norm(m.nombre)) === sinPlural(q))
        || todos.find(m => Util.norm(m.nombre).includes(q) || q.includes(Util.norm(m.nombre)))
        || null;
  },

  /** Las carnes que la casa autoriza para el personal, ya emparejadas con
      el inventario. La fuente de verdad son los insumos elegidos por id
      (config.carnesEmpleadosIds); la lista de texto de siempre se sigue
      leyendo para no perder nada de lo ya configurado, y para dejar
      anotadas las que todavía no existen en el inventario. */
  autorizadas(){
    const ids = Array.isArray(DB.d.config.carnesEmpleadosIds) ? DB.d.config.carnesEmpleadosIds : null;
    const out = [], vistos = new Set(), vistosNombre = new Set();

    if (ids) ids.forEach(id => {
      const m = DB.meats().find(x => x.id === id);
      if (m && !vistos.has(m.id)){ vistos.add(m.id); out.push({nombre:m.nombre, insumo:m}); }
    });

    String(DB.d.config.carnesEmpleados||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(n => {
      const m = this.buscarInsumo(n);
      if (m){
        if (!vistos.has(m.id)){ vistos.add(m.id); out.push({nombre:m.nombre, insumo:m}); }
      } else {
        const k = Util.norm(n);
        if (!vistosNombre.has(k)){ vistosNombre.add(k); out.push({nombre:n, insumo:null}); }
      }
    });
    return out;
  },
  faltantes(){ return this.autorizadas().filter(x => !x.insumo); },
  /** Autorizadas que sí existen pero están en cero: no se pueden servir. */
  agotadas(){ return this.autorizadas().filter(x => x.insumo && DB.available(x.insumo.id) < 1); },

  actions(){
    return '<button class="btn" data-act="personal">' + Util.ico('team') + '<span>Empleados</span></button>' +
           '<button class="btn" data-act="carnes">Carnes autorizadas</button>' +
           '<button class="btn" data-act="reporte">' + Util.ico('print') + '<span>Reporte</span></button>' +
           '<button class="btn pri" data-act="registrar">' + Util.ico('plus') + '<span>Registrar comida</span></button>';
  },

  html(){
    const f = this.filtros();
    const activos = DB.personal();
    const delDia = DB.mealsOf(f.fecha);
    const comieron = new Set(delDia.map(m => m.userId));
    const costoDia = delDia.reduce((a,m) => a + (m.costo||0), 0);
    const mes = DB.meals().filter(m => Util.monthKey(m.fecha) === Util.monthKey(f.fecha));
    const costoMes = mes.reduce((a,m) => a + (m.costo||0), 0);
    const faltan = this.faltantes();
    const esHoy = f.fecha === Util.today();

    const horas = DB.horasBloqueoComida();
    const tarjeta = u => {
      /* Lo único que bloquea es la ventana de horas desde su última comida.
         La fecha de arriba no bloquea nada: sirve para consultar. */
      const bloqueo = DB.mealHoy(u.id);
      const reg = delDia.find(m => m.userId === u.id);
      const muestra = bloqueo || reg;          // qué plato se enseña en la tarjeta
      const libre = bloqueo ? DB.mealLibreEn(bloqueo) : null;
      const falta = bloqueo ? DB.mealFaltaTxt(bloqueo) : '';
      const badge = bloqueo
        ? '<span class="badge warn right">Bloqueado</span>'
        : (reg ? '<span class="badge ok right">Ya comió</span>'
               : '<span class="badge mut right">Pendiente</span>');
      return '<div class="card emp ' + (muestra?'comio':'') + '">' +
        '<div class="row" style="gap:11px">' +
          '<div class="avatar">' + Util.esc(u.nombre.slice(0,1)) + '</div>' +
          '<div style="min-width:0"><div style="font-weight:600;font-size:13.5px">' + Util.esc(u.nombre) + '</div>' +
          '<div class="dim" style="font-size:11px">' + Util.esc(u.cargo) +
            (u.fuente === 'empleado' ? '' : ' · con acceso') + '</div></div>' +
          badge +
        '</div>' +
        (muestra
          ? '<div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)">' +
              '<div class="row"><div>' +
                '<div style="font-size:13px;font-weight:600">' + Util.esc(muestra.carneNombre) + '</div>' +
                '<div class="dim" style="font-size:11px">' + Util.ico('clock','ico-min') + ' ' +
                  ((muestra.fecha||'').slice(0,10) === Util.today() ? Util.time(muestra.fecha) : Util.dt(muestra.fecha)) +
                  (muestra.nota ? ' · ' + Util.esc(muestra.nota) : '') + '</div>' +
              '</div>' +
              (Auth.can('anular')
                ? '<button class="btn sm ghost right" data-anular="' + muestra.id + '" style="color:var(--ash-dim)">Anular</button>'
                : '') + '</div></div>'
          : '') +
        (bloqueo
          ? '<div style="margin-top:8px;padding:7px 10px;border-radius:6px;background:rgba(212,175,95,.10);' +
              'font-size:11px;color:var(--brass-hi);line-height:1.5">' +
              Util.ico('lock','ico-min') + ' Bloqueado ' + horas + ' h — se habilita a las ' +
              Util.esc(Util.time(libre)) + (falta ? ' (faltan ' + Util.esc(falta) + ')' : '') + '</div>'
          : '<button class="btn gold wide" data-dar="' + u.id + '" style="margin-top:11px">' +
              Util.ico('plus') + ' Registrar comida</button>') +
      '</div>';
    };

    return '<div class="view-head"><div><div class="eyebrow">' +
        (esHoy ? 'Hoy' : Util.date(f.fecha)) + ' · un plato por persona cada ' + horas + ' horas</div>' +
        '<h2>Alimentación empleados</h2></div>' +
        '<div class="row right"><label class="f">Fecha de consulta' +
          '<input class="inp" type="date" id="cmFecha" value="' + f.fecha + '" max="' + Util.today() + '">' +
          '</label></div></div>' +
        (esHoy ? '' : '<div class="card" style="margin-bottom:14px;padding:10px 14px">' +
          '<div class="dim" style="font-size:12px;line-height:1.5">' +
          'Estás consultando el ' + Util.esc(Util.date(f.fecha)) + '. La fecha solo filtra lo que se muestra: ' +
          'registrar una comida siempre se hace con la hora actual, y el bloqueo depende únicamente de las ' +
          horas + ' horas desde la última comida de cada persona.</div></div>') +

      (faltan.length ? '<div class="card" style="margin-bottom:14px;border-color:var(--ember-dim)">' +
        '<div class="row"><span style="color:var(--ember-hi);display:flex">' + Util.ico('warn') + '</span>' +
        '<div><b style="font-size:13.5px">' + faltan.length + ' carne(s) sin inventario</b>' +
        '<div class="dim" style="font-size:12px">' + Util.esc(faltan.map(x=>x.nombre).join(', ')) +
        '. Sin existencia no se pueden registrar.</div></div>' +
        (Auth.can('inv') ? '<button class="btn gold right" data-act="crear">Crearlas en el inventario</button>' : '') +
        '</div></div>' : '') +

      '<div class="grid g-kpi" style="margin-bottom:14px">' +
        UI.kpi('Comieron', delDia.length + ' de ' + activos.length,
          (activos.length - comieron.size) + ' sin registrar') +
        UI.kpi('Personal', String(activos.length),
          DB.staff().filter(e=>e.activo).length + ' sin acceso a la app') +
        UI.kpi('Costo del día', Util.money(costoDia), 'Al costo por porción del inventario') +
        UI.kpi('Costo del mes', Util.money(costoMes), mes.length + ' platos en el mes') +
        UI.kpi('Porciones del mes', String(mes.length), 'Descontadas del inventario') +
      '</div>' +

      '<div class="card" style="margin-bottom:14px;padding:10px 14px"><div class="search">' + Util.ico('search') +
        '<input class="inp" id="cmBusca" placeholder="Buscar empleado por nombre…" value="' +
        Util.esc(f.q || '') + '"></div></div>' +

      '<div class="grid g-3">' + (function(){
        const q = Util.norm(f.q || '');
        const filtrados = q ? activos.filter(u => Util.norm(u.nombre).includes(q)) : activos;
        return filtrados.length ? filtrados.map(tarjeta).join('')
          : '<div class="card" style="grid-column:1/-1;text-align:center;padding:30px;color:var(--ash-dim)">' +
            Util.ico('search') + '<div style="margin-top:8px">No se encontró ningún empleado con "' + Util.esc(f.q||'') + '"</div></div>';
      })() + '</div>' +

      '<div class="card pad0" style="margin-top:14px"><div class="card-h"><h3>Últimos registros</h3>' +
        '<button class="btn sm right" data-act="exp">' + Util.ico('down') + ' CSV</button></div>' +
        UI.table([{t:'Fecha'},{t:'Persona'},{t:'Carne'},{t:'Observación'},{t:'Registró'},{t:'Costo',n:1}],
          DB.meals().slice(-60).reverse().map(m =>
            '<tr><td>' + Util.dt(m.fecha) + '</td>' +
            '<td>' + Util.esc(DB.nombrePersona(m.userId, m.userNombre)) + '</td>' +
            '<td>' + Util.esc(m.carneNombre) + '</td>' +
            '<td class="mut" style="font-size:12px">' + Util.esc(m.nota||'—') + '</td>' +
            '<td class="dim">' + Util.esc(m.registroNombre||'—') + '</td>' +
            '<td class="n">' + Util.money(m.costo||0) + '</td></tr>'),
          {emptyTitle:'Todavía no hay registros', emptyMsg:'Registra la primera comida del personal.'}) + '</div>' +

      /* INTERVENCIÓN: historial completo, oculto por defecto, que se
         despliega con un filtro de fechas (Desde/Hasta) para verificar
         registros de cualquier periodo, con opción de imprimir tanto el
         listado filtrado como la comanda de cada registro individual. */
      this.historialHTML();
  },

  historialHTML(){
    const h = this._hist || (this._hist = {abierto:false, desde:Util.today(), hasta:Util.today()});
    if (!h.abierto){
      return '<div class="card pad0" style="margin-top:14px"><div class="card-h" style="justify-content:space-between">' +
        '<h3>Historial de alimentación</h3>' +
        '<button class="btn sm ghost" id="alHistToggle">' + Util.ico('search') + ' Ver historial por fechas</button>' +
        '</div></div>';
    }
    const filtrados = DB.meals().filter(m => {
      const f = (m.fecha||'').slice(0,10);
      return f >= h.desde && f <= h.hasta;
    }).slice().reverse();
    const costoFiltrado = filtrados.reduce((a,m)=>a+(m.costo||0),0);
    return '<div class="card pad0" style="margin-top:14px">' +
      '<div class="card-h" style="justify-content:space-between;flex-wrap:wrap;gap:8px">' +
        '<h3>Historial de alimentación</h3>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
          '<label class="f" style="margin:0"><span style="font-size:11px">Desde</span><input class="inp" type="date" id="alHistDesde" value="' + h.desde + '" max="' + Util.today() + '"></label>' +
          '<label class="f" style="margin:0"><span style="font-size:11px">Hasta</span><input class="inp" type="date" id="alHistHasta" value="' + h.hasta + '" max="' + Util.today() + '"></label>' +
          (filtrados.length ? '<button class="btn sm gold" id="alHistImprimir">' + Util.ico('print') + ' Imprimir historial</button>' : '') +
          '<button class="btn sm ghost" id="alHistToggle">Ocultar</button>' +
        '</div>' +
      '</div>' +
      '<div class="dim" style="padding:8px 16px 0;font-size:12px">' + filtrados.length + ' registro(s) · Costo total ' + Util.money(costoFiltrado) + '</div>' +
      UI.table([{t:'Fecha'},{t:'Persona'},{t:'Carne'},{t:'Observación'},{t:'Registró'},{t:'Costo',n:1},{t:'',n:1}],
        filtrados.map(m =>
          '<tr><td>' + Util.dt(m.fecha) + '</td>' +
          '<td>' + Util.esc(DB.nombrePersona(m.userId, m.userNombre)) + '</td>' +
          '<td>' + Util.esc(m.carneNombre) + '</td>' +
          '<td class="mut" style="font-size:12px">' + Util.esc(m.nota||'—') + '</td>' +
          '<td class="dim">' + Util.esc(m.registroNombre||'—') + '</td>' +
          '<td class="n">' + Util.money(m.costo||0) + '</td>' +
          '<td class="n"><button class="btn sm ghost" data-hist-print="' + m.id + '" title="Imprimir esta comanda">' + Util.ico('print') + '</button></td></tr>'),
        {emptyTitle:'Sin registros en ese rango', emptyMsg:'Prueba con otro rango de fechas.'}) + '</div>';
  },

  mount(){
    const f = this.filtros();
    const fecha = document.getElementById('cmFecha');
    if (fecha) fecha.onchange = e => { f.fecha = e.target.value || Util.today(); Router.render(); };
    const busca = document.getElementById('cmBusca');
    if (busca){
      busca.oninput = Util.debounce(() => { f.q = busca.value; Router.render(); }, 180);
    }
    document.querySelectorAll('[data-dar]').forEach(b => b.onclick = () => this.registrar(b.dataset.dar));
    document.querySelectorAll('[data-anular]').forEach(b => b.onclick = () => this.anular(b.dataset.anular));
    /* INTERVENCIÓN: historial oculto con filtro de fechas */
    const hTog = document.getElementById('alHistToggle');
    if (hTog) hTog.onclick = () => { this._hist.abierto = !this._hist.abierto; Router.render(); };
    const hDesde = document.getElementById('alHistDesde');
    if (hDesde) hDesde.onchange = () => { this._hist.desde = hDesde.value || Util.today(); Router.render(); };
    const hHasta = document.getElementById('alHistHasta');
    if (hHasta) hHasta.onchange = () => { this._hist.hasta = hHasta.value || Util.today(); Router.render(); };
    const hImp = document.getElementById('alHistImprimir');
    if (hImp) hImp.onclick = () => this.imprimirHistorial();
    document.querySelectorAll('[data-hist-print]').forEach(b => b.onclick = () => {
      const reg = (DB.d.meals||[]).find(x => x.id === b.dataset.histPrint);
      if (reg) this.imprimirComanda(reg);
    });
    const bind = (a, fn) => { const b = document.querySelector('[data-act=' + a + ']'); if (b) b.onclick = fn; };
    bind('registrar', () => this.registrar());
    bind('personal', () => this.personal());
    bind('carnes', async () => {
      if (!Auth.can('admin')){
        const autorizo = await Auth.autorizar('Configurar carnes autorizadas', 'Módulo de alimentación');
        if (!autorizo) return;
      }
      this.configurar();
    });
    bind('crear', () => this.crearFaltantes());
    bind('reporte', () => this.ticketAlimentacion());
    bind('exp', () => Reports.csv('alimentacion', DB.meals().map(m => ({
      fecha:m.fecha, persona:DB.nombrePersona(m.userId, m.userNombre),
      carne:m.carneNombre, observacion:m.nota||'', registro:m.registroNombre||'', costo:m.costo||0}))));
  },

  /** Pantalla de registro: persona, carne y observación. */
  registrar(userId){
    const activos = DB.personal();
    if (!activos.length)
      return UI.toast('No hay personal activo. Agrégalo en el botón Empleados.','warn', 5200);
    const todas = this.autorizadas();
    const disponibles = todas.filter(x => x.insumo);
    if (!disponibles.length)
      return UI.toast('Ninguna de las carnes autorizadas está en el inventario. ' +
        'Ábrelas en "Carnes autorizadas" y elígelas del inventario.','warn', 6000);
    const sinInv = todas.filter(x => !x.insumo).map(x => x.nombre);
    const enCero = disponibles.filter(x => DB.available(x.insumo.id) < 1).map(x => x.insumo.nombre);
    const avisoFalta = [
      enCero.length ? 'Sin existencia: ' + Util.esc(enCero.join(', ')) + '.' : '',
      sinInv.length ? 'Autorizadas que no están en el inventario: ' + Util.esc(sinInv.join(', ')) + '.' : ''
    ].filter(Boolean).join(' ');

    let sel = userId || null;
    let carne = null;
    let cantidadHuevos = 1;
    /** Detecta si un insumo es de tipo huevo por su nombre */
    const esHuevo = (insumo) => insumo && /huevo/i.test(Util.norm(insumo.nombre || ''));
    const close = UI.modal({
      title:'Registrar comida del personal', size:'lg',
      body:'<div id="cmBody"></div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn pri" id="cmOk">Registrar y descontar</button>',
      onMount(ov){
        const box = ov.querySelector('#cmBody');
        const pinta = () => {
          const yaComio = sel ? DB.mealHoy(sel) : null;
          box.innerHTML =
            '<div class="eyebrow" style="margin-bottom:8px">¿Quién come?</div>' +
            '<select class="inp" id="cmUser">' +
              '<option value="">Elige a la persona…</option>' +
              activos.map(u => {
                const comio = DB.mealHoy(u.id);
                const libre = comio ? DB.mealLibreEn(comio) : null;
                return '<option value="' + u.id + '"' + (u.id===sel?' selected':'') + (comio?' disabled':'') + '>' +
                  Util.esc(u.nombre) + ' · ' + Util.esc(u.cargo) +
                  (comio ? ' — bloqueado hasta ' + Util.time(libre) : '') + '</option>';
              }).join('') +
            '</select>' +
            (yaComio
              ? '<div class="card" style="margin-top:12px;border-color:var(--ember-dim)">' +
                '<div class="row"><span style="color:var(--ember-hi);display:flex">' + Util.ico('lock') + '</span>' +
                '<div><b style="font-size:13.5px">Bloqueado por ' + DB.horasBloqueoComida() + ' horas</b>' +
                '<div class="dim" style="font-size:12px">' +
                Util.esc(yaComio.carneNombre) + ' a las ' + Util.time(yaComio.fecha) +
                '. Se habilita solo a las ' + Util.time(DB.mealLibreEn(yaComio)) +
                (DB.mealFaltaTxt(yaComio) ? ' (faltan ' + DB.mealFaltaTxt(yaComio) + ')' : '') +
                '</div></div></div></div>'
              : '<div class="eyebrow" style="margin:14px 0 8px">¿Qué carne? <span class="dim" ' +
                  'style="text-transform:none;letter-spacing:0">· ' + disponibles.length + ' autorizada(s)</span></div>' +
                '<div class="bandeja-carnes' + (disponibles.length > 8 ? ' compacta' : '') + '">' + disponibles.map(x => {
                  const disp = DB.available(x.insumo.id);
                  const falta = disp < 1;
                  return '<button class="bcarne ' + (falta?'off':'') + (carne===x.insumo.id?' on':'') +
                    '" data-c="' + x.insumo.id + '"' + (falta?' disabled':'') + '>' +
                    '<span class="ic">' + Glifo.de(x.insumo, 26) + '</span>' +
                    '<b>' + Util.esc(x.insumo.nombre) + '</b>' +
                    '<span class="dim">' + (falta ? 'agotada' : Util.cantIns(Math.max(0,disp), x.insumo)) + '</span>' +
                  '</button>';
                }).join('') + '</div>' +
                /* Si una carne autorizada no se puede servir, se dice por qué:
                   antes simplemente no aparecía y no había forma de saberlo. */
                (avisoFalta ? '<div style="margin-top:10px;padding:9px 12px;border-radius:var(--r);' +
                  'background:rgba(163,35,28,.10);border:1px solid rgba(163,35,28,.30);' +
                  'font-size:11.5px;line-height:1.5;color:var(--ash)">' + avisoFalta + '</div>' : '') +
                /* Selector de cantidad para Huevos (máx 2 porciones) */
                '<div id="cmHuevosQty" class="hide" style="margin-top:10px;padding:10px 14px;border-radius:8px;background:rgba(198,168,103,.08)">' +
                  '<div class="row" style="gap:10px;align-items:center">' +
                    '<span style="font-size:13px;font-weight:600">Porciones de huevo:</span>' +
                    '<button class="btn sm' + (cantidadHuevos===1?' gold':'') + '" data-hq="1">1</button>' +
                    '<button class="btn sm' + (cantidadHuevos===2?' gold':'') + '" data-hq="2">2 (doble)</button>' +
                  '</div>' +
                '</div>' +
                '<label class="f" style="margin-top:14px">Observación' +
                  '<input class="inp" id="cmNota" placeholder="Ej: sin ensalada, para llevar"></label>');

          const su = box.querySelector('#cmUser');
          su.onchange = () => { sel = su.value || null; pinta(); };
          box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
            carne = b.dataset.c;
            box.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b));
            /* Mostrar/ocultar selector de cantidad para Huevos */
            const selInsumo = disponibles.find(x => x.insumo.id === carne);
            const qtyBox = box.querySelector('#cmHuevosQty');
            if (qtyBox){
              if (selInsumo && esHuevo(selInsumo.insumo)){
                qtyBox.classList.remove('hide');
                cantidadHuevos = 1;
                qtyBox.querySelectorAll('[data-hq]').forEach(hb => hb.classList.toggle('gold', hb.dataset.hq === '1'));
              } else {
                qtyBox.classList.add('hide');
                cantidadHuevos = 1;
              }
            }
          });
          /* Botones de cantidad de huevos */
          box.querySelectorAll('[data-hq]').forEach(hb => hb.onclick = () => {
            cantidadHuevos = parseInt(hb.dataset.hq, 10);
            box.querySelectorAll('[data-hq]').forEach(x => x.classList.toggle('gold', x === hb));
          });
        };
        pinta();

        ov.querySelector('#cmOk').onclick = () => {
          if (!sel) return UI.toast('Elige a la persona.','warn');
          const bloq = DB.mealHoy(sel);
          if (DB.d.config.alimentacionUnaVez !== false && bloq)
            return UI.toast('Bloqueado hasta las ' + Util.time(DB.mealLibreEn(bloq)) +
              (DB.mealFaltaTxt(bloq) ? ' · faltan ' + DB.mealFaltaTxt(bloq) : ''),'warn', 4600);
          if (!carne) return UI.toast('Elige la carne.','warn');
          const nota = (box.querySelector('#cmNota')||{}).value || '';
          const r = Views.comidas.guardar(sel, carne, nota, cantidadHuevos);
          if (r){
            close();
            /* INTERVENCIÓN: al registrar la comida se genera de una vez la
               comanda de ese plato (empleado, hora, plato y observación)
               lista para que Caja la imprima en la térmica de 80 mm y
               pase a cocina. */
            Views.comidas.imprimirComanda(r);
          }
        };
      }
    });
  },

  /** Escribe el registro y descuenta la porción del inventario.
      @param {number} porciones — cantidad a descontar (default 1, máx 2 para huevos) */
  guardar(userId, meatId, nota, porciones){
    const u = DB.personal(true).find(x => x.id === userId);
    const m = DB.meat(meatId);
    if (!u || !m) return UI.toast('Faltan datos del registro.','bad'), false;
    const bloqueado = DB.mealHoy(userId);
    if (DB.d.config.alimentacionUnaVez !== false && bloqueado)
      return UI.toast('Bloqueado hasta las ' + Util.time(DB.mealLibreEn(bloqueado)) +
        (DB.mealFaltaTxt(bloqueado) ? ' · faltan ' + DB.mealFaltaTxt(bloqueado) : ''),'warn', 4600), false;
    /* Determinar cantidad: solo Huevos puede ser 2, todo lo demás forzado a 1 */
    const esHuevoItem = /huevo/i.test(Util.norm(m.nombre || ''));
    const cant = esHuevoItem ? Math.min(2, Math.max(1, parseInt(porciones, 10) || 1)) : 1;
    if (DB.available(meatId) < cant)
      return UI.toast('No ' + (cant > 1 ? 'quedan ' + cant + ' porciones' : 'queda ninguna porción') + ' de ' + m.nombre + '.','bad'), false;

    m.gramos = Math.max(0, m.gramos - cant);
    m.act = Util.now();
    const reg = {
      id:Util.uid('cm'), fecha:Util.now(), userId:u.id, userNombre:u.nombre,
      rol:u.cargo, fuente:u.fuente,
      meatId:m.id, carneNombre:DB.rotulo(m) + (cant > 1 ? ' ×' + cant : ''),
      porciones:cant, costo:Math.round((m.costoGramo||0) * cant),
      nota:String(nota||'').trim(), registroId:(Auth.user||{}).id, registroNombre:(Auth.user||{}).nombre||'',
      sede:DB.d.config.sedeId, act:Util.now()
    };
    DB.d.meals.push(reg);
    DB.touch('meals','meats');
    DB.log('alimentacion:registrar', u.nombre + ' · ' + reg.carneNombre + ' · ' +
      Util.money(reg.costo) + (reg.nota ? ' · ' + reg.nota : ''), reg.id);
    Sync.enqueue('meals','create', reg);
    Sync.enqueue('meats','update', m);
    UI.toast(u.nombre.split(' ')[0] + ' registrado: ' + m.nombre + (cant > 1 ? ' ×' + cant + ' porciones' : '') +
      '. Se habilita de nuevo a las ' + Util.time(DB.mealLibreEn(reg)),'ok', 4600);
    Router.render();
    return reg;
  },

  /** INTERVENCIÓN: comanda individual de un plato de alimentación de
      personal — empleado, hora, plato y observación — en el mismo
      formato de ticket térmico de 80&nbsp;mm que usa el resto de la
      aplicación, lista para que Caja la pase a cocina. */
  imprimirComanda(reg){
    const c = DB.d.config;

  /** INTERVENCIÓN: imprime en 80&nbsp;mm el listado del historial ya
      filtrado por el rango de fechas (Desde/Hasta) seleccionado, para
      poder verificar y entregar un consolidado de ese periodo. */
  imprimirHistorial(){
    const h = this._hist || {desde:Util.today(), hasta:Util.today()};
    const c = DB.d.config;
    const line = '<hr>';
    const filtrados = DB.meals().filter(m => {
      const f = (m.fecha||'').slice(0,10);
      return f >= h.desde && f <= h.hasta;
    }).slice().reverse();
    const costoTotal = filtrados.reduce((a,m)=>a+(m.costo||0),0);
    const filas = filtrados.length
      ? filtrados.map(m =>
          '<tr><td class="b">' + Util.esc(DB.nombrePersona(m.userId, m.userNombre)) + '</td></tr>' +
          '<tr><td>' + Util.esc(m.carneNombre) + ' · ' + Util.dt(m.fecha) + '</td></tr>' +
          (m.nota ? '<tr><td style="font-size:10px;color:#555">* ' + Util.esc(m.nota) + '</td></tr>' : '') +
          '<tr><td class="r" style="font-size:10px">Costo: ' + Util.money(m.costo||0,false) + '</td></tr>'
        ).join('<tr><td style="border-bottom:1px dotted #999"></td></tr>')
      : '<tr><td class="c" style="padding:10px 0;color:#777">Sin registros en ese rango</td></tr>';
    const cuerpo = '<div class="ticket">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() + '" style="max-width:50%;height:auto;margin-bottom:4px"></div>' : '') +
      '<div class="c b" style="font-size:13px;letter-spacing:.08em">HISTORIAL ALIMENTACIÓN</div>' +
      '<div class="c tk-sub">' + Util.date(h.desde) + (h.hasta!==h.desde ? ' a ' + Util.date(h.hasta) : '') + '</div>' +
      line +
      '<table><tr><td>Registros</td><td class="r b">' + filtrados.length + '</td></tr>' +
      '<tr><td class="b">Costo total</td><td class="r b">' + Util.money(costoTotal,false) + '</td></tr></table>' +
      line +
      '<table>' + filas + '</table>' +
      line +
      '<div class="c" style="font-size:9px">Impreso ' + Util.dt(Util.now()) + ' · ' + Util.esc((Auth.user||{}).nombre||'') + '</div>' +
      '</div>';
    UI.modal({title:'Historial de alimentación', size:'sm',
      body:'<div class="ticket-frame">' + cuerpo + '</div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
        '<button class="btn gold" id="alHistTk">' + Util.ico('print') + ' Imprimir</button>',
      onMount(ov){
        ov.querySelector('#alHistTk').onclick = () => {
          DB.log('alimentacion:historial', h.desde + ' a ' + h.hasta + ' · ' + filtrados.length + ' registros');
          const anchoOriginal = c.ticket;
          c.ticket = '80';
          UI.imprimir(ov);
          c.ticket = anchoOriginal;
        };
      }});

  /** Anular devuelve la porción y deja a la persona habilitada de nuevo. */
  async anular(id){
    const reg = (DB.d.meals||[]).find(x => x.id === id);
    if (!reg) return;
    if (!Auth.can('anular')) return UI.toast('Solo un supervisor puede anular un registro.','warn');
    const autorizo = await Auth.autorizar('Anular una comida del personal',
      (reg.userNombre||'') + ' · ' + reg.carneNombre);
    if (!autorizo) return;
    if (!(await UI.confirm('Se anula el registro de ' + Util.esc(reg.userNombre) + '. La porción vuelve al ' +
      'inventario y esa persona podrá registrarse otra vez hoy.', {ok:'Anular', danger:true}))) return;

    const m = DB.meat(reg.meatId);
    if (m){ m.gramos += (reg.porciones||1); m.act = Util.now(); Sync.enqueue('meats','update', m); }
    reg.anulada = true; reg.anuladaEn = Util.now(); reg.act = Util.now();
    DB.touch('meals','meats');
    DB.log('alimentacion:anular', (reg.userNombre||'') + ' · ' + reg.carneNombre +
      ' · autorizó ' + autorizo.nombre, reg.id);
    Sync.enqueue('meals','update', reg);
    UI.toast('Registro anulado. La porción volvió al inventario.','ok');
    Router.render();
  },

    const line = '<hr>';
    const delDia = DB.mealsOf(f.fecha);
    const activos = DB.personal();
    const costoDia = delDia.reduce((a,m) => a + (m.costo||0), 0);
    const esHoy = f.fecha === Util.today();

    let filas = '';
    if (delDia.length){
      filas = delDia.map(m =>
        '<tr><td class="b">' + Util.esc(DB.nombrePersona(m.userId, m.userNombre)) + '</td></tr>' +
        '<tr><td>' + Util.esc(m.carneNombre) + ' · ' + Util.time(m.fecha) + '</td></tr>' +
        (m.nota ? '<tr><td style="font-size:10px;color:#555">* ' + Util.esc(m.nota) + '</td></tr>' : '') +
        '<tr><td class="r" style="font-size:10px">Costo: ' + Util.money(m.costo||0,false) + '</td></tr>'
      ).join('<tr><td style="border-bottom:1px dotted #999"></td></tr>');
    } else {
      filas = '<tr><td class="c" style="padding:10px 0;color:#777">Sin registros para esta fecha</td></tr>';
    }

    const resumen =
      '<table>' +
        '<tr><td>Comieron</td><td class="r b">' + delDia.length + ' de ' + activos.length + '</td></tr>' +
        '<tr><td>Pendientes</td><td class="r">' + (activos.length - delDia.length) + '</td></tr>' +
        '<tr><td class="b">Costo total</td><td class="r b">' + Util.money(costoDia,false) + '</td></tr>' +
      '</table>';

    const cuerpo = '<div class="ticket ' + (w58?'w58':'') + '">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() +
        '" style="max-width:55%;height:auto;margin-bottom:4px;background:#fff"></div>' : '') +
      '<div class="c b lg">' + Util.esc(c.empresa.toUpperCase()) + '</div>' +

      '<div class="c b" style="font-size:13px;letter-spacing:.1em">REPORTE ALIMENTACIÓN</div>' +
      '<div class="c" style="font-size:11px;margin-top:2px">' + (esHoy ? 'Hoy' : Util.date(f.fecha)) + '</div>' +
      '<div class="c" style="font-size:9px">' + Util.dt(Util.now()) + ' · ' + Util.esc((Auth.user||{}).nombre||'') + '</div>' + line +
      resumen + line +
      '<div style="font-size:11px;font-weight:700;margin-bottom:6px">DETALLE</div>' +
      '<table>' + filas + '</table>' + line +
      '<div class="c" style="font-size:9px">' + Util.esc(c.sede) + ' · ' + delDia.length + ' registros</div>' +
    '</div>';

    UI.modal({title:'Reporte Alimentación · ' + (esHoy ? 'Hoy' : Util.date(f.fecha)), size:'sm',
      body:'<div class="ticket-frame">' + cuerpo + '</div>',
      footer:'<button class="btn" data-close>Cerrar</button><button class="btn gold" id="alTk">' + Util.ico('print') + ' Imprimir</button>',
      onMount(ov){ ov.querySelector('#alTk').onclick = () => { DB.log('alimentacion:reporte', f.fecha); UI.imprimir(ov); }; }});

    const close = UI.modal({
      title:'Empleados', size:'lg', body:'<div id="epBody">' + pinta() + '</div>',

          ov.querySelector('#epNuevo').onclick = () =>
            proteger('Crear un nuevo empleado', 'Módulo de alimentación', () => self.formEmpleado(null, refrescar));
          ov.querySelector('#epImportar').onclick = () =>
            proteger('Importar empleados desde archivo', 'Carga masiva', () => { close(); self.importar(); });

          const ex = ov.querySelector('#epExportar');
          if (ex) ex.onclick = () => Reports.csv('empleados', DB.staff().map(e => ({
            nombre:e.nombre, documento:e.doc||'', cargo:e.cargo||'', activo:e.activo?'si':'no'})));
          ov.querySelectorAll('[data-ee]').forEach(b => b.onclick = () =>
            proteger('Editar empleado', DB.empleado(b.dataset.ee)?.nombre || '', () => self.formEmpleado(b.dataset.ee, refrescar)));
          ov.querySelectorAll('[data-et]').forEach(b => b.onclick = () =>
            proteger('Cambiar estado de empleado', DB.empleado(b.dataset.et)?.nombre || '', () => self.alternarEmpleado(b.dataset.et, refrescar)));
          ov.querySelectorAll('[data-ex]').forEach(b => b.onclick = () =>
            proteger('Eliminar empleado', DB.empleado(b.dataset.ex)?.nombre || '', () => self.borrarEmpleado(b.dataset.ex, refrescar)));
        };
        enlazar();
      }
    });
  },

  /** Alta y edición de un empleado. */
  formEmpleado(id, despues){
    const e = id ? DB.empleado(id) : null;
    UI.formModal({
      title: e ? 'Editar ' + e.nombre : 'Nuevo empleado', size:'sm',
      ok: e ? 'Guardar' : 'Crear empleado',
      fields:[
        {k:'nombre', label:'Nombre completo', val:e?e.nombre:'', req:true, full:true},
        {k:'doc', label:'Documento', val:e?(e.doc||''):'', ph:'Opcional'},
        {k:'cargo', label:'Cargo', val:e?(e.cargo||''):'', ph:'Cocina, Mesero, Aseo'},
        {k:'activo', label:'Activo', type:'check', val:e?e.activo:true, full:true}
      ],
      onSave(d, close){
        const nombre = String(d.nombre||'').trim();
        if (!nombre) return 'El empleado necesita un nombre.';
        const docInput = String(d.doc||'').trim();
        const repetido = DB.staff().some(x => Util.norm(x.nombre) === Util.norm(nombre) && (!e || x.id !== e.id)) ||
          DB.users().some(u => !u.borrado && Util.norm(u.nombre) === Util.norm(nombre));
        if (repetido) return 'Ya hay alguien con ese nombre en el personal.';

        /* Validación anti-duplicidad por número de documento */
        if (docInput){
          const docRepetido = DB.staff().some(x => x.doc && Util.norm(x.doc) === Util.norm(docInput) && (!e || x.id !== e.id)) ||
            DB.users().some(u => !u.borrado && u.doc && Util.norm(u.doc) === Util.norm(docInput));
          if (docRepetido) return 'Ya existe un empleado con el documento ' + docInput + '. No se permite duplicidad.';
        }

        if (e){
          Object.assign(e, {nombre, doc:docInput, cargo:String(d.cargo||'').trim() || 'Empleado',
            activo:!!d.activo, act:Util.now()});
          DB.log('empleado:editar', e.nombre + ' · ' + e.cargo, e.id);
          Sync.enqueue('staff','update', e);
        } else {
          const nuevo = {id:Util.uid('e'), nombre, doc:docInput,
            cargo:String(d.cargo||'').trim() || 'Empleado', activo:!!d.activo, act:Util.now()};
          DB.d.staff.push(nuevo);
          DB.log('empleado:crear', nombre + ' · ' + nuevo.cargo, nuevo.id);
          Sync.enqueue('staff','create', nuevo);
        }
        DB.touch('staff');
        close();
        UI.toast(e ? 'Empleado actualizado.' : 'Empleado agregado.','ok');
        if (despues) despues(); else Router.render();
      }
    });
  },

  alternarEmpleado(id, despues){
    const e = DB.empleado(id); if (!e) return;
    e.activo = !e.activo; e.act = Util.now();
    DB.touch('staff');
    DB.log('empleado:' + (e.activo?'activar':'desactivar'), e.nombre, e.id);
    Sync.enqueue('staff','update', e);
    UI.toast(e.nombre + (e.activo ? ' quedó activo.' : ' quedó inactivo.'),'ok');
    if (despues) despues(); else Router.render();
  },

  /** La baja conserva el histórico de comidas ya registradas. */
  async borrarEmpleado(id, despues){
    const e = DB.empleado(id); if (!e) return;
    const comidas = DB.meals().filter(m => m.userId === e.id).length;
    if (!(await UI.confirm('Se elimina a ' + Util.esc(e.nombre) + ' del personal' +
      (comidas ? '. Sus ' + comidas + ' comida(s) ya registradas se conservan en el histórico' : '') + '.',
      {ok:'Eliminar', danger:true, title:'Eliminar empleado'}))) return;
    e.borrado = true; e.activo = false; e.act = Util.now();
    DB.touch('staff');
    DB.log('empleado:eliminar', e.nombre + (comidas ? ' · ' + comidas + ' comidas conservadas' : ''), e.id);
    Sync.enqueue('staff','update', e);
    UI.toast('Empleado eliminado.','ok');
    if (despues) despues(); else Router.render();
  },

  /** Qué carnes puede consumir el personal. Se eligen del inventario con
      un toque, en vez de escribirlas: escribiéndolas bastaba una tilde,
      un plural o un espacio de más para que la carne no apareciera al
      registrar, y el error no se veía por ninguna parte. */
  configurar(){
    const todos = DB.meats().slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    const actuales = this.autorizadas();
    const sel = new Set(actuales.filter(x=>x.insumo).map(x=>x.insumo.id));
    /* Nombres autorizados que todavía no existen en el inventario: se
       conservan tal cual, para poder crearlos desde el aviso del módulo. */
    let pendientes = actuales.filter(x=>!x.insumo).map(x=>x.nombre);
    let q = '';
    const self = this;

    UI.modal({
      title:'Carnes autorizadas para el personal', size:'lg',
      body:'<div id="caBody"></div>',
      footer:'<button class="btn" data-close>Cancelar</button>' +
             '<button class="btn pri" id="caOk">Guardar</button>',
      onMount(ov){
        const box = ov.querySelector('#caBody');
        const pinta = () => {
          const nq = Util.norm(q).trim();
          const lista = todos.filter(m => !nq || Util.norm(m.nombre).includes(nq));
          box.innerHTML =
            '<p class="dim" style="font-size:12px;line-height:1.55;margin:0">' +
              'Marca lo que el personal puede pedir. Solo lo marcado aparece al registrar una comida, ' +
              'y se descuenta de ese mismo insumo del inventario.</p>' +
            '<div class="row wrap" style="gap:8px">' +
              '<div class="search" style="flex:1;min-width:200px">' + Util.ico('search') +
                '<input class="inp" id="caQ" autocomplete="off" placeholder="Buscar insumo" value="' + Util.esc(q) + '"></div>' +
              '<span class="badge ' + (sel.size?'ok':'warn') + '">' + sel.size + ' seleccionada(s)</span>' +
              '<button class="btn sm ghost" id="caNone">Quitar todas</button>' +
            '</div>' +
            (lista.length
              ? '<div class="bandeja-carnes" id="caGrid">' + lista.map(m => {
                  const disp = DB.available(m.id);
                  return '<button class="bcarne' + (sel.has(m.id)?' on':'') + '" data-ca="' + m.id + '">' +
                    '<span class="ic">' + Glifo.de(m, 26) + '</span>' +
                    '<b>' + Util.esc(m.nombre) + '</b>' +
                    '<span class="dim">' + Util.cantIns(Math.max(0,disp), m) + '</span>' +
                  '</button>';
                }).join('') + '</div>'
              : '<div class="card">' + UI.empty('Ningún insumo coincide','Prueba con otro nombre.') + '</div>') +
            (pendientes.length
              ? '<div style="padding:10px 12px;border-radius:var(--r);background:rgba(163,35,28,.10);' +
                'border:1px solid rgba(163,35,28,.35)">' +
                '<div style="font-size:12.5px;font-weight:700;color:var(--ember-hi)">Autorizadas que no están en el inventario</div>' +
                '<div class="dim" style="font-size:11.5px;margin-top:4px;line-height:1.5">' +
                  Util.esc(pendientes.join(', ')) + '. Créalas desde el aviso del módulo o quítalas de la lista.</div>' +
                '<button class="btn sm ghost" id="caPend" style="margin-top:8px">Quitar de la lista</button></div>'
              : '') +
            '<label class="f" style="margin:0">' +
              '<span class="row" style="gap:8px"><input type="checkbox" id="caUnaVez"' +
                (DB.d.config.alimentacionUnaVez !== false ? ' checked' : '') + '>' +
                '<span style="font-size:13px">Un solo plato por persona al día</span></span></label>';

          const iq = box.querySelector('#caQ');
          if (iq){
            iq.oninput = () => { q = iq.value; pinta(); };
            if (q){ iq.focus(); iq.setSelectionRange(iq.value.length, iq.value.length); }
          }
          box.querySelectorAll('[data-ca]').forEach(b => b.onclick = () => {
            const id = b.dataset.ca;
            if (sel.has(id)) sel.delete(id); else sel.add(id);
            b.classList.toggle('on', sel.has(id));
            const cnt = box.querySelector('.badge');
            if (cnt){ cnt.textContent = sel.size + ' seleccionada(s)';
              cnt.className = 'badge ' + (sel.size?'ok':'warn'); }
          });
          const bn = box.querySelector('#caNone');
          if (bn) bn.onclick = () => { sel.clear(); pinta(); };
          const bp = box.querySelector('#caPend');
          if (bp) bp.onclick = () => { pendientes = []; pinta(); };
        };
        pinta();

        ov.querySelector('#caOk').onclick = () => {
          if (!sel.size && !pendientes.length)
            return UI.toast('Marca al menos un insumo para el personal.','warn');
          const ids = todos.filter(m => sel.has(m.id)).map(m => m.id);
          const nombres = todos.filter(m => sel.has(m.id)).map(m => m.nombre).concat(pendientes);
          DB.d.config.carnesEmpleadosIds = ids;
          DB.d.config.carnesEmpleados = nombres.join(', ');
          DB.d.config.alimentacionUnaVez = !!(box.querySelector('#caUnaVez')||{}).checked;
          DB.touch('config');
          Sync.enqueue('config','update', Object.assign({id:'config', act:Util.now()}, DB.d.config));
          DB.log('alimentacion:configurar', nombres.join(', '));
          UI.closeAll();
          UI.toast(ids.length + ' carne(s) autorizadas guardadas.','ok');
          Router.render();
        };
      }
    });
  },

  /** Crea en el inventario, en cero, las carnes autorizadas que aún no existen. */
  async crearFaltantes(){
    const faltan = this.faltantes();
    if (!faltan.length) return UI.toast('Todas las carnes autorizadas ya están en el inventario.','ok');
    if (!(await UI.confirm('Se crearán ' + faltan.length + ' carne(s) en el inventario, en cero porciones: ' +
      faltan.map(x=>x.nombre).join(', ') + '. Después registra las existencias con una compra o un conteo.',
      {ok:'Crear'}))) return;
    const nuevos = [];
    faltan.forEach(x => {
      const m = {id:Util.uid('m'), nombre:x.nombre, presentacion:'', tipo:'carne', unidad:'und',
        gramos:0, minimo:0, costoGramo:0, unidadMigrada:true, act:Util.now()};
      DB.d.meats.push(m);
      nuevos.push(m.id);
      Sync.enqueue('meats','create', m);
    });
    DB.touch('meats');
    /* Recién creadas quedan autorizadas de una vez, enlazadas por id: así
       no dependen otra vez de que el nombre escrito calce exacto. */
    const ids = Array.isArray(DB.d.config.carnesEmpleadosIds) ? DB.d.config.carnesEmpleadosIds.slice() : [];
    DB.d.config.carnesEmpleadosIds = ids.concat(nuevos.filter(id => !ids.includes(id)));
    DB.touch('config');
    Sync.enqueue('config','update', Object.assign({id:'config', act:Util.now()}, DB.d.config));
    DB.log('alimentacion:crear-carnes', faltan.map(x=>x.nombre).join(', '));
    UI.toast(faltan.length + ' carnes creadas en cero. Regístralas con una compra.','ok', 5200);
    Router.render();
  }
};

        if (u && u.id === (Auth.user||{}).id && (!d.activo || d.rol !== u.rol))
          return 'No puedes cambiar tu propio rol ni desactivarte.';
        if (DB.users().some(x => Util.norm(x.usuario) === Util.norm(d.usuario) && (!u || x.id !== u.id)))
          return 'Ese nombre de usuario ya está tomado.';
        if (u && u.rol === 'admin' && d.rol !== 'admin' &&
            DB.users().filter(x => x.rol === 'admin' && x.activo).length <= 1)
          return 'Es el único administrador activo. Nombra otro antes de cambiarle el rol.';
        const obj = Object.assign(u || {id:Util.uid('u'), pin: await Util.hash('1234')}, d, {act:Util.now()});

    if (u.rol === 'admin' && DB.users().filter(x => x.rol === 'admin' && x.activo).length <= 1)
      return UI.toast('Es el único administrador activo. Crea otro antes de eliminarlo.','bad', 5000);

      return UI.toast(u.nombre + ' tiene la caja abierta. Ciérrala antes de eliminar el usuario.','warn');

    const autorizo = await Auth.autorizar('Eliminar un usuario del sistema', u.nombre + ' · ' + ROL_LABEL[u.rol]);
    if (!autorizo) return;
    if (!(await UI.confirm('Se elimina el usuario de ' + u.nombre + '. No podrá volver a iniciar sesión. ' +

    u.borrado = true; u.activo = false; u.act = Util.now();
    DB.touch('users');
    DB.log('usuario:eliminar', u.nombre + ' · ' + ROL_LABEL[u.rol] + ' · autorizó ' + autorizo.nombre, u.id);
    Sync.enqueue('users','update', u);
    UI.toast('Usuario eliminado.','ok');

    if (!Auth.can('team')) return UI.toast('Solo el administrador puede cambiar el PIN.','warn');

        u.pin = await Util.hash(d.pin); u.act = Util.now();
        DB.touch('users');
        Sync.enqueue('users','update', u);
        DB.log('usuario:pin','PIN actualizado para ' + u.nombre);
        close(); UI.toast('PIN actualizado y guardado.','ok');
        Router.render();
      }});
  }

            '<td class="n"><button class="btn sm ghost" data-gdel="' + g.id + '" style="color:var(--ash-dim)">Eliminar</button></td></tr>'
          ), {emptyTitle:'Sin gastos en este turno', emptyMsg:'Los gastos del turno aparecerán aquí.'}) + '</div>' +
      '<div class="card pad0" style="margin-top:14px"><div class="card-h"><h3>Historial reciente</h3></div>' +

          allGastos.map(g =>
            '<tr><td>' + Util.dt(g.fecha) + '</td>' +
            '<td>' + Util.esc((DB.user(g.userId)||{}).nombre||'—') + '</td>' +
            '<td>' + Util.esc(g.concepto) + '</td>' +
            '<td><span class="badge ' + (g.metodo==='Efectivo'?'ok':'info') + '">' + g.metodo + '</span></td>' +
            '<td class="n">' + Util.money(g.valor) + '</td></tr>'
          ), {emptyTitle:'Sin gastos registrados', emptyMsg:'El historial de gastos aparecerá aquí.'}) + '</div>';
  },
  mount(){
    const btn = document.querySelector('[data-act=newgasto]');
    if (btn) btn.onclick = () => this.nuevo();
    document.querySelectorAll('[data-gdel]').forEach(b => b.onclick = async () => {
      if (!Auth.can('admin') && !Auth.can('menu')){
        /* Cajero: requiere autorización de admin para eliminar */
        const autorizo = await Auth.autorizar('Eliminar un gasto', 'Se requiere autorización de administrador');
        if (!autorizo) return;
      }
      this.eliminar(b.dataset.gdel);
    });
  },
  nuevo(){
    const c = DB.openCash();
    if (!c) return UI.toast('Abre la caja primero para registrar gastos.','warn');
    const responsable = (Auth.user||{}).nombre || '—';
    UI.formModal({title:'Registrar gasto', size:'sm', ok:'Guardar gasto',
      fields:[
        {k:'concepto', label:'Concepto', val:'', req:true, full:true, ph:'Ej: compra de hielo, gas, servilletas'},
        {k:'valor', label:'Valor', type:'number', val:0, min:0, req:true},
        {k:'metodo', label:'Forma de pago', type:'select', val:'Efectivo', opts:[{v:'Efectivo',t:'Efectivo'},{v:'Transferencia',t:'Transferencia'}]}
      ],
      extra:'<div class="card" style="margin-top:10px"><div class="tot-row"><span>Responsable</span><b>' +
        Util.esc(responsable) + '</b></div><div class="tot-row"><span>Fecha</span><b>' + Util.dt(Util.now()) + '</b></div></div>',
      onSave(d, close){
        if (!d.valor || d.valor <= 0) return 'Indica un valor mayor a cero.';
        const gasto = {id:Util.uid('gs'), fecha:Util.now(), concepto:d.concepto, valor:Math.abs(d.valor),
          metodo:d.metodo, userId:(Auth.user||{}).id, cajaId:c.id, act:Util.now()};
        if (!DB.d.gastos) DB.d.gastos = [];
        DB.d.gastos.push(gasto);
        Sync.enqueue('gastos','create', gasto);
        /* Registrar como egreso en caja si es efectivo */
        if (d.metodo === 'Efectivo'){
          c.movs.push({id:Util.uid('mv'), tipo:'egreso', fecha:Util.now(),
            concepto:'Gasto: ' + d.concepto, monto:-Math.abs(d.valor), metodo:'Efectivo', userId:(Auth.user||{}).id});
          c.act = Util.now();
          Sync.enqueue('cash','mov', c);
        }
        DB.touch('cash'); DB.touch('gastos');
        DB.log('gasto:registrar', d.metodo + ' · ' + Util.money(d.valor) + ' · ' + d.concepto, gasto.id);
        close(); UI.toast('Gasto registrado por ' + Util.money(d.valor) + '.','ok'); Router.render();
      }});
  },
  async eliminar(gastoId){
    const g = (DB.d.gastos||[]).find(x => x.id === gastoId);
    if (!g) return;
    const autorizo = await Auth.autorizar('Eliminar un gasto', g.concepto + ' · ' + Util.money(g.valor));
    if (!autorizo) return;
    if (!(await UI.confirm('Se eliminará el gasto "' + g.concepto + '" por ' + Util.money(g.valor) + '.',
      {ok:'Eliminar gasto', danger:true}))) return;
    /* Si fue efectivo, quitar el egreso de caja */
    if (g.metodo === 'Efectivo'){
      const c = DB.d.cash.find(x => x.id === g.cajaId);
      if (c){ c.movs = c.movs.filter(m => !(m.concepto === 'Gasto: ' + g.concepto && Math.abs(m.monto) === g.valor)); c.act = Util.now(); Sync.enqueue('cash','update', c); }
    }
    /* Baja lógica, no borrado a secas. Ahora que los gastos viajan entre
       equipos, quitarlo de la lista sin dejar marca haría que volviera con
       la siguiente sincronización: el servidor todavía lo tendría y lo
       daría por nuevo. La marca viaja y lo deja eliminado en todas partes.
       Todas las listas y todos los totales ya descartan lo marcado. */
    g.borrado = true; g.act = Util.now();
    Sync.enqueue('gastos','update', g);
    DB.touch('cash'); DB.touch('gastos');
    DB.log('gasto:eliminar', g.concepto + ' · ' + Util.money(g.valor) + ' · autorizó ' + autorizo.nombre, gastoId);
    UI.toast('Gasto eliminado.','ok'); Router.render();
  }
};

/* --- Caja ------------------------------------------------------------ */
Views.cash = {
  actions(){
    const c = DB.openCash();
    return c ? '<button class="btn" data-act="mov">Movimiento</button>' +
               '<button class="btn pri" data-act="close">Cerrar caja</button>'
             : '<button class="btn gold" data-act="open">Abrir caja</button>';
  },
  totals(c){
    const ventas = DB.paid().filter(s => s.fecha >= c.apertura && (!c.cierre || s.fecha <= c.cierre));
    const porMetodo = Metrics.byPayment(ventas);
    const efectivoVentas = porMetodo['Efectivo']||0;
    const transferencias = (porMetodo['Transferencia']||0) + (porMetodo['Nequi']||0) + (porMetodo['Daviplata']||0);
    const total = ventas.reduce((a,s)=>a+s.total,0);
    const otrosMedios = Math.max(0, total - efectivoVentas - transferencias);
    const ingresos = c.movs.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
    /* CORRECCIÓN DE RAÍZ (caja: doble descuento al anular una venta en efectivo):
       se excluyen de "egresos" los movimientos marcados "reversionAnulacion"
       (ver Sales.void). Esa venta ya no está en DB.paid(), así que su efectivo
       ya se restó solo al recalcular "efectivoVentas"/"total" arriba; sumar
       también su reversión aquí restaba el mismo valor dos veces del efectivo
       esperado del turno. El movimiento se conserva en c.movs únicamente como
       rastro visible en "Movimientos del turno". */
    const egresos = c.movs.filter(m=>m.tipo==='egreso' && !m.reversionAnulacion).reduce((a,m)=>a+m.monto,0);
    /* CORRECCIÓN DE RAÍZ (caja: "esperado" incluía pagos con tarjeta/otros
       medios como si fueran efectivo en el cajón): el arqueo de "Cerrar Caja"
       le pide al usuario "Total contado (efectivo + transferencias)" y el
       ticket lo rotula "Efectivo esperado en el cajón" — es decir, el dinero
       que debe estar físicamente contable (efectivo + transferencias
       verificables por el negocio). Los pagos con datáfono/tarjeta
       ("otrosMedios") nunca pasan por el cajón ni por las manos de quien
       cierra: se liquidan aparte, directo al banco. Antes "esperado" sumaba
       "total" (TODAS las ventas, incluidas las de tarjeta), así que cualquier
       turno con ventas por datáfono mostraba una "diferencia" (faltante)
       falsa por ese mismo valor, aunque la caja estuviera perfectamente
       cuadrada. Se corrige a base + efectivo + transferencias + mov., que es
       lo que la persona que cierra realmente puede contar y comparar. */
    const esperado = c.base + efectivoVentas + transferencias + ingresos + egresos;
    /* INTERVENCIÓN (corrección de raíz): "egresos" solo suma los gastos
       pagados en Efectivo, porque son los únicos que de verdad mueven el
       cajón físico — eso está bien para el arqueo (esperado). Pero el
       resumen impreso venía usando ese mismo "egresos" como si fuera
       "el total de gastos del turno", y los gastos pagados por
       Transferencia nunca se registran en c.movs, así que quedaban
       invisibles ahí. Se agrega "gastosTotal", tomado directo de
       DB.d.gastos (la fuente real, ya persistida) para TODO el turno,
       sin importar la forma de pago — este es el valor que deben usar
       el resumen, el PDF y los reportes. */
    /* CORRECCIÓN DE RAÍZ (caja: gastos filtrados por rango de fecha en vez
       de por caja): cada gasto ya guarda "cajaId" desde que se registra
       (Views.gastos.nuevo), que identifica sin ambigüedad a QUÉ turno de
       caja pertenece. Filtrar en cambio por "g.fecha >= c.apertura && (!c.cierre
       || g.fecha <= c.cierre)" es el mismo patrón de bug ya corregido en otros
       módulos: si el reloj de otro dispositivo está desfasado (la app
       sincroniza entre varios equipos), un gasto puede quedar fuera de la
       ventana de su propia caja, o colarse en la caja equivocada. Se usa
       "cajaId" cuando existe, y solo se cae al rango de fecha para gastos
       viejos guardados antes de que existiera ese campo. */
    const gastosTotal = (DB.d.gastos||[])
      .filter(g => !g.borrado && (g.cajaId ? g.cajaId === c.id :
        (g.fecha >= c.apertura && (!c.cierre || g.fecha <= c.cierre))))
      .reduce((a,g)=>a+(Number(g.valor)||0), 0);
    return {ventas, porMetodo, efectivoVentas, transferencias, otrosMedios, ingresos, egresos, esperado, total, gastosTotal};
  },

        '<button class="btn gold" id="cash-resumen-turno" style="margin-left:8px">' + Util.ico('print') + ' Resumen de Turno</button>'

      /* INTERVENCIÓN: filtro de cierres por fecha y por empleado, con
