        '<div class="grid g-form">' +
          '<label class="f">Nombre del cliente<input class="inp" id="dm-nombre" placeholder="Nombre completo" value="' + Util.esc(bor.nombre) + '"></label>' +
          '<label class="f">Contacto / Alias<input class="inp" id="dm-contacto" placeholder="Referencia" value="' + Util.esc(bor.contacto) + '"></label>' +
          '<label class="f" style="grid-column:1/-1">Dirección de entrega<input class="inp" id="dm-dir" placeholder="Calle, barrio, referencias…" value="' + Util.esc(bor.direccion) + '"></label>' +
          '<label class="f">Teléfono<input class="inp" id="dm-tel" type="tel" placeholder="300 000 0000" value="' + Util.esc(bor.telefono) + '"></label>' +
        '</div>' +
        /* INTERVENCIÓN: botones flotantes de selección rápida para el
           valor del domicilio, justo después de Teléfono. Al elegir uno,
           se suma automáticamente al pedido y se refleja en el resumen,
           en la comanda y en la factura (todos calculan el total a
           partir de este mismo valor). */
        '<div style="margin-top:12px">' +
          '<span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Valor del domicilio</span>' +
          '<div class="chips wrap" id="dm-domval" style="margin-top:6px">' +
            [1000,2000,3000,4000,5000,6000,8000,10000].map(v =>
              '<button type="button" class="chip' + (Number(bor.domicilioValor)===v?' ad-sel':'') + '" data-domval="' + v + '">' + Util.money(v) + '</button>'
            ).join('') +
          '</div>' +
        '</div></div>' +

        /* ── Resumen del pedido (sección "Pedido": Nota + Quitar por plato) ── */
        '<div style="margin-top:20px">' +
          '<div class="eyebrow" style="margin-bottom:8px">Pedido</div>' +
          '<div id="dm-resumen">' + renderResumen() + '</div>' +
        '</div>' +

        /* ── Carta de selección ── */
        '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)">' +
          '<div class="eyebrow" style="margin-bottom:10px">Menú — toca un plato para agregarlo</div>' +
          '<div id="dm-carta">' + renderCarta() + '</div>' +
        '</div>' +

        /* ── Nota general ── */
        '<div style="margin-top:14px">' +
          '<label class="f" style="grid-column:1/-1">Observaciones del pedido' +
            '<textarea class="inp" id="dm-nota" rows="2" placeholder="Indicaciones especiales, alergias, etc.">' +
              Util.esc(bor.nota) + '</textarea>' +
          '</label>' +
        '</div>',

      /* INTERVENCIÓN: misma interfaz de acciones que la sección Pedido del
         módulo Vender — Nuevo Pedido, Enviar a Cocina y Cobrar, del mismo
         tamaño y estilo (todas parten de la clase base .btn). */
      footer:
        '<button class="btn" data-close>Cancelar</button>' +
        '<button type="button" class="btn" id="dm-nuevo-pedido" style="' +
          'background:linear-gradient(180deg,#FF9A3D 0%,#FB7B1E 55%,#E35F05 100%);' +
          'border:1px solid #E35F05;color:#fff;font-weight:800;' +
          'box-shadow:0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);' +
          'text-shadow:0 1px 1px rgba(0,0,0,.35);transition:.12s" ' +
          'onmousedown="this.style.transform=\'translateY(2px)\';this.style.boxShadow=\'0 1px 0 #B8460A,0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)\'" ' +
          'onmouseup="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
          'onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
          'title="Descarta este formulario y abre uno en blanco">' +
          Util.ico('plus') + ' Nuevo Pedido</button>' +
        '<button class="btn pri" id="dm-guardar">' + Util.ico('fire') + ' Enviar a Cocina</button>' +
        (Auth.can('cobrar')
          ? '<button class="btn gold" id="dm-cobrar" title="Cobrar de una vez este domicilio">' + Util.ico('cash') + ' Cobrar</button>'
          : ''),

      onMount(ov, cerrarModal){
        /* Leer campos de texto */
        const g = id => ov.querySelector('#' + id);
        const sync = () => {
          bor.nombre   = (g('dm-nombre').value||'').trim();
          bor.contacto = (g('dm-contacto').value||'').trim();
          bor.direccion= (g('dm-dir').value||'').trim();
          bor.telefono = (g('dm-tel').value||'').trim();
          bor.nota     = (g('dm-nota').value||'').trim();
        };
        ['dm-nombre','dm-contacto','dm-dir','dm-tel','dm-nota'].forEach(id=>{
          const el = g(id); if(el) el.oninput = sync;
        });

        /* INTERVENCIÓN: botones rápidos de valor del domicilio — al elegir
           uno, se guarda en el borrador y se refresca el resumen para que
           el total (pedido, comanda y factura) lo sume de inmediato. */
        const domvalBox = g('dm-domval');
        if (domvalBox) domvalBox.querySelectorAll('[data-domval]').forEach(b => b.onclick = () => {
          bor.domicilioValor = Number(b.dataset.domval);
          domvalBox.querySelectorAll('[data-domval]').forEach(c => c.classList.toggle('ad-sel', c===b));
          g('dm-resumen').innerHTML = renderResumen();
        });

        /* Re-render de resumen + carta */
        const refrescar = () => {
          g('dm-resumen').innerHTML = renderResumen();
          g('dm-carta').innerHTML   = renderCarta();
          enlazar();
        };

        /* INTERVENCIÓN: "Nota · Indicaciones para cocina" del pedido a
           domicilio — misma interfaz, secciones, funcionalidad y lógica
           que ya tiene el módulo Vender en POS.note(lid) (Sopa, Cocción,
           Acompañamientos, Ensaladas, Jugo incluido y Adiciones con
           Cargo con su cuadrícula de icono+nombre), adaptada para
           trabajar sobre bor.items[idx] en lugar de POS.cart. */
        const notaItem = (idx) => {
          const it = bor.items[idx]; if (!it) return;
          const chipsCoccion = ['Término Azul','Término Medio','Tres Cuartos','Bien Asado','Sin Sal','Sin Picante'];
          const chipsAcomp = ['Frijol','Espagueti','Huevo','Sin Ensalada','Doble Arroz','Solo Maduro','Solo Papas'];
          const chipsEnsalada = ['Ensalada de cebolla y tomate','Ensalada de remolacha','Ensalada agridulce','Ensalada de repollo','Ensalada de lechuga'];
          const p = DB.product(it.pid);
          const esDesayuno = p && ((DB.cat(p.cat)||{}).id === 'c_des' || /desayuno/i.test((DB.cat(p.cat)||{}).nombre));
          const jugos = ['Tomate','Guayaba','Tropical','Piña','Curuba','Guarapo','Claro','Mazamorra','Mango','Banano'];
          const sopas = ['Sopa del día','Menudencia','Pescado'];
          const excluirCarnes = ['tilapia','punta de anca','churrasco','trucha',
            'picada para 2','picada para dos','picada para 4','picada para cuatro',
            'sopa del dia','sopa del día','calentado',
            'salchichas zenu','salchichas zenú','salchicha zenu','salchicha zenú',
            'lonchitas','lonchita','arepa tela','ensalada','desayuno sencillo'];
          const norm = str => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          const carnesDesayuno = esDesayuno
            ? DB.meats().filter(m => (m.tipo||'carne')==='carne' && !excluirCarnes.some(e=>norm(m.nombre).includes(norm(e)))).map(m=>m.nombre)
            : [];

          /* Copia local: solo se aplica a bor.items[idx] al pulsar Guardar */
          let notaTmp = it.nota || '';
          let adicionesTmp = Array.isArray(it.adiciones) ? it.adiciones.slice() : [];

          const grpChips = (titulo, items) =>
            '<div style="margin-top:10px">' +
              '<span class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">' + titulo + '</span>' +
              '<div class="chips wrap" style="margin-top:5px">' +
                items.map(c => '<button type="button" class="chip" data-dmn-chip="' + Util.esc(c) + '">' + Util.esc(c) + '</button>').join('') +
              '</div></div>';

          const adDefHTML = (p && p.adicionesDefault && p.adicionesDefault.length)
            ? p.adicionesDefault.map(a =>
                '<button type="button" class="ad-chip" data-dmn-adchip="' + Util.esc(a.nombre) + '" data-dmn-adprecio="' + (Number(a.precio)||0) + '">' +
                '<span class="ad-chip-ico">⊕</span><span>' + Util.esc(a.nombre) + '</span></button>').join('')
            : '';

          const bodyHTML =
            '<label style="display:block;font-size:12px;color:var(--ash-dim);margin-bottom:5px">Indicación para cocina</label>' +
            '<textarea id="dmn-ta" class="inp" rows="3" style="width:100%;resize:vertical" ' +
              'placeholder="Escribe la indicación o selecciona opciones rápidas">' + Util.esc(notaTmp) + '</textarea>' +
            grpChips('Sopa', sopas) +
            grpChips('Cocción', chipsCoccion) +
            grpChips('Acompañamientos', chipsAcomp) +
            grpChips('Ensaladas', chipsEnsalada) +
            (esDesayuno && carnesDesayuno.length ? grpChips('Carne', carnesDesayuno.map(c=>'Carne: '+c)) : '') +
            grpChips('Jugo incluido', jugos.map(c=>'Jugo de '+c)) +
            (esDesayuno ? grpChips('Bebida incluida', ['Café con Leche','Chocolate con Leche','Chocolate sin Leche','Tinto'].map(c=>'Bebida: '+c)) : '') +
            '<hr style="border-color:var(--line);margin:12px 0 8px">' +
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">' +
              '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)">⊕ Adiciones con cargo — toca para agregar</span>' +
            '</div>' +
            '<div class="ad-grid">' +
              adDefHTML +
              '<button type="button" class="ad-chip" data-dmn-adchip="Aguacate"><span class="ad-chip-ico">🥑</span><span>Aguacate</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Papas Fritas"><span class="ad-chip-ico">🍟</span><span>Papas Fritas</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Tajadas Maduro"><span class="ad-chip-ico">🍌</span><span>Tajadas Maduro</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Patacón"><span class="ad-chip-ico">🫓</span><span>Patacón</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Sopa"><span class="ad-chip-ico">🍲</span><span>Sopa</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Jugo"><span class="ad-chip-ico">🧃</span><span>Jugo</span></button>' +
              '<button type="button" class="ad-chip" data-dmn-adchip="Huevo"><span class="ad-chip-ico">🍳</span><span>Huevo</span></button>' +
            '</div>' +
            '<div class="row" style="gap:6px;margin-top:8px">' +
              '<input class="inp" id="dmn-ad-nombre" placeholder="Nombre de la adición" style="flex:2">' +
              '<input class="inp num" id="dmn-ad-precio" type="number" min="0" step="500" placeholder="Precio ($0 = sin cargo)" style="flex:1">' +
              '<button type="button" id="dmn-ad-btn" style="' +
                'display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;' +
                'background:linear-gradient(180deg,#3EB86A 0%,#2E9A55 60%,#22753E 100%);' +
                'color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;white-space:nowrap;' +
                'box-shadow:0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);' +
                'text-shadow:0 1px 1px rgba(0,0,0,.35);transition:.12s;' +
                '" onmousedown="this.style.transform=\'translateY(2px)\';this.style.boxShadow=\'0 1px 0 #1A5C2E,0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)\'"' +
                ' onmouseup="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)\'"' +
                ' onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #1A5C2E,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)\'">' +
                '＋ Agregar Adición' +
              '</button>' +
            '</div>' +
            '<div id="dmn-adiciones-list" style="margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden"></div>';

          UI.modal({
            title: 'Nota · ' + it.nombre, size:'sm nota-xl',
            body: bodyHTML,
            /* INTERVENCIÓN: botón "Guardar y Nuevo Pedido" — naranja, en
               alto relieve, misma lógica y funcionamiento que el botón
               homónimo del módulo Vender: GARANTIZA el guardado de esta
               nota/adiciones y de inmediato regresa al Menú del mismo
               domicilio para seguir agregando platos. Así, en un solo
               pedido la mesera o cajera puede sumar varios platos sin
               perder lo ya indicado. */
            footer: '<button type="button" class="btn" data-close>Cancelar</button>' +
              '<button type="button" class="btn" id="dmn-guardar-nuevo" style="' +
                'background:linear-gradient(180deg,#FF9A3D 0%,#FB7B1E 55%,#E35F05 100%);' +
                'border:1px solid #E35F05;color:#fff;font-weight:800;' +
                'box-shadow:0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);' +
                'text-shadow:0 1px 1px rgba(0,0,0,.35);transition:.12s" ' +
                'onmousedown="this.style.transform=\'translateY(2px)\';this.style.boxShadow=\'0 1px 0 #B8460A,0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)\'" ' +
                'onmouseup="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
                'onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'0 3px 0 #B8460A,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)\'" ' +
                'title="Guarda esta nota y regresa al menú para agregar otro plato">' +
                Util.ico('plus') + ' Guardar y Nuevo Pedido</button>' +
              '<button type="button" class="btn pri" id="dmn-ok">' + Util.ico('chk') + ' Guardar nota</button>',
            onMount(ovn, cerrarN){
              const ta = ovn.querySelector('#dmn-ta');
              const adBox = ovn.querySelector('#dmn-adiciones-list');

              const paintAd = () => {
                adBox.innerHTML = adicionesTmp.length
                  ? adicionesTmp.map((a, i) =>
                      '<div class="row" style="gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center">' +
                        '<span style="flex:1;font-size:13px;font-weight:600">' + Util.esc(a.nombre) + '</span>' +
                        '<b class="num" style="font-size:13px;white-space:nowrap;color:var(--brass)">' +
                          (a.precio > 0 ? '+ ' + Util.money(a.precio) : '<span class="dim">sin cargo</span>') +
                        '</b>' +
                        '<button type="button" class="btn sm ghost" data-dmn-addel="' + i + '" ' +
                          'style="color:var(--ash-dim);padding:2px 6px;flex:none" title="Quitar">✕</button>' +
                      '</div>').join('')
                  : '<div class="dim" style="padding:10px 8px;font-size:12px;text-align:center">Sin adiciones — toca un chip para agregar</div>';
              };

              const actualizarChips = () => {
                ovn.querySelectorAll('[data-dmn-adchip]').forEach(b => {
                  const nom = b.dataset.dmnAdchip;
                  const yaEsta = adicionesTmp.some(a => a.nombre.toLowerCase() === nom.toLowerCase());
                  b.classList.toggle('on', yaEsta);
                  b.style.opacity = yaEsta ? '0.55' : '';
                  b.title = yaEsta ? nom + ' ya agregado' : '';
                });
              };

              const agregarAdicion = (nom, pre) => {
                nom = String(nom||'').trim();
                if (!nom) return;
                pre = Math.max(0, Number(pre)||0);
                const idxAd = adicionesTmp.findIndex(a => a.nombre.toLowerCase() === nom.toLowerCase());
                if (idxAd >= 0){
                  adicionesTmp.splice(idxAd, 1);
                  paintAd();
                  actualizarChips();
                  return;
                }
                adicionesTmp.push({nombre:nom, precio:pre});
                paintAd();
                actualizarChips();
              };

              ovn.querySelectorAll('[data-dmn-chip]').forEach(b => b.addEventListener('click', async () => {
                const val = b.dataset.dmnChip;
                const actual = ta.value || '';
                const yaEsta = actual.split(',').map(str=>str.trim()).some(str=>str.toLowerCase()===val.toLowerCase());
                if (yaEsta){
                  const ok = await UI.confirm(
                    '«' + val + '» ya está en las indicaciones. ¿Deseas agregarlo de nuevo?',
                    {ok:'Sí, agregar otra vez', title:'Indicación duplicada'});
                  if (!ok) return;
                }
                ta.value = (actual ? actual + ', ' : '') + val;
                ta.scrollTop = ta.scrollHeight;
              }));

              ovn.querySelectorAll('[data-dmn-adchip]').forEach(b => b.addEventListener('click', () => {
                const nom = b.dataset.dmnAdchip;
                const inpNom = ovn.querySelector('#dmn-ad-nombre');
                const inpPre = ovn.querySelector('#dmn-ad-precio');
                inpNom.value = nom;
                inpPre.value = '';
                inpPre.focus();
                ovn.querySelectorAll('[data-dmn-adchip]').forEach(c => c.classList.remove('ad-sel'));
                b.classList.add('ad-sel');
              }));

              ovn.querySelector('#dmn-ad-btn').addEventListener('click', () => {
                const nom = (ovn.querySelector('#dmn-ad-nombre').value||'').trim();
                const pre = Math.max(0, Number(ovn.querySelector('#dmn-ad-precio').value)||0);
                if (!nom) return UI.toast('Escribe el nombre de la adición.','warn');
                agregarAdicion(nom, pre);
                ovn.querySelector('#dmn-ad-nombre').value = '';
                ovn.querySelector('#dmn-ad-precio').value = '';
                ovn.querySelectorAll('[data-dmn-adchip]').forEach(c => c.classList.remove('ad-sel'));
              });

              adBox.addEventListener('click', e => {
                const del = e.target.closest('[data-dmn-addel]');
                if (!del) return;
                adicionesTmp.splice(Number(del.dataset.dmnAddel), 1);
                paintAd();
                actualizarChips();
              });

              paintAd();
              actualizarChips();

              let _guardado = false;
              const guardarNota = () => {
                if (_guardado) return false;
                _guardado = true;
                it.nota = (ta.value || '').trim();
                it.adiciones = adicionesTmp.slice();
                return true;
              };
              ovn.querySelector('#dmn-ok').onclick = () => {
                if (!guardarNota()) return;
                cerrarN();
                refrescar();
              };
              /* "Guardar y Nuevo Pedido": guarda igual que arriba y además
                 regresa al Menú del domicilio para agregar otro plato,
                 haciendo scroll automático hasta la carta. */
              ovn.querySelector('#dmn-guardar-nuevo').onclick = () => {
                if (!guardarNota()) return;
                cerrarN();
                refrescar();
                const cartaEl = g('dm-carta');
                if (cartaEl) cartaEl.scrollIntoView({behavior:'smooth', block:'start'});
                UI.toast('Nota guardada. Agrega el siguiente plato.', 'ok', 2600);
              };
            }
          });
        };

        /* Subir la cantidad de un plato del domicilio pasa por la misma
           confirmación que en Vender: el "+" subía en silencio y sin tope. */
        const subirCantidad = (it) => {
          if (!it) return;
          if (DB.d.config.confirmarRepetir === false){ it.qty++; refrescar(); return; }
          const adEx = (it.adiciones||[]).reduce((a,x)=>a+(Number(x.precio)||0),0);
          const antes = Number(it.qty)||1;
          UI.repetir({nombre:it.nombre, detalle:it.carneNombre,
            unit:(Number(it.precio)||0)+adEx, qty:antes}).then(destino => {
              if (!destino || destino <= antes) return;
              it.qty = destino; refrescar();
              UI.toast(it.nombre + ' · ahora van ' + it.qty + '.','ok');
            });
        };

        const enlazar = () => {
          ov.querySelectorAll('[data-dom-nota]').forEach(b => b.onclick = () => notaItem(parseInt(b.dataset.domNota)));
          ov.querySelectorAll('[data-dom-rm]').forEach(b => b.onclick = () => {
            bor.items.splice(parseInt(b.dataset.domRm),1); refrescar();
          });
          ov.querySelectorAll('[data-dom-inc]').forEach(b => b.onclick = () => {
            subirCantidad(bor.items[parseInt(b.dataset.domInc)]);
          });
          ov.querySelectorAll('[data-dom-dec]').forEach(b => b.onclick = () => {
            const idx = parseInt(b.dataset.domDec);
            if (bor.items[idx].qty > 1) bor.items[idx].qty--;
            else bor.items.splice(idx,1);
            refrescar();
          });
          ov.querySelectorAll('[data-dom-add]').forEach(b => b.onclick = () => {
            const pid = b.dataset.domAdd;
            const p = DB.product(pid); if (!p) return;
            const ex = bor.items.find(i=>i.pid===pid && !(i.nota));
            if (ex){
              /* Misma regla que en Vender: repetir un plato se confirma. */
              subirCantidad(ex);
              return;
            }
            bor.items.push({
              pid:p.id, nombre:p.nombre, precio:Number(p.precio)||0,
              qty:1, gramos:p.gramos||0, nota:'', adiciones:[],
              carne:p.carne||null, carneNombre:'',
              total:Number(p.precio)||0
            });
            refrescar();
            /* INTERVENCIÓN: al seleccionar un plato del menú, se hace scroll
               automático hasta la sección Pedido (donde queda el plato
               recién agregado junto a su botón "Nota"), para que la
               mesera no tenga que desplazarse manualmente por el
               formulario. */
            const resumenEl = g('dm-resumen');
            if (resumenEl) resumenEl.scrollIntoView({behavior:'smooth', block:'start'});
          });
        };
        enlazar();

        /* Arma el objeto "venta" a partir del borrador actual; se reutiliza
           tanto para "Enviar a Cocina" como para "Cobrar", así ambos
           botones parten siempre de los MISMOS datos y nunca divergen. */
        const construirVenta = () => {
          const c = DB.d.config;
          const t = calcT();
          /* INTERVENCIÓN (corrección de raíz): el turno de domicilios de
             cada encargada se calcula filtrando las ventas por el
             userId de quien la creó. Antes este campo se reescribía en
             CADA guardado (incluido "Enviar a Cocina" y "Cobrar") con
             quien estuviera conectado en ese momento — si otra persona
             distinta a quien tomó el pedido terminaba guardándolo o
             cobrándolo, la venta "cambiaba de dueña" y el resumen de
             turno de la encargada original quedaba en ceros. Ahora se
             conserva SIEMPRE el userId original de la venta ya creada;
             solo se usa el usuario conectado actual cuando el domicilio
             es nuevo. */
          const original = bor._id ? (DB.d.sales||[]).find(x=>x.id===bor._id) : null;
          const numero = bor._id
            ? ((DB.d.sales||[]).find(x=>x.id===bor._id)||{}).numero || ((c.prefijo||'') + String(Number(c.consecutivo)||1).padStart(5,'0'))
            : (c.prefijo||'') + String(Number(c.consecutivo)||1).padStart(5,'0');
          const ahora = Util.now();
          return {
            numero, ahora,
            venta:{
              id: bor._id || Util.uid('v'), numero, fecha:ahora,
              sede:c.sedeId, userId:(original && original.userId) || (Auth.user||{}).id,
              domTurnoId:(original && original.domTurnoId) || undefined,
              clienteId:'cl_1', mesa:'DOM', tipo:'domicilio',
              entrega:{nombre:bor.nombre, contacto:bor.contacto, direccion:bor.direccion, telefono:bor.telefono},
              items: bor.items.map(i=>{
                const adP=(i.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
                return Object.assign({},i,{total:(Number(i.precio||0)+adP)*(Number(i.qty)||1)});
              }),
              subtotal:t.subtotal, descuento:0, impuesto:t.impuesto,
              propina:0, domicilio:t.domicilio, costo:0,
              total:t.total, pagos:[], cambio:0,
              estado:'pendiente', nota:bor.nota, sync:false, act:ahora
            }
          };
        };

        /* Guarda / actualiza la venta y su comanda de cocina (KDS).
           CORRECCIÓN DE RAÍZ: al editar un domicilio ya enviado (bor._id
           existente), antes se detectaba la comanda ya creada (yaOrden) y
           simplemente se dejaba intacta — el tiquete de cocina se quedaba
           con los platos viejos aunque la factura ya tuviera los nuevos.
           Ahora, si la comanda ya existe, se ACTUALIZA con los ítems y la
           nota vigentes, para que cocina y factura jamás diverjan. */
        const guardarVenta = (venta) => {
          const c = DB.d.config;
          if (!bor._id) c.consecutivo = (Number(c.consecutivo)||1)+1;

          if (bor._id){
            const idx = DB.d.sales.findIndex(x=>x.id===bor._id);
            if (idx>=0) DB.d.sales[idx]=venta; else DB.d.sales.push(venta);
          } else {
            DB.d.sales.push(venta);
          }
          DB.touch('sales','config');
          Sync.enqueue('sales', bor._id ? 'update' : 'create', venta);

          if (!DB.d.orders) DB.d.orders=[];
          let orden = DB.d.orders.find(o=>o.saleId===venta.id);
          if (!orden){
            const seq = (Number(c.comandaSeq)||0)+1;
            c.comandaSeq = seq;
            orden = {
              id:Util.uid('o'), saleId:venta.id, numero:'C'+String(seq).padStart(4,'0'),
              mesa:'DOM-'+(bor.telefono||'').slice(-4),
              tipo:'domicilio', entrega:venta.entrega,
              items:venta.items, estado:'pendiente',
              nota:bor.nota, fecha:venta.fecha, act:venta.fecha,
              meseroId:(Auth.user||{}).id, sync:false
            };
            DB.d.orders.push(orden);
            DB.touch('orders');
            Sync.enqueue('orders','create',orden);
          } else if (orden.estado !== 'cobrada' && orden.estado !== 'cancelada') {
            orden.entrega = venta.entrega;
            orden.items = venta.items;
            orden.nota = bor.nota;
            orden.act = Util.now();
            DB.touch('orders');
            Sync.enqueue('orders','update',orden);
          }
          return orden;
        };

        /* Enviar a Cocina */
        ov.querySelector('#dm-guardar').onclick = () => {
          sync();
          if (!bor.nombre)    return UI.toast('Escribe el nombre del cliente.','warn');
          if (!bor.direccion) return UI.toast('La dirección de entrega es obligatoria.','warn');
          if (!bor.items.length) return UI.toast('Agrega al menos un plato al pedido.','warn');

          const { venta } = construirVenta();
          guardarVenta(venta);
          /* INTERVENCIÓN (causa raíz): antes, la lista y los KPIs
             (Pedidos hoy, Cobrado hoy, En despacho) solo se actualizaban
             si luego se pulsaba "Imprimir" o "Nuevo pedido" en el
             tiquete — si el operario solo cerraba esa ventana, el
             módulo seguía mostrando los datos de antes de crear el
             domicilio. Ahora se refresca la vista de inmediato, en el
             mismo instante en que el domicilio queda registrado. */
          Router.render();

          DB.log('domicilio:crear', venta.numero+' · '+bor.nombre+' · '+bor.direccion+' · '+Util.money(venta.total), venta.id);
          UI.toast('Pedido de '+bor.nombre+' enviado a cocina.','ok',3800);
          cerrarModal();
          /* Se limpia el borrador de inmediato: el tiquete que sigue es
             solo un comprobante, ya no debe mantener el pedido "vivo". */
          Domicilios.resetBorrador();
          Views.domicilios.imprimirTicket(venta);
        };

        /* Cobrar — INTERVENCIÓN (causa raíz de la duplicidad): antes el
           módulo Domicilios no tenía forma de marcar un pedido como
           pagado; para cobrarlo, la cajera tenía que ir a "Comandas" y
           usar el botón "Cobrar" genérico, el cual SIEMPRE crea una
           venta nueva e independiente — resultando en DOS facturas para
           un mismo domicilio (la "pendiente" de aquí y la "pagada" de
           allá), cada una con su propio consecutivo y, si hubo ediciones
           entre una y otra, con totales distintos. Ahora "Cobrar" marca
           EL MISMO registro (misma id) como pagado, cierra también su
           comanda (por lo que deja de aparecer para cobro en Comandas) y
           así ya no puede volver a facturarse por duplicado. */
        const btnCobrar = ov.querySelector('#dm-cobrar');
        if (btnCobrar) btnCobrar.onclick = () => {
          sync();
          if (!bor.nombre)    return UI.toast('Escribe el nombre del cliente.','warn');
          if (!bor.direccion) return UI.toast('La dirección de entrega es obligatoria.','warn');
          if (!bor.items.length) return UI.toast('Agrega al menos un plato al pedido.','warn');

          const { venta } = construirVenta();
          const METODOS = ['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','Nequi','Daviplata','Otro'];
          UI.modal({
            title:'Cobrar domicilio', size:'sm',
            body:
              '<div class="row" style="justify-content:space-between;margin-bottom:12px">' +
                '<span class="mut">Cliente</span><b>' + Util.esc(bor.nombre) + '</b></div>' +
              '<div class="row" style="justify-content:space-between;margin-bottom:12px">' +
                '<span class="mut">Total a cobrar</span><b style="font-size:20px;color:var(--brass-hi)">' + Util.money(venta.total) + '</b></div>' +
              '<label class="f">Forma de pago' +
                '<select class="inp" id="dmc-met">' + METODOS.map(m=>'<option>'+m+'</option>').join('') + '</select>' +
              '</label>',
            footer:'<button type="button" class="btn" data-close>Cancelar</button>' +
              '<button type="button" class="btn gold" id="dmc-ok">' + Util.ico('cash') + ' Confirmar cobro</button>',
            onMount(ovc, cerrarC){
              ovc.querySelector('#dmc-ok').onclick = () => {
                const metodo = ovc.querySelector('#dmc-met').value || 'Efectivo';
                venta.estado = 'pagada';
                venta.pagos = [{metodo, monto:venta.total}];
                venta.cambio = 0;
                /* Se sella aquí el turno al que pertenece este dinero. Es el
                   único momento en que el cobro existe, y deja el resumen
                   fuera del alcance de quién guarde o edite la venta después. */
                const turnoDom = Domicilios.turnoDeCobro(venta);
                if (turnoDom) venta.domTurnoId = turnoDom.id;
                const orden = guardarVenta(venta);
                if (orden){
                  orden.estado = 'cobrada';
                  orden.ventaId = venta.id; orden.numeroVenta = venta.numero;
                  orden.tiempos = Object.assign({}, orden.tiempos, {cobrado:venta.fecha});
                  orden.act = Util.now();
                  DB.touch('orders');
                  Sync.enqueue('orders','update', orden);
                }
                if (metodo === 'Efectivo'){
                  const caja = DB.openCash();
                  if (caja){
                    caja.movs.push({id:Util.uid('mv'), tipo:'venta', fecha:venta.fecha, concepto:'Domicilio ' + venta.numero,
                      monto:venta.total, metodo:'Efectivo', ventaId:venta.id, userId:venta.userId});
                    caja.act = Util.now();
                    DB.touch('cash');
                    Sync.enqueue('cash','update', caja);
                  }
                }
                /* INTERVENCIÓN (causa raíz): refrescar de inmediato la
                   vista del módulo (KPIs "Cobrado hoy"/"En despacho" y
                   la lista), sin depender de qué se haga después con el
                   tiquete de confirmación. */
                Router.render();
                DB.log('domicilio:cobrar', venta.numero+' · '+bor.nombre+' · '+Util.money(venta.total)+' · '+metodo, venta.id);
                UI.toast('Domicilio de '+bor.nombre+' cobrado por '+Util.money(venta.total)+'.','ok',3800);
                cerrarC();
                cerrarModal();
                Domicilios.resetBorrador();
                Views.domicilios.imprimirTicket(venta);
              };
            }
          });
        };

        /* Nuevo Pedido — descarta este formulario (con confirmación si hay
           datos sin guardar) y abre uno completamente nuevo. */
        ov.querySelector('#dm-nuevo-pedido').onclick = async () => {
          sync();
          const hayDatos = bor.nombre || bor.contacto || bor.direccion || bor.telefono || bor.items.length;
          if (hayDatos && !(await UI.confirm(
            '¿Descartar este domicilio y comenzar uno nuevo? Los datos no guardados se perderán.',
            {ok:'Sí, nuevo pedido', danger:true}))) return;
          cerrarModal();
          Domicilios.resetBorrador();
          Views.domicilios.abrirFormulario();
        };

        /* INTERVENCIÓN (corrección de raíz): cerrar este formulario por
           cualquier vía que no sea guardar (Cancelar, la "X" o un clic
           fuera del modal) también debe limpiar el borrador — si no, el
           próximo "Nuevo domicilio" reabre estos mismos datos a medio
           llenar y termina mezclándolos con el siguiente cliente. */
        ov.addEventListener('click', e => {
          if (e.target === ov || e.target.closest('[data-close]')) Domicilios.resetBorrador();
        });
      }
    });
  },

  /* ── Ticket de domicilio ── */
  imprimirTicket(venta){
    const c = DB.d.config;
    const w58 = c.ticket==='58';
    const line = '<hr>';
    const it = (venta.items||[]).map(i=>{
      const adP=(i.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
      const lt=(Number(i.precio||0)+adP)*(Number(i.qty)||1);
      return '<tr><td colspan="2"><b>' + Util.esc(i.nombre) + '</b></td></tr>' +
        '<tr><td>' + i.qty + ' × ' + Util.money(i.precio,false) + (adP?'  +adic '+Util.money(adP,false):'') + '</td><td class="r b">' + Util.money(lt,false) + '</td></tr>' +
        (i.nota?'<tr><td colspan="2">  * '+Util.esc(i.nota)+'</td></tr>':'');
    }).join('');

    const sub = (venta.items||[]).reduce((a,i)=>{
      const adP=(i.adiciones||[]).reduce((s,x)=>s+(Number(x.precio)||0),0);
      return a+(Number(i.precio||0)+adP)*(Number(i.qty)||1);
    },0);

    const cuerpo =
      '<div class="ticket '+(w58?'w58':'')+'">' +
      (Ticket.logoImp()?'<div class="c"><img src="'+Ticket.logoImp()+'" style="max-width:55%;height:auto;margin-bottom:4px"></div>':'') +
      '<div class="c b lg">'+Util.esc((c.empresa||'').toUpperCase())+'</div>' +
      '<div class="c" style="font-size:10px">'+Util.esc(c.dir||'')+' · Tel: '+Util.esc(c.tel||'')+'</div>' +
      line +
      '<div class="c b" style="font-size:16px;letter-spacing:.1em">🛵 DOMICILIO' + (venta.estado==='pagada' ? ' · PAGADO' : '') + '</div>' +
      '<div class="c b tk-mesa"># '+Util.esc(venta.numero)+'</div>' +
      '<div class="c tk-sub">'+Util.dt(venta.fecha)+'</div>' +
      line +
      '<div><b>CLIENTE</b></div>' +
      '<div>'+Util.esc((venta.entrega&&venta.entrega.nombre)||'—')+'</div>' +
      ((venta.entrega&&venta.entrega.contacto)?'<div class="mut" style="font-size:10px">Ref: '+Util.esc(venta.entrega.contacto)+'</div>':'') +
      '<div style="margin-top:4px"><b>Dir:</b> '+Util.esc((venta.entrega&&venta.entrega.direccion)||'—')+'</div>' +
      '<div><b>Tel:</b> '+Util.esc((venta.entrega&&venta.entrega.telefono)||'—')+'</div>' +
      line +
      '<div><b>PEDIDO</b></div>' +
      '<table style="width:100%">'+it+'</table>' +
      line +
      '<table style="width:100%">' +
        '<tr><td>Subtotal</td><td class="r">'+Util.money(sub,false)+'</td></tr>' +
        (venta.impuesto?'<tr><td>'+(c.impuestoNombre||'Impuesto')+'</td><td class="r">'+Util.money(venta.impuesto,false)+'</td></tr>':'') +
        (venta.domicilio?'<tr><td>Domicilio</td><td class="r">'+Util.money(venta.domicilio,false)+'</td></tr>':'') +
        '<tr style="font-size:14px;font-weight:700"><td>TOTAL</td><td class="r">'+Util.money(venta.total,false)+'</td></tr>' +
      '</table>' +
      (venta.nota?line+'<div style="font-size:10px;font-style:italic">'+Util.esc(venta.nota)+'</div>':'') +
      line +
      '<div class="c">'+Util.esc(c.pieTicket||'¡Gracias por su pedido!')+'</div></div>';

    const closeT = UI.modal({
      title:'Domicilio · '+Util.esc((venta.entrega&&venta.entrega.nombre)||venta.numero), size:'sm',
      body:'<div class="ticket-frame">'+cuerpo+'</div>',
      footer:
        '<button class="btn gold" id="dm-print">'+Util.ico('print')+' Imprimir</button>' +
        '<button class="btn pri" id="dm-nuevo">'+Util.ico('plus')+' Nuevo pedido</button>',
      onMount(ov){
        ov.querySelector('#dm-print').onclick = () => {
          DB.log('domicilio:imprimir', venta.numero);
          UI.imprimir(ov);
          /* Cerrar inmediatamente y resetear para nuevo pedido */
          setTimeout(()=>{ closeT(); Domicilios.resetBorrador(); Router.render(); }, 350);
        };
        ov.querySelector('#dm-nuevo').onclick = () => {
          closeT();
          Domicilios.resetBorrador();
          Router.render();
          setTimeout(()=>Views.domicilios.abrirFormulario(), 180);
        };
      }
    });
  },

  /* Ver / reimprimir un domicilio existente */
  verTicket(venta){ Views.domicilios.imprimirTicket(venta); },

  /** Gestión de domiciliarios: crear, editar, desactivar y abrir/cerrar
      turno. El turno es lo que decide quién aparece para elegir al
      despachar un domicilio, así que se maneja aquí mismo, en la misma
      tabla, sin tener que salir a otra pantalla. */
  gestionDomiciliarios(){
    if (!DB.d.domiciliarios) DB.d.domiciliarios = [];

    const filas = () => {
      const doms = DB.d.domiciliarios.filter(d=>!d.borrado);
      if (!doms.length) return '<tr><td colspan="5" class="dim" style="text-align:center;padding:20px">' +
        'No hay domiciliarios registrados</td></tr>';
      return doms.map(d =>
        '<tr><td><b>' + Util.esc(d.nombre) + '</b>' +
          (d.enTurno && d.inicioTurno ? '<div class="dim" style="font-size:11px">desde ' +
            Util.esc(Util.dt(d.inicioTurno)) + '</div>' : '') + '</td>' +
        '<td>' + Util.esc(d.telefono||'—') + '</td>' +
        '<td><span class="badge ' + (d.activo?'ok':'bad') + '">' + (d.activo?'Activo':'Inactivo') + '</span></td>' +
        '<td>' + (!d.activo
            ? '<span class="dim" style="font-size:12px">—</span>'
            : '<span class="badge ' + (d.enTurno?'ok':'mut') + '">' + (d.enTurno?'En turno':'Fuera') + '</span>') + '</td>' +
        '<td class="n" style="white-space:nowrap">' +
          (d.activo ? '<button class="btn sm ' + (d.enTurno?'ghost':'gold') + '" data-dturno="' + d.id + '">' +
            (d.enTurno ? 'Finalizar turno' : 'Iniciar turno') + '</button> ' : '') +
          '<button class="btn sm ghost" data-dedit="' + d.id + '">Editar</button>' +
          '<button class="btn sm ghost" data-ddel="' + d.id + '" style="color:var(--ash-dim)">Eliminar</button></td></tr>').join('');
    };

    const enTurno = () => DB.d.domiciliarios.filter(d=>!d.borrado && d.activo && d.enTurno).length;
    const resumen = () => enTurno()
      ? enTurno() + ' domiciliario(s) en turno. Solo ellos aparecen para asignar al despachar un domicilio.'
      : 'Nadie está en turno. Inicia el turno de al menos uno para poder asignarlo al despachar un domicilio.';

    UI.modal({title:'Gestionar domiciliarios', size:'lg',
      body:'<div id="dg-aviso" style="margin-bottom:12px;padding:10px 12px;border-radius:var(--r);' +
          'background:rgba(212,175,95,.10);border:1px solid var(--line);font-size:12.5px;line-height:1.5">' +
          Util.esc(resumen()) + '</div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th>' +
        '<th>Turno</th><th></th></tr></thead><tbody id="dg-body">' + filas() + '</tbody></table></div>',
      footer:'<button class="btn" data-close>Cerrar</button>' +
             '<button class="btn pri" id="domNuevo">' + Util.ico('plus') + ' Nuevo domiciliario</button>',
      onMount(ov){
        /* Se repinta solo la tabla: así el modal no se cierra ni salta
           al iniciar o finalizar un turno. */
        const pintar = () => {
          ov.querySelector('#dg-body').innerHTML = filas();
          ov.querySelector('#dg-aviso').textContent = resumen();
          enlazar();
        };
        const enlazar = () => {
          ov.querySelectorAll('[data-dturno]').forEach(b => b.onclick = () => {
            const d = DB.d.domiciliarios.find(x=>x.id===b.dataset.dturno);
            if (!d) return;
            if (d.enTurno){
              d.enTurno = false; d.finTurno = Util.now(); d.act = Util.now();
              DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
              DB.log('domiciliario:fin-turno', d.nombre);
              UI.toast(d.nombre + ' finalizó turno.','ok');
            } else {
              d.enTurno = true; d.inicioTurno = Util.now(); d.finTurno = null; d.act = Util.now();
              DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
              DB.log('domiciliario:inicio-turno', d.nombre);
              UI.toast(d.nombre + ' inició turno.','ok');
            }
            pintar();
            Router.render();
          });
          ov.querySelectorAll('[data-dedit]').forEach(b => b.onclick = () => Views.domicilios.formDomiciliario(b.dataset.dedit));
          ov.querySelectorAll('[data-ddel]').forEach(b => b.onclick = async () => {
            const d = DB.d.domiciliarios.find(x=>x.id===b.dataset.ddel);
            if (!d) return;
            if (!(await UI.confirm('¿Eliminar a ' + d.nombre + '?', {ok:'Eliminar', danger:true}))) return;
            d.borrado = true; d.activo = false; d.enTurno = false; d.act = Util.now();
            DB.touch('domiciliarios'); Sync.enqueue('domiciliarios','update', d);
            DB.log('domiciliario:eliminar', d.nombre);
            UI.toast('Domiciliario eliminado.','ok');
            pintar();
            Router.render();
          });
        };
        ov.querySelector('#domNuevo').onclick = () => Views.domicilios.formDomiciliario();
        enlazar();
      }
    });
  },
  formDomiciliario(id){
    const d = id ? (DB.d.domiciliarios||[]).find(x=>x.id===id) : null;
    UI.formModal({title: d ? 'Editar domiciliario' : 'Nuevo domiciliario', size:'sm',
      ok: d ? 'Guardar' : 'Crear domiciliario',
      fields:[
        {k:'nombre', label:'Nombre completo', val:d?d.nombre:'', req:true, full:true},
        {k:'telefono', label:'Teléfono', val:d?d.telefono:'', full:true},
        {k:'activo', label:'Activo', type:'check', val:d?d.activo:true, full:true}
      ],
      onSave(data, close){
        if (!data.nombre.trim()) return 'El nombre es obligatorio.';
        const obj = Object.assign(d || {id:Util.uid('dm'), enTurno:false, inicioTurno:null, finTurno:null},
          data, {act:Util.now()});
        if (!d){ DB.d.domiciliarios.push(obj); }
        DB.touch('domiciliarios'); Sync.enqueue('domiciliarios', d?'update':'create', obj);
        DB.log(d?'domiciliario:editar':'domiciliario:crear', obj.nombre);
        close(); UI.toast(d ? 'Domiciliario actualizado.' : 'Domiciliario creado.','ok');
        /* Se vuelve a la lista de gestión con el dato ya fresco, para
           poder iniciarle el turno enseguida al recién creado. */
        UI.closeAll(); Router.render();
        setTimeout(()=>Views.domicilios.gestionDomiciliarios(), 140);

};

/* --- Comandas: el puente entre el mesero, la parrilla y la caja ------
   Ciclo: pendiente → preparando → listo → entregado → cobrada.
   Los gramos se reservan al enviar a cocina y se descuentan al cobrar.
   ------------------------------------------------------------------ */
const Orders = {
  EST:{
    pendiente: {t:'En cola',     b:'warn', sig:'preparando', accion:'Empezar'},
    preparando:{t:'En parrilla', b:'info', sig:'listo',      accion:'Marcar listo'},
    listo:     {t:'Listo',       b:'ok',   sig:'entregado',  accion:'Entregado'},
    entregado: {t:'En mesa',     b:'mut',  sig:null,         accion:null},
    cobrada:   {t:'Cobrada',     b:'ok',   sig:null,         accion:null},
    cancelada: {t:'Cancelada',   b:'bad',  sig:null,         accion:null},
    suspendida:{t:'Suspendida',  b:'warn', sig:null,         accion:null},
    eliminada: {t:'Eliminada',   b:'mut',  sig:null,         accion:null}
  },
  total(o){ return o.items.reduce((a,i)=>a + (i.precio + ((i.adiciones||[]).reduce((s,x)=>s+(x.precio||0),0)))*i.qty, 0); },
  gramos(o){ return o.items.reduce((a,i)=>a + (i.gramos||0)*i.qty, 0); },
  minutos(o){ return Math.floor((Date.now() - new Date((o.tiempos||{}).enviado || o.fecha).getTime())/60000); },
  reloj(o){
    const ms = Date.now() - new Date((o.tiempos||{}).enviado || o.fecha).getTime();
    const m = Math.floor(ms/60000), sg = Math.floor((ms%60000)/1000);
    const limite = Number(DB.d.config.alertaCocina)||20;
    return {txt: m + ':' + String(sg).padStart(2,'0'),
            cls: m >= limite ? 't2' : (m >= limite*0.6 ? 't1' : '')};
  },
  avanzar(id, estado){
    const o = DB.order(id); if (!o) return;
    o.estado = estado;
    o.tiempos = Object.assign({}, o.tiempos, {[estado]:Util.now()});
    if (estado === 'listo') o.items.forEach(i => i.st = 'listo');
    o.act = Util.now();
    DB.touch('orders');
    DB.log('comanda:' + estado, o.numero + ' · mesa ' + o.mesa + ' · ' + this.minutos(o) + ' min', o.id);
    Sync.enqueue('orders','update', o);
    if (estado === 'listo') UI.toast('Mesa ' + o.mesa + ' lista para servir.','ok');
    Router.render();
  },
  /** Aparta una comanda equivocada sin decidir todavía qué hacer con ella.

      Queda fuera de `ABIERTAS`, y de ahí salen solas las tres condiciones que
      hacen falta: desaparece del módulo de comandas y del KDS, deja de reservar
      inventario (el descuento real ocurre al cobrar, y esta no se cobra nunca)
      y no toca la caja. La mesa también queda libre, que es lo correcto si la
      comanda se mandó por error.

      La suspende el cajero; resolverla es cosa del administrador. */
  suspender(id){
    const o = DB.order(id); if (!o) return;
    if (!Auth.can('suspender'))
      return UI.toast('Solo caja puede suspender una comanda.','warn');
    if (!DB.ABIERTAS.includes(o.estado))
      return UI.toast('Esa comanda ya no está abierta.','warn');
    const self = this;
    UI.formModal({
      title:'Suspender la comanda ' + o.numero, size:'sm', ok:'Suspender',
      extra:'<p class="dim" style="font-size:12px;line-height:1.55;margin-top:10px">' +
        'Sale de cocina, libera la mesa ' + Util.esc(o.mesa) + ', y no descuenta inventario ni toca la caja. ' +
        'El administrador decidirá después si se cancela o se elimina.</p>',
      fields:[{k:'motivo', label:'Qué pasó (opcional)', val:'', full:true,
               ph:'Se pidió en la mesa equivocada'}],
      onSave(d, close){
        o.estado = 'suspendida';
        o.suspension = {por:(Auth.user||{}).id, en:Util.now(), motivo:String(d.motivo||'').trim()};
        o.tiempos = Object.assign({}, o.tiempos, {suspendido:Util.now()});
        o.act = Util.now();
        DB.touch('orders');
        DB.log('comanda:suspender', o.numero + ' · mesa ' + o.mesa + ' · ' + Util.money(self.total(o)) +
          (o.suspension.motivo ? ' · ' + o.suspension.motivo : ''), o.id);
        Sync.enqueue('orders','update', o);
        close();
        UI.toast('Comanda suspendida. Queda apartada para el administrador.','ok', 4200);
        Router.render();
      }
    });
  },

  /** Devuelve al servicio una comanda suspendida por error. Solo administrador. */
  async reactivar(id){
    const o = DB.order(id); if (!o || o.estado !== 'suspendida') return;
    if (!Auth.can('suspendidas'))
      return UI.toast('Solo el administrador puede reactivar una comanda suspendida.','warn');
    if (!(await UI.confirm('La comanda ' + o.numero + ' vuelve a cocina y a ocupar la mesa ' +
      o.mesa + ', y sus platos vuelven a reservar inventario.', {ok:'Reactivar'}))) return;
    o.estado = 'pendiente';
    delete o.suspension;
    o.act = Util.now();
    DB.touch('orders');
    DB.log('comanda:reactivar', o.numero + ' · mesa ' + o.mesa, o.id);
    Sync.enqueue('orders','update', o);
    UI.toast('Comanda reactivada.','ok');
    Router.render();
  },

  /** Cierra una comanda suspendida. Solo administrador.
      `cancelar` la deja registrada como cancelada; `eliminar` la retira de la
      vista. En los dos casos queda la anotación en la bitácora. */
  async resolverSuspendida(id, accion){
    const o = DB.order(id); if (!o || o.estado !== 'suspendida') return;
    if (!Auth.can('suspendidas'))
      return UI.toast('Solo el administrador puede cerrar una comanda suspendida.','warn');
    const eliminar = accion === 'eliminar';
    if (!(await UI.confirm(
      (eliminar ? 'Se eliminará ' : 'Se cancelará ') + 'la comanda ' + o.numero +
      ' por ' + Util.money(this.total(o)) + '. ' +
      (eliminar ? 'Desaparece de las listas; queda solo en la bitácora.'
                : 'Queda guardada como cancelada y se puede consultar después.'),
      {ok: eliminar ? 'Eliminar' : 'Cancelar comanda', danger:true}))) return;
    o.estado = eliminar ? 'eliminada' : 'cancelada';
    if (eliminar) o.borrado = true;
    o.tiempos = Object.assign({}, o.tiempos, {[o.estado]:Util.now()});
    o.resueltaPor = (Auth.user||{}).id;
    o.act = Util.now();
    DB.touch('orders');
    DB.log('comanda:' + (eliminar ? 'eliminar' : 'cancelar') + '-suspendida',
      o.numero + ' · mesa ' + o.mesa + ' · ' + Util.money(this.total(o)) +
      (((o.suspension||{}).motivo) ? ' · ' + o.suspension.motivo : ''), o.id);
    Sync.enqueue('orders','update', o);
    UI.toast(eliminar ? 'Comanda eliminada.' : 'Comanda cancelada.','ok');
    Router.render();
  },

  async cancelar(id){
    const o = DB.order(id); if (!o) return;
    if (!Auth.can('anular')) return UI.toast('Solo un supervisor puede cancelar una comanda.','warn');
    if (!(await UI.confirm('Se cancelará la comanda ' + o.numero + ' de la mesa ' + o.mesa +
      '. Los gramos reservados vuelven a quedar disponibles.', {ok:'Cancelar comanda', danger:true}))) return;
    o.estado = 'cancelada'; o.act = Util.now();
    o.tiempos = Object.assign({}, o.tiempos, {cancelado:Util.now()});
    DB.touch('orders');
    DB.log('comanda:cancelar', o.numero + ' · mesa ' + o.mesa + ' · ' + Util.money(this.total(o)), o.id);
    Sync.enqueue('orders','update', o);
    UI.toast('Comanda cancelada.','ok');
    Router.render();
  },
  /** Quita una línea de una comanda abierta: el mesero marcó un plato de más. */
  async quitarLinea(orderId, idx){
    const o = DB.order(orderId); if (!o) return;
    const it = o.items[idx]; if (!it) return;
    if (!Auth.can('anular')) return UI.toast('Solo un supervisor puede quitar platos de una comanda enviada.','warn');
    if (o.items.length === 1)
      return UI.toast('Es el único plato del pedido. Cancela la comanda completa.','warn');
    if (!(await UI.confirm('Se quita ' + it.qty + ' × ' + it.nombre + ' de la mesa ' + o.mesa +
      '. Avisa a la cocina si ya lo estaban preparando.', {ok:'Quitar del pedido', danger:true}))) return;
    o.items.splice(idx, 1);
    o.act = Util.now();
    DB.touch('orders');
    DB.log('comanda:quitar-linea', o.numero + ' · mesa ' + o.mesa + ' · ' + it.qty + ' × ' + it.nombre +
      ' · ' + Util.money(it.precio*it.qty), o.id);
    Sync.enqueue('orders','update', o);
    UI.toast('Plato retirado del pedido.','ok');
    Router.render();
  },
  /** Refresca solo los cronómetros, sin repintar la vista. */
  tick(){
    document.querySelectorAll('[data-since]').forEach(el => {
      const o = DB.order(el.dataset.since); if (!o) return;
      const r = Orders.reloj(o);
      el.textContent = r.txt;
      el.className = 'ktime ' + r.cls;
      const card = el.closest('.kcard');
      if (card) card.className = 'kcard ' + r.cls + (o.estado==='listo'||o.estado==='entregado'?' done':'');
    });
  }
};

/* --- Tablero de cocina (KDS) ---------------------------------------- */
Views.kds = {
  actions(){
    const f = State.filters.kds || (State.filters.kds = {f:'activas'});
    return '<div class="chips">' + [['activas','En curso'],['listo','Listas'],['todas','Todas']].map(x =>
      '<button class="chip ' + (f.f===x[0]?'on':'') + '" data-k="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
  },
  lista(){
    const f = State.filters.kds || (State.filters.kds = {f:'activas'});
    let l = DB.openOrders();
    if (f.f === 'activas') l = l.filter(o => o.estado==='pendiente' || o.estado==='preparando');
    if (f.f === 'listo') l = l.filter(o => o.estado==='listo');
    // Lo que sale del local va de primero: hay alguien esperando en la puerta
    return l.sort((a,b) => {
      const pa = (a.tipo && a.tipo !== 'mesa') ? 0 : 1;
      const pb = (b.tipo && b.tipo !== 'mesa') ? 0 : 1;
      if (pa !== pb) return pa - pb;
      return new Date((a.tiempos||{}).enviado||a.fecha) - new Date((b.tiempos||{}).enviado||b.fecha);
    });
  },
  html(){
    const fk = State.filters.kdsq || (State.filters.kdsq = {q:''});
    const l = this.lista();
    const enCola = DB.openOrders().filter(o=>o.estado==='pendiente').length;
    const enParrilla = DB.openOrders().filter(o=>o.estado==='preparando').length;
    const salen = DB.openOrders().filter(o=>o.tipo && o.tipo !== 'mesa' &&
      (o.estado==='pendiente'||o.estado==='preparando')).length;
    const cards = l.map(o => {
      const r = Orders.reloj(o), est = Orders.EST[o.estado];
      const rondas = Math.max(1, ...o.items.map(i=>i.ronda||1));
      const llevar = o.tipo && o.tipo !== 'mesa';
      /* Texto para el buscador por mesa dentro de cocina. */
      const busca = (llevar ? (POS.TIPOS[o.tipo]||{corto:o.tipo}).corto : 'mesa ' + o.mesa) +
        ' ' + (o.mesa||'') + ' ' + (o.numero||'') + ' ' + ((DB.user(o.meseroId)||{}).nombre||'');
      return '<div class="kcard ' + r.cls + (llevar?' llevar':'') + (o.estado==='listo'||o.estado==='entregado'?' done':'') +
        '" data-busca="' + Util.esc(busca) + '">' +
        (llevar ? '<div class="kllevar">' + Util.ico(POS.TIPOS[o.tipo].ico) +
          POS.TIPOS[o.tipo].corto + (o.domicilio ? ' · ' + Util.money(o.domicilio) : '') + '</div>' : '') +
        '<div class="khead"><div><div class="kmesa">' +
          (llevar ? Util.esc(POS.TIPOS[o.tipo].corto) : 'Mesa ' + Util.esc(o.mesa)) + '</div>' +
          '<div class="dim num" style="font-size:10.5px">' + Util.esc(o.numero) + ' · ' +
          Util.esc(((DB.user(o.meseroId)||{}).nombre||'').split(' ')[0]) + '</div></div>' +
          '<span class="ktime ' + r.cls + '" data-since="' + o.id + '">' + r.txt + '</span></div>' +
        '<div class="kitems">' + o.items.map(i =>
          '<div class="kit"><span class="kq">' + i.qty + '</span><div>' +
          '<div class="kn">' + Util.esc(i.nombre) +
            (rondas > 1 && i.ronda > 1 ? '<span class="kron">Ronda ' + i.ronda + '</span>' : '') + '</div>' +
          (i.carneNombre ? '<div class="kcarne">' + Util.esc(i.carneNombre) + '</div>' : '') +
          (i.gramos ? '<div class="kg">' + Util.cantIns(i.gramos*i.qty, DB.meat(i.carne)) + '</div>' : '') +
          (i.nota ? '<div class="knote">' + Util.esc(i.nota) + '</div>' : '') +
          '</div></div>').join('') + '</div>' +
        '<div class="kfoot">' +
          '<span class="badge ' + est.b + '" style="align-self:center;padding:6px 10px">' + est.t + '</span>' +
          (est.sig ? '<button class="btn ' + (o.estado==='preparando'?'gold':'pri') + '" data-adv="' + o.id + '" data-to="' + est.sig + '">' +
            est.accion + '</button>' : '') +
          '<button class="btn icon ghost" data-tk="' + o.id + '" title="Reimprimir comanda">' + Util.ico('print') + '</button>' +
        '</div>' +
        (llevar && o.entrega && (o.entrega.direccion || o.entrega.telefono)
          ? '<div class="kdir">' + (o.entrega.direccion ? Util.esc(o.entrega.direccion) : '') +
            (o.entrega.telefono ? '<br><b class="num">' + Util.esc(o.entrega.telefono) + '</b>' : '') + '</div>' : '') +
        '</div>';
    }).join('');
    return '<div class="view-head"><div><div class="eyebrow">' + enCola + ' en cola · ' + enParrilla + ' en parrilla' +
      (salen ? ' · ' + salen + ' para llevar' : '') + '</div>' +
      '<h2>Cocina</h2></div>' +
      '<span class="pill right"><span class="dot ' + (Sync.activo() ? (navigator.onLine?'on':'off') : 'off') + '"></span>' +
        (Sync.activo() ? (navigator.onLine ? 'Recibiendo comandas' : 'Sin red del local') : 'Sin servidor configurado') + '</span></div>' +
      /* Buscador por número de mesa, para ubicar una comanda entre muchas. */
      '<div class="card" style="margin-bottom:14px"><div class="row wrap">' +
        '<div class="search">' + Util.ico('search') +
          '<input class="inp" id="kq" autocomplete="off" inputmode="search" ' +
          'placeholder="Buscar mesa (número), comanda o mesero" value="' + Util.esc(fk.q) + '"></div>' +
        (fk.q ? '<button class="btn sm ghost" id="kq-clr">Limpiar</button>' : '') +
        '<span class="dim right num" id="kq-info" style="font-size:12px"></span>' +
      '</div></div>' +
      (l.length ? '<div class="kgrid" id="kq-grid">' + cards + '</div>' :
        '<div class="card">' + UI.empty('La parrilla está al día','Cuando un mesero envíe un pedido aparecerá aquí solo, sin recargar.') + '</div>');
  },
  mount(){
    document.querySelectorAll('[data-adv]').forEach(b => b.onclick = () => Orders.avanzar(b.dataset.adv, b.dataset.to));
    document.querySelectorAll('[data-tk]').forEach(b => b.onclick = () => Ticket.comanda(b.dataset.tk));
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { State.filters.kds.f = b.dataset.k; Router.render(); });

    /* Buscador por mesa: filtra las comandas en pantalla sin repintar. */
    const fk = State.filters.kdsq || (State.filters.kdsq = {q:''});
    const kq = document.getElementById('kq');
    const aplicarFiltroK = () => {
      const q = Util.norm((fk.q||'').trim());
      const tarjetas = document.querySelectorAll('.kcard[data-busca]');
      let vis = 0;
      tarjetas.forEach(c => {
        const ok = !q || Util.norm(c.dataset.busca).includes(q);
        c.style.display = ok ? '' : 'none';
        if (ok) vis++;
      });
      const info = document.getElementById('kq-info');
      if (info) info.textContent = q ? (vis + ' de ' + tarjetas.length + ' en pantalla') : '';
      const grid = document.getElementById('kq-grid');
      let vacio = document.getElementById('kq-vacio');
      if (q && !vis && grid){
        if (!vacio){
          vacio = document.createElement('div');
          vacio.id = 'kq-vacio';
          vacio.className = 'card';
          grid.insertAdjacentElement('afterend', vacio);
        }
        vacio.innerHTML = UI.empty('Ninguna comanda coincide', 'Revisa el número de mesa o limpia la búsqueda.');
        vacio.style.display = '';
      } else if (vacio) vacio.style.display = 'none';
    };
    if (kq){
      kq.oninput = () => { fk.q = kq.value; aplicarFiltroK(); };
      if (fk.q){ kq.focus(); kq.setSelectionRange(kq.value.length, kq.value.length); }
    }
    const kqc = document.getElementById('kq-clr');
    if (kqc) kqc.onclick = () => { fk.q = ''; Router.render(); };
    aplicarFiltroK();

    Router._timer = setInterval(Orders.tick, 1000);
  }
};

        '<span class="badge warn right">' + suspendidas.length + '</span></div>' +

          '<tr><td class="num">' + Util.esc(o.numero) + '</td>' +

          '<td>' + Util.esc((DB.user(o.meseroId)||{}).nombre||'—') + '</td>' +
          '<td class="dim">' + Util.esc((o.suspension||{}).motivo || '—') + '</td>' +
          '<td class="dim" style="white-space:nowrap">' + Util.esc((DB.user((o.suspension||{}).por)||{}).nombre||'—') +
            '<div style="font-size:11px">' + Util.esc(Util.dt((o.suspension||{}).en || o.fecha)) + '</div></td>' +
          '<td class="n">' + Util.money(Orders.total(o)) + '</td>' +
          (puedeResolver ?
            '<td class="n" style="white-space:nowrap">' +

      '<h2>Comandas</h2></div></div>' +
      '<div class="grid g-kpi" style="margin-bottom:14px">' +

  mount(){
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => POS.loadOrder(b.dataset.add, false));
    document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => POS.loadOrder(b.dataset.pay, true));
    document.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => Ticket.precuenta(b.dataset.pre));
    document.querySelectorAll('[data-tk]').forEach(b => b.onclick = () => Ticket.comanda(b.dataset.tk));
    document.querySelectorAll('[data-can]').forEach(b => b.onclick = () => Orders.cancelar(b.dataset.can));
    document.querySelectorAll('[data-susp]').forEach(b => b.onclick = () => Orders.suspender(b.dataset.susp));
    document.querySelectorAll('[data-react]').forEach(b => b.onclick = () => Orders.reactivar(b.dataset.react));
    document.querySelectorAll('[data-scan]').forEach(b => b.onclick = () => Orders.resolverSuspendida(b.dataset.scan, 'cancelar'));
    document.querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => Orders.resolverSuspendida(b.dataset.sdel, 'eliminar'));
    document.querySelectorAll('[data-oline]').forEach(b => b.onclick = () => Orders.quitarLinea(b.dataset.oline, Number(b.dataset.idx)));
    const n = document.querySelector('[data-act=new]');
    if (n) n.onclick = () => { POS.reset(); POS.askMesa(()=>Router.go('pos')); };

    /* Buscador por mesa. Filtra el DOM en vivo (sin volver a pintar la
       vista) para que no se pierda el foco ni el texto mientras se teclea. */
    const fo = State.filters.orders || (State.filters.orders = {q:''});
    const oq = document.getElementById('oq');
    const aplicarFiltro = () => {
      const q = Util.norm((fo.q||'').trim());
      const tarjetas = document.querySelectorAll('[data-busca]');
      let vis = 0;
      tarjetas.forEach(c => {
        const ok = !q || Util.norm(c.dataset.busca).includes(q);
        c.style.display = ok ? '' : 'none';
        if (ok) vis++;
      });
      const info = document.getElementById('oq-info');
      if (info) info.textContent = q ? (vis + ' de ' + tarjetas.length + ' en pantalla') : '';
      const grid = document.getElementById('oq-grid');
      let vacio = document.getElementById('oq-vacio');
      if (q && !vis && grid){
        if (!vacio){
          vacio = document.createElement('div');
          vacio.id = 'oq-vacio';
          vacio.className = 'card';
          grid.insertAdjacentElement('afterend', vacio);
        }
        vacio.innerHTML = UI.empty('Ninguna mesa coincide', 'Revisa el número o limpia la búsqueda.');
        vacio.style.display = '';
      } else if (vacio) vacio.style.display = 'none';
    };
    if (oq){
      oq.oninput = () => { fo.q = oq.value; aplicarFiltro(); };
      if (fo.q){ oq.focus(); oq.setSelectionRange(oq.value.length, oq.value.length); }
    }
    const oqc = document.getElementById('oq-clr');
    if (oqc) oqc.onclick = () => { fo.q = ''; Router.render(); };
    aplicarFiltro();

    /* El refresco automático no puede borrar lo que se está escribiendo. */
    Router._timer = setInterval(()=>{
      if (UI._stack.length) return;
      const act = document.activeElement;
      if (act && act.id === 'oq') return;
      Router.render();
    }, 20000);
  }
};

/* --- Ticket térmico 58 / 80 mm -------------------------------------- */
const Ticket = {
  /** Logotipo ya preparado para papel: blanco y negro puro, sin fondo.
      Se calcula al arrancar y cada vez que se cambia el logotipo. */
  _logoBN:null,

  /** Convierte el logotipo a alto contraste. Si el fondo es oscuro se invierte,
      de forma que el papel quede blanco y solo el dibujo salga en negro. El CSS
      no puede hacer esto: dentro de una imagen no hay fondo, son píxeles, y la
      impresora los marca todos. Además se umbraliza, porque una térmica solo
      sabe marcar o no marcar y los grises salen como tramado sucio. */
  prepararLogo(){
    const fuente = (DB.d.config.logo || '').trim() || Ticket.LOGO_PRINT;
    return new Promise(resolve => {
      try{
        const img = new Image();
        img.onerror = () => { Ticket._logoBN = null; resolve(null); };
        img.onload = () => {
          try{
            const lado = Math.min(420, Math.max(img.width, img.height) || 280);
            const esc = lado / Math.max(img.width, img.height);
            const w = Math.max(1, Math.round(img.width*esc));
            const h = Math.max(1, Math.round(img.height*esc));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);   // por si trae transparencia
            g.drawImage(img, 0, 0, w, h);
            const d = g.getImageData(0, 0, w, h);
            const p = d.data;

            let suma = 0, n = 0;
            const mirar = (x, y) => {
              const i = (y*w + x)*4;
              suma += (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114); n++;
            };
            for (let x = 0; x < w; x += Math.max(1, Math.floor(w/40))){ mirar(x, 0); mirar(x, h-1); }
            for (let y = 0; y < h; y += Math.max(1, Math.floor(h/40))){ mirar(0, y); mirar(w-1, y); }
            const fondoOscuro = (suma/Math.max(1,n)) < 128;

            for (let i = 0; i < p.length; i += 4){
              let l = p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114;
              if (fondoOscuro) l = 255 - l;
              const v = l < 150 ? 0 : 255;
              p[i] = p[i+1] = p[i+2] = v;
              p[i+3] = 255;
            }
            g.putImageData(d, 0, 0);
            Ticket._logoBN = c.toDataURL('image/png');
            resolve(Ticket._logoBN);
          }catch(e){ Ticket._logoBN = null; resolve(null); }
        };
        img.src = fuente;
      }catch(e){ Ticket._logoBN = null; resolve(null); }
    });
  },

  /** Lo que se pone en el ticket, o nada si el negocio prefiere no imprimirlo. */
  logoImp(){
    if (DB.d.config.logoTicket === false) return '';
    return Ticket._logoBN || (DB.d.config.logo || '').trim() || Ticket.LOGO_PRINT;
  },

  render(v, ancho){
    const c = DB.d.config, w58 = ancho === '58';
    const cli = DB.client(v.clienteId) || {nombre:'Consumidor final'};
    const line = '<hr>';
    const it = v.items.map(i => {
      const adP = (i.adiciones||[]).reduce((s,a)=>s+(Number(a.precio)||0),0);
      const lineaTotal = (Number(i.precio||0)+adP)*(Number(i.qty)||1);
      return '<tr><td colspan="2">' + Util.esc(i.nombre) + (i.carneNombre ? ' (' + Util.esc(i.carneNombre) + ')' : '') +
        (i.gramos && DB.unidadDe(i.carne) !== 'und' ? ' (' + Util.cantCorta(i.gramos, DB.unidadDe(i.carne)) + ')' : '') + '</td></tr>' +
      '<tr><td>' + i.qty + ' x ' + Util.money(i.precio,false) + '</td><td class="r"><b>' + Util.money(lineaTotal,false) + '</b></td></tr>' +
      (i.nota ? '<tr><td colspan="2">  * ' + Util.esc(i.nota) + '</td></tr>' : '') +
      ((i.adiciones&&i.adiciones.length) ? i.adiciones.map(a=>'<tr><td>  ⊕ ' + Util.esc(a.nombre) + '</td><td class="r">' + (a.precio>0?'+'+Util.money(a.precio,false):'sin cargo') + '</td></tr>').join('') : '');
    }).join('');
    return '<div class="ticket ' + (w58?'w58':'') + '" id="tprint">' +
      (Ticket.logoImp() ? '<div class="c"><img src="' + Ticket.logoImp() +
        '" style="max-width:55%;height:auto;margin-bottom:4px;background:#fff"></div>' : '') +
      '<div class="c b lg">' + Util.esc(c.empresa.toUpperCase()) + '</div>' +
      '<div class="c">NIT ' + Util.esc(c.nit) + '<br>' + Util.esc(c.dir) + '<br>' + Util.esc(c.tel) + '</div>' +
      '<div class="c" style="font-size:9px;margin-top:3px">' + Util.esc(c.resolucion) + '</div>' +
      (v.tipo === 'domicilio' ? '<div class="c b lg" style="font-size:18px;letter-spacing:.2em;margin:6px 0;border:2px solid #111;padding:4px 0">*** DOMICILIO ***</div>' : '') + line +
      '<table><tr><td>Factura</td><td class="r b">' + Util.esc(v.numero) + '</td></tr>' +
      '<tr><td>Fecha</td><td class="r">' + Util.dt(v.fecha) + '</td></tr>' +
      '<tr><td>Atendió</td><td class="r">' + Util.esc((DB.user(v.userId)||{}).nombre||'—') + '</td></tr>' +
      (v.tipo && v.tipo !== 'mesa'
        ? '<tr><td>Entrega</td><td class="r b">' + Util.esc(POS.TIPOS[v.tipo].corto.toUpperCase()) + '</td></tr>' +
          (v.entrega && v.entrega.direccion ? '<tr><td colspan="2">' + Util.esc(v.entrega.direccion) + '</td></tr>' : '') +
          (v.entrega && v.entrega.telefono ? '<tr><td>Tel</td><td class="r">' + Util.esc(v.entrega.telefono) + '</td></tr>' : '')
        : (v.mesa ? '<tr><td>Mesa</td><td class="r">' + Util.esc(v.mesa) + '</td></tr>' : '')) +
      '<tr><td>Cliente</td><td class="r">' + Util.esc(cli.nombre) + '</td></tr></table>' + line +
      '<table>' + it + '</table>' + line +
      '<table><tr><td>Subtotal</td><td class="r">' + Util.money(v.subtotal,false) + '</td></tr>' +
      (v.descuento ? '<tr><td>Descuento</td><td class="r">-' + Util.money(v.descuento,false) + '</td></tr>' : '') +
      (v.impuesto ? '<tr><td>' + Util.esc(c.impuestoNombre) + ' ' + c.impuesto + '%</td><td class="r">' + Util.money(v.impuesto,false) + '</td></tr>' : '') +
      (v.propina ? '<tr><td>Propina voluntaria</td><td class="r">' + Util.money(v.propina,false) + '</td></tr>' : '') +
      (v.domicilio ? '<tr><td>Domicilio</td><td class="r">' + Util.money(v.domicilio,false) + '</td></tr>' : '') +
      '<tr><td class="b lg">TOTAL</td><td class="r b lg">' + Util.money(v.total,false) + '</td></tr></table>' + line +
      '<table>' + v.pagos.map(p=>'<tr><td>' + Util.esc(p.metodo) + '</td><td class="r">' + Util.money(p.monto,false) + '</td></tr>').join('') +
      (v.cambio ? '<tr><td>Cambio</td><td class="r">' + Util.money(v.cambio,false) + '</td></tr>' : '') + '</table>' + line +
      (v.estado === 'anulada' ? '<div class="c b" style="font-size:15px;letter-spacing:.2em">** ANULADA **</div>' + line : '') +
      '<div class="c">' + Util.esc(c.pieTicket) + '</div>' +
      '<div class="c" style="font-size:9px;margin-top:5px">' + Util.esc(c.sede) + ' · ' + (v.sync?'sincronizada':'pendiente de sincronizar') + '</div>' +
    '</div>';
  },
  /** Comanda de cocina: papel grande, con adiciones detalladas y precio para despacho. */
  comanda(orderId, ronda){
    const o = DB.order(orderId); if (!o) return;
    /* Si se pide una ronda que no tiene platos (por ejemplo al reimprimir),
       se imprime la comanda completa en vez de un tiquete vacío. */
    let items = o.items.filter(i => !ronda || i.ronda === ronda);
    if (!items.length){ items = o.items.slice(); ronda = null; }
    const llevar = o.tipo && o.tipo !== 'mesa';
    /* Total de adiciones por ítem */
    const adTotalItem = (i) => (i.adiciones||[]).reduce((s,a)=>s+a.precio,0);
    /* Subtotal de la comanda (esta ronda) */
    const subtotalRonda = items.reduce((s,i)=>(s + (i.precio + adTotalItem(i))*i.qty),0);
    /* CORRECCIÓN: este tiquete es de cocina y, en una ronda posterior, su
       total es solo el de esa ronda. Impreso a secas como "TOTAL", se
       confundía con la cuenta de la mesa y se cobraba de menos. Cuando la
       mesa ya trae rondas anteriores se dice explícitamente de qué ronda es
       el total y cuánto lleva acumulado la mesa. */
    const hayAnteriores = items.length !== (o.items||[]).length;
    const cargoDom = llevar ? (Number(o.domicilio)||0) : 0;
    const totalMesa = Orders.total(o) + cargoDom;
    const cuerpo = '<div class="ticket">' +
